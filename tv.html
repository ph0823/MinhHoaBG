<style>
:root{--accent:#ef4444;--focus:#facc15;--bg:#090b0f;--panel:rgba(12,15,21,.94);--text:#fff;--muted:#aab2c0;--safe:clamp(10px,2vw,24px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Roboto,Arial,sans-serif;overscroll-behavior:none}button{font:inherit}
body{min-height:100dvh}.shell{width:min(100%,1280px);margin:auto;padding:12px}.title{text-align:center;margin:4px 0 10px;font-size:clamp(20px,3vw,34px);color:var(--accent)}
.app{position:relative;background:#000;overflow:hidden;border-radius:14px;box-shadow:0 16px 50px #000a;aspect-ratio:16/9;isolation:isolate}
video{width:100%;height:100%;display:block;background:#000;outline:0;object-fit:contain}video:focus-visible{box-shadow:inset 0 0 0 4px var(--focus)}
#visualizer{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:clamp(4px,.65vw,9px);background:radial-gradient(circle at 50% 48%,#263b58 0,#101824 34%,#05070b 70%,#020203 100%);pointer-events:none;overflow:hidden}
#visualizer:before{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);box-shadow:0 0 26px rgba(239,68,68,.3);opacity:.65}
.bar{position:relative;width:clamp(5px,.72vw,10px);height:clamp(80px,17vw,190px);border-radius:999px;background:linear-gradient(180deg,#fff7 0,var(--accent) 22%,#ef4444 72%,#7f1d1d 100%);transform:scaleY(.10);transform-origin:center;opacity:.30;box-shadow:0 0 10px rgba(239,68,68,.12);will-change:transform,opacity}
#visualizer.playing .bar{animation-name:radioWave;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
@keyframes radioWave{0%{transform:scaleY(.10);opacity:.28}35%{transform:scaleY(.48);opacity:.68}70%{transform:scaleY(.22);opacity:.45}100%{transform:scaleY(1);opacity:1}}
body.tv-mode #visualizer .bar{height:clamp(110px,24vh,250px);box-shadow:none}

.topHud{position:absolute;left:var(--safe);right:var(--safe);top:var(--safe);display:flex;justify-content:flex-end;align-items:flex-start;pointer-events:none;z-index:4}.channelInfo{display:none!important}.status{background:#05070acc;backdrop-filter:blur(8px);border:1px solid #ffffff25;border-radius:10px;padding:8px 12px;text-shadow:0 1px 2px #000;display:none;color:#fff;font-size:14px}.status.show{display:block}.spinner{display:inline-block;width:13px;height:13px;border:2px solid #fff5;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}
.quickActions{position:absolute;right:var(--safe);bottom:var(--safe);display:flex;gap:10px;z-index:6;transition:opacity .35s ease,transform .35s ease;will-change:opacity,transform}.iconBtn{min-width:50px;width:50px;height:50px;border-radius:999px;border:2px solid #ffffff35;background:#07090dd9;color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px);outline:0;font-size:21px}.iconBtn:hover,.iconBtn:focus-visible{background:var(--accent);border-color:var(--focus);box-shadow:0 0 0 4px #facc1545;transform:scale(1.04)}.iconBtn:disabled{opacity:.35}
.menu{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:10px max(var(--safe),12px) calc(10px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--panel) 78%,transparent);transform:translateY(105%);opacity:0;pointer-events:none;transition:transform .2s ease,opacity .2s}.app.menu-open .menu{transform:translateY(0);opacity:1;pointer-events:auto}.menuHeader{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}.menuHeader strong{font-size:15px}.hint{font-size:12px;color:var(--muted)}
.channelStrip{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;padding:3px 2px 5px;scrollbar-width:thin}.channelCard{flex:0 0 clamp(94px,11vw,132px);min-height:58px;padding:9px 8px;border-radius:9px;border:2px solid transparent;background:#20242c;color:#fff;text-align:center;cursor:pointer;outline:0;scroll-snap-align:center;font-weight:650}.channelCard:hover,.channelCard:focus-visible{border-color:var(--focus);background:#343a46;transform:translateY(-2px)}.channelCard.active{background:var(--accent);border-color:#fff}.tag{display:block;color:#fde047;font-size:10px;text-transform:uppercase;margin-top:4px}
.mobileBar{display:none}.below{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:14px 0}.action{border:1px solid #ffffff28;background:#181c24;color:#fff;border-radius:10px;padding:11px 17px;min-height:46px;cursor:pointer;outline:0}.action:hover,.action:focus-visible{background:var(--accent);border-color:var(--focus)}.links{text-align:center;color:var(--muted);font-size:14px}.links a{color:#68b7ff;padding:8px;display:inline-block}
.app:fullscreen,.app.fullscreen{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0}.app:fullscreen .quickActions,.app.fullscreen .quickActions{bottom:var(--safe)}

@media (min-width:768px){
  #recallFloat{display:none}
  .menu{padding-bottom:12px}

@media (max-width:767px){
  #visualizer{gap:4px}
  .bar{width:5px;height:72px}
  body{padding-bottom:76px}

  .title{font-size:20px;margin:8px}
  .app{border-radius:0;aspect-ratio:16/9}
  .topHud{top:8px;left:8px;right:8px}
  .status{font-size:12px;padding:6px 9px}
  .quickActions{right:8px;bottom:8px;gap:6px}
  .iconBtn{min-width:40px;width:40px;height:40px;font-size:17px;border-width:1.5px}
  #menuBtn{display:none}
  .menu{position:fixed;left:0;right:0;bottom:64px;z-index:20;max-height:52dvh;background:#11151bf5;border-radius:18px 18px 0 0;padding:10px 12px 12px;box-shadow:0 -12px 32px #0009}
  .menuHeader{margin:4px 2px 10px;gap:10px}
  .menuHeader strong{font-size:17px}
  .hint{font-size:11px;line-height:1.3;text-align:right}
  .channelStrip{display:grid;grid-template-columns:repeat(3,1fr);max-height:38dvh;overflow-y:auto;scroll-snap-type:none;padding-bottom:4px}
  .channelCard{min-width:0;min-height:58px;padding:8px 6px}
  .below{display:none}
  .links{padding:14px 10px}

  .mobileBar button:active,.mobileBar button:focus-visible{background:var(--accent);border-color:var(--focus);outline:0}

}

@media (max-width:430px){.channelStrip{grid-template-columns:repeat(2,1fr)}}
@media (max-width:380px){.mobileBar button{font-size:12px}.menuHeader{align-items:flex-start}.hint{max-width:58%}.channelCard{font-size:14px}}

/* Giao diện chuẩn cho Tivi LG webOS */
body.tv-mode{position:fixed;inset:0;width:100%;height:100%;min-height:0;overflow:hidden;background:#000;overscroll-behavior:none}
body.tv-mode .shell{position:absolute;inset:0;width:100%;height:100%;max-width:none;margin:0;padding:0;overflow:hidden}
body.tv-mode .title,body.tv-mode .below,body.tv-mode .links,body.tv-mode .mobileBar{display:none!important}

body.tv-mode .menuHeader{margin:20px 0 12px}

body.tv-mode .hint{font-size:15px}
body.tv-mode .channelCard{flex:0 0 164px;min-height:74px;padding:12px 10px;border-radius:12px;font-size:20px;border-width:3px}
body.tv-mode .channelCard:hover,body.tv-mode .channelCard:focus-visible{transform:none;border-color:var(--focus);box-shadow:0 0 0 4px #facc1545;background:#343a46}
body.tv-mode .channelCard.active{background:var(--accent);border-color:#fff}
body.tv-mode .tag{font-size:12px;margin-top:6px}
body.tv-mode .app.menu-open .quickActions{bottom:132px}

.tvApps{display:none}
body.tv-mode .tvApps{
  position:absolute;left:0;right:0;bottom:0;z-index:8;
  display:flex;justify-content:center;gap:18px;
  padding:22px 30px 28px;
  background:linear-gradient(0deg,rgba(8,10,14,.985) 72%,rgba(8,10,14,.88) 88%,transparent);
  transform:translateY(112%);opacity:0;pointer-events:none;
  transition:transform .22s ease,opacity .22s ease;
}
body.tv-mode .app.apps-open .tvApps{transform:translateY(0);opacity:1;pointer-events:auto}
body.tv-mode .app.apps-open .quickActions{opacity:0!important;pointer-events:none!important}
body.tv-mode .app.apps-open .menu{transform:translateY(105%);opacity:0;pointer-events:none}
.tvAppLink{
  min-width:170px;min-height:84px;padding:14px 20px;border-radius:16px;
  border:3px solid #ffffff2b;background:#20252f;color:#fff;text-decoration:none;
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-size:22px;font-weight:700;outline:0;box-shadow:0 10px 28px #0007;
}
.tvAppLink:hover,.tvAppLink:focus-visible{
  background:var(--accent);border-color:var(--focus);
  box-shadow:0 0 0 5px #facc1540,0 12px 34px #0009;
  transform:translateY(-3px) scale(1.02)
}
.tvAppIcon{font-size:28px}.tvAppsHint{position:absolute;bottom:5px;left:0;right:0;text-align:center;color:#b7bec9;font-size:13px}

/* LG webOS: cho phép tương tác trình phát iframe để bật âm thanh của bên thứ ba */
.iframeAudioHelp{display:none}
body.tv-mode .app.iframe-audio-access #tvIframe{pointer-events:auto!important}
body.tv-mode .iframeAudioHelp{display:none;position:absolute;z-index:12;top:14px;left:18px;right:18px;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:rgba(5,9,16,.92);border:1px solid #ffffff55;border-radius:10px;color:#fff;font-size:17px}
body.tv-mode .app.iframe-audio-access .iframeAudioHelp{display:flex}
body.tv-mode .iframeAudioDone{flex:none;background:#facc15;color:#141414;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}
/* Màn hình chuyển kênh: nền vẫn có nội dung khi bộ giải mã ngừng để nạp nguồn mới. */
.switchCover{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#101724;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease,visibility .18s ease}
.switchCover.visible{opacity:1;visibility:visible;pointer-events:auto}
.frameHold{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;filter:brightness(.45) blur(2px);transform:scale(1.015)}
.switchTint{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(12,20,34,.56),rgba(0,0,0,.87));pointer-events:none}
.switchContent{position:relative;z-index:1;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;color:#fff;padding:24px;max-width:88%;text-shadow:0 2px 8px #000}
.switchContent strong{font-size:clamp(18px,3.2vw,36px);font-weight:700}
.switchContent small{font-size:clamp(12px,1.55vw,20px);color:#d6dde8;line-height:1.45}
.switchSpinner{width:42px;height:42px;border-radius:50%;border:4px solid #ffffff46;border-top-color:#ef4444;animation:spin .9s linear infinite}
.switchCover.failed .switchSpinner{display:none}
.switchActions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.switchActions[hidden]{display:none!important}
.switchActions button{padding:12px 21px;min-width:120px;background:#262f3b;color:white;border:2px solid #ffffff60;border-radius:11px;font-size:18px;cursor:pointer}
.switchActions button:hover,.switchActions button:focus-visible{outline:0;background:#b91c1c;border-color:#facc15;box-shadow:0 0 0 3px #facc1540}
body.tv-mode video:focus-visible{box-shadow:none}
body.tv-mode .switchContent{padding-bottom:6vh}
body.tv-mode .switchContent strong{font-size:34px}
body.tv-mode .switchContent small{font-size:21px}
body.tv-mode .switchSpinner{width:54px;height:54px}
@media (max-width:767px){.switchContent{gap:7px;padding:12px}.switchContent strong{font-size:15px}.switchContent small{font-size:11px}.switchSpinner{width:25px;height:25px;border-width:3px}.switchActions button{font-size:12px;min-width:82px;padding:7px 9px}}
@media (prefers-reduced-motion:reduce){.switchCover{transition:none}}
</style>

    /* ---------------- cache & truy xuất luồng ---------------- */
    function cacheKey(url){return 'tv.stream.'+encodeURIComponent(url)}
    function getCachedUrl(url){
      try{
        const str=safeRead(SS,cacheKey(url));if(!str)return null;
        const entry=JSON.parse(str);
        if(!entry||!entry.url||Date.now()-entry.time>CONFIG.streamCacheTtlMs){
          safeRemove(SS,cacheKey(url));return null;
        }
        return entry.url;
      }catch(_){return null}
    }
    function setCachedUrl(url,src){
      safeWrite(SS,cacheKey(url),JSON.stringify({url:src,time:Date.now()}));
    }
    function extractM3u8(text){
      if(typeof text!=='string')return null;
      // Chỉ nhận HTTPS/HTTP m3u8 (kể cả URL có ký tự \/ và tham số).
      const normalized=text.replace(/\\\//g,'/').replace(/&amp;/g,'&');
      const found=normalized.match(/https?:\/\/[^\s"'<>\\]+?\.m3u8(?:\?[^\s"'<>\\]*)?/i);
      if(!found)return null;
      try{const u=new URL(found[0]);return /^https?:$/.test(u.protocol)?u.href:null}
      catch(_){return null}
    }
    async function resolveCurl(ctx,ignoreCache=false){
      if(!ignoreCache){
        const cached=getCachedUrl(ctx.channel.url);
        if(cached){ctx.usedCache=true;return cached}
      }
      ctx.usedCache=false;
      const ctrl=typeof AbortController!=='undefined'?new AbortController():null;
      fetchAbort=ctrl;
      const timer=ctrl?setTimeout(()=>ctrl.abort(),CONFIG.curlTimeoutMs):null;
      try{
        const r=await fetch(ctx.channel.url,{cache:'no-store',signal:ctrl?ctrl.signal:undefined});
        if(!r.ok)throw new Error('HTTP '+r.status);
        const html=await r.text();
        const url=extractM3u8(html);
        if(url)setCachedUrl(ctx.channel.url,url);
        return url;
      }catch(err){
        console.warn('[TV] Không lấy được M3U8 trực tiếp:',ctx.channel.name,err.message||err);
        return null;
      }finally{
        if(timer)clearTimeout(timer);
        if(fetchAbort===ctrl)fetchAbort=null;
      }
    }

    /* ---------------- quản lý vòng đời video/iframe ---------------- */
    function clearPlayerTimers(){
      clearTimeout(startTimer);clearTimeout(stallTimer);clearTimeout(iframeRevealTimer);
      startTimer=stallTimer=iframeRevealTimer=null;
    }
    function stopCurrentPlayer(){
      clearPlayerTimers();
      if(hls){try{hls.destroy()}catch(e){console.debug(e)}hls=null}
      // Gỡ nguồn, tránh các sự kiện cũ làm thay đổi player mới.
      video.onloadedmetadata=null;
      try{video.pause()}catch(_){}
      video.removeAttribute('src');
      try{video.load()}catch(_){}
      iframeEl.onload=null;iframeEl.onerror=null;
      iframeEl.style.display='none';iframeEl.style.pointerEvents='';
      iframeEl.src='about:blank';

      updateMuteUI();
    }
    function abortPendingFetch(){
      if(fetchAbort){try{fetchAbort.abort()}catch(_){}fetchAbort=null}
    }
    function isCurrent(ctx,phase){
      return ctx&&activeLoad===ctx&&ctx.token===loadToken&&
             (phase===undefined||ctx.phase===phase);
    }
    function phaseBegin(ctx,mode){
      stopCurrentPlayer();
      if(!isCurrent(ctx))return -1;
      ctx.phase=(ctx.phase||0)+1;
      playbackMode=mode;
      return ctx.phase;
    }
    function armStartTimeout(ctx,phase,ms,reason){
      clearTimeout(startTimer);
      startTimer=setTimeout(()=>{
        if(isCurrent(ctx,phase)&&playbackState==='loading'){
          console.warn('[TV] Quá thời gian:',reason);
          handleStreamFailure(ctx,phase,reason);
        }
      },ms);
    }
    function markPlaying(ctx,phase,iframe=false){
      if(!isCurrent(ctx,phase))return;
      playbackState='playing';
      clearTimeout(startTimer);clearTimeout(stallTimer);
      hideCover();setStatus('',false);saveLastChannel();
      visualizer.classList.toggle('playing',ctx.channel.type==='radio'&&!video.paused);
      playBtn.textContent='⏸ Tạm dừng';
      if(iframe)console.info('[TV] iframe tải xong (không xác minh được video con đã phát):',ctx.channel.name);
    }
    function tryPlay(ctx,phase){
      if(!ctx||!isCurrent(ctx,phase)||playbackMode==='iframe')return;
      let promise;
      try{promise=video.play()}catch(e){console.warn('[TV] play lỗi:',e);return}
      if(promise&&typeof promise.catch==='function'){
        promise.catch(err=>{
          if(!isCurrent(ctx,phase))return;
          if(err.name==='AbortError')return;
          if(err.name==='NotAllowedError'){
            autoMutedByPolicy=true;
            if(video.muted){
              showFatal('Trình duyệt yêu cầu nhấn OK hoặc nút Thử lại để phát.');return;
            }
            video.muted=true;updateMuteUI();
            let again;try{again=video.play()}catch(_){}
            if(again&&again.catch)again.catch(()=>{
              if(isCurrent(ctx,phase))showFatal('Trình duyệt đang chặn phát tự động; nhấn OK hoặc Thử lại.');
            });
            setStatus('Nhấn nút loa để bật tiếng',false,2500);
          }else console.warn('[TV] play() thất bại:',err.message||err);
        });
      }
    }
    function startNative(ctx,url){
      if(!isCurrent(ctx))return;
      ctx.nativeTried=true;ctx.playUrl=url;
      const phase=phaseBegin(ctx,'native');if(phase<0)return;
      playbackState='loading';
      video.onloadedmetadata=()=>{if(isCurrent(ctx,phase))tryPlay(ctx,phase)};
      video.src=url;
      try{video.load()}catch(_){}
      armStartTimeout(ctx,phase,CONFIG.videoStartTimeoutMs,'HLS native không bắt đầu phát');
    }
    function startHlsJs(ctx,url){
      if(!isCurrent(ctx))return;
      const H=window.Hls;
      if(!H||!H.isSupported||!H.isSupported()){
        if(!ctx.nativeTried&&canNative())return startNative(ctx,url);
        return handleStreamFailure(ctx,undefined,'Thiết bị không hỗ trợ định dạng nguồn phát');
      }
      ctx.hlsTried=true;ctx.playUrl=url;
      const phase=phaseBegin(ctx,'hls');if(phase<0)return;
      playbackState='loading';
      const player=new H({
        lowLatencyMode:false,
        backBufferLength:isWebOS?8:15,
        maxBufferLength:isWebOS?CONFIG.webOSBufferSeconds:30,
        maxMaxBufferLength:isWebOS?28:60,
        maxBufferSize:isWebOS?26*1024*1024:60*1024*1024,
        liveSyncDurationCount:3,
        liveMaxLatencyDurationCount:10,
        maxBufferHole:0.5,
        nudgeMaxRetry:4,
        capLevelToPlayerSize:true,
        enableWorker:true
      });
      hls=player;
      player.on(H.Events.MANIFEST_PARSED,()=>{
        if(isCurrent(ctx,phase)&&hls===player)tryPlay(ctx,phase);
      });
      player.on(H.Events.ERROR,(_e,data)=>{
        if(!isCurrent(ctx,phase)||hls!==player)return;
        if(!data||!data.fatal){
          if(data&&data.details===H.ErrorDetails.BUFFER_STALLED_ERROR){
            setStatus('Đang đồng bộ lại luồng…',true,2500);
          }
          return;
        }
        if(data.type===H.ErrorTypes.NETWORK_ERROR&&ctx.networkRetries<2){
          ctx.networkRetries++;
          const delay=ctx.networkRetries===1?700:1600;
          console.warn('[TV] Khôi phục lỗi mạng HLS',ctx.networkRetries);
          setTimeout(()=>{
            if(isCurrent(ctx,phase)&&hls===player){
              try{player.startLoad()}catch(e){handleStreamFailure(ctx,phase,'Không thể tải dữ liệu')}
            }
          },delay);
          return;
        }
        if(data.type===H.ErrorTypes.MEDIA_ERROR&&ctx.mediaRetries<2){
          ctx.mediaRetries++;
          console.warn('[TV] Khôi phục lỗi giải mã HLS',ctx.mediaRetries);
          try{
            if(ctx.mediaRetries===2&&player.swapAudioCodec)player.swapAudioCodec();
            player.recoverMediaError();
          }catch(e){handleStreamFailure(ctx,phase,'Bộ giải mã không khôi phục được')}
          return;
        }
        handleStreamFailure(ctx,phase,'Nguồn HLS bị gián đoạn hoặc không tương thích');
      });
      try{
        player.attachMedia(video);
        player.loadSource(url);
      }catch(e){handleStreamFailure(ctx,phase,'Lỗi khởi tạo trình phát HLS');return}
      armStartTimeout(ctx,phase,CONFIG.videoStartTimeoutMs,'HLS.js không bắt đầu phát');
    }
    function canNative(){
      try{return !!(video.canPlayType('application/vnd.apple.mpegurl')||video.canPlayType('application/x-mpegURL'))}catch(_){return false}
    }
    function startVideo(ctx,url){
      if(!isCurrent(ctx))return;
      const isHls=/\.m3u8(?:[?#]|$)/i.test(url);
      if(isHls&&isWebOS&&canNative()&&!ctx.nativeTried)return startNative(ctx,url);
      if(isHls&&window.Hls&&window.Hls.isSupported&&window.Hls.isSupported()&&!ctx.hlsTried)return startHlsJs(ctx,url);
      if(isHls&&canNative()&&!ctx.nativeTried)return startNative(ctx,url);
      if(isHls)return handleStreamFailure(ctx,undefined,'Thiết bị không có trình phát HLS phù hợp');
      return startNative(ctx,url); // MP3/AAC/MP4 thông thường
    }
    function startIframe(ctx,url){
      if(!isCurrent(ctx))return;
      ctx.iframeTried=true;
      const phase=phaseBegin(ctx,'iframe');if(phase<0)return;
      playbackState='loading';
      showCover('Đang mở '+ctx.channel.name,'Đang kết nối trình phát nhúng…');
      video.style.display='none';
      iframeEl.style.display='block';
      iframeEl.style.pointerEvents='';
      iframeEl.onload=()=>{
        if(!isCurrent(ctx,phase))return;
        // iframe.onload chỉ chứng minh trang nhúng tải, KHÔNG chứng minh video có hình.
        clearTimeout(startTimer);
        clearTimeout(iframeRevealTimer);
        iframeRevealTimer=setTimeout(()=>markPlaying(ctx,phase,true),CONFIG.iframeRevealDelayMs);
      };
      iframeEl.onerror=()=>{if(isCurrent(ctx,phase))showFatal('Không tải được trang phát nhúng. Hãy thử lại hoặc chọn kênh khác.')};
      iframeEl.src=url;
      updateMuteUI();
      armStartTimeout(ctx,phase,CONFIG.iframeStartTimeoutMs,'Không nhận được phản hồi từ nguồn nhúng');
      if(isWebOS)try{video.focus({preventScroll:true})}catch(_){}
    }
    async function startCurl(ctx,ignoreCache=false){
      if(!isCurrent(ctx))return;
      showCover('Đang mở '+ctx.channel.name,'Đang tìm luồng truyền hình…');
      const resolved=await resolveCurl(ctx,ignoreCache);
      if(!isCurrent(ctx))return;
      if(resolved){startVideo(ctx,resolved)}
      else startIframe(ctx,ctx.channel.url);
    }
    function handleStreamFailure(ctx,phase,reason){
      if(!isCurrent(ctx,phase))return;
      clearTimeout(startTimer);
      console.warn('[TV] '+ctx.channel.name+': '+reason);
      // Lỗi native -> thử hls.js nếu có; hoặc chiều ngược lại.
      if(playbackMode==='native'&&!ctx.hlsTried&&/\.m3u8(?:[?#]|$)/i.test(ctx.playUrl||'')&&window.Hls&&window.Hls.isSupported&&window.Hls.isSupported()){
        showCover('Đang khôi phục '+ctx.channel.name,'Thử bộ giải mã thay thế…');
        return startHlsJs(ctx,ctx.playUrl);
      }
      if(playbackMode==='hls'&&!ctx.nativeTried&&canNative()){
        showCover('Đang khôi phục '+ctx.channel.name,'Thử phát trực tiếp…');
        return startNative(ctx,ctx.playUrl);
      }
      if(ctx.channel.type==='curl_hls'){
        if(ctx.usedCache&&!ctx.cacheRefreshTried){
          ctx.cacheRefreshTried=true;
          safeRemove(SS,cacheKey(ctx.channel.url));
          stopCurrentPlayer();  // Ngắt hẳn luồng lỗi trước khi truy xuất URL mới.
          return startCurl(ctx,true);
        }
        if(!ctx.iframeTried)return startIframe(ctx,ctx.channel.url);
      }
      showFatal(reason+'. Nhấn “Thử lại” hoặc “Kênh trước”.');
    }
    function requestChannel(index,options={}){
      index=(index+channels.length)%channels.length;
      const {remember=true,isInitial=false,force=false}=options;
      if(!force&&!isInitial&&index===currentIndex&&playbackState!=='error')return;
      // Snapshot trước stopCurrentPlayer; cover được dựng ngay, không lộ nền đen.
      captureFrame();
      loadToken++;
      abortPendingFetch();
      stopCurrentPlayer();
      if(remember&&index!==currentIndex)previousIndex=currentIndex;
      currentIndex=index;
      if(autoMutedByPolicy&&!isInitial){video.muted=false;autoMutedByPolicy=false}
      playbackState='loading';
      updateRecall();updateUI();updateMuteUI();
      showCover('Đang mở '+channels[index].name,'Kết nối nguồn phát…');
      setStatus('',false);
      const ctx={
        token:loadToken,channel:channels[index],phase:0,
        hlsTried:false,nativeTried:false,iframeTried:false,
        usedCache:false,cacheRefreshTried:false,networkRetries:0,mediaRetries:0,
        playUrl:''
      };
      activeLoad=ctx;
      if(ctx.channel.type==='iframe')startIframe(ctx,ctx.channel.url);
      else if(ctx.channel.type==='curl_hls')startCurl(ctx);
      else startVideo(ctx,ctx.channel.url);
    }
    function selectChannel(index){setMenu(false);requestChannel(index)}
    function changeChannel(step){selectChannel(currentIndex+step)}
    function recall(){
      if(previousIndex===null){setStatus('Chưa có kênh trước',false,1800);return}
      const target=previousIndex;
      requestChannel(target,{remember:true});
      setMenu(false);
    }

    /* ---------------- khi video phát / chờ / gặp lỗi ---------------- */
    video.addEventListener('playing',()=>{
      if(!activeLoad||playbackMode==='iframe'||video.readyState<2)return;
      markPlaying(activeLoad,activeLoad.phase);
    });
    video.addEventListener('play',()=>{
      playBtn.textContent='⏸ Tạm dừng';
      if(channels[currentIndex].type==='radio')visualizer.classList.add('playing');
    });
    video.addEventListener('pause',()=>{
      playBtn.textContent='▶ Phát tiếp';
      visualizer.classList.remove('playing');
    });
    video.addEventListener('waiting',onBuffering);
    video.addEventListener('stalled',onBuffering);
    function onBuffering(){
      if(!activeLoad||playbackMode==='iframe'||video.paused)return;
      if(playbackState==='playing')setStatus('Đang tải thêm dữ liệu…',true,5000);
      clearTimeout(stallTimer);
      const ctx=activeLoad,phase=ctx.phase;
      stallTimer=setTimeout(()=>{
        if(!isCurrent(ctx,phase)||video.paused)return;
        console.warn('[TV] Bộ đệm gián đoạn, thử khôi phục.');
        if(hls){
          try{hls.startLoad()}catch(_){}
          try{
            if(video.buffered.length){
              const end=video.buffered.end(video.buffered.length-1);
              if(end-video.currentTime>2)video.currentTime=end-.5;
            }
          }catch(_){}
        }
        tryPlay(ctx,phase);
      },CONFIG.stalledRetryMs);
    }
    video.addEventListener('timeupdate',()=>{
      if(video.readyState>=3){clearTimeout(stallTimer);stallTimer=null}
    });
    video.addEventListener('error',()=>{
      if(!activeLoad||playbackMode==='iframe'||playbackMode==='none')return;
      if(hls&&playbackMode==='hls')return; // Hls.Events.ERROR tự xử lý.
      handleStreamFailure(activeLoad,activeLoad.phase,'Lỗi bộ giải mã hoặc nguồn phát');
    });
    video.addEventListener('volumechange',updateMuteUI);
    video.addEventListener('click',()=>{
      if(autoMutedByPolicy&&video.muted){toggleMute();return}
      if(video.paused)tryPlay(activeLoad,activeLoad&&activeLoad.phase);
      else video.pause();
    });
    function resumePlayback(){
      if(playbackState==='error'){requestChannel(currentIndex,{remember:false,force:true});return}
      tryPlay(activeLoad,activeLoad&&activeLoad.phase);
    }
    playBtn.onclick=()=>video.paused?resumePlayback():video.pause();

    /* ---------------- menu, quick buttons, mobile ---------------- */
    channels.forEach((ch,i)=>{
      const b=document.createElement('button');
      b.className='channelCard';b.type='button';b.setAttribute('role','option');
      b.textContent=ch.name;
      if(ch.type==='radio'){
        const tag=document.createElement('span');tag.className='tag';tag.textContent='radio';b.appendChild(tag);
      }
      b.addEventListener('click',()=>selectChannel(i));
      b.addEventListener('keydown',e=>{
        if(isWebOS&&e.key==='ArrowDown'){e.preventDefault();setMenu(false);setApps(true,true);return}
        if(isWebOS&&e.key==='ArrowUp'){e.preventDefault();setMenu(false);return}
        if(e.key==='ArrowRight'||(!isWebOS&&e.key==='ArrowDown')){
          e.preventDefault();const next=playlist.children[(i+1)%channels.length];
          next.focus({preventScroll:true});centerActiveCard(next);
        }
        if(e.key==='ArrowLeft'||(!isWebOS&&e.key==='ArrowUp')){
          e.preventDefault();const prev=playlist.children[(i-1+channels.length)%channels.length];
          prev.focus({preventScroll:true});centerActiveCard(prev);
        }
      });
      playlist.appendChild(b);
    });
    $('#menuBtn').onclick=()=>setMenu(!app.classList.contains('menu-open'),true);
    $('#mobileMenu').onclick=()=>setMenu(!app.classList.contains('menu-open'),true);
    $('#recallBtn').onclick=$('#recallFloat').onclick=recall;
    $('#switchRetry').onclick=()=>requestChannel(currentIndex,{remember:false,force:true});
    $('#switchBack').onclick=recall;
    muteBtn.onclick=muteActionBtn.onclick=toggleMute;
    $('#mobilePrev').onclick=()=>changeChannel(-1);
    $('#mobileNext').onclick=()=>changeChannel(1);

    async function toggleFullscreen(){
      if(isWebOS){
        // webOS đã cố định đúng 100% viewport: không tháo tv-mode.
        lockTvViewport();setMenu(false);return;
      }
      setMenu(false);
      if(!document.fullscreenElement&&!document.webkitFullscreenElement){
        const enter=app.requestFullscreen||app.webkitRequestFullscreen;
        if(enter){
          try{await enter.call(app);app.classList.add('fullscreen')}catch(e){console.warn(e)}
        }
      }else{
        const exit=document.exitFullscreen||document.webkitExitFullscreen;
        if(exit){try{await exit.call(document);app.classList.remove('fullscreen')}catch(e){console.warn(e)}}
      }
    }
    $('#fullscreenBtn').onclick=toggleFullscreen;
    $('#mobileFs').onclick=toggleFullscreen;
    video.addEventListener('dblclick',toggleFullscreen);
    document.addEventListener('fullscreenchange',()=>app.classList.toggle('fullscreen',!!document.fullscreenElement));

    /* ---------------- LG Magic Remote: Back chính xác một lần ----------------
     * LG xác nhận mã phím 461. Trên ứng dụng web/browser, Back có thể tạo
     * history.back() mà không có keydown, do đó dùng cả popstate.
     * Chỉ keydown mới kích hoạt; keyup chỉ chặn propagation (KHÔNG recall).
     */
    function isBackKey(e){
      const code=e.keyCode||e.which||0;
      return code===461||code===10009||e.key==='GoBack'||e.key==='BrowserBack'||
             e.key==='Back'||e.code==='BrowserBack'||(isWebOS&&e.key==='Escape');
    }
    function handleBackAction(){
      if(iframeAudioOpen){closeIframeAudio();scheduleQuickControlsHide();return}
      if(app.classList.contains('apps-open')){setApps(false);return}
      if(app.classList.contains('menu-open')){setMenu(false);return}
      recall();
    }
    function backOnce(origin){
      const now=Date.now();
      if(now-lastBackAt<CONFIG.backDedupMs)return false;
      lastBackAt=now;
      console.debug('[TV] Back:',origin);
      handleBackAction();return true;
    }
    function consumeBackEvent(e){
      if(!isWebOS||!isBackKey(e))return false;
      e.preventDefault();e.stopPropagation();
      if(e.stopImmediatePropagation)e.stopImmediatePropagation();
      return true;
    }
    // Capture: ưu tiên bắt trước handler của các nút điều khiển app.
    document.addEventListener('keydown',e=>{
      if(!consumeBackEvent(e))return;
      if(!e.repeat)backOnce('keydown');
    },true);
    document.addEventListener('keyup',e=>{consumeBackEvent(e)},true);
    document.addEventListener('keydown',e=>{
      if(isWebOS&&isBackKey(e))return;
      const key=e.key, code=e.keyCode||e.which||0;
      const inMenu=app.classList.contains('menu-open');
      const appsOpen=app.classList.contains('apps-open');
      if(!isWebOS&&(key==='Escape'||key==='Backspace')){
        if(inMenu){e.preventDefault();setMenu(false)}
        else if(document.fullscreenElement){e.preventDefault();toggleFullscreen()}
        return;
      }
      if(isWebOS&&appsOpen){
        if(key==='ArrowLeft'){e.preventDefault();moveTvApp(-1);return}
        if(key==='ArrowRight'){e.preventDefault();moveTvApp(1);return}
        if(key==='ArrowUp'){e.preventDefault();setApps(false);return}
        if(key==='ArrowDown'){e.preventDefault();return}
        if(key==='Enter'||key===' '){
          const a=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('[data-tvapp]');
          if(a){e.preventDefault();a.click();return}
        }
      }
      const inQuickActions=!!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('.quickActions'));
      if(inQuickActions){
        const buttons=[...document.querySelectorAll('.quickActions .iconBtn:not(:disabled)')].filter(b=>b.offsetParent!==null);
        const n=buttons.indexOf(document.activeElement);
        if(key==='ArrowLeft'&&n>0){e.preventDefault();buttons[n-1].focus();return}
        if(key==='ArrowRight'&&n<buttons.length-1){e.preventDefault();buttons[n+1].focus();return}
        if(key==='ArrowDown'){e.preventDefault();video.focus();return}
      }
      if(isWebOS&&!inMenu&&!appsOpen){
        if(key==='ArrowDown'){e.preventDefault();setApps(true,true);return}
        if(key==='ArrowUp'&&!inQuickActions){e.preventDefault();showQuickControls();muteBtn.focus();return}
      }
      if(!inMenu&&!appsOpen&&!inQuickActions&&(key==='ArrowLeft'||key==='ChannelDown'||key==='PageDown'||code===34)){
        e.preventDefault();changeChannel(-1);return;
      }
      if(!inMenu&&!appsOpen&&!inQuickActions&&(key==='ArrowRight'||key==='ChannelUp'||key==='PageUp'||code===33)){
        e.preventDefault();changeChannel(1);return;
      }
      if(!inMenu&&!appsOpen&&(key==='Enter'||key===' ')){
        if(document.activeElement===video||document.activeElement===document.body){
          e.preventDefault();setMenu(true,true);return;
        }
      }
      if(key==='r'||key==='R'){e.preventDefault();recall()}
      if(key==='m'||key==='M'){e.preventDefault();toggleMute()}
    });
    if(isWebOS){
      ['mousemove','pointermove','pointerdown','touchstart'].forEach(name=>document.addEventListener(name,showQuickControls,{passive:true}));
      document.addEventListener('keydown',showQuickControls,true);
      $('.quickActions').addEventListener('mouseenter',showQuickControls);
      $('.quickActions').addEventListener('focusin',showQuickControls);
      // Không tự bật pointerEvents iframe khi rê chuột: dễ mất Back.
      window.addEventListener('keydown',()=>{
        if(isIframeActive()&&!iframeAudioOpen)iframeEl.style.pointerEvents='';
      },true);
      window.addEventListener('resize',lockTvViewport);
      window.addEventListener('orientationchange',lockTvViewport);
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)lockTvViewport()});
      // Chỉ tạo bẫy lịch sử trên webOS, PC/mobile vẫn Back của trình duyệt.
      try{
        history.replaceState({tvRoot:true},'',location.href);
        history.pushState({tvGuard:true},'',location.href);
      }catch(e){console.warn('[TV] Không thiết lập được history guard:',e)}
      window.addEventListener('popstate',()=>{
        backOnce('popstate');
        try{history.pushState({tvGuard:true},'',location.href)}catch(e){console.warn(e)}
      });
    }

    /* ---------------- giữ màn hình sáng, khởi động ---------------- */
    async function requestWakeLock(){
      if('wakeLock' in navigator&&!document.hidden){
        try{wakeLock=await navigator.wakeLock.request('screen')}catch(_){}
      }
    }
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)requestWakeLock()});
    requestWakeLock();
    const barCount=isWebOS?16:28;
    const mid=(barCount-1)/2;
    for(let i=0;i<barCount;i++){
      const b=document.createElement('i');b.className='bar';
      const center=1-Math.abs(i-mid)/mid;
      b.style.animationDuration=(.48+Math.random()*.72).toFixed(2)+'s';
      b.style.animationDelay=(-Math.random()*1.4).toFixed(2)+'s';
      b.style.height=(70+(.55+center*.65+Math.random()*.28)*72).toFixed(0)+'px';
      visualizer.appendChild(b);
    }
    video.muted=false;
    updateRecall();updateUI();updateMuteUI();
    requestChannel(currentIndex,{remember:false,isInitial:true});
    setTimeout(()=>{
      lockTvViewport();
      try{video.focus({preventScroll:true})}catch(_){}
    },300);
    scheduleQuickControlsHide();
    console.info('[TV] webOS optimized v3.0 ready, device:',isWebOS?'webOS':'Browser');
</script>
</body>
