<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090b0f">
<title>TH Nguyên Nhi</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root{--accent:#ef4444;--focus:#facc15;--bg:#090b0f;--panel:rgba(12,15,21,.94);--text:#fff;--muted:#aab2c0;--safe:clamp(10px,2vw,24px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Roboto,Arial,sans-serif;overscroll-behavior:none}button{font:inherit}
body{min-height:100dvh}.shell{width:min(100%,1280px);margin:auto;padding:12px}.title{text-align:center;margin:4px 0 10px;font-size:clamp(20px,3vw,34px);color:var(--accent)}
.app{position:relative;background:#000;overflow:hidden;border-radius:14px;box-shadow:0 16px 50px #000a;aspect-ratio:16/9;isolation:isolate}
video{width:100%;height:100%;display:block;background:#000;outline:0;object-fit:contain}video:focus-visible{box-shadow:inset 0 0 0 4px var(--focus)}
#visualizer{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:7px;background:radial-gradient(circle,#233044,#020203);pointer-events:none}.bar{width:9px;height:64px;border-radius:5px;background:var(--accent);transform:scaleY(.18);opacity:.45}.playing .bar{animation:bounce 1.05s ease-in-out infinite alternate}@keyframes bounce{to{transform:scaleY(1.2);opacity:1}}
.topHud{position:absolute;left:var(--safe);right:var(--safe);top:var(--safe);display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:4}.channelInfo,.status{background:#05070acc;backdrop-filter:blur(8px);border:1px solid #ffffff25;border-radius:10px;padding:8px 12px;text-shadow:0 1px 2px #000}.channelInfo{font-weight:700}.channelInfo small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:2px}.status{display:none;color:#fff;font-size:14px}.status.show{display:block}.spinner{display:inline-block;width:13px;height:13px;border:2px solid #fff5;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}
.quickActions{position:absolute;right:var(--safe);bottom:var(--safe);display:flex;gap:8px;z-index:6}.iconBtn{min-width:48px;height:48px;border-radius:999px;border:1px solid #ffffff40;background:#07090dcc;color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px);outline:0}.iconBtn:hover,.iconBtn:focus-visible{background:var(--accent);border-color:var(--focus);box-shadow:0 0 0 3px #facc1545}.iconBtn:disabled{opacity:.35}
.menu{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:10px max(var(--safe),12px) calc(10px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--panel) 78%,transparent);transform:translateY(105%);opacity:0;pointer-events:none;transition:transform .2s ease,opacity .2s}.app.menu-open .menu{transform:translateY(0);opacity:1;pointer-events:auto}.menuHeader{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}.menuHeader strong{font-size:15px}.hint{font-size:12px;color:var(--muted)}
.channelStrip{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;padding:3px 2px 5px;scrollbar-width:thin}.channelCard{flex:0 0 clamp(94px,11vw,132px);min-height:58px;padding:9px 8px;border-radius:9px;border:2px solid transparent;background:#20242c;color:#fff;text-align:center;cursor:pointer;outline:0;scroll-snap-align:center;font-weight:650}.channelCard:hover,.channelCard:focus-visible{border-color:var(--focus);background:#343a46;transform:translateY(-2px)}.channelCard.active{background:var(--accent);border-color:#fff}.tag{display:block;color:#fde047;font-size:10px;text-transform:uppercase;margin-top:4px}
.mobileBar{display:none}.below{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:14px 0}.action{border:1px solid #ffffff28;background:#181c24;color:#fff;border-radius:10px;padding:11px 17px;min-height:46px;cursor:pointer;outline:0}.action:hover,.action:focus-visible{background:var(--accent);border-color:var(--focus)}.links{text-align:center;color:var(--muted);font-size:14px}.links a{color:#68b7ff;padding:8px;display:inline-block}
.app:fullscreen,.app.fullscreen{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0}.app:fullscreen .quickActions,.app.fullscreen .quickActions{bottom:var(--safe)}
@media (min-width:768px){.menu{padding-bottom:12px}.channelStrip{max-height:78px}.app.menu-open .quickActions{bottom:102px}.app.menu-open .channelInfo{opacity:.35}}
@media (max-width:767px){body{padding-bottom:76px}.shell{padding:0}.title{font-size:20px;margin:8px}.app{border-radius:0;aspect-ratio:16/9}.topHud{top:8px;left:8px;right:8px}.channelInfo{font-size:13px;padding:6px 9px}.status{font-size:12px;padding:6px 9px}.quickActions{right:8px;bottom:8px}.iconBtn{width:42px;min-width:42px;height:42px}.menu{position:fixed;z-index:20;max-height:55dvh;background:#11151bf5;border-radius:18px 18px 0 0;padding:10px 12px calc(14px + env(safe-area-inset-bottom))}.menuHeader{margin:4px 2px 10px}.channelStrip{display:grid;grid-template-columns:repeat(3,1fr);max-height:40dvh;overflow-y:auto;scroll-snap-type:none}.channelCard{min-width:0;min-height:56px}.below{display:none}.links{padding:15px}.mobileBar{position:fixed;left:0;right:0;bottom:0;height:64px;padding:7px 10px calc(7px + env(safe-area-inset-bottom));background:#10131aee;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;z-index:15;border-top:1px solid #ffffff1f}.mobileBar button{border:0;border-radius:10px;background:#232833;color:#fff;font-size:13px}.mobileBar button:active{background:var(--accent)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<main class="shell">
<h1 class="title">TIVI <span style="color:#fff">NGUYÊN</span> NHI</h1>
<section class="app" id="app" aria-label="Trình phát truyền hình">
<div id="visualizer" aria-hidden="true"></div>
<video id="video" playsinline crossorigin="anonymous" tabindex="0"></video>
<div class="topHud"><div class="channelInfo"><span id="currentName">Đang tải…</span><small id="currentType">Trực tiếp</small></div><div class="status" id="status"></div></div>
<div class="quickActions">
<button class="iconBtn" id="recallFloat" title="Kênh vừa xem" aria-label="Kênh vừa xem" disabled>↶</button>
<button class="iconBtn" id="menuBtn" title="Danh sách kênh" aria-label="Mở danh sách kênh">☰</button>
</div>
<div class="menu" id="menu" aria-hidden="true">
<div class="menuHeader"><strong>Danh sách kênh</strong><span class="hint">← → đổi nhanh · OK chọn · Back đóng</span></div>
<div class="channelStrip" id="playlist" role="listbox" aria-label="Danh sách kênh"></div>
</div>
</section>
<div class="below">
<button class="action" id="playBtn">⏸ Tạm dừng</button><button class="action" id="recallBtn" disabled>↶ Kênh vừa xem</button><button class="action" id="fullscreenBtn">⛶ Toàn màn hình</button>
</div>
<div class="links"><a href="xemphim.html">Phim</a><a href="music.html">Nhạc</a></div>
</main>
<nav class="mobileBar" aria-label="Điều khiển nhanh trên điện thoại"><button id="mobilePrev">◀ Kênh trước</button><button id="mobileMenu">☰ Kênh</button><button id="mobileNext">Kênh sau ▶</button></nav>
<script>
const channels = [
        { name: "HTV1", url: "https://live.fptplay53.net/epzhd1/htv1_hls.smil/chunklist_b1800000.m3u8", type: "tv" },
        { name: "HTV2", url: "https://live.fptplay53.net/epzhd1/htv2hd_vhls.smil/chunklist_b1800000.m3u8", type: "tv" },
        { name: "HTV3", url: "https://live.fptplay53.net/epzhd1/htv3_hls.smil/chunklist.m3u8", type: "tv" },
        { name: "HTV4", url: "https://live.fptplay53.net/epzhd1/htv4_hls.smil/chunklist_b1800000.m3u8", type: "tv" },
        { name: "HTV7", url: "https://live.fptplay53.net/epzhd1/htv7hd_vhls.smil/chunklist_b5000000.m3u8", type: "tv" },
        { name: "HTV9", url: "https://live.fptplay53.net/epzhd1/htv9hd_vhls.smil/chunklist.m3u8", type: "tv" },
        { name: "SCTV2", url: "https://freem3u.xyz/api/live/play.m3u8?vid=201", type: "tv" },
        { name: "SCTV4", url: "https://vtvgolive-sctvdrm.vtvdigital.vn/zbhZdlxRAlmWWLLO5g6THg/1786005011/manifest/sctv4/playlist_720p.m3u8", type: "tv" },
        { name: "SCTV6", url: "https://live.fptplay53.net/epzhd2/film360_vhls.smil/chunklist.m3u8", type: "tv" },        
        { name: "VTV5", url: "https://vips-livecdn.fptplay.net/live/media/vtv5tnb/live-hls-avc/index.m3u8", type: "tv" },
        { name: "TN", url: "https://live.fptplay53.net/epzsd1/tayninh01_hls.smil/chunklist_b1800000.m3u8", type: "tv" },
        { name: "THVL1", url: "https://live.fptplay53.net/epzhd2/vinhlong1_vhls.smil/chunklist_b5000000.m3u8", type: "tv" },
        { name: "THVL2", url: "https://live.fptplay53.net/epzhd2/vinhlong2_vhls.smil/chunklist.m3u8", type: "tv" },
        { name: "THVL3", url: "https://live.fptplay53.net/epzhd2/vinhlong3_vhls.smil/chunklist.m3u8", type: "tv" },
        { name: "THDN2", url: "https://freem3u.xyz/api/live/play.m3u8?vid=255", type: "tv" },
        { name: "VieGT", url: "https://freem3u.xyz/api/live/play.m3u8?vid=180", type: "tv" },
        { name: "VieDr", url: "https://freem3u.xyz/api/live/play.m3u8?vid=177", type: "tv" },        
        { name: "INFO", url: "https://freem3u.xyz/api/live/play.m3u8?vid=189", type: "tv" },
        { name: "K-Drama", url: "https://stream.ads.ottera.tv/playlist.m3u8?network_id=425", type: "tv" },
        { name: "VNToday", url: "https://live.fptplay53.net/fnxhd1/vntoday_vhls.smil/chunklist_b5000000.m3u8", type: "tv" },
        { name: "FM 92.5", url: "https://1011337676.vnns.net/-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1cmkiOiIvaHR2Yy9WT0gtRk05Mi41LmFkbS50bXMvIiwiZXhwIjoxOTI0OTI1MjI4fQ.u5XcdU9KljAz3HgehDbCBbNEvSzWNAQTEKkU-DwH2K8-/htvc/VOH-FM92.5.adm.tms/chunks.m3u8", type: "radio" },
        { name: "FM 95.6", url: "https://1011337676.vnns.net/-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1cmkiOiIvaHR2Yy9WT0gtRk05NS42LmFkbS50bXMvIiwiZXhwIjoxOTI0OTI1MjI4fQ.isr2nlUkXOPGSxT-KT8FcZQFCcXn58RZrCyqoB3zDGg-/htvc/VOH-FM95.6.adm.tms/chunks.m3u8", type: "radio" },
        { name: "FM 99.9", url: "https://1011337676.vnns.net/-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1cmkiOiIvaHR2Yy9WT0gtRk05OS45LmFkbS50bXMvIiwiZXhwIjoxOTI0OTI1MjI4fQ.zVLoKcCW3tFLySpEQHcYh11PHIxk2ZE1pj5P-GFIm1I-/htvc/VOH-FM99.9.adm.tms/chunks.m3u8", type: "radio" },
        { name: "GTHN", url: "https://str.vov.gov.vn/vovlive/vovGTHN.sdp_aac/chunklist_w601606653.m3u8", type: "radio" },
        { name: "GTHCM", url: "https://str.vov.gov.vn/vovlive/vovGTHCM.sdp_aac/chunklist_w1213978008.m3u8", type: "radio" },
        { name: "M music", url: "https://stream-37.zeno.fm/4q7y9hvkp2zuv", type: "radio" },
        { name: "Dance machine", url: "https://edm.streeemer.com/listen/edm/radio.aac", type: "radio" },
        { name: "80s Pop Vibes", url: "https://oldies.streeemer.com/listen/oldies/radio.aac", type: "radio" }
    ];

const $=s=>document.querySelector(s);
const app=$('#app'),video=$('#video'),playlist=$('#playlist'),menu=$('#menu'),visualizer=$('#visualizer'),statusEl=$('#status');
const currentName=$('#currentName'),currentType=$('#currentType'),playBtn=$('#playBtn');
const recallButtons=[$('#recallBtn'),$('#recallFloat')];
let hls=null,currentIndex=Math.max(0,Math.min(channels.length-1,Number(localStorage.getItem('tv.lastChannel'))||0));
let previousIndex=null,loadToken=0,statusTimer=null;

for(let i=0;i<22;i++){const b=document.createElement('i');b.className='bar';b.style.animationDelay=(Math.random()*.8)+'s';visualizer.appendChild(b)}

function setStatus(text,loading=false,autoHide=0){clearTimeout(statusTimer);statusEl.innerHTML=(loading?'<span class="spinner"></span>':'')+text;statusEl.classList.toggle('show',!!text);if(autoHide)statusTimer=setTimeout(()=>statusEl.classList.remove('show'),autoHide)}
function setMenu(open,focusActive=false){app.classList.toggle('menu-open',open);menu.setAttribute('aria-hidden',String(!open));if(open&&focusActive){const card=playlist.children[currentIndex];card?.focus({preventScroll:true});card?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}else if(!open){video.focus({preventScroll:true})}}
function updateRecall(){const enabled=previousIndex!==null;recallButtons.forEach(b=>b.disabled=!enabled);if(enabled){const name=channels[previousIndex].name;recallButtons.forEach(b=>b.title='Quay lại '+name)}}
function updateUI(){const ch=channels[currentIndex];currentName.textContent=ch.name;currentType.textContent=ch.type==='radio'?'Phát thanh trực tuyến':'Truyền hình trực tiếp';visualizer.style.display=ch.type==='radio'?'flex':'none';visualizer.classList.toggle('playing',ch.type==='radio'&&!video.paused);[...playlist.children].forEach((el,i)=>{el.classList.toggle('active',i===currentIndex);el.setAttribute('aria-selected',String(i===currentIndex))});localStorage.setItem('tv.lastChannel',currentIndex)}
function destroyStream(){if(hls){hls.destroy();hls=null}video.pause();video.removeAttribute('src');video.load()}
function tryPlay(){video.play().catch(()=>setStatus('Nhấn OK hoặc chạm để phát',false,3500))}
function loadChannel(index,{remember=true}={}){index=(index+channels.length)%channels.length;if(index===currentIndex&&video.currentSrc)return;if(remember&&index!==currentIndex)previousIndex=currentIndex;currentIndex=index;updateRecall();updateUI();setStatus('Đang mở '+channels[index].name+'…',true);const token=++loadToken;destroyStream();const ch=channels[index];const isHls=/\.m3u8(?:$|\?)/i.test(ch.url);
if(isHls&&video.canPlayType('application/vnd.apple.mpegurl')){video.src=ch.url;video.addEventListener('loadedmetadata',()=>token===loadToken&&tryPlay(),{once:true})}
else if(isHls&&window.Hls&&Hls.isSupported()){hls=new Hls({lowLatencyMode:true,backBufferLength:15,maxBufferLength:12,maxMaxBufferLength:24,startLevel:-1});hls.loadSource(ch.url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>token===loadToken&&tryPlay());hls.on(Hls.Events.ERROR,(_,data)=>{if(token!==loadToken||!data.fatal)return;if(data.type===Hls.ErrorTypes.NETWORK_ERROR){setStatus('Mạng gián đoạn, đang thử lại…',true);hls.startLoad()}else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){setStatus('Đang khôi phục luồng phát…',true);hls.recoverMediaError()}else{setStatus('Kênh hiện không phát được',false,5000)}})}
else{video.src=ch.url;video.addEventListener('loadedmetadata',()=>token===loadToken&&tryPlay(),{once:true})}}
function selectChannel(index){loadChannel(index);setMenu(false)}
function changeChannel(step){selectChannel(currentIndex+step);setStatus(channels[currentIndex].name,false,1300)}
function recall(){if(previousIndex===null)return;const target=previousIndex;previousIndex=currentIndex;updateRecall();loadChannel(target,{remember:false});setMenu(false);setStatus('Quay lại '+channels[target].name,false,1600)}

channels.forEach((ch,i)=>{const b=document.createElement('button');b.className='channelCard';b.type='button';b.setAttribute('role','option');b.innerHTML=`${ch.name}${ch.type==='radio'?'<span class="tag">radio</span>':''}`;b.addEventListener('click',()=>selectChannel(i));b.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();playlist.children[(i+1)%channels.length].focus()}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();playlist.children[(i-1+channels.length)%channels.length].focus()}});playlist.appendChild(b)});

$('#menuBtn').onclick=()=>setMenu(!app.classList.contains('menu-open'),true);$('#mobileMenu').onclick=()=>setMenu(true,true);
$('#recallBtn').onclick=$('#recallFloat').onclick=recall;$('#mobilePrev').onclick=()=>changeChannel(-1);$('#mobileNext').onclick=()=>changeChannel(1);
playBtn.onclick=()=>video.paused?tryPlay():video.pause();video.addEventListener('click',()=>video.paused?tryPlay():video.pause());
video.addEventListener('play',()=>{playBtn.textContent='⏸ Tạm dừng';visualizer.classList.toggle('playing',channels[currentIndex].type==='radio');setStatus('',false)});video.addEventListener('pause',()=>{playBtn.textContent='▶ Phát tiếp';visualizer.classList.remove('playing')});video.addEventListener('waiting',()=>setStatus('Đang tải dữ liệu…',true));video.addEventListener('playing',()=>setStatus('',false));video.addEventListener('error',()=>setStatus('Không thể phát kênh này. Hãy thử lại sau.',false,5000));
function toggleFullscreen(){if(!document.fullscreenElement){(app.requestFullscreen||app.webkitRequestFullscreen)?.call(app);app.classList.add('fullscreen')}else{(document.exitFullscreen||document.webkitExitFullscreen)?.call(document);app.classList.remove('fullscreen')}}
$('#fullscreenBtn').onclick=toggleFullscreen;video.addEventListener('dblclick',toggleFullscreen);document.addEventListener('fullscreenchange',()=>app.classList.toggle('fullscreen',!!document.fullscreenElement));

document.addEventListener('keydown',e=>{const inMenu=app.classList.contains('menu-open');const key=e.key;const isBack=key==='Escape'||key==='Backspace'||e.keyCode===461;
if(isBack){e.preventDefault();if(inMenu)setMenu(false);else if(document.fullscreenElement)toggleFullscreen();else recall();return}
if(!inMenu&&(key==='ArrowLeft'||key==='ChannelDown')){e.preventDefault();changeChannel(-1)}
if(!inMenu&&(key==='ArrowRight'||key==='ChannelUp')){e.preventDefault();changeChannel(1)}
if(!inMenu&&(key==='Enter'||key===' ')){if(document.activeElement===video||document.activeElement===document.body){e.preventDefault();setMenu(true,true)}}
if(key==='r'||key==='R'){e.preventDefault();recall()}
});

updateUI();loadChannel(currentIndex,{remember:false});setTimeout(()=>video.focus({preventScroll:true}),300);
</script>
</body>
</html>
