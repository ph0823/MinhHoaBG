    // Giữ màn hình Android luôn sáng khi đang xem TV / nghe Radio
    async function requestWakeLock(){
      if('wakeLock' in navigator && !document.hidden){
        try{ wakeLock = await navigator.wakeLock.request('screen'); }catch(_){}
      }

    function getCachedStreamUrl(key){
      try{
        const raw=sessionStorage.getItem('tv.stream.'+key);
        if(!raw)return null;
        const data=JSON.parse(raw);
        if(!data||!data.url||!data.time||Date.now()-data.time>STREAM_CACHE_TTL){
          sessionStorage.removeItem('tv.stream.'+key);
          return null;
        }
        return data.url;
      }catch(_){return null}
    }

    function setCachedStreamUrl(key,url){
      if(!url)return;
      try{sessionStorage.setItem('tv.stream.'+key,JSON.stringify({url,time:Date.now()}))}catch(_){}
    }

    async function fetchM3u8FromCurl(curlUrl) {
      const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const timer = controller ? setTimeout(() => controller.abort(), 6000) : null;
      try {
        const res = await fetch(curlUrl, { cache: 'no-store', signal: controller ? controller.signal : undefined });
        if (timer) clearTimeout(timer);
        if (!res.ok) return null;
        const html = await res.text();
        const match = html.match(/(?:file|source|src)\s*[:=]\s*['"](https?:\/\/[^'"]+\.m3u8[^'"]*)['"]/i)
                   || html.match(/['"](https?:\/\/[^'"]+\.m3u8[^'"]*)['"]/i);
        return match ? match[1] : null;
      } catch (e) {
        if (timer) clearTimeout(timer);
        console.warn("Không thể cURL m3u8 trực tiếp:", e);
        return null;
      }
    }

    const barCount = isWebOS ? 20 : 28;
    const barMid = (barCount - 1) / 2;
    for(let i=0;i<barCount;i++){
      const b=document.createElement('i');
      b.className='bar';
      const center=1-Math.abs(i-barMid)/barMid;
      const duration=.48+Math.random()*.72;
      const delay=-(Math.random()*1.4);
      const base=.55+center*.65+Math.random()*.28;
      b.style.animationDuration=duration.toFixed(2)+'s';
      b.style.animationDelay=delay.toFixed(2)+'s';
      b.style.height=(70+base*72).toFixed(0)+'px';
      visualizer.appendChild(b);
    }

        playlist.scrollLeft=Math.max(0,target);
      }else if(card.scrollIntoView){

    function updateMuteUI(){
      if(isWebOS && iframeIsActive()){

    function toggleMute(){
      if(isWebOS && iframeIsActive()){
        openIframeAudioAccess();
        return;
      }
      video.muted=!video.muted;
      autoMutedByPolicy=false;
      updateMuteUI();

    function destroyStream(){
      closeIframeAudioAccess();
      clearTimeout(stallTimer);
      video.onloadedmetadata=null;
      if(hls){hls.destroy();hls=null}
      video.pause();
      video.removeAttribute('src');
      video.load();
      if(iframeEl){
        iframeEl.style.display='none';
        iframeEl.src='about:blank';
      }
      video.style.display='block';
      updateMuteUI();

    function tryPlay() {
      let playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          if (error.name === 'NotAllowedError') {
            autoMutedByPolicy = true;
            video.muted = true;
            updateMuteUI();
            video.play().then(() => {
              setStatus('Chạm vào màn hình hoặc nhấn 🔊 để bật tiếng', false, 4500);
            }).catch(() => {
              setStatus('Nhấn OK hoặc chạm để phát', false, 3500);
            });
          } else if (error.name !== 'AbortError') {
            setStatus('Nhấn OK hoặc chạm để phát', false, 3500);
          }
        });
      }
    }

    async function loadChannel(index, { remember = true, isInitial = false } = {}) {
      index = (index + channels.length) % channels.length;

      if (!isInitial && index === currentIndex && (video.currentSrc !== "" || (iframeEl.src !== "" && iframeEl.src !== "about:blank"))) {
        return;
      }

      if (remember && index !== currentIndex) {
        previousIndex = currentIndex;
      }

      if (!isInitial && autoMutedByPolicy) {
        video.muted = false;
        autoMutedByPolicy = false;
      }

      currentIndex = index;
      retryCount = 0;
      updateRecall();
      updateUI();
      setStatus('Đang mở ' + channels[index].name + '…', true);
      const token = ++loadToken;
      destroyStream();
      const ch = channels[index];

      let streamUrl = ch.url;

      if (ch.type === 'curl_hls') {
        const cacheKey = encodeURIComponent(ch.url);
        const cachedUrl = getCachedStreamUrl(cacheKey);

        if (cachedUrl) {
          streamUrl = cachedUrl;
        } else {
          setStatus('Đang xử lý ' + ch.name + '…', true);
          const freshUrl = await fetchM3u8FromCurl(ch.url);
          if (token !== loadToken) return;

          if (freshUrl) {
            streamUrl = freshUrl;
            setCachedStreamUrl(cacheKey, freshUrl);
          } else {
            video.style.display = 'none';
            iframeEl.style.display = 'block';
            iframeEl.src = ch.url;
            updateMuteUI();
            setStatus('', false);
            if (isWebOS) try { video.focus({ preventScroll: true }); } catch (_) {}
            return;
          }
        }
      } else if (ch.type === 'iframe') {
        video.style.display = 'none';
        iframeEl.style.display = 'block';
        iframeEl.src = ch.url;
        updateMuteUI();
        setStatus('', false);
        if (isWebOS) try { video.focus({ preventScroll: true }); } catch (_) {}
        return;
      }

      const isHls = /\.m3u8/i.test(streamUrl);

      if (isHls && window.Hls && Hls.isSupported()) {
        hls = new Hls({
          lowLatencyMode: false,
          backBufferLength: isWebOS ? 10 : 15,
          maxBufferLength: isWebOS ? 20 : 30,
          maxMaxBufferLength: isWebOS ? 30 : 60,
          maxBufferHole: 0.5,
          highBufferWatchdogPeriod: 3,
          nudgeOffset: 0.2,
          nudgeMaxRetry: 5,
          liveSyncDurationCount: 3,
          liveMaxLatencyDurationCount: 10,
          manifestLoadingTimeOut: 10000,
          manifestLoadingMaxRetry: 3,
          levelLoadingTimeOut: 10000,
          levelLoadingMaxRetry: 4,
          fragLoadingTimeOut: 15000,
          fragLoadingMaxRetry: 6,
          startLevel: -1,
          capLevelToPlayerSize: true,
          enableWorker: true
        });
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          if (token === loadToken) {
            retryCount = 0;
            tryPlay();
          }
        });
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (token !== loadToken) return;

          if (!data.fatal) {
            if (data.details === Hls.ErrorDetails.BUFFER_STALLED_ERROR) {
              setStatus('Đang đồng bộ lại luồng phát…', true, 2500);
              if (video.paused) tryPlay();
            }
            return;
          }

          retryCount++;
          if (retryCount <= 4 && data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            const delay = [500, 1500, 3000, 5000][retryCount - 1] || 5000;
            setStatus('Mạng gián đoạn, đang thử lại…', true);
            setTimeout(() => { if (token === loadToken && hls) hls.startLoad(); }, delay);
          } else if (retryCount <= 3 && data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            setStatus('Đang khôi phục hình ảnh…', true);
            if (retryCount === 2) hls.swapAudioCodec();
            hls.recoverMediaError();
          } else if (ch.type === 'curl_hls') {
            try { sessionStorage.removeItem('tv.stream.' + encodeURIComponent(ch.url)); } catch (_) {}
            destroyStream();
            video.style.display = 'none';
            iframeEl.style.display = 'block';
            iframeEl.src = ch.url;
            updateMuteUI();
            setStatus('', false);
            if (isWebOS) try { video.focus({ preventScroll: true }); } catch (_) {}
          } else {
            setStatus('Kênh đang bảo trì hoặc gián đoạn.', false, 4000);
          }
        });
      } else if (isHls && video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.onloadedmetadata = () => token === loadToken && tryPlay();
      } else {
        video.src = streamUrl;
        video.onloadedmetadata = () => token === loadToken && tryPlay();
      }
    }

    function selectChannel(index){loadChannel(index);setMenu(false)}
    function changeChannel(step){selectChannel(currentIndex+step)}
    function recall(){
      if(previousIndex===null)return;
      const target=previousIndex;
      previousIndex=currentIndex;

    channels.forEach((ch,i)=>{
      const b=document.createElement('button');

      b.addEventListener('keydown',e=>{
        if(isWebOS&&e.key==='ArrowDown'){e.preventDefault();setMenu(false);setApps(true,true);return}
        if(isWebOS&&e.key==='ArrowUp'){e.preventDefault();setMenu(false);return}

          e.preventDefault();
          const next=playlist.children[(i+1)%channels.length];
          next.focus({preventScroll:true});

        if(e.key==='ArrowLeft'||(!isWebOS&&e.key==='ArrowUp')){

    $('#menuBtn').onclick=()=>setMenu(!app.classList.contains('menu-open'),true);

    function startStallWatchdog(){
      setStatus('Đang tải dữ liệu…',true);
      clearTimeout(stallTimer);
      stallTimer=setTimeout(()=>{
        if(video.paused)return;
        if(hls){
          hls.startLoad();
          try{
            if(video.buffered.length){
              const end=video.buffered.end(video.buffered.length-1);
              if(end-video.currentTime>1.5)video.currentTime=end-0.5;
            }
          }catch(_){}
          tryPlay();
        }
      },6000);
    }
    video.addEventListener('waiting',startStallWatchdog);
    video.addEventListener('stalled',startStallWatchdog);
    video.addEventListener('playing',()=>{clearTimeout(stallTimer);setStatus('',false)});
    video.addEventListener('timeupdate',()=>{
      if(video.readyState>=3 && stallTimer){
        clearTimeout(stallTimer);

        if(statusEl.classList.contains('show'))setStatus('',false);
      }

    video.addEventListener('error',()=>{clearTimeout(stallTimer);if(!hls)setStatus('Không thể phát kênh này. Hãy thử lại sau.',false,5000)});

    async function toggleFullscreen(){
      if(isWebOS){

        $('#fullscreenBtn').textContent=on?'⛶ Chế độ TV':'⛶ Toàn màn hình';

      setMenu(false);
      if(!document.fullscreenElement && !document.webkitFullscreenElement){
        const enterFs=app.requestFullscreen||app.webkitRequestFullscreen||video.webkitEnterFullscreen;
        if(enterFs){
          try{
            await enterFs.call(app);
            app.classList.add('fullscreen');
            if(screen.orientation && screen.orientation.lock){
              screen.orientation.lock('landscape').catch(()=>{});
            }
          }catch(_){}
        }
      }else{
        const exitFs=document.exitFullscreen||document.webkitExitFullscreen;
        if(exitFs){
          try{
            await exitFs.call(document);
            app.classList.remove('fullscreen');
            if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
          }catch(_){}
        }
      }
    }

    function handleBackAction(){
      if(app.classList.contains('iframe-audio-access')){closeIframeAudioAccess();return true}
      const now=Date.now();
      if(now-lastBackAt<450)return true;
      lastBackAt=now;

      if(app.classList.contains('apps-open')){setApps(false);return true}
      if(app.classList.contains('menu-open')){setMenu(false);return true}
      if(isWebOS){recall();return true}
      return false;
    }

    function isLgBackEvent(e){
      const key=e.key||'';
      const code=e.code||'';
      const keyCode=e.keyCode||e.which||0;
      return keyCode===461 ||
             keyCode===10009 ||
             key==='GoBack' ||
             key==='BrowserBack' ||
             key==='Back' ||
             (key==='Escape' && isWebOS) ||
             code==='BrowserBack';
    }

    function consumeLgBack(e){
      if(!isWebOS || !isLgBackEvent(e))return false;
      try{e.preventDefault()}catch(_){}
      try{e.stopPropagation()}catch(_){}
      try{e.stopImmediatePropagation()}catch(_){}
      handleBackAction();
      return true;
    }

    document.addEventListener('keydown',e=>{
      const inMenu=app.classList.contains('menu-open');
      const key=e.key;
      const keyCode=e.keyCode||e.which||0;
      const isTvBack=isLgBackEvent(e);
      const isDesktopBack=key==='Escape'||key==='Backspace';

      if(isWebOS&&isTvBack){consumeLgBack(e);return}
      if(isDesktopBack){
        e.preventDefault();
        if(app.classList.contains('apps-open'))setApps(false);
        else if(inMenu)setMenu(false);
        else if(!isWebOS&&document.fullscreenElement)toggleFullscreen();
        return;
      }

      const appsOpen=app.classList.contains('apps-open');
      if(isWebOS&&appsOpen){
        if(key==='ArrowLeft'){e.preventDefault();moveTvApp(-1);return}
        if(key==='ArrowRight'){e.preventDefault();moveTvApp(1);return}
        if(key==='ArrowUp'){e.preventDefault();setApps(false);return}
        if(key==='ArrowDown'){e.preventDefault();return}
        if(key==='Enter'||key===' '){
          const a=document.activeElement&&document.activeElement.closest?document.activeElement.closest('[data-tvapp]'):null;
          if(a){e.preventDefault();a.click();return}
        }
      }

      const inQuickActions=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('.quickActions');
      if(inQuickActions){
        const btns=[...document.querySelectorAll('.quickActions .iconBtn:not(:disabled)')].filter(b=>b.offsetParent!==null);
        const idx=btns.indexOf(document.activeElement);
        if(key==='ArrowLeft'&&idx>0){e.preventDefault();btns[idx-1].focus();return}
        if(key==='ArrowRight'&&idx<btns.length-1){e.preventDefault();btns[idx+1].focus();return}
        if(key==='ArrowDown'){e.preventDefault();video.focus();return}
      }

      if(isWebOS&&!inMenu&&!appsOpen){
        if(key==='ArrowDown'){e.preventDefault();setApps(true,true);return}
        if(key==='ArrowUp'&&!inQuickActions){e.preventDefault();showQuickControls();muteBtn.focus();return}
      }

      if(!inMenu&&!appsOpen&&!inQuickActions&&(key==='ArrowLeft'||key==='ChannelDown'||key==='PageDown'||keyCode===34)){e.preventDefault();changeChannel(-1)}
      if(!inMenu&&!appsOpen&&!inQuickActions&&(key==='ArrowRight'||key==='ChannelUp'||key==='PageUp'||keyCode===33)){e.preventDefault();changeChannel(1)}
      if(!inMenu&&!appsOpen&&(key==='Enter'||key===' ')){
        if(document.activeElement===video||document.activeElement===document.body){
          e.preventDefault();
          setMenu(true,true);
        }
      }
      if(key==='r'||key==='R'){e.preventDefault();recall()}
      if(key==='m'||key==='M'){e.preventDefault();toggleMute()}
    });

    if(isWebOS){
      ['mousemove','pointermove','pointerdown','touchstart'].forEach(evt=>document.addEventListener(evt,showQuickControls,{passive:true}));
      document.addEventListener('keydown',showQuickControls,true);
      $('.quickActions').addEventListener('mouseenter',showQuickControls);
      $('.quickActions').addEventListener('focusin',showQuickControls);
      document.addEventListener('keyup',e=>{if(isLgBackEvent(e))consumeLgBack(e)},true);
    }

    if(isWebOS){
      window.addEventListener('resize',lockTvViewport);
      window.addEventListener('orientationchange',lockTvViewport);
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)lockTvViewport()});
    }

    video.muted = false;
    updateUI();
    updateMuteUI();
    loadChannel(currentIndex, { remember: false, isInitial: true });
    setTimeout(() => {
      lockTvViewport();
      try { video.focus({ preventScroll: true }); } catch (_) { video.focus(); }
    }, 300);
    showQuickControls();
</script>
</body>
</html>
