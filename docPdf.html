    function waitForGoogleIdentityServices(timeout = 12000) {
      return new Promise((resolve, reject) => {
        const startTime = Date.now();

        const timer = setInterval(() => {
          const ready =
            window.google &&
            google.accounts &&
            google.accounts.oauth2;

          if (ready) {
            clearInterval(timer);
            resolve();
            return;
          }

          if (Date.now() - startTime > timeout) {
            clearInterval(timer);

            reject(
              new Error(
                "Google Identity Services không phản hồi."
              )
            );
          }
        }, 100);
      });
    }

    /* =====================================================
       5. ĐĂNG NHẬP GOOGLE
       ===================================================== */

    function requestGoogleAccess() {
      if (!state.tokenClient) {
        showToast(
          "Dịch vụ đăng nhập Google chưa sẵn sàng.",
          "warning"
        );

        return;
      }

      dom.btnLogin.disabled = true;

      try {
        state.tokenClient.requestAccessToken({
          /*
           * Không dùng "consent" ở những lần sau.
           * Google chỉ hiện lại màn hình đồng ý khi thật sự cần.
           */
          prompt: ""
        });
      } catch (error) {
        dom.btnLogin.disabled = false;

        console.error("Lỗi yêu cầu token:", error);

        showToast(
          "Không thể mở cửa sổ đăng nhập Google.",
          "error"
        );
      }
    }

    async function handleTokenResponse(tokenResponse) {
      dom.btnLogin.disabled = false;

      if (
        !tokenResponse ||
        !tokenResponse.access_token
      ) {
        showToast(
          "Google không trả về mã truy cập hợp lệ.",
          "error"
        );

        return;
      }

      state.accessToken = tokenResponse.access_token;

      const expiresIn =
        Number(tokenResponse.expires_in) || 3600;

      state.tokenExpiresAt =
        Date.now() + expiresIn * 1000;

      saveGoogleSession();

      updateAuthUI(true);

      showToast(
        "Đã kết nối Google Drive.",
        "success"
      );

      state.folderStack = [
        {
          id: CONFIG.ROOT_FOLDER_ID,
          name: "Thư mục gốc"
        }
      ];

      await loadCurrentFolder();
    }

    function handleOAuthError(error) {
      dom.btnLogin.disabled = false;

      console.error("Google OAuth error:", error);

      showToast(
        "Đăng nhập Google không thành công hoặc đã bị hủy.",
        "error"
      );
    }

    function disconnectGoogleDrive() {
      if (
        state.accessToken &&
        window.google?.accounts?.oauth2
      ) {
        google.accounts.oauth2.revoke(
          state.accessToken,
          () => {}
        );
      }

      clearGoogleSession();

      state.accessToken = null;
      state.tokenExpiresAt = 0;
      state.files = [];
      state.filteredFiles = [];
      state.folderStack = [
        {
          id: CONFIG.ROOT_FOLDER_ID,
          name: "Thư mục gốc"
        }
      ];

      cleanupViewer();
      updateAuthUI(false);
      updateBreadcrumb();

      dom.currentFolderTitle.textContent =
        "Thư mục gốc";

      dom.currentFolderTitle.title =
        "Thư mục gốc";

      dom.fileSearch.value = "";
      dom.fileCount.textContent = "Chưa có dữ liệu";

      showListMessage(
        "Vui lòng kết nối Google Drive để tải danh sách."
      );

      showToast(
        "Đã ngắt kết nối Google Drive.",
        "success"
      );
    }

    function saveGoogleSession() {
      try {
        sessionStorage.setItem(
          CONFIG.AUTH_TOKEN_KEY,
          state.accessToken || ""
        );

        sessionStorage.setItem(
          CONFIG.AUTH_EXPIRES_KEY,
          String(state.tokenExpiresAt || 0)
        );
      } catch (error) {
        console.warn(
          "Không thể lưu phiên Google Drive:",
          error
        );
      }
    }

    function restoreGoogleSession() {
      try {
        const savedToken =
          sessionStorage.getItem(
            CONFIG.AUTH_TOKEN_KEY
          );

        const savedExpiresAt =
          Number(
            sessionStorage.getItem(
              CONFIG.AUTH_EXPIRES_KEY
            )
          );

        const stillValid =
          Boolean(savedToken) &&
          Number.isFinite(savedExpiresAt) &&
          Date.now() < savedExpiresAt - 30000;

        if (!stillValid) {
          clearGoogleSession();
          return false;
        }

        state.accessToken = savedToken;
        state.tokenExpiresAt = savedExpiresAt;

        return true;
      } catch (error) {
        console.warn(
          "Không thể khôi phục phiên Google Drive:",
          error
        );

        return false;
      }
    }

    function clearGoogleSession() {
      try {
        sessionStorage.removeItem(
          CONFIG.AUTH_TOKEN_KEY
        );

        sessionStorage.removeItem(
          CONFIG.AUTH_EXPIRES_KEY
        );
      } catch (error) {
        console.warn(
          "Không thể xóa phiên Google Drive:",
          error
        );
      }
    }

    function updateAuthUI(isConnected) {
      dom.btnLogin.style.display =
        isConnected ? "none" : "inline-flex";

      dom.btnLogout.style.display =
        isConnected ? "inline-flex" : "none";

      dom.userStatus.style.display =
        isConnected ? "flex" : "none";
    }

    function isTokenLikelyValid() {
      if (!state.accessToken) {
        return false;
      }

      /*
       * Trừ trước 30 giây để tránh gửi yêu cầu
       * đúng lúc token vừa hết hạn.
       */
      return Date.now() <
        state.tokenExpiresAt - 30000;
    }

    function requireValidToken() {
      if (isTokenLikelyValid()) {
        return true;
      }

      clearGoogleSession();

      state.accessToken = null;
      state.tokenExpiresAt = 0;

      updateAuthUI(false);

      showToast(
        "Phiên Google Drive đã hết hạn. Hãy kết nối lại.",
        "warning",
        6000
      );

      return false;
    }

    /* =====================================================
       6. GỌI DRIVE API
       ===================================================== */

    async function driveFetch(
      url,
      options = {}
    ) {
      if (!requireValidToken()) {
        throw new Error("TOKEN_EXPIRED");
      }

      const headers = new Headers(
        options.headers || {}
      );

      headers.set(
        "Authorization",
        `Bearer ${state.accessToken}`
      );

      const response = await fetch(
        url,
        {
          ...options,
          headers
        }
      );

      if (
        response.status === 401 ||
        response.status === 403
      ) {
        clearGoogleSession();

        state.accessToken = null;
        state.tokenExpiresAt = 0;

        updateAuthUI(false);

        throw new Error("TOKEN_EXPIRED");
      }

      if (!response.ok) {
        let detail = "";

        try {
          const errorData = await response.json();

          detail =
            errorData?.error?.message || "";
        } catch {
          detail = await response
            .text()
            .catch(() => "");
        }

        throw new Error(
          detail ||
          `Google Drive trả về HTTP ${response.status}.`
        );
      }

      return response;
    }

    async function loadCurrentFolder() {
      const currentFolder =
        state.folderStack[
          state.folderStack.length - 1
        ];

      await loadDriveFiles(
        currentFolder.id,
        currentFolder.name
      );
    }

    async function loadDriveFiles(folderId, folderName) {
      if (!requireValidToken()) {
        return;
      }

      dom.fileSearch.value = "";

      dom.currentFolderTitle.textContent =
        folderName || "Thư mục";

      dom.currentFolderTitle.title =
        folderName || "Thư mục";

      updateBreadcrumb();

      showListMessage("Đang tải danh sách file...");
      dom.fileCount.textContent = "Đang tải...";

      try {
        const allFiles = [];
        let pageToken = "";

        do {
          /*
           * Cú pháp Drive API đúng:
           *
           * 'folderId' in parents
           * and trashed = false
           * and (
           *   mimeType = folder
           *   or mimeType = pdf
           * )
           */
          const query = [
            `'${folderId}' in parents`,
            "and trashed = false",
            "and (",
            "mimeType = 'application/vnd.google-apps.folder'",
            "or mimeType = 'application/pdf'",
            "or mimeType = 'application/epub+zip'",
            "or name contains '.epub'",
            ")"
          ].join(" ");

          const params = new URLSearchParams();

          params.set("q", query);

          params.set(
            "fields",
            "nextPageToken,files(id,name,mimeType,size,modifiedTime,webViewLink)"
          );

          /*
           * Dùng name_natural để sắp xếp:
           * file 2 đứng trước file 10.
           *
           * Không dùng "folder,name_natural" vì một số trường hợp
           * Drive API có thể trả về Invalid Value.
           */
          params.set("orderBy", "name_natural");

          params.set(
            "pageSize",
            String(CONFIG.MAX_FILES_PER_PAGE || 1000)
          );

          params.set("supportsAllDrives", "true");
          params.set("includeItemsFromAllDrives", "true");

          if (pageToken) {
            params.set("pageToken", pageToken);
          }

          const url =
            `${CONFIG.DRIVE_API_BASE}/files?${params.toString()}`;

          console.log("Đang tải thư mục:", folderName);
          console.log("Drive query:", query);

          const response = await driveFetch(url);
          const data = await response.json();

          if (Array.isArray(data.files)) {
            allFiles.push(...data.files);
          }

          pageToken = data.nextPageToken || "";
        } while (pageToken);

        /*
         * Google Drive không đảm bảo thư mục luôn đứng trước file
         * khi chỉ orderBy name_natural.
         * Vì vậy sắp xếp lại trên trình duyệt.
         */
        allFiles.sort(compareDriveFiles);

        state.files = allFiles;
        state.filteredFiles = [...allFiles];

        renderFileList(state.filteredFiles);
      } catch (error) {
        console.error(
          "Lỗi tải danh sách Drive:",
          error
        );

        state.files = [];
        state.filteredFiles = [];

        if (error.message === "TOKEN_EXPIRED") {
          showListMessage(
            "Phiên đăng nhập đã hết hạn. Hãy kết nối lại Google Drive.",
            true
          );

          showToast(
            "Phiên Google Drive đã hết hạn. Hãy kết nối lại.",
            "warning",
            6000
          );
        } else {
          showListMessage(
            `Không thể tải thư mục: ${error.message}`,
            true
          );

          showToast(
            `Không thể tải danh sách Google Drive: ${error.message}`,
            "error",
            7000
          );
        }

        dom.fileCount.textContent =
          "Không tải được dữ liệu";
      }
    }

    /**
     * Sắp xếp thư mục đứng trước, sau đó sắp tên tự nhiên.
     * Ví dụ:
     *   Chương 2
     *   Chương 9
     *   Chương 10
     */
    function compareDriveFiles(fileA, fileB) {
      const folderMimeType =
        "application/vnd.google-apps.folder";

      const aIsFolder =
        fileA.mimeType === folderMimeType;

      const bIsFolder =
        fileB.mimeType === folderMimeType;

      if (aIsFolder && !bIsFolder) {
        return -1;
      }

      if (!aIsFolder && bIsFolder) {
        return 1;
      }

      return String(fileA.name || "").localeCompare(
        String(fileB.name || ""),
        "vi",
        {
          numeric: true,
          sensitivity: "base"
        }
      );
    }

    /* =====================================================
       7. HIỂN THỊ DANH SÁCH FILE
       ===================================================== */

    function renderFileList(files) {
      dom.fileList.replaceChildren();

      if (!files.length) {
        showListMessage(
          state.files.length
            ? "Không tìm thấy file phù hợp."
            : "Thư mục này không có file PDF hoặc EPUB."
        );

        updateFileCount(files.length);

        return;
      }

      const fragment =
        document.createDocumentFragment();

      files.forEach((file) => {
        fragment.appendChild(
          createFileItem(file)
        );
      });

      dom.fileList.appendChild(fragment);

      updateFileCount(files.length);
    }

    function createFileItem(file) {
      const item =
        document.createElement("li");

      item.className = "file-item";
      item.tabIndex = 0;
      item.setAttribute("role", "button");

      if (
        file.id === state.activeFileId
      ) {
        item.classList.add("active");
      }

      const icon =
        document.createElement("span");

      icon.className = "file-item-icon";
      icon.textContent =
        getFileIcon(file.mimeType, file.name);

      const content =
        document.createElement("div");

      content.className =
        "file-item-content";

      const name =
        document.createElement("div");

      name.className =
        "file-item-name";

      name.textContent = file.name;
      name.title = file.name;

      const type =
        document.createElement("div");

      type.className =
        "file-item-type";

      type.textContent =
        getFileDescription(file);

      content.append(name, type);
      item.append(icon, content);

      const activate = () => {
        openFile(file);
      };

      item.addEventListener(
        "click",
        activate
      );

      item.addEventListener(
        "keydown",
        (event) => {
          if (
            event.key === "Enter" ||
            event.key === " "
          ) {
            event.preventDefault();
            activate();
          }
        }
      );

      return item;
    }

    function getFileIcon(mimeType, fileName = "") {
      if (
        mimeType ===
        "application/vnd.google-apps.folder"
      ) {
        return "📁";
      }

      if (
        mimeType === "application/pdf"
      ) {
        return "📄";
      }

      if (
        mimeType === "application/epub+zip" ||
        /\.epub$/i.test(String(fileName || ""))
      ) {
        return "📘";
      }

      return "📎";
    }

    function getFileDescription(file) {
      if (
        file.mimeType ===
        "application/vnd.google-apps.folder"
      ) {
        return "Thư mục";
      }

      if (
        file.mimeType === "application/pdf"
      ) {
        return formatFileTypeAndSize(
          "Tài liệu PDF",
          file.size
        );
      }

      if (isEpubFile(file)) {
        return formatFileTypeAndSize(
          "Sách EPUB",
          file.size
        );
      }

      return file.mimeType || "Tệp";
    }

    function formatFileTypeAndSize(
      label,
      size
    ) {
      if (!size) {
        return label;
      }

      return `${label} • ${formatBytes(size)}`;
    }

    function formatBytes(value) {
      const bytes = Number(value);

      if (
        !Number.isFinite(bytes) ||
        bytes <= 0
      ) {
        return "";
      }

      const units = [
        "B",
        "KB",
        "MB",
        "GB"
      ];

      const index = Math.min(
        Math.floor(
          Math.log(bytes) /
          Math.log(1024)
        ),
        units.length - 1
      );

      const result =
        bytes /
        Math.pow(1024, index);

      return (
        result.toFixed(
          index === 0 ? 0 : 1
        ) +
        " " +
        units[index]
      );
    }

    function showListMessage(
      message,
      isError = false
    ) {
      dom.fileList.replaceChildren();

      const item =
        document.createElement("li");

      item.className =
        "list-message" +
        (isError ? " error" : "");

      item.textContent = message;

      dom.fileList.appendChild(item);
    }

    function updateFileCount(
      visibleCount
    ) {
      if (
        visibleCount === state.files.length
      ) {
        dom.fileCount.textContent =
          `${visibleCount} mục`;
      } else {
        dom.fileCount.textContent =
          `${visibleCount}/${state.files.length} mục`;
      }
    }

    function applyFileFilter() {
      const keyword =
        normalizeSearchText(
          dom.fileSearch.value
        );

      if (!keyword) {
        state.filteredFiles =
          [...state.files];

        renderFileList(
          state.filteredFiles
        );

        return;
      }

      state.filteredFiles =
        state.files.filter((file) => {
          return normalizeSearchText(
            file.name
          ).includes(keyword);
        });

      renderFileList(
        state.filteredFiles
      );
    }

    function normalizeSearchText(value) {
      return String(value || "")
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        )
        .toLowerCase()
        .trim();
    }

    function clearSearch() {
      dom.fileSearch.value = "";
      dom.fileSearch.focus();

      state.filteredFiles =
        [...state.files];

      renderFileList(
        state.filteredFiles
      );
    }

    /* =====================================================
       8. ĐƯỜNG DẪN THƯ MỤC
       ===================================================== */

    function updateBreadcrumb() {
      dom.breadcrumb.replaceChildren();

      state.folderStack.forEach(
        (folder, index) => {
          if (index > 0) {
            const separator =
              document.createElement("span");

            separator.textContent = "›";
            separator.setAttribute(
              "aria-hidden",
              "true"
            );

            dom.breadcrumb.appendChild(
              separator
            );
          }

          const button =
            document.createElement("button");

          button.type = "button";
          button.className =
            "breadcrumb-button";

          button.textContent =
            folder.name;

          button.title =
            folder.name;

          button.addEventListener(
            "click",
            async () => {
              if (
                index ===
                state.folderStack.length - 1
              ) {
                return;
              }

              state.folderStack =
                state.folderStack.slice(
                  0,
                  index + 1
                );

              await loadCurrentFolder();
            }
          );

          dom.breadcrumb.appendChild(
            button
          );
        }
      );

      requestAnimationFrame(() => {
        dom.breadcrumb.scrollLeft =
          dom.breadcrumb.scrollWidth;
      });
    }

    async function openFolder(file) {
      state.folderStack.push({
        id: file.id,
        name: file.name
      });

      await loadCurrentFolder();
    }

    /* =====================================================
       9. MỞ FILE
       ===================================================== */

    function isEpubFile(file) {
      return Boolean(
        file &&
        (
          file.mimeType === "application/epub+zip" ||
          /\.epub$/i.test(String(file.name || ""))
        )
      );
    }

    async function openFile(file) {
      if (!file?.id) {
        return;
      }

      if (
        file.mimeType ===
        "application/vnd.google-apps.folder"
      ) {
        await openFolder(file);
        return;
      }

      state.activeFileId =
        file.id;

      state.activeFileName =
        file.name;

      state.activeMimeType =
        file.mimeType;

      renderFileList(
        state.filteredFiles
      );

      closeSidebarOnSmallScreen();

      if (
        file.mimeType ===
        "application/pdf"
      ) {
        await openPdf(file);
        return;
      }

      if (isEpubFile(file)) {
        await openEpub(file);
        return;
      }

      showToast(
        "Định dạng file này chưa được hỗ trợ.",
        "warning"
      );
    }


    /* =====================================================
       10. PDF
       ===================================================== */

    async function openPdf(file) {
      if (!requireValidToken()) {
        return;
      }

      await cleanupEpub();
      state.viewerType = "pdf";

      dom.placeholder.style.display =
        "none";

      dom.pdfToolbar.classList.remove("epub-mode");
      dom.pageLabel.textContent = "Trang";
      dom.fitMode.disabled = false;
      dom.pageEffect.disabled = false;

      dom.pdfToolbar.style.display =
        "flex";

      dom.pdfContainer.style.display =
        "block";

      dom.btnEdgePrev.classList.add(
        "pdf-visible"
      );

      dom.btnEdgeNext.classList.add(
        "pdf-visible"
      );

      updateHeightFocusMode(true);

      dom.pageNum.textContent = "0";
      dom.pageCount.textContent = "0";
      configurePageJump({
        enabled: false,
        label: "Trang",
        max: null,
        value: ""
      });

      state.pageNum = 1;
      state.pendingPageNum = null;
      state.customZoom = 1;

      updateZoomStatus();
      updatePageButtons();

      showLoading(
        "Đang mở tài liệu PDF...",
        "Ứng dụng đang đọc cấu trúc tài liệu. File lớn có thể cần thêm thời gian."
      );

      try {
        await cleanupPdfDocument();

        const mediaUrl =
          `${CONFIG.DRIVE_API_BASE}/files/` +
          `${encodeURIComponent(file.id)}` +
          "?alt=media";

        state.pdfLoadingTask =
          pdfjsLib.getDocument({
            url: mediaUrl,

            httpHeaders: {
              Authorization:
                `Bearer ${state.accessToken}`
            },

            withCredentials: false,

            disableAutoFetch: false,
            disableStream: false,
            disableRange: false,

            rangeChunkSize:
              1024 * 1024
          });

        state.pdfLoadingTask.onProgress =
          handlePdfProgress;

        state.pdfDoc =
          await state.pdfLoadingTask.promise;

        dom.pageCount.textContent =
          String(state.pdfDoc.numPages);

        configurePageJump({
          enabled: true,
          label: "Trang",
          max: state.pdfDoc.numPages,
          value: 1
        });

        state.pageNum = 1;

        await renderPage(
          state.pageNum,
          {
            resetScroll: true
          }
        );

        showToast(
          `Đã mở “${file.name}”.`,
          "success",
          3000
        );

        if (
          window.matchMedia(
            "(pointer: coarse)"
          ).matches
        ) {
          showSwipeHintOnce();
        }
      } catch (error) {
        hideLoading();

        console.error(
          "Lỗi mở PDF:",
          error
        );

        if (
          error?.name ===
          "RenderingCancelledException"
        ) {
          return;
        }

        if (
          error?.name ===
          "PasswordException"
        ) {
          showToast(
            "PDF được bảo vệ bằng mật khẩu nên chưa thể mở.",
            "error",
            6500
          );
        } else {
          showToast(
            "Không thể tải PDF. Phiên đăng nhập có thể đã hết hạn hoặc file không cho phép truy cập.",
            "error",
            7000
          );
        }

        showPlaceholder(
          "Không thể mở tài liệu",
          "Hãy kết nối lại Google Drive hoặc thử một file khác.",
          "⚠️"
        );
      }
    }

    /* =====================================================
       CACHE EPUB BẰNG INDEXEDDB
       - Lần đầu tải từ Google Drive
       - Các lần sau đọc trực tiếp từ bộ nhớ thiết bị
       - Tự làm mới khi modifiedTime của file thay đổi
       ===================================================== */

    function openEpubCacheDatabase() {
      if (!("indexedDB" in window)) {
        return Promise.resolve(null);
      }

      if (state.epubCacheDbPromise) {
        return state.epubCacheDbPromise;
      }

      state.epubCacheDbPromise = new Promise((resolve, reject) => {
        const request = indexedDB.open(
          CONFIG.EPUB_CACHE_DB,
          CONFIG.EPUB_CACHE_VERSION
        );

        request.onupgradeneeded = () => {
          const database = request.result;

          if (!database.objectStoreNames.contains(
            CONFIG.EPUB_CACHE_STORE
          )) {
            const store = database.createObjectStore(
              CONFIG.EPUB_CACHE_STORE,
              { keyPath: "id" }
            );

            store.createIndex("cachedAt", "cachedAt", { unique: false });
          }
        };

        request.onsuccess = () => {
          const database = request.result;
          database.onversionchange = () => {
            database.close();
            state.epubCacheDbPromise = null;
          };
          resolve(database);
        };

        request.onerror = () => {
          state.epubCacheDbPromise = null;
          reject(request.error);
        };

        request.onblocked = () => {
          state.epubCacheDbPromise = null;
          reject(new Error("Cơ sở dữ liệu EPUB đang bị khóa."));
        };
      });

      return state.epubCacheDbPromise;
    }

    async function readEpubFromCache(file) {
      const database = await openEpubCacheDatabase();
      if (!database) return null;

      const record = await new Promise((resolve, reject) => {
        const transaction = database.transaction(
          CONFIG.EPUB_CACHE_STORE,
          "readonly"
        );
        const request = transaction
          .objectStore(CONFIG.EPUB_CACHE_STORE)
          .get(file.id);
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error);
      });

      if (!record?.buffer) return null;

      const sameVersion =
        String(record.modifiedTime || "") ===
        String(file.modifiedTime || "");
      const sameSize = !file.size || !record.size ||
        Number(record.size) === Number(file.size);
      const freshEnough =
        Date.now() - Number(record.cachedAt || 0) <
        CONFIG.EPUB_CACHE_MAX_AGE;

      if (!sameVersion || !sameSize || !freshEnough) {
        deleteEpubCacheEntry(file.id).catch(() => {});
        return null;
      }

      // Cập nhật LRU nhưng không chặn việc mở sách.
      touchEpubCacheEntry(file.id).catch(() => {});
      return record.buffer;
    }

    async function touchEpubCacheEntry(fileId) {
      const database = await openEpubCacheDatabase();
      if (!database) return;

      await new Promise((resolve, reject) => {
        const transaction = database.transaction(
          CONFIG.EPUB_CACHE_STORE,
          "readwrite"
        );
        const store = transaction.objectStore(CONFIG.EPUB_CACHE_STORE);
        const request = store.get(fileId);
        request.onsuccess = () => {
          const record = request.result;
          if (record) {
            record.cachedAt = Date.now();
            store.put(record);
          }
        };
        request.onerror = () => reject(request.error);
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
      });
    }

    async function writeEpubToCache(file, buffer) {
      const database = await openEpubCacheDatabase();
      if (!database || !buffer?.byteLength) return false;

      await enforceEpubCacheLimit(buffer.byteLength, file.id);

      await new Promise((resolve, reject) => {
        const transaction = database.transaction(
          CONFIG.EPUB_CACHE_STORE,
          "readwrite"
        );
        transaction.objectStore(CONFIG.EPUB_CACHE_STORE).put({
          id: file.id,
          name: file.name || "",
          modifiedTime: file.modifiedTime || "",
          cachedAt: Date.now(),
          size: buffer.byteLength,
          buffer
        });
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
      });

      return true;
    }

    async function deleteEpubCacheEntry(fileId) {
      const database = await openEpubCacheDatabase();
      if (!database) return;

      await new Promise((resolve, reject) => {
        const transaction = database.transaction(
          CONFIG.EPUB_CACHE_STORE,
          "readwrite"
        );
        transaction.objectStore(CONFIG.EPUB_CACHE_STORE).delete(fileId);
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
      });
    }

    async function getAllEpubCacheRecords() {
      const database = await openEpubCacheDatabase();
      if (!database) return [];

      return new Promise((resolve, reject) => {
        const transaction = database.transaction(
          CONFIG.EPUB_CACHE_STORE,
          "readonly"
        );
        const request = transaction
          .objectStore(CONFIG.EPUB_CACHE_STORE)
          .getAll();
        request.onsuccess = () => resolve(request.result || []);
        request.onerror = () => reject(request.error);
      });
    }

    async function enforceEpubCacheLimit(incomingBytes = 0, keepId = "") {
      const records = await getAllEpubCacheRecords();
      const now = Date.now();
      const expired = records.filter(record => {
        const cachedAt = Number(record.cachedAt || 0);
        return !cachedAt || now - cachedAt > CONFIG.EPUB_CACHE_MAX_AGE;
      });

      for (const record of expired) {
        await deleteEpubCacheEntry(record.id);
      }

      const valid = records
        .filter(record => !expired.some(item => item.id === record.id))
        .filter(record => record.id !== keepId)
        .sort((a, b) => Number(a.cachedAt || 0) - Number(b.cachedAt || 0));

      let total = valid.reduce(
        (sum, record) => sum + Number(record.size || record.buffer?.byteLength || 0),
        0
      );

      while (
        valid.length &&
        total + Number(incomingBytes || 0) > CONFIG.EPUB_CACHE_MAX_BYTES
      ) {
        const oldest = valid.shift();
        total -= Number(oldest.size || oldest.buffer?.byteLength || 0);
        await deleteEpubCacheEntry(oldest.id);
      }
    }

    async function cleanupExpiredEpubCache() {
      await enforceEpubCacheLimit(0, "");
    }

    async function readResponseArrayBufferWithProgress(response, signal) {
      const total = Number(response.headers.get("content-length") || 0);

      if (!response.body || typeof response.body.getReader !== "function") {
        return response.arrayBuffer();
      }

      const reader = response.body.getReader();
      const chunks = [];
      let loaded = 0;
      let lastUiUpdate = 0;

      while (true) {
        if (signal?.aborted) {
          try { await reader.cancel(); } catch {}
          throw new DOMException("Đã hủy tải EPUB.", "AbortError");
        }

        const { done, value } = await reader.read();
        if (done) break;
        if (!value?.byteLength) continue;

        chunks.push(value);
        loaded += value.byteLength;

        const now = performance.now();
        if (now - lastUiUpdate > 180) {
          lastUiUpdate = now;
          if (total > 0) {
            const percent = Math.min(99, Math.round(loaded / total * 100));
            dom.loadingMessage.textContent =
              `Đã tải ${percent}% • ${formatBytes(loaded)} / ${formatBytes(total)}`;
          } else {
            dom.loadingMessage.textContent =
              `Đã tải ${formatBytes(loaded)} dữ liệu sách.`;
          }
        }
      }

      const result = new Uint8Array(loaded);
      let offset = 0;
      for (const chunk of chunks) {
        result.set(chunk, offset);
        offset += chunk.byteLength;
      }
      return result.buffer;
    }

    async function getEpubArrayBuffer(file, signal) {
      try {
        const cachedBuffer = await readEpubFromCache(file);
        if (cachedBuffer) {
          showLoading(
            "Đang mở EPUB từ bộ nhớ...",
            "Đang dựng trang đọc, không cần tải lại từ Google Drive."
          );
          return { buffer: cachedBuffer, fromCache: true };
        }
      } catch (error) {
        console.warn("Không thể đọc cache EPUB:", error);
      }

      showLoading(
        "Đang tải EPUB lần đầu...",
        file.size
          ? `Dung lượng ${formatBytes(file.size)}. Đang tải từ Google Drive...`
          : "Đang tải từ Google Drive..."
      );

      const mediaUrl =
        `${CONFIG.DRIVE_API_BASE}/files/${encodeURIComponent(file.id)}` +
        "?alt=media&supportsAllDrives=true";

      const timeoutController = new AbortController();
      const timeoutId = window.setTimeout(
        () => timeoutController.abort(),
        CONFIG.EPUB_DOWNLOAD_TIMEOUT
      );
      const abort = () => timeoutController.abort();
      signal?.addEventListener("abort", abort, { once: true });

      try {
        const response = await driveFetch(mediaUrl, {
          signal: timeoutController.signal,
          cache: "no-store"
        });
        const buffer = await readResponseArrayBufferWithProgress(
          response,
          timeoutController.signal
        );
        return { buffer, fromCache: false };
      } finally {
        clearTimeout(timeoutId);
        signal?.removeEventListener("abort", abort);
      }
    }

    function scheduleEpubCacheWrite(file, buffer) {
      const write = async () => {
        try {
          await writeEpubToCache(file, buffer);
        } catch (error) {
          console.warn("Không thể lưu cache EPUB:", error);
          if (error?.name === "QuotaExceededError" || error?.name === "UnknownError") {
            try {
              await enforceEpubCacheLimit(buffer.byteLength, file.id);
              await writeEpubToCache(file, buffer);
            } catch (retryError) {
              console.warn("Không thể lưu EPUB sau khi dọn cache:", retryError);
            }
          }
        }
      };

      if ("requestIdleCallback" in window) {
        requestIdleCallback(write, { timeout: 3500 });
      } else {
        setTimeout(write, 900);
      }
    }

    function scheduleEpubLocationGeneration() {
      const generate = () => {
        if (
          state.viewerType !== "epub" ||
          !state.epubBook ||
          state.epubLocationsReady
        ) {
          return;
        }

        state.epubBook.locations.generate(CONFIG.EPUB_LOCATION_BREAK)
          .then(() => {
            if (state.viewerType !== "epub") {
              return;
            }

            state.epubLocationsReady = true;

            const totalLocations =
              getEpubTotalLocations();

            configurePageJump({
              enabled: totalLocations > 0,
              label: "Vị trí",
              max: totalLocations || null,
              value: getEpubCurrentLocationNumber()
            });

            updateEpubLocationDisplay(
              state.epubCurrentCfi
            );
          })
          .catch(error => {
            console.warn(
              "Không thể tạo vị trí EPUB:",
              error
            );
          });
      };

      if ("requestIdleCallback" in window) {
        window.requestIdleCallback(generate, {
          timeout: 1800
        });
      } else {
        window.setTimeout(generate, 700);
      }
    }

    async function openEpub(file) {
      if (!requireValidToken()) return;

      if (typeof ePub !== "function") {
        showToast("Không thể tải thư viện đọc EPUB.", "error", 6500);
        return;
      }

      const openToken = ++state.epubOpenToken;
      state.epubLoadController?.abort();
      state.epubLoadController = new AbortController();
      const signal = state.epubLoadController.signal;

      await cleanupPdfDocument();
      cleanupPdfOnly();
      await cleanupEpub(false);

      if (openToken !== state.epubOpenToken || signal.aborted) return;

      state.viewerType = "epub";
      state.epubFontScale = Number(localStorage.getItem("docEpubFontScale")) || 1;
      state.epubAtStart = true;
      state.epubAtEnd = false;
      state.epubLocationsReady = false;
      state.epubRenderedOnce = false;

      dom.placeholder.style.display = "none";
      dom.pdfToolbar.style.display = "flex";
      dom.pdfToolbar.classList.add("epub-mode");
      dom.pdfContainer.style.display = "none";
      dom.epubContainer.style.display = "block";
      dom.epubContainer.classList.add("is-loading");
      dom.pageLabel.textContent = "Vị trí";
      dom.pageNum.textContent = "…";
      dom.pageCount.textContent = "…";
      configurePageJump({ enabled: false, label: "Vị trí", max: null, value: "" });
      dom.zoomStatus.textContent = `${Math.round(state.epubFontScale * 100)}%`;

      dom.btnEdgePrev.classList.add("pdf-visible");
      dom.btnEdgeNext.classList.add("pdf-visible");
      updateHeightFocusMode(false);
      updatePageButtons();

      showLoading(
        "Đang mở sách EPUB...",
        "Đang kiểm tra bộ nhớ thiết bị và chuẩn bị nội dung."
      );

      try {
        const epubSource = await getEpubArrayBuffer(file, signal);
        if (openToken !== state.epubOpenToken || signal.aborted) return;

        dom.loadingMessage.textContent = "Đang giải nén và dựng trang đầu tiên...";

        // Không tạo bản sao ArrayBuffer. EPUB.js và IndexedDB dùng cùng nguồn,
        // giúp giảm đáng kể RAM và thời gian với sách dung lượng lớn.
        state.epubBook = ePub(epubSource.buffer, {
          replacements: "blobUrl",
          openAs: "epub"
        });

        state.epubRendition = state.epubBook.renderTo(dom.epubStage, {
          width: "100%",
          height: "100%",
          spread: "none",
          flow: "paginated",
          manager: "default",
          allowScriptedContent: false,
          snap: false
        });

        installEpubContentHooks();
        applyEpubTheme();

        state.epubRendition.on("relocated", handleEpubRelocated);
        state.epubRendition.on("rendered", () => {
          if (openToken !== state.epubOpenToken) return;
          state.epubRenderedOnce = true;
          dom.epubContainer.classList.remove("is-loading");
        });
        state.epubRendition.on("keyup", event => {
          if (event.key === "ArrowLeft") changePage(-1);
          else if (event.key === "ArrowRight") changePage(1);
        });
        state.epubRendition.on("touchstart", handlePdfTouchStart);
        state.epubRendition.on("touchmove", handlePdfTouchMove);
        state.epubRendition.on("touchend", handlePdfTouchEnd);

        const savedCfi = localStorage.getItem(`docEpubPosition:${file.id}`);
        await state.epubRendition.display(savedCfi || undefined);

        if (openToken !== state.epubOpenToken || signal.aborted) return;

        hideLoading();
        dom.epubContainer.classList.remove("is-loading");
        showToast(
          epubSource.fromCache
            ? `Đã mở nhanh “${file.name}” từ bộ nhớ thiết bị.`
            : `Đã mở “${file.name}”.`,
          "success",
          3000
        );

        if (!epubSource.fromCache) {
          scheduleEpubCacheWrite(file, epubSource.buffer);
        }

        scheduleEpubLocationGeneration();
      } catch (error) {
        if (error?.name === "AbortError" || openToken !== state.epubOpenToken) {
          return;
        }

        hideLoading();
        dom.epubContainer.classList.remove("is-loading");
        console.error("Lỗi mở EPUB:", error);

        showToast(
          error?.message?.includes("TOKEN_EXPIRED")
            ? "Phiên Google Drive đã hết hạn. Hãy kết nối lại."
            : "Không thể mở EPUB. File có thể bị lỗi, được bảo vệ DRM hoặc không đúng chuẩn EPUB.",
          "error",
          7500
        );

        showPlaceholder(
          "Không thể mở sách EPUB",
          "Hãy thử một file EPUB khác hoặc kiểm tra quyền truy cập Google Drive.",
          "⚠️"
        );
      }
    }

    function installEpubContentHooks() {
      if (!state.epubRendition?.hooks?.content) return;

      state.epubRendition.hooks.content.register(contents => {
        const doc = contents?.document;
        if (!doc) return;

        doc.documentElement.style.setProperty("color-scheme", "light");

        doc.querySelectorAll("img").forEach(img => {
          img.decoding = "async";
          if (!img.hasAttribute("loading")) img.loading = "lazy";
        });

        doc.querySelectorAll("video, audio").forEach(media => {
          media.preload = "metadata";
        });

        doc.querySelectorAll("a[href]").forEach(link => {
          link.style.overflowWrap = "anywhere";
        });
      });
    }

    function applyEpubTheme() {
      if (!state.epubRendition) return;

      state.epubRendition.themes.default({
        "html": {
          "background": "#ffffff !important"
        },
        "body": {
          "font-family": "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important",
          "font-size": `${Math.round(state.epubFontScale * 100)}% !important`,
          "line-height": "1.68 !important",
          "padding": "0 4.5% !important",
          "margin": "0 !important",
          "color": "#1e293b !important",
          "background": "#ffffff !important",
          "text-rendering": "optimizeLegibility",
          "overflow-wrap": "break-word"
        },
        "p": {
          "text-align": "justify",
          "orphans": "2",
          "widows": "2"
        },
        "h1, h2, h3, h4, h5, h6": {
          "line-height": "1.3 !important",
          "break-after": "avoid-page"
        },
        "img, svg, video": {
          "max-width": "100% !important",
          "max-height": "92vh !important",
          "height": "auto !important",
          "object-fit": "contain"
        },
        "table": {
          "max-width": "100% !important",
          "border-collapse": "collapse"
        },
        "pre, code": {
          "white-space": "pre-wrap !important",
          "overflow-wrap": "anywhere"
        },
        "a": {
          "color": "#0f766e !important"
        }
      });
    }

    function handleEpubRelocated(location) {
      if (!location) {
        return;
      }

      state.epubCurrentCfi =
        location.start?.cfi || "";
      state.epubAtStart =
        Boolean(location.atStart);
      state.epubAtEnd =
        Boolean(location.atEnd);

      if (
        state.activeFileId &&
        state.epubCurrentCfi
      ) {
        localStorage.setItem(
          `docEpubPosition:${state.activeFileId}`,
          state.epubCurrentCfi
        );
      }

      updateEpubLocationDisplay(
        state.epubCurrentCfi
      );
      updatePageButtons();
    }

    function getEpubTotalLocations() {
      if (
        !state.epubLocationsReady ||
        !state.epubBook?.locations
      ) {
        return 0;
      }

      const total =
        Number(state.epubBook.locations.length?.()) ||
        Number(state.epubBook.locations.total) ||
        0;

      return Math.max(0, Math.floor(total));
    }

    function getEpubCurrentLocationNumber() {
      if (
        !state.epubLocationsReady ||
        !state.epubCurrentCfi ||
        !state.epubBook?.locations
      ) {
        return "";
      }

      const index =
        state.epubBook.locations.locationFromCfi(
          state.epubCurrentCfi
        );

      if (!Number.isFinite(index) || index < 0) {
        return "";
      }

      return Math.floor(index) + 1;
    }

    function updateEpubLocationDisplay(cfi) {
      const totalLocations =
        getEpubTotalLocations();

      if (
        totalLocations > 0 &&
        cfi &&
        state.epubBook?.locations
      ) {
        const currentLocation =
          getEpubCurrentLocationNumber();

        if (currentLocation) {
          dom.pageNum.textContent =
            String(currentLocation);
          dom.pageCount.textContent =
            String(totalLocations);

          if (
            document.activeElement !==
            dom.pageJumpInput
          ) {
            dom.pageJumpInput.value =
              String(currentLocation);
          }

          return;
        }
      }

      dom.pageNum.textContent =
        state.epubAtStart ? "Đầu" : "…";
      dom.pageCount.textContent =
        state.epubAtEnd ? "Cuối" : "…";
    }

    function configurePageJump({
      enabled,
      label,
      max,
      value
    }) {
      dom.pageJumpLabel.textContent =
        label || "Đi tới";

      dom.pageJumpInput.disabled = !enabled;
      dom.btnPageJump.disabled = !enabled;

      dom.pageJumpInput.min = "1";

      if (
        Number.isFinite(Number(max)) &&
        Number(max) >= 1
      ) {
        dom.pageJumpInput.max =
          String(Math.floor(Number(max)));
        dom.pageJumpInput.placeholder =
          `1-${Math.floor(Number(max))}`;
      } else {
        dom.pageJumpInput.removeAttribute("max");
        dom.pageJumpInput.placeholder = "Số";
      }

      dom.pageJumpInput.value =
        value === "" ||
        value === null ||
        value === undefined
          ? ""
          : String(value);

      dom.pageJumpInput.classList.remove("invalid");
    }

    async function handlePageJumpSubmit(event) {
      event.preventDefault();

      const rawValue =
        String(dom.pageJumpInput.value || "").trim();

      const targetNumber =
        Number(rawValue);

      if (
        !rawValue ||
        !Number.isInteger(targetNumber)
      ) {
        markPageJumpInvalid(
          "Hãy nhập một số nguyên hợp lệ."
        );
        return;
      }

      if (state.viewerType === "pdf") {
        await jumpToPdfPage(targetNumber);
        return;
      }

      if (state.viewerType === "epub") {
        await jumpToEpubLocation(targetNumber);
      }
    }

    function markPageJumpInvalid(message) {
      dom.pageJumpInput.classList.add("invalid");
      dom.pageJumpInput.focus();
      dom.pageJumpInput.select();

      showToast(
        message,
        "warning",
        3500
      );
    }

    async function jumpToPdfPage(pageNumber) {
      const totalPages =
        state.pdfDoc?.numPages || 0;

      if (
        !totalPages ||
        pageNumber < 1 ||
        pageNumber > totalPages
      ) {
        markPageJumpInvalid(
          `Số trang phải từ 1 đến ${totalPages || 1}.`
        );
        return;
      }

      if (
        pageNumber === state.pageNum ||
        state.pageTransitioning
      ) {
        dom.pageJumpInput.blur();
        return;
      }

      const direction =
        pageNumber > state.pageNum
          ? "next"
          : "prev";

      state.pageTransitioning = true;

      try {
        preparePageFlipSnapshot(direction);

        await renderPage(
          pageNumber,
          {
            resetScroll: true,
            transitionDirection: direction,
            suppressLoading:
              state.pageEffect !== "none"
          }
        );

        animateNewPage(direction);
        dom.pageJumpInput.value =
          String(pageNumber);
        dom.pageJumpInput.blur();
      } finally {
        window.setTimeout(() => {
          finishPageTransition();
        }, state.pageEffect === "none" ? 0 : 300);
      }
    }

    async function jumpToEpubLocation(locationNumber) {
      const totalLocations =
        getEpubTotalLocations();

      if (!state.epubLocationsReady || !totalLocations) {
        showToast(
          "Ứng dụng đang tạo danh sách vị trí EPUB. Hãy thử lại sau ít giây.",
          "warning",
          4500
        );
        return;
      }

      if (
        locationNumber < 1 ||
        locationNumber > totalLocations
      ) {
        markPageJumpInvalid(
          `Vị trí phải từ 1 đến ${totalLocations}.`
        );
        return;
      }

      if (
        !state.epubRendition ||
        state.pageTransitioning
      ) {
        return;
      }

      const targetCfi =
        state.epubBook.locations.cfiFromLocation(
          locationNumber - 1
        );

      if (!targetCfi) {
        markPageJumpInvalid(
          "Không xác định được vị trí EPUB này."
        );
        return;
      }

      state.pageTransitioning = true;

      try {
        await state.epubRendition.display(
          targetCfi
        );

        dom.pageJumpInput.value =
          String(locationNumber);
        dom.pageJumpInput.blur();
      } catch (error) {
        console.error(
          "Lỗi đi tới vị trí EPUB:",
          error
        );

        showToast(
          "Không thể đi tới vị trí EPUB đã chọn.",
          "error",
          4500
        );
      } finally {
        state.pageTransitioning = false;
      }
    }

    async function changeEpubPage(offset) {
      if (
        !state.epubRendition ||
        state.pageTransitioning
      ) {
        return;
      }

      if (
        (offset < 0 && state.epubAtStart) ||
        (offset > 0 && state.epubAtEnd)
      ) {
        return;
      }

      state.pageTransitioning = true;

      try {
        if (offset > 0) {
          await state.epubRendition.next();
        } else {
          await state.epubRendition.prev();
        }
      } catch (error) {
        console.error("Lỗi chuyển trang EPUB:", error);
      } finally {
        state.pageTransitioning = false;
      }
    }

    function changeEpubFont(delta) {
      if (!state.epubRendition) {
        return;
      }

      state.epubFontScale = clamp(
        state.epubFontScale + delta,
        0.7,
        1.8
      );

      localStorage.setItem(
        "docEpubFontScale",
        String(state.epubFontScale)
      );

      applyEpubTheme();
      dom.zoomStatus.textContent =
        `${Math.round(state.epubFontScale * 100)}%`;
    }

    async function cleanupEpub(cancelPendingLoad = true) {
      if (cancelPendingLoad) {
        state.epubOpenToken++;
        state.epubLoadController?.abort();
      }

      state.epubLoadController = null;

      if (state.epubRendition) {
        try { state.epubRendition.destroy(); } catch {}
      }

      if (state.epubBook) {
        try { state.epubBook.destroy(); } catch {}
      }

      state.epubRendition = null;
      state.epubBook = null;
      state.epubLocationsReady = false;
      state.epubAtStart = true;
      state.epubAtEnd = false;
      state.epubCurrentCfi = "";
      state.epubRenderedOnce = false;

      dom.epubStage.replaceChildren();
      dom.epubContainer.classList.remove("is-loading");
      dom.epubContainer.style.display = "none";
      dom.pdfToolbar.classList.remove("epub-mode");

      if (state.viewerType !== "pdf") {
        configurePageJump({
          enabled: false,
          label: "Đi tới",
          max: null,
          value: ""
        });
      }
    }

    function handlePdfProgress(progress) {
      if (
        !progress ||
        !progress.total
      ) {
        return;
      }

      const percent = Math.min(
        100,
        Math.round(
          progress.loaded /
          progress.total *
          100
        )
      );

      dom.loadingMessage.textContent =
        `Đã tải khoảng ${percent}% dữ liệu tài liệu.`;
    }

    async function renderPage(
      pageNumber,
      options = {}
    ) {
      if (!state.pdfDoc) {
        return;
      }

      if (
        pageNumber < 1 ||
        pageNumber > state.pdfDoc.numPages
      ) {
        return;
      }

      if (state.pageRendering) {
        state.pendingPageNum =
          pageNumber;

        return;
      }

      state.pageRendering = true;

      if (!options.suppressLoading) {
        showLoading(
          `Đang hiển thị trang ${pageNumber}...`,
          "Ứng dụng đang vẽ nội dung trang PDF."
        );
      }

      try {
        if (state.pdfRenderTask) {
          try {
            state.pdfRenderTask.cancel();
          } catch {
            // Không cần xử lý thêm.
          }

          state.pdfRenderTask = null;
        }

        const page =
          await state.pdfDoc.getPage(
            pageNumber
          );

        const scale =
          calculatePdfScale(page);

        const viewport =
          page.getViewport({
            scale
          });

        const outputScale =
          Math.min(
            window.devicePixelRatio || 1,
            2.5
          );

        const pixelWidth =
          Math.max(
            1,
            Math.floor(
              viewport.width *
              outputScale
            )
          );

        const pixelHeight =
          Math.max(
            1,
            Math.floor(
              viewport.height *
              outputScale
            )
          );

        dom.pdfCanvas.width =
          pixelWidth;

        dom.pdfCanvas.height =
          pixelHeight;

        dom.pdfCanvas.style.width =
          `${Math.round(viewport.width)}px`;

        dom.pdfCanvas.style.height =
          `${Math.round(viewport.height)}px`;

        canvasContext.setTransform(
          1,
          0,
          0,
          1,
          0,
          0
        );

        canvasContext.fillStyle =
          "#ffffff";

        canvasContext.fillRect(
          0,
          0,
          pixelWidth,
          pixelHeight
        );

        const renderContext = {
          canvasContext,

          viewport,

          transform:
            outputScale !== 1
              ? [
                  outputScale,
                  0,
                  0,
                  outputScale,
                  0,
                  0
                ]
              : null,

          background:
            "#ffffff"
        };

        state.pdfRenderTask =
          page.render(renderContext);

        await state.pdfRenderTask.promise;

        state.pdfRenderTask = null;
        state.pageNum = pageNumber;

        dom.pageNum.textContent =
          String(pageNumber);

        if (
          document.activeElement !==
          dom.pageJumpInput
        ) {
          dom.pageJumpInput.value =
            String(pageNumber);
        }

        updatePageButtons();
        updateZoomStatus();

        if (options.resetScroll) {
          dom.pdfContainer.scrollTo({
            top: 0,
            left: 0,
            behavior: "auto"
          });
        }

        if (options.transitionDirection) {
          dom.pdfCanvas.classList.remove(
            "page-enter-next",
            "page-enter-prev"
          );

          void dom.pdfCanvas.offsetWidth;

          dom.pdfCanvas.classList.add(
            options.transitionDirection === "next"
              ? "page-enter-next"
              : "page-enter-prev"
          );
        }
      } catch (error) {
        if (
          error?.name !==
          "RenderingCancelledException"
        ) {
          console.error(
            "Lỗi render PDF:",
            error
          );

          showToast(
            "Không thể hiển thị trang PDF này.",
            "error"
          );
        }
      } finally {
        state.pageRendering = false;
        hideLoading();

        if (
          state.pendingPageNum !== null
        ) {
          const pending =
            state.pendingPageNum;

          state.pendingPageNum = null;

          await renderPage(
            pending,
            {
              resetScroll: true
            }
          );
        }
      }
    }

    function calculatePdfScale(page) {
      const baseViewport =
        page.getViewport({
          scale: 1
        });

      const horizontalPadding =
        window.innerWidth <= 620
          ? 20
          : 40;

      const verticalPadding =
        window.innerWidth <= 620
          ? 20
          : 40;

      const availableWidth =
        Math.max(
          100,
          dom.pdfContainer.clientWidth -
          horizontalPadding
        );

      const availableHeight =
        Math.max(
          100,
          dom.pdfContainer.clientHeight -
          verticalPadding
        );

      if (
        state.fitMode === "height"
      ) {
        const heightScale =
          availableHeight /
          baseViewport.height;

        /*
         * Đồng thời giới hạn theo chiều rộng.
         * Cách này tránh lỗi iPad: canvas có chiều rộng
         * vượt quá vùng hiển thị làm người dùng tưởng trang trống.
         */
        const widthScale =
          availableWidth /
          baseViewport.width;

        return clamp(
          Math.min(
            heightScale,
            widthScale
          ),
          CONFIG.MIN_ZOOM,
          CONFIG.MAX_ZOOM
        );
      }

      if (
        state.fitMode === "actual"
      ) {
        return clamp(
          state.customZoom,
          CONFIG.MIN_ZOOM,
          CONFIG.MAX_ZOOM
        );
      }

      const widthScale =
        availableWidth /
        baseViewport.width;

      return clamp(
        widthScale *
        state.customZoom,
        CONFIG.MIN_ZOOM,
        CONFIG.MAX_ZOOM
      );
    }

    async function changePage(offset) {
      if (state.viewerType === "epub") {
        await changeEpubPage(offset);
        return;
      }

      if (!state.pdfDoc || state.pageTransitioning) {
        return;
      }

      const nextPage =
        state.pageNum + offset;

      if (
        nextPage < 1 ||
        nextPage > state.pdfDoc.numPages
      ) {
        return;
      }

      const direction =
        offset > 0 ? "next" : "prev";

      state.pageTransitioning = true;

      try {
        preparePageFlipSnapshot(direction);

        await renderPage(
          nextPage,
          {
            resetScroll: true,
            transitionDirection: direction,
            suppressLoading:
              state.pageEffect !== "none"
          }
        );

        animateNewPage(direction);
      } finally {
        window.setTimeout(() => {
          finishPageTransition();
        }, state.pageEffect === "none" ? 0 : 300);
      }
    }


    function handlePageEffectChange() {
      state.pageEffect =
        dom.pageEffect.value;

      localStorage.setItem(
        "docPdfPageEffect",
        state.pageEffect
      );
    }

    function preparePageFlipSnapshot(direction) {
      if (
        state.pageEffect !== "flip" ||
        !dom.pdfCanvas.width ||
        !dom.pdfCanvas.height
      ) {
        return;
      }

      const source =
        dom.pdfCanvas;

      const overlay =
        dom.pageFlipLayer;

      overlay.width =
        source.width;

      overlay.height =
        source.height;

      overlay.style.width =
        source.style.width;

      overlay.style.height =
        source.style.height;

      const overlayContext =
        overlay.getContext("2d", {
          alpha: false
        });

      overlayContext.setTransform(
        1, 0, 0, 1, 0, 0
      );

      overlayContext.clearRect(
        0,
        0,
        overlay.width,
        overlay.height
      );

      overlayContext.drawImage(
        source,
        0,
        0
      );

      overlay.classList.remove(
        "flip-next",
        "flip-prev",
        "visible"
      );

      void overlay.offsetWidth;

      overlay.classList.add(
        "visible",
        direction === "next"
          ? "flip-next"
          : "flip-prev"
      );
    }

    function animateNewPage(direction) {
      if (state.pageEffect === "none") {
        return;
      }

      if (state.pageEffect === "slide") {
        dom.pdfCanvas.classList.remove(
          "page-enter-next",
          "page-enter-prev"
        );

        void dom.pdfCanvas.offsetWidth;

        dom.pdfCanvas.classList.add(
          direction === "next"
            ? "page-enter-next"
            : "page-enter-prev"
        );
      }
    }

    function finishPageTransition() {
      state.pageTransitioning = false;

      dom.pageFlipLayer.classList.remove(
        "visible",
        "flip-next",
        "flip-prev"
      );

      dom.pdfCanvas.classList.remove(
        "page-enter-next",
        "page-enter-prev"
      );
    }

    function handlePdfTouchStart(event) {
      if (
        (!state.pdfDoc && !state.epubRendition) ||
        event.touches.length !== 1
      ) {
        state.touchTracking = false;
        return;
      }

      const touch =
        event.touches[0];

      state.touchStartX =
        touch.clientX;

      state.touchStartY =
        touch.clientY;

      state.touchStartTime =
        performance.now();

      state.touchTracking = true;
    }

    function handlePdfTouchMove(event) {
      if (
        !state.touchTracking ||
        event.touches.length !== 1
      ) {
        return;
      }

      const touch =
        event.touches[0];

      const deltaX =
        touch.clientX - state.touchStartX;

      const deltaY =
        touch.clientY - state.touchStartY;

      if (
        Math.abs(deltaY) >
        Math.abs(deltaX) * 1.25
      ) {
        state.touchTracking = false;
      }
    }

    function handlePdfTouchEnd(event) {
      if (
        !state.touchTracking ||
        (!state.pdfDoc && !state.epubRendition)
      ) {
        return;
      }

      state.touchTracking = false;

      const touch =
        event.changedTouches?.[0];

      if (!touch) {
        return;
      }

      const deltaX =
        touch.clientX - state.touchStartX;

      const deltaY =
        touch.clientY - state.touchStartY;

      const elapsed =
        performance.now() -
        state.touchStartTime;

      const minimumDistance =
        Math.min(
          90,
          Math.max(
            48,
            dom.pdfContainer.clientWidth * 0.12
          )
        );

      const isHorizontal =
        Math.abs(deltaX) >
        Math.abs(deltaY) * 1.35;

      const isFastEnough =
        elapsed < 700;

      if (
        !isHorizontal ||
        !isFastEnough ||
        Math.abs(deltaX) < minimumDistance
      ) {
        return;
      }

      if (deltaX < 0) {
        changePage(1);
      } else {
        changePage(-1);
      }
    }

    function handlePdfTapNavigation(event) {
      if (
        event.pointerType === "mouse" ||
        (!state.pdfDoc && !state.epubRendition) ||
        state.pageTransitioning
      ) {
        return;
      }

      const rect =
        dom.pdfContainer.getBoundingClientRect();

      const relativeX =
        event.clientX - rect.left;

      const relativeY =
        event.clientY - rect.top;

      if (
        isHeightFocusMode() &&
        (relativeY <= 90 ||
          (relativeX > rect.width * 0.25 &&
           relativeX < rect.width * 0.75))
      ) {
        showFocusControls();
        return;
      }

      const edgeZone =
        rect.width * 0.18;

      if (relativeX <= edgeZone) {
        changePage(-1);
      } else if (
        relativeX >= rect.width - edgeZone
      ) {
        changePage(1);
      }
    }

    function showSwipeHintOnce() {
      if (
        localStorage.getItem(
          "docPdfSwipeHintShown"
        )
      ) {
        return;
      }

      dom.pdfContainer.classList.add(
        "show-swipe-hint"
      );

      window.setTimeout(() => {
        dom.pdfContainer.classList.remove(
          "show-swipe-hint"
        );

        localStorage.setItem(
          "docPdfSwipeHintShown",
          "1"
        );
      }, 2600);
    }

    function changeZoom(delta) {
      if (state.viewerType === "epub") {
        changeEpubFont(delta);
        return;
      }

      if (!state.pdfDoc) {
        return;
      }

      /*
       * Khi người dùng điều chỉnh zoom thủ công,
       * chuyển về chế độ kích thước thực để kết quả rõ ràng.
       */
      if (
        state.fitMode === "height"
      ) {
        state.fitMode = "actual";
        state.customZoom = 1;
        dom.fitMode.value = "actual";
      }

      state.customZoom = clamp(
        state.customZoom + delta,
        CONFIG.MIN_ZOOM,
        CONFIG.MAX_ZOOM
      );

      renderPage(
        state.pageNum,
        {
          resetScroll: false
        }
      );
    }

    function handleFitModeChange() {
      state.fitMode =
        dom.fitMode.value;

      state.customZoom = 1;
      updateHeightFocusMode(true);

      if (state.pdfDoc) {
        renderPage(
          state.pageNum,
          {
            resetScroll: true
          }
        );
      }
    }


    function isHeightFocusMode() {
      return (
        state.fitMode === "height" &&
        state.viewerType === "pdf" &&
        Boolean(state.pdfDoc) &&
        window.innerWidth <= 900
      );
    }

    function updateHeightFocusMode(showControls = false) {
      const enabled = isHeightFocusMode();

      document.body.classList.toggle(
        "height-focus-mode",
        enabled
      );

      if (!enabled) {
        clearTimeout(state.focusControlsTimer);
        dom.pdfToolbar.classList.remove("controls-hidden");
        return;
      }

      if (showControls) {
        showFocusControls();
      } else {
        scheduleFocusControlsHide();
      }
    }

    function showFocusControls() {
      if (!isHeightFocusMode()) {
        return;
      }

      dom.pdfToolbar.classList.remove("controls-hidden");
      dom.btnFocusControls.textContent = "✕";
      dom.btnFocusControls.setAttribute("aria-expanded", "true");
      scheduleFocusControlsHide();
    }

    function hideFocusControls() {
      if (!isHeightFocusMode()) {
        return;
      }

      dom.pdfToolbar.classList.add("controls-hidden");
      dom.btnFocusControls.textContent = "☰";
      dom.btnFocusControls.setAttribute("aria-expanded", "false");
    }

    function toggleFocusControls(event) {
      event.stopPropagation();

      if (!isHeightFocusMode()) {
        return;
      }

      if (dom.pdfToolbar.classList.contains("controls-hidden")) {
        showFocusControls();
      } else {
        hideFocusControls();
      }
    }

    function keepFocusControlsVisible() {
      if (isHeightFocusMode()) {
        scheduleFocusControlsHide();
      }
    }

    function scheduleFocusControlsHide() {
      clearTimeout(state.focusControlsTimer);

      if (!isHeightFocusMode()) {
        return;
      }

      state.focusControlsTimer = window.setTimeout(
        hideFocusControls,
        2600
      );
    }

    function updatePageButtons() {
      const hasPdf = Boolean(state.pdfDoc);
      const hasEpub = Boolean(state.epubRendition);

      let previousDisabled = true;
      let nextDisabled = true;

      if (hasEpub && state.viewerType === "epub") {
        previousDisabled = state.epubAtStart;
        nextDisabled = state.epubAtEnd;
      } else if (hasPdf) {
        previousDisabled = state.pageNum <= 1;
        nextDisabled =
          state.pageNum >=
          (state.pdfDoc?.numPages || 0);
      }

      dom.btnPrev.disabled = previousDisabled;
      dom.btnNext.disabled = nextDisabled;
      dom.btnEdgePrev.disabled = previousDisabled;
      dom.btnEdgeNext.disabled = nextDisabled;
    }

    function updateZoomStatus() {
      let displayValue;

      if (
        state.fitMode === "height"
      ) {
        displayValue = "Vừa cao";
      } else if (
        state.fitMode === "width" &&
        state.customZoom === 1
      ) {
        displayValue = "Vừa rộng";
      } else {
        displayValue =
          `${Math.round(
            state.customZoom * 100
          )}%`;
      }

      dom.zoomStatus.textContent =
        displayValue;
    }

    /* =====================================================
       12. MỞ FILE GỐC
       ===================================================== */

    function openOriginalFile() {
      if (
        !state.activeFileId ||
        !state.accessToken
      ) {
        showToast(
          "Chưa có file đang mở.",
          "warning"
        );

        return;
      }

      /*
       * URL này mở luồng media trong tab mới.
       * Token chỉ dùng trong phiên hiện tại.
       */
      const url =
        `${CONFIG.DRIVE_API_BASE}/files/` +
        `${encodeURIComponent(
          state.activeFileId
        )}` +
        "?alt=media&access_token=" +
        encodeURIComponent(
          state.accessToken
        );

      const newWindow =
        window.open(
          url,
          "_blank",
          "noopener,noreferrer"
        );

      if (!newWindow) {
        showToast(
          "Trình duyệt đã chặn cửa sổ mới.",
          "warning"
        );
      }
    }

    /* =====================================================
       13. RESPONSIVE SIDEBAR
       ===================================================== */

    function openSidebar() {
      dom.sidebar.classList.add("open");

      dom.sidebarBackdrop.classList.add(
        "visible"
      );

      dom.sidebarBackdrop.setAttribute(
        "aria-hidden",
        "false"
      );
    }

    function closeSidebar() {
      dom.sidebar.classList.remove("open");

      dom.sidebarBackdrop.classList.remove(
        "visible"
      );

      dom.sidebarBackdrop.setAttribute(
        "aria-hidden",
        "true"
      );
    }

    function closeSidebarOnSmallScreen() {
      if (window.innerWidth <= 900) {
        closeSidebar();
      }
    }

    /* =====================================================
       14. PHÍM TẮT
       ===================================================== */

    function handleKeyboardShortcuts(event) {
      const targetTag =
        event.target?.tagName?.toLowerCase();

      if (
        targetTag === "input" ||
        targetTag === "select" ||
        targetTag === "textarea"
      ) {
        return;
      }

      if (!state.pdfDoc && !state.epubRendition) {
        return;
      }

      if (
        event.key === "ArrowLeft" ||
        event.key === "PageUp"
      ) {
        event.preventDefault();
        changePage(-1);
      }

      if (
        event.key === "ArrowRight" ||
        event.key === "PageDown"
      ) {
        event.preventDefault();
        changePage(1);
      }

      if (
        event.key === "+" ||
        event.key === "="
      ) {
        event.preventDefault();
        changeZoom(
          CONFIG.ZOOM_STEP
        );
      }

      if (event.key === "-") {
        event.preventDefault();
        changeZoom(
          -CONFIG.ZOOM_STEP
        );
      }
    }

    /* =====================================================
       15. XỬ LÝ RESIZE
       ===================================================== */

    function handleWindowResize() {
      clearTimeout(
        state.resizeTimer
      );

      state.resizeTimer =
        setTimeout(() => {
          if (
            window.innerWidth > 900
          ) {
            closeSidebar();
          }

          updateHeightFocusMode(false);

          if (
            state.epubRendition &&
            state.viewerType === "epub"
          ) {
            state.epubRendition.resize();
          }

          if (
            state.pdfDoc &&
            (
              state.fitMode === "width" ||
              state.fitMode === "height"
            )
          ) {
            renderPage(
              state.pageNum,
              {
                resetScroll: false
              }
            );
          }
        }, CONFIG.RESIZE_DELAY);
    }

    /* =====================================================
       16. LOADING
       ===================================================== */

    function showLoading(
      title,
      message
    ) {
      dom.loadingTitle.textContent =
        title || "Đang xử lý...";

      dom.loadingMessage.textContent =
        message ||
        "Vui lòng chờ trong giây lát.";

      dom.loadingOverlay.classList.add(
        "visible"
      );
    }

    function hideLoading() {
      dom.loadingOverlay.classList.remove(
        "visible"
      );
    }

    /* =====================================================
       17. TOAST
       ===================================================== */

    function showToast(
      message,
      type = "info",
      duration = 4200
    ) {
      const toast =
        document.createElement("div");

      toast.className =
        `toast ${type}`;

      const icon =
        document.createElement("span");

      icon.textContent =
        getToastIcon(type);

      const text =
        document.createElement("div");

      text.className =
        "toast-message";

      text.textContent = message;

      const closeButton =
        document.createElement("button");

      closeButton.type = "button";
      closeButton.className =
        "toast-close";

      closeButton.textContent = "✕";
      closeButton.setAttribute(
        "aria-label",
        "Đóng thông báo"
      );

      const removeToast = () => {
        toast.remove();
      };

      closeButton.addEventListener(
        "click",
        removeToast
      );

      toast.append(
        icon,
        text,
        closeButton
      );

      dom.toastRegion.appendChild(
        toast
      );

      window.setTimeout(
        removeToast,
        duration
      );
    }

    function getToastIcon(type) {
      switch (type) {
        case "success":
          return "✓";

        case "error":
          return "⚠";

        case "warning":
          return "!";
          
        default:
          return "ℹ";
      }
    }

    /* =====================================================
       17. DỌN DẸP TÀI NGUYÊN
       ===================================================== */

    function cleanupPdfOnly() {
      if (state.pdfRenderTask) {
        try {
          state.pdfRenderTask.cancel();
        } catch {
          // Bỏ qua.
        }
      }

      state.pdfRenderTask = null;
      state.pageRendering = false;
      state.pendingPageNum = null;
      state.pageTransitioning = false;

      finishPageTransition();

      if (state.viewerType !== "epub") {
        dom.pdfToolbar.style.display = "none";

        configurePageJump({
          enabled: false,
          label: "Đi tới",
          max: null,
          value: ""
        });
      }

      dom.pdfContainer.style.display =
        "none";

      dom.btnEdgePrev.classList.remove(
        "pdf-visible"
      );

      dom.btnEdgeNext.classList.remove(
        "pdf-visible"
      );

      dom.btnEdgePrev.disabled = true;
      dom.btnEdgeNext.disabled = true;

      clearTimeout(state.focusControlsTimer);
      document.body.classList.remove("height-focus-mode");
      dom.pdfToolbar.classList.remove("controls-hidden");
    }

    async function cleanupPdfDocument() {
      if (state.pdfRenderTask) {
        try {
          state.pdfRenderTask.cancel();
        } catch {
          // Bỏ qua.
        }

        state.pdfRenderTask = null;
      }

      if (state.pdfLoadingTask) {
        try {
          await state.pdfLoadingTask.destroy();
        } catch {
          // Bỏ qua.
        }

        state.pdfLoadingTask = null;
      }

      if (state.pdfDoc) {
        try {
          await state.pdfDoc.destroy();
        } catch {
          // Bỏ qua.
        }

        state.pdfDoc = null;
      }

      state.pageRendering = false;
      state.pendingPageNum = null;

      dom.pdfCanvas.width = 1;
      dom.pdfCanvas.height = 1;

      dom.pdfCanvas.style.width = "1px";
      dom.pdfCanvas.style.height = "1px";
    }

    function cleanupViewer() {
      cleanupPdfOnly();

      cleanupPdfDocument().catch(() => {});
      cleanupEpub().catch(() => {});

      state.activeFileId = null;
      state.activeFileName = "";
      state.activeMimeType = "";
      state.viewerType = "";

      showPlaceholder(
        "Chưa chọn tài liệu",
        "Kết nối Google Drive, sau đó chọn một file PDF hoặc EPUB để mở.",
        "📖"
      );

      hideLoading();
    }

    function cleanupResources() {
      if (state.pdfRenderTask) {
        try {
          state.pdfRenderTask.cancel();
        } catch {
          // Bỏ qua.
        }
      }

      if (state.pdfLoadingTask) {
        try {
          state.pdfLoadingTask.destroy();
        } catch {
          // Bỏ qua.
        }
      }

      if (state.pdfDoc) {
        try {
          state.pdfDoc.destroy();
        } catch {
          // Bỏ qua.
        }
      }

      if (state.epubRendition) {
        try {
          state.epubRendition.destroy();
        } catch {
          // Bỏ qua.
        }
      }

      if (state.epubBook) {
        try {
          state.epubBook.destroy();
        } catch {
          // Bỏ qua.
        }
      }
    }

    /* =====================================================
       18. PLACEHOLDER
       ===================================================== */

    function showPlaceholder(
      title,
      message,
      icon = "📖"
    ) {
      cleanupPdfOnly();
      cleanupEpub().catch(() => {});
      state.viewerType = "";

      dom.placeholder.replaceChildren();

      const iconElement =
        document.createElement("div");

      iconElement.className =
        "placeholder-icon";

      iconElement.textContent = icon;

      const titleElement =
        document.createElement("h2");

      titleElement.textContent = title;

      const messageElement =
        document.createElement("p");

      messageElement.textContent =
        message;

      dom.placeholder.append(
        iconElement,
        titleElement,
        messageElement
      );

      dom.placeholder.style.display =
        "block";
    }

    /* =====================================================
       20. TIỆN ÍCH
       ===================================================== */

    function clamp(
      value,
      min,
      max
    ) {
      return Math.min(
        max,
        Math.max(min, value)
      );
    }
  </script>
</body>
