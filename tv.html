<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin qua internet</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --primary-color: #e74c3c;
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #ffffff;
            --focus-color: #f1c40f; 
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 50px;
        }

        .container {
            width: 95%;
            max-width: 1100px;
            margin-top: 20px;
        }

        h1 { text-align: center; color: var(--primary-color); letter-spacing: 1px; margin-bottom: 10px; }

        .app-container {
            width: 100%;
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .player-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        video { width: 100%; height: 100%; z-index: 1; outline: none; }
        video:focus { box-shadow: inset 0 0 0 4px var(--focus-color); }
        video::-webkit-media-controls-fullscreen-button { display: none !important; }

        /* --- VISUALIZER SÓNG NHẠC CSS --- */
        #visualizer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            gap: 6px;
            background: radial-gradient(circle, #2c3e50 0%, #000000 100%);
            z-index: 2;
            pointer-events: none; 
        }

        .bar {
            width: 10px;
            height: 60px;
            background: var(--primary-color);
            border-radius: 4px;
            box-shadow: 0 0 15px var(--primary-color);
            transform: scaleY(0.2); 
            opacity: 0.4;
        }

        .animated-bar {
            animation: bounce 1.2s ease-in-out infinite alternate;
        }
        @keyframes bounce {
            0% { transform: scaleY(0.2); opacity: 0.4; }
            100% { transform: scaleY(1.2); opacity: 1; }
        }

        .channel-grid {
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            max-height: 350px; 
            overflow-y: auto;
            background: #1a1a1a;
        }

        .channel-grid::-webkit-scrollbar { width: 8px; }
        .channel-grid::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); border-radius: 10px; }
        .channel-grid::-webkit-scrollbar-thumb { background: var(--primary-color); border-radius: 10px; }

        @media (min-width: 768px) {
            .app-container {
                position: relative;
                display: block;
            }

            .channel-grid {
                position: absolute;
                bottom: 0;
                left: 0;
                width: 100%;
                height: 40%; 
                max-height: none;
                background: rgba(20, 20, 20, 0.9); 
                backdrop-filter: blur(10px); 
                border-top: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 0 0 12px 12px;
                z-index: 1000; 
                transform: translateY(100%);
                opacity: 0;
                pointer-events: none;
                transition: all 0.3s ease-out;
            }

            .app-container.show-overlay .channel-grid,
            .channel-grid:focus-within {
                transform: translateY(0);
                opacity: 1;
                pointer-events: auto;
            }
            
            /* Class ép ẩn menu khi bị khóa */
            .app-container.menu-locked .channel-grid {
                transform: translateY(100%) !important;
                opacity: 0 !important;
                pointer-events: none !important;
            }
        }

        .app-container.fullscreen-mode {
            position: fixed !important;
            top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important;
            max-width: none !important;
            border-radius: 0 !important;
            z-index: 9999 !important;
            margin: 0 !important;
        }

        .app-container.fullscreen-mode .player-wrapper {
            height: 100%;
            aspect-ratio: auto; 
        }
        
        .app-container.fullscreen-mode video {
            z-index: 1 !important;
        }

        .app-container.fullscreen-mode .channel-grid {
            border-radius: 0;
            z-index: 2147483647 !important; 
        }

        /* Nút khóa menu trên TV */
        .btn-lock-menu {
            position: absolute;
            top: 25px;
            right: 25px;
            background-color: rgba(0, 0, 0, 0.6);
            color: var(--text-color);
            border: 2px solid rgba(255,255,255,0.3);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            z-index: 2147483647 !important;
            display: none; /* Chỉ hiện ở fullscreen */
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            outline: none;
        }

        .btn-lock-menu:hover, .btn-lock-menu:focus {
            background-color: var(--primary-color);
            border-color: var(--focus-color);
        }

        .btn-lock-menu.active-lock {
            background-color: var(--primary-color);
            border-color: #fff;
        }

        .app-container.fullscreen-mode .btn-lock-menu {
            display: flex;
        }

        .channel-card {
            background: var(--container-bg);
            padding: 18px 10px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            font-weight: 500;
            outline: none;
        }

        .channel-card:hover, .channel-card:focus {
            background: var(--primary-color);
            transform: translateY(-3px);
            border-color: var(--focus-color);
            box-shadow: 0 5px 15px rgba(241, 196, 15, 0.4);
        }

        .active {
            background: var(--primary-color) !important;
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
            border-color: #fff;
        }

        .tag { display: block; font-size: 10px; margin-top: 5px; opacity: 0.8; text-transform: uppercase; color: #f1c40f; }

        .controls-bar { 
            display: flex; 
            justify-content: center; 
            margin-top: 25px; 
            gap: 15px; 
        }

        .btn-action {
            background-color: var(--container-bg);
            color: var(--text-color);
            border: 2px solid var(--primary-color);
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s ease;
            outline: none;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 140px;
            justify-content: center;
        }

        .btn-action:hover, .btn-action:focus {
            background-color: var(--primary-color);
            border-color: var(--focus-color);
            transform: translateY(-2px);
        }

        .btn-action:disabled { opacity: 0.5; cursor: not-allowed; border-color: #555; background-color: #333; transform: none; }

        .links-section { margin-top: 20px; text-align: center; }
        .links-section a { color: #3498db; text-decoration: none; padding: 10px; display: inline-block; }
        .links-section a:focus, .links-section a:hover { color: var(--focus-color); text-decoration: underline; }
    </style>
</head>
<body>

<script>
    const channels = [

        { name: "VTV5", url: "https://vips-livecdn.fptplay.net/live/media/vtv5tnb/live-hls-avc/index.m3u8", type: "tv" },
        { name: "TN", url: "https://live.fptplay53.net/epzsd1/tayninh01_hls.smil/chunklist_b1800000.m3u8", type: "tv" },
        { name: "THVL1", url: "https://live.fptplay53.net/epzhd2/vinhlong1_vhls.smil/chunklist_b5000000.m3u8", type: "tv" },
        { name: "THVL2", url: "https://live.fptplay53.net/epzhd2/vinhlong2_vhls.smil/chunklist.m3u8", type: "tv" },
        { name: "THVL3", url: "https://live.fptplay53.net/epzhd2/vinhlong3_vhls.smil/chunklist.m3u8", type: "tv" },
        { name: "THDN2", url: "https://freem3u.xyz/api/live/play.m3u8?vid=255", type: "tv" },
        { name: "VieGT", url: "https://freem3u.xyz/api/live/play.m3u8?vid=180", type: "tv" },
        { name: "VieDr", url: "https://freem3u.xyz/api/live/play.m3u8?vid=177", type: "tv" },        
        { name: "INFO", url: "https://freem3u.xyz/api/live/play.m3u8?vid=189", type: "tv" },
        { name: "K-Drama", url: "https://stream.ads.ottera.tv/playlist.m3u8?network_id=425", type: "tv" },
        { name: "VNToday", url: "https://live.fptplay53.net/fnxhd1/vntoday_vhls.smil/chunklist_b5000000.m3u8", type: "tv" },
        { name: "FM 92.5", url: "https://1011337676.vnns.net/-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1cmkiOiIvaHR2Yy9WT0gtRk05Mi41LmFkbS50bXMvIiwiZXhwIjoxOTI0OTI1MjI4fQ.u5XcdU9KljAz3HgehDbCBbNEvSzWNAQTEKkU-DwH2K8-/htvc/VOH-FM92.5.adm.tms/chunks.m3u8", type: "radio" },
        { name: "FM 95.6", url: "https://1011337676.vnns.net/-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1cmkiOiIvaHR2Yy9WT0gtRk05NS42LmFkbS50bXMvIiwiZXhwIjoxOTI0OTI1MjI4fQ.isr2nlUkXOPGSxT-KT8FcZQFCcXn58RZrCyqoB3zDGg-/htvc/VOH-FM95.6.adm.tms/chunks.m3u8", type: "radio" },
        { name: "FM 99.9", url: "https://1011337676.vnns.net/-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1cmkiOiIvaHR2Yy9WT0gtRk05OS45LmFkbS50bXMvIiwiZXhwIjoxOTI0OTI1MjI4fQ.zVLoKcCW3tFLySpEQHcYh11PHIxk2ZE1pj5P-GFIm1I-/htvc/VOH-FM99.9.adm.tms/chunks.m3u8", type: "radio" },
        { name: "GTHN", url: "https://str.vov.gov.vn/vovlive/vovGTHN.sdp_aac/chunklist_w601606653.m3u8", type: "radio" },
        { name: "GTHCM", url: "https://str.vov.gov.vn/vovlive/vovGTHCM.sdp_aac/chunklist_w1213978008.m3u8", type: "radio" },
        { name: "M music", url: "https://stream-37.zeno.fm/4q7y9hvkp2zuv", type: "radio" },
        { name: "Dance machine", url: "https://edm.streeemer.com/listen/edm/radio.aac", type: "radio" },
        { name: "80s Pop Vibes", url: "https://oldies.streeemer.com/listen/oldies/radio.aac", type: "radio" }
    ];

    const video = document.getElementById('video');
    const visualizer = document.getElementById('visualizer');
    const playlist = document.getElementById('playlist');
    const btnRecall = document.getElementById('btnRecall');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const iconPlayPause = document.getElementById('iconPlayPause');
    const textPlayPause = document.getElementById('textPlayPause');
    const appContainer = document.getElementById('appContainer'); 
    
    // Khai báo biến xử lý Khóa Menu
    const btnLockMenu = document.getElementById('btnLockMenu');
    const textLockMenu = document.getElementById('textLockMenu');
    const iconLock = document.getElementById('iconLock');
    let isMenuLocked = false;

    let hls = null;
    let currentChannelIndex = 0;
    let previousChannelIndex = null;
    let hideOverlayTimeout; 
    const barCount = 25; 

    for (let i = 0; i < barCount; i++) {
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.animationDelay = `${Math.random() * 0.8}s`;
        visualizer.appendChild(bar);
    }

    btnPlayPause.addEventListener('click', () => {
        if (video.paused) {
            video.play();
        } else {
            video.pause();
        }
    });

    video.addEventListener('play', () => {
        textPlayPause.innerText = "Tạm dừng";
        iconPlayPause.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
        
        if (channels[currentChannelIndex].type === 'radio') {
            document.querySelectorAll('.bar').forEach(bar => bar.classList.add('animated-bar'));
        }
    });

    video.addEventListener('pause', () => {
        textPlayPause.innerText = "Phát tiếp";
        iconPlayPause.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
        document.querySelectorAll('.bar').forEach(bar => bar.classList.remove('animated-bar'));
    });

    // --- LOGIC XỬ LÝ NÚT KHÓA MENU ---
    btnLockMenu.addEventListener('click', (e) => {
        e.stopPropagation(); // Ngăn sự kiện click lan ra appContainer
        isMenuLocked = !isMenuLocked;
        
        if (isMenuLocked) {
            appContainer.classList.add('menu-locked');
            btnLockMenu.classList.add('active-lock');
            textLockMenu.innerText = "Tự động hiện Menu: TẮT";
            // Đổi sang icon ổ khóa đã khóa
            iconLock.innerHTML = '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path>'; 
        } else {
            appContainer.classList.remove('menu-locked');
            btnLockMenu.classList.remove('active-lock');
            textLockMenu.innerText = "Tự động hiện Menu: BẬT";
            // Đổi sang icon ổ khóa mở
            iconLock.innerHTML = '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>'; 
        }
    });

    function showOverlayMenu() {
        if (window.innerWidth < 768) return;
        appContainer.classList.add('show-overlay');
        resetHideTimeout();
    }

    function hideOverlayMenu() {
        if (window.innerWidth >= 768) {
            appContainer.classList.remove('show-overlay');
            clearTimeout(hideOverlayTimeout);
        }
    }

    function resetHideTimeout() {
        clearTimeout(hideOverlayTimeout);
        hideOverlayTimeout = setTimeout(() => {
            if (!playlist.contains(document.activeElement)) {
                appContainer.classList.remove('show-overlay');
            } else {
                resetHideTimeout(); 
            }
        }, 5000); 
    }

    appContainer.addEventListener('mousemove', (e) => {
        if (isMenuLocked) return; // BỎ QUA NẾU ĐÃ KHÓA MENU
        
        const rect = appContainer.getBoundingClientRect();
        const relativeY = e.clientY - rect.top;
        if (relativeY > rect.height * 0.4) {
            showOverlayMenu();
        }
    });
    
    appContainer.addEventListener('mouseleave', hideOverlayMenu);

    appContainer.addEventListener('click', (e) => {
        if (window.innerWidth < 768) return; 
        
        // Không xử lý click nếu nhấn vào menu hoặc nút khóa
        if (e.target.closest('.channel-grid') || e.target.closest('.btn-lock-menu')) {
            resetHideTimeout();
            return;
        }
        
        if (!isMenuLocked) {
            appContainer.classList.toggle('show-overlay');
            if (appContainer.classList.contains('show-overlay')) resetHideTimeout();
        }
    });

    function playChannel(channel) {
        if (channel.type === "radio") {
            visualizer.style.display = 'flex';
        } else {
            visualizer.style.display = 'none';
            document.querySelectorAll('.bar').forEach(bar => bar.classList.remove('animated-bar'));
        }

        if (hls) {
            hls.destroy();
            hls = null;
        }

        const isM3U8 = channel.url.includes('.m3u8');

        if (isM3U8 && Hls.isSupported()) {
            hls = new Hls({ maxMaxBufferLength: 10 });
            hls.loadSource(channel.url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play().catch(e => console.log("Chờ tương tác từ người dùng"));
            });
            hls.on(Hls.ErrorTypes.NETWORK_ERROR, () => {
                console.log("Lỗi mạng luồng stream, đang thử lại...");
            });
        } else {
            video.src = channel.url;
            video.play().catch(e => console.log("Chờ tương tác"));
        }
    }

    video.addEventListener('dblclick', toggleFullScreen);
    
    function toggleFullScreen() {
        if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
            if (appContainer.requestFullscreen) {
                appContainer.requestFullscreen();
            } else if (appContainer.msRequestFullscreen) {
                appContainer.msRequestFullscreen();
            } else if (appContainer.mozRequestFullScreen) {
                appContainer.mozRequestFullScreen();
            } else if (appContainer.webkitRequestFullscreen) {
                appContainer.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT);
            }
            appContainer.classList.add('fullscreen-mode');
            document.body.style.overflow = 'hidden';
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            } else if (document.mozCancelFullScreen) {
                document.mozCancelFullScreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
            appContainer.classList.remove('fullscreen-mode');
            document.body.style.overflow = '';
        }
    }

    function recallChannel() {
        if (previousChannelIndex !== null) {
            const previousCard = playlist.children[previousChannelIndex];
            if (previousCard) {
                showOverlayMenu();
                previousCard.click(); 
                setTimeout(() => previousCard.focus(), 100);
            }
        }
    }

    btnRecall.addEventListener('click', recallChannel);

    channels.forEach((ch, index) => {
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.setAttribute('tabindex', '0'); 
        card.innerHTML = `${ch.name}${ch.type === 'radio' ? ' <span class="tag">radio</span>' : ''}`;
        
        const triggerPlay = (e) => {
            if (e) e.stopPropagation();

            if (currentChannelIndex !== index) {
                previousChannelIndex = currentChannelIndex;
                currentChannelIndex = index;
                btnRecall.disabled = false;
            }

            document.querySelectorAll('.channel-card').forEach(el => el.classList.remove('active'));
            card.classList.add('active');
            playChannel(ch);
            
            setTimeout(hideOverlayMenu, 300);
            video.focus(); 
        };

        card.onclick = triggerPlay;
        card.onkeydown = (e) => { if (e.key === 'Enter') triggerPlay(e); };
        
        card.onfocus = () => { showOverlayMenu(); };

        playlist.appendChild(card);
        
        if(index === 0) { 
            card.classList.add('active'); 
            playChannel(ch); 
        }
    });

    window.history.pushState({ noExit: true }, '', window.location.href);
    window.addEventListener('popstate', function(event) {
        recallChannel();
        window.history.pushState({ noExit: true }, '', window.location.href);
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' || e.keyCode === 461 || e.key === 'Escape') {
            if (appContainer.classList.contains('fullscreen-mode')) {
                e.preventDefault();
                toggleFullScreen();
            } else if (previousChannelIndex !== null) {
                e.preventDefault();
                recallChannel();
            }
        }
    });
</script>
</body>
</html>
