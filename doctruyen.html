<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Đọc Tranh</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --primary-color: #ff5252;
            --card-bg: #1e1e1e;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        header { margin-bottom: 20px; }
        input[type="text"] {
            padding: 10px;
            width: 60%;
            max-width: 400px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: var(--primary-color);
            color: white;
            cursor: pointer;
            margin-left: 5px;
            transition: 0.2s;
        }
        button:hover:not(:disabled) { background-color: #ff1744; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        
        #section-title {
            text-align: left;
            padding-left: 20px;
            margin-top: 20px;
            color: var(--primary-color);
        }

        /* Grid Truyện */
        #results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .manga-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }
        .manga-card:hover { transform: scale(1.05); }
        .manga-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
        }
        .manga-card h3 {
            font-size: 14px;
            padding: 12px 10px;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Phân trang */
        .pagination {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .pagination span { font-weight: bold; }

        /* Chi tiết truyện & Chapter */
        #details, #reader { display: none; }
        .chapter-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 600px;
            margin: 20px auto;
        }
        .chapter-item {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 5px;
            cursor: pointer;
            text-align: left;
        }
        .chapter-item:hover { background-color: #333; }
        
        /* Khung Đọc Truyện */
        .page-image {
            max-width: 100%;
            margin-bottom: 10px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        
        .nav-buttons { margin-bottom: 20px; text-align: left; padding-left: 20px; }
        #loading { display: none; margin: 20px; color: var(--primary-color); font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1 style="cursor: pointer;" onclick="loadHomePage(1)">📖 Manga Reader</h1>
        <div id="search-bar">
            <input type="text" id="searchInput" placeholder="Nhập tên truyện (VD: One Piece, Naruto)..." onkeypress="if(event.key === 'Enter') searchManga(1)">
            <button onclick="searchManga(1)">Tìm kiếm</button>
        </div>
    </header>

    <div id="loading">Đang tải dữ liệu, vui lòng chờ...</div>
