<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Tủ sách XNhi Google Drive - 2026</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --surface: #ffffff;
      --bg: #eef2f5;
      --text: #172033;
      --muted: #64748b;
      --border: #dbe3ea;
      --danger: #b91c1c;
      --shadow: 0 10px 28px rgba(15, 23, 42, .09);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
    .topbar {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 18px; background: var(--surface); border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(15, 23, 42, .05); z-index: 5;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 250px; }
    .brand-icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: #ccfbf1; font-size: 23px; }
    .brand h1 { margin: 0; font-size: 18px; }
    .brand small { display: block; margin-top: 2px; color: var(--muted); }
    .status { margin-left: auto; min-width: 260px; max-width: 460px; }
    .status-row { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    .progress { height: 7px; overflow: hidden; background: #e2e8f0; border-radius: 999px; }
    .progress > div { height: 100%; width: 0; background: var(--primary); transition: width .2s ease; }
    .layout {
      min-height: 0;
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 14px;
      padding: 14px;
      transition: grid-template-columns .24s ease, gap .24s ease;
    }
    .sidebar, .viewer {
      min-height: 0;
      background: var(--surface);
      border-radius: 14px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .sidebar {
      display: grid;
      grid-template-rows: auto auto 1fr;
      overflow: hidden;
      min-width: 0;
      opacity: 1;
      transform: translateX(0);
      transition: opacity .18s ease, transform .24s ease, border-color .18s ease, box-shadow .18s ease;
    }

    /* Sidebar Collapsed State */
    .layout.sidebar-collapsed {
      grid-template-columns: 0 minmax(0, 1fr);
      gap: 0;
    }
    .layout.sidebar-collapsed .sidebar {
      opacity: 0;
      transform: translateX(-18px);
      pointer-events: none;
      border-color: transparent;
      box-shadow: none;
    }
    .sidebar-head { padding: 14px; border-bottom: 1px solid var(--border); }
    .folder-title { font-weight: 750; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .breadcrumb { margin-top: 6px; font-size: 12px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .search-wrap { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .search-wrap input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; outline: none; }
    .search-wrap input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15, 118, 110, .12); }
    .file-list { list-style: none; padding: 8px; margin: 0; overflow: auto; }
    .file-item {
      display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center;
      width: 100%; padding: 10px; border: 0; border-radius: 10px; background: transparent; text-align: left; color: var(--text);
    }
    .file-item:hover, .file-item.active { background: #ecfdf5; }
    .file-item.active { outline: 1px solid #99f6e4; }
    .file-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; background: #f1f5f9; font-size: 19px; }
    .file-name { font-size: 14px; font-weight: 650; overflow-wrap: anywhere; }
    .file-meta { margin-top: 3px; font-size: 11px; color: var(--muted); }
    .empty { padding: 30px 16px; text-align: center; color: var(--muted); }
    .viewer { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
    .toolbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px;
      padding: 10px; border-bottom: 1px solid var(--border); background: #fbfdfe;
    }
    .toolbar button, .toolbar input {
      height: 36px; border: 1px solid var(--border); border-radius: 9px; background: white; color: var(--text);
    }
    .toolbar button { padding: 0 12px; font-weight: 650; }
    .toolbar button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .toolbar button:disabled { opacity: .45; cursor: not-allowed; }
    .toolbar .primary { background: var(--primary); color: white; border-color: var(--primary); }
    .toolbar .primary:hover:not(:disabled) { background: var(--primary-dark); color: white; }
    .toolbar .fit-active { background: var(--primary); color: white; border-color: var(--primary); }
    .toolbar .fit-active:hover:not(:disabled) { background: var(--primary-dark); color: white; }
    .toolbar .library-toggle { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--primary); border-color: #99f6e4; background: #ecfdf5; }
    .toolbar .library-toggle:hover:not(:disabled) { color: white; border-color: var(--primary); background: var(--primary); }
    .page-input { width: 62px; padding: 0 8px; text-align: center; }
    .divider { width: 1px; height: 24px; background: var(--border); margin: 0 2px; }
    .document-name { flex: 1 1 200px; min-width: 140px; max-width: 420px; margin-right: auto; padding: 0 8px; font-weight: 700; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .canvas-wrap { min-height: 0; overflow: auto; padding: 24px; text-align: center; background: #cbd5e1; }
    .canvas-stage { display: inline-block; position: relative; min-width: 1px; min-height: 1px; }
    canvas { display: block; background: white; box-shadow: 0 8px 30px rgba(15, 23, 42, .25); }
    .welcome { height: 100%; display: grid; place-items: center; color: #475569; }
    .welcome[hidden] { display: none !important; }
    .welcome-box { max-width: 480px; padding: 28px; text-align: center; background: rgba(255,255,255,.72); border-radius: 16px; }
    .welcome-icon { font-size: 56px; }
    .toast {
      position: fixed; right: 18px; bottom: 18px; z-index: 20; max-width: min(420px, calc(100vw - 36px));
      padding: 12px 14px; border-radius: 11px; background: #0f172a; color: white; box-shadow: var(--shadow);
      opacity: 0; transform: translateY(12px); pointer-events: none; transition: .2s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: var(--danger); }
    .mobile-menu { display: none; }
    
    /* Responsive Design */
    @media (max-width: 860px) {
      body { overflow: auto; }
      .app { min-height: 100%; height: auto; }
      .topbar { position: sticky; top: 0; }
      .brand { min-width: 0; }
      .brand small, .status { display: none; }
      .mobile-menu { display: inline-grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 10px; background: white; }
      .layout, .layout.sidebar-collapsed { grid-template-columns: 1fr; gap: 14px; min-height: calc(100vh - 66px); }
      .sidebar, .layout.sidebar-collapsed .sidebar {
        position: fixed; inset: 66px auto 0 0; z-index: 10; width: min(88vw, 350px);
        border-radius: 0 14px 14px 0; opacity: 1; pointer-events: auto; border-color: var(--border);
        box-shadow: var(--shadow); transform: translateX(-105%); transition: transform .22s ease;
      }
      .sidebar.open, .layout.sidebar-collapsed .sidebar.open { transform: translateX(0); }
      .viewer { min-height: calc(100vh - 94px); }
      .canvas-wrap { padding: 12px; }
      .document-name { flex-basis: 100%; max-width: none; text-align: center; }
      .divider { display: none; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button id="mobileMenu" class="mobile-menu" type="button" aria-label="Mở danh sách tài liệu">☰</button>
    <div class="brand">
      <div class="brand-icon">📚</div>
      <div><h1>Tủ sách PDF</h1><small>Đọc tài liệu từ Google Drive</small></div>
    </div>
    <div id="statusBox" class="status" hidden>
      <div class="status-row"><span id="statusText">Đang xử lý...</span><span id="statusPercent">0%</span></div>
      <div class="progress"><div id="progressBar"></div></div>
    </div>
  </header>

  <main id="mainLayout" class="layout">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <div id="folderTitle" class="folder-title">Đang kết nối...</div>
        <div id="breadcrumb" class="breadcrumb">Thư mục gốc</div>
      </div>
      <div class="search-wrap"><input id="searchInput" type="search" placeholder="Tìm thư mục hoặc file PDF..." autocomplete="off"></div>
      <ul id="fileList" class="file-list"><li class="empty">Đang tải danh sách...</li></ul>
    </aside>

    <section class="viewer">
      <div class="toolbar">
        <button id="btnLibrary" class="library-toggle" type="button" aria-label="Hiện hoặc ẩn tủ sách">☰ Tủ sách</button>
        <div id="documentName" class="document-name">Chưa chọn tài liệu</div>
        <button id="btnPrev" type="button" disabled>← Trước</button>
        <input id="pageInput" class="page-input" type="number" min="1" value="1" disabled aria-label="Số trang">
        <span>/ <strong id="pageCount">0</strong></span>
        <button id="btnNext" type="button" disabled>Sau →</button>
        <span class="divider"></span>
        <button id="btnZoomOut" type="button" disabled>−</button>
        <strong id="zoomLabel">100%</strong>
        <button id="btnZoomIn" type="button" disabled>+</button>
        <button id="btnFit" type="button" disabled title="Phím 0">↔ Vừa chiều rộng</button>
        <button id="btnFitHeight" type="button" disabled title="Phím 9 hoặc H">↕ Vừa chiều cao</button>
      </div>
      <div id="canvasWrap" class="canvas-wrap">
        <div id="welcome" class="welcome"><div class="welcome-box"><div class="welcome-icon">📄</div><h2>Chọn một file PDF để bắt đầu</h2><p>Dùng danh sách bên trái để mở thư mục và tài liệu.</p></div></div>
        <div class="canvas-stage"><canvas id="pdfCanvas" hidden></canvas></div>
      </div>
    </section>
  </main>
</div>
<div id="toast" class="toast" role="status"></div>

<script>
  // Cấu hình Google Apps Script Backend URL
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbz9Fd3kzo7TCoGvKO4AhHl_iv0LiCB3Y2L4bqkvrpjMwWYHtDscRm5JhPMthQaSw8lZ5A/exec';
  const ROOT_MARKER = '';
  
  // Tùy chỉnh hiệu suất
  const MIN_SCALE = 0.5, MAX_SCALE = 3, SCALE_STEP = 0.2;
  const MAX_PARALLEL_CHUNK_REQUESTS = 3;
  const GLOBAL_CHUNK_CACHE_LIMIT = 48 * 1024 * 1024; // Cache 48MB
  const DESKTOP_MAX_CANVAS_PIXELS = 10_000_000;
  const MOBILE_MAX_CANVAS_PIXELS = 5_000_000;
  const DESKTOP_DPR_LIMIT = 1.5, MOBILE_DPR_LIMIT = 1.2;
  const ZOOM_RENDER_DELAY = 90;

  // Sử dụng Web Worker để xử lý luồng PDF độc lập (tăng tốc độ giao diện)
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  // Khởi tạo các Element Node
  const els = {
    mainLayout: document.getElementById('mainLayout'), sidebar: document.getElementById('sidebar'),
    mobileMenu: document.getElementById('mobileMenu'), btnLibrary: document.getElementById('btnLibrary'),
    folderTitle: document.getElementById('folderTitle'), breadcrumb: document.getElementById('breadcrumb'),
    searchInput: document.getElementById('searchInput'), fileList: document.getElementById('fileList'),
    statusBox: document.getElementById('statusBox'), statusText: document.getElementById('statusText'),
    statusPercent: document.getElementById('statusPercent'), progressBar: document.getElementById('progressBar'),
    documentName: document.getElementById('documentName'), btnPrev: document.getElementById('btnPrev'),
    pageInput: document.getElementById('pageInput'), pageCount: document.getElementById('pageCount'),
    btnNext: document.getElementById('btnNext'), btnZoomOut: document.getElementById('btnZoomOut'),
    zoomLabel: document.getElementById('zoomLabel'), btnZoomIn: document.getElementById('btnZoomIn'),
    btnFit: document.getElementById('btnFit'), btnFitHeight: document.getElementById('btnFitHeight'),
    canvasWrap: document.getElementById('canvasWrap'), canvas: document.getElementById('pdfCanvas'),
    welcome: document.getElementById('welcome'), toast: document.getElementById('toast')
  };

  const ctx = els.canvas.getContext('2d', { alpha: false });
  const globalChunkCache = new Map();

  // Biến trạng thái State
  let globalChunkCacheBytes = 0, folderStack = [], currentItems = [], currentFolderId = ROOT_MARKER;
  let activeFileId = '', pdfDoc = null, pdfLoadingTask = null;
  let currentRangeTransport = null, currentAbortController = null;
  let currentPageProxy = null, prefetchedPage = null, pageNum = 1;
  let scale = 1.25, fitMode = 'width'; // width | height | manual
  let renderTask = null, renderSerial = 0, loadToken = 0;
  let toastTimer = null, sidebarCollapsed = false, resizeTimer = null, zoomRenderTimer = null, cleanupTimer = null, idlePrefetchHandle = null;

  document.addEventListener('DOMContentLoaded', init);

  function init() {
    bindEvents();
    els.btnLibrary.textContent = '✕ Đóng tủ sách';
    els.btnLibrary.setAttribute('aria-expanded', 'true');
    loadDirectory(ROOT_MARKER, true);
  }

  function bindEvents() {
    els.mobileMenu.addEventListener('click', () => els.sidebar.classList.toggle('open'));
    els.btnLibrary.addEventListener('click', toggleLibrary);
    els.searchInput.addEventListener('input', renderFileList);
    els.btnPrev.addEventListener('click', () => goToPage(pageNum - 1));
    els.btnNext.addEventListener('click', () => goToPage(pageNum + 1));
    els.pageInput.addEventListener('change', () => goToPage(Number(els.pageInput.value)));
    els.pageInput.addEventListener('keydown', e => { if (e.key === 'Enter') goToPage(Number(els.pageInput.value)); });
    els.btnZoomOut.addEventListener('click', () => setScale(scale - SCALE_STEP));
    els.btnZoomIn.addEventListener('click', () => setScale(scale + SCALE_STEP));
    els.btnFit.addEventListener('click', fitToWidth);
    els.btnFitHeight.addEventListener('click', fitToHeight);
    window.addEventListener('keydown', handleShortcuts);
    window.addEventListener('resize', handleViewportResize);
    window.addEventListener('beforeunload', abortCurrentWork);
  }

  // Tiện ích Gọi API với cơ chế tự động Retries
  async function api(action, params = {}, options = {}) {
    const { signal, cache = 'no-store', bustCache = true, retries = 0 } = options;
    let lastError;
    for (let attempt = 0; attempt <= retries; attempt++) {
      try {
        const url = new URL(WEB_APP_URL);
        url.searchParams.set('action', action);
        url.searchParams.set('appType', 'pdf');
        if (bustCache) url.searchParams.set('_', Date.now().toString());
        Object.entries(params).forEach(([key, value]) => {
          if (value !== undefined && value !== null && value !== '') url.searchParams.set(key, String(value));
        });
        const response = await fetch(url.toString(), { method: 'GET', cache, redirect: 'follow', signal });
        if (!response.ok) throw new Error(`Lỗi HTTP ${response.status}.`);
        const data = await response.json();
        if (data.ok === false || data.error) throw new Error(data.error || 'Xử lý thất bại.');
        return data;
      } catch (error) {
        if (error?.name === 'AbortError') throw error;
        lastError = error;
        if (attempt < retries) await delay(250 * (attempt + 1));
      }
    }
    throw lastError;
  }

  // Quản lý hiển thị Thư Mục
  async function loadDirectory(folderId, reset = false) {
    setLoading(true, 'Đang lấy danh sách...', 15);
    els.fileList.innerHTML = '<li class="empty">Đang tải...</li>';
    try {
      const data = await api('list', folderId ? { folderId } : {});
      currentFolderId = data.folder.id;
      currentItems = Array.isArray(data.files) ? data.files : [];
      if (reset) folderStack = [{ id: data.folder.id, name: data.folder.name }];
      els.folderTitle.textContent = data.folder.name;
      els.breadcrumb.textContent = folderStack.map(i => i.name).join(' › ');
      els.searchInput.value = '';
      renderFileList();
      setLoading(false);
    } catch (error) {
      setLoading(false);
      els.fileList.innerHTML = `<li class="empty">❌ ${escapeHtml(error.message)}</li>`;
      showToast(error.message, true);
    }
  }

  function renderFileList() {
    const keyword = normalize(els.searchInput.value);
    const filtered = currentItems.filter(item => normalize(item.name).includes(keyword));
    const fragment = document.createDocumentFragment();

    if (folderStack.length > 1) {
      fragment.appendChild(makeItem({ name: 'Quay lại thư mục trước', isFolder: true }, true));
    }
    if (!filtered.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = keyword ? 'Không tìm thấy kết quả.' : 'Thư mục trống.';
      fragment.appendChild(li);
    } else {
      filtered.forEach(item => fragment.appendChild(makeItem(item, false)));
    }
    els.fileList.replaceChildren(fragment);
  }

  function makeItem(item, isBack) {
    const li = document.createElement('li');
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'file-item' + (!isBack && item.id === activeFileId ? ' active' : '');
    button.innerHTML = `<span class="file-icon">${isBack ? '↩️' : item.isFolder ? '📁' : '📄'}</span><span><div class="file-name">${escapeHtml(item.name)}</div>${(!isBack && !item.isFolder) ? `<div class="file-meta">${formatBytes(item.size || 0)}</div>` : ''}</span>`;
    button.addEventListener('click', () => {
      if (isBack) return goBack();
      if (item.isFolder) return openFolder(item);
      openPdf(item);
    });
    li.appendChild(button);
    return li;
  }

  function openFolder(item) { showLibrary(); folderStack.push({ id: item.id, name: item.name }); loadDirectory(item.id); }
  function goBack() { showLibrary(); if (folderStack.length <= 1) return; folderStack.pop(); loadDirectory(folderStack[folderStack.length - 1].id); }

  // Công cụ quản lý luồng đồng thời
  function createLimiter(maxConcurrent) {
    let active = 0; const queue = [];
    const runNext = () => {
      while (active < maxConcurrent && queue.length) {
        const job = queue.shift();
        active++;
        Promise.resolve().then(job.task).then(job.resolve, job.reject).finally(() => { active--; runNext(); });
      }
    };
    return task => new Promise((resolve, reject) => { queue.push({ task, resolve, reject }); runNext(); });
  }

  // Quản lý bộ nhớ tạm của Chunk
  function makeChunkCacheKey(fileId, version, index) { return `${fileId}::${version}::${index}`; }
  function getGlobalChunk(key) {
    const bytes = globalChunkCache.get(key);
    if (!bytes) return null;
    globalChunkCache.delete(key); globalChunkCache.set(key, bytes);
    return bytes;
  }
  function putGlobalChunk(key, bytes) {
    if (!bytes?.byteLength || bytes.byteLength > GLOBAL_CHUNK_CACHE_LIMIT / 2) return;
    const old = globalChunkCache.get(key);
    if (old) { globalChunkCacheBytes -= old.byteLength; globalChunkCache.delete(key); }
    globalChunkCache.set(key, bytes); globalChunkCacheBytes += bytes.byteLength;
    while (globalChunkCacheBytes > GLOBAL_CHUNK_CACHE_LIMIT && globalChunkCache.size) {
      const oldestKey = globalChunkCache.keys().next().value;
      globalChunkCacheBytes -= globalChunkCache.get(oldestKey).byteLength;
      globalChunkCache.delete(oldestKey);
    }
  }

  // Range Transport: Quản lý nạp từng phần PDF
  function createChunkRangeTransport(file, info, token, firstChunk, signal) {
    const initialData = firstChunk.slice();
    const chunkCache = new Map([[0, firstChunk]]), pendingChunks = new Map(), loadedChunkIndexes = new Set([0]);
    const requestLimit = createLimiter(MAX_PARALLEL_CHUNK_REQUESTS);
    const fileSize = Number(info.size), totalChunks = Number(info.totalChunks), chunkSize = Number(info.chunkSize) || firstChunk.length;
    const version = getFileVersion(info);
    let loadedBytes = firstChunk.length, aborted = false;

    const transport = new pdfjsLib.PDFDataRangeTransport(fileSize, initialData, false, file.name);

    function reportProgress(label = `Đang nạp file...`) {
      const percent = Math.min(99, Math.max(1, Math.round((loadedBytes / fileSize) * 100)));
      setLoading(true, label, percent);
      transport.onDataProgress(loadedBytes, fileSize);
    }

    function rememberChunk(index, bytes) {
      chunkCache.set(index, bytes);
      if (!loadedChunkIndexes.has(index)) {
        loadedChunkIndexes.add(index);
        loadedBytes = Math.min(fileSize, loadedBytes + bytes.length);
      }
      putGlobalChunk(makeChunkCacheKey(file.id, version, index), bytes);
      reportProgress();
      return bytes;
    }

    async function fetchChunk(index) {
      if (aborted || token !== loadToken || signal.aborted) throw createAbortError();
      if (index < 0 || index >= totalChunks) throw new Error(`Lỗi khối ${index}`);
      if (chunkCache.has(index)) return chunkCache.get(index);
      if (pendingChunks.has(index)) return pendingChunks.get(index);

      const globalKey = makeChunkCacheKey(file.id, version, index);
      const globalBytes = getGlobalChunk(globalKey);
      if (globalBytes) return rememberChunk(index, globalBytes);

      const request = requestLimit(async () => {
        if (aborted || token !== loadToken || signal.aborted) throw createAbortError();
        const chunkData = await api('getFileChunk', { fileId: file.id, index, v: version }, { signal, cache: 'default', bustCache: false, retries: 1 });
        if (aborted || token !== loadToken || signal.aborted) throw createAbortError();
        return rememberChunk(index, base64ToBytes(chunkData.base64));
      }).finally(() => pendingChunks.delete(index));

      pendingChunks.set(index, request);
      return request;
    }

    transport.requestDataRange = async function(begin, end) {
      try {
        if (aborted || token !== loadToken || signal.aborted) return;
        const safeBegin = Math.max(0, Math.floor(begin)), safeEnd = Math.min(fileSize, Math.ceil(end));
        if (safeEnd <= safeBegin) return;
        const firstIndex = Math.floor(safeBegin / chunkSize), lastIndex = Math.floor((safeEnd - 1) / chunkSize);
        const indexes = Array.from({ length: lastIndex - firstIndex + 1 }, (_, i) => firstIndex + i);
        
        const parts = await Promise.all(indexes.map(fetchChunk));
        if (aborted || token !== loadToken || signal.aborted) return;

        const requestedBytes = new Uint8Array(safeEnd - safeBegin);
        let destinationOffset = 0;
        parts.forEach((part, idx) => {
          const chunkStart = indexes[idx] * chunkSize;
          const sourceStart = Math.max(0, safeBegin - chunkStart), sourceEnd = Math.min(part.length, safeEnd - chunkStart);
          if (sourceEnd > sourceStart) {
            requestedBytes.set(part.subarray(sourceStart, sourceEnd), destinationOffset);
            destinationOffset += sourceEnd - sourceStart;
          }
        });
        this.onDataRange(safeBegin, requestedBytes);
      } catch (error) {
        if (error?.name === 'AbortError' || token !== loadToken) return;
        showToast('Không tải được khối PDF', true);
      }
    };

    transport.prefetchChunk = idx => (idx >= 0 && idx < totalChunks) ? fetchChunk(idx).catch(() => null) : Promise.resolve(null);
    transport.abort = function() { aborted = true; pendingChunks.clear(); };
    transport.chunkSize = chunkSize; transport.totalChunks = totalChunks;
    return transport;
  }

  // Lõi hiển thị PDF
  async function openPdf(file) {
    const token = ++loadToken;
    abortCurrentWork();
    currentAbortController = new AbortController();
    const signal = currentAbortController.signal;

    activeFileId = file.id;
    renderFileList();
    els.sidebar.classList.remove('open');
    els.documentName.textContent = file.name;
    hideLibrary();
    els.welcome.hidden = els.canvas.hidden = true;
    setViewerEnabled(false);

    try {
      setLoading(true, 'Chuẩn bị dữ liệu PDF...', 2);
      const listedVersion = getFileVersion(file);
      const cached = getGlobalChunk(makeChunkCacheKey(file.id, listedVersion, 0));

      const [infoData, firstChunkData] = await Promise.all([
        api('getFileInfo', { fileId: file.id }, { signal, retries: 1 }),
        cached ? Promise.resolve({ cachedBytes: cached }) : api('getFileChunk', { fileId: file.id, index: 0, v: listedVersion }, { signal, cache: 'default', bustCache: false, retries: 1 }),
        disposePdfDocument()
      ]);
      if (token !== loadToken) return;

      const info = infoData.file;
      const firstChunk = firstChunkData.cachedBytes || base64ToBytes(firstChunkData.base64);
      putGlobalChunk(makeChunkCacheKey(file.id, getFileVersion(info), 0), firstChunk);

      currentRangeTransport = createChunkRangeTransport(file, info, token, firstChunk, signal);
      
      // Khối cuối lấy bảng Table of Contents & Cross-references
      currentRangeTransport.prefetchChunk(Number(info.totalChunks) - 1);
      if (Number(info.totalChunks) > 2) currentRangeTransport.prefetchChunk(1);

      pdfLoadingTask = pdfjsLib.getDocument({
        range: currentRangeTransport, length: Number(info.size), disableRange: false, disableStream: true,
        disableAutoFetch: true, rangeChunkSize: currentRangeTransport.chunkSize, verbosity: 0
      });

      pdfLoadingTask.onProgress = progress => {
        if (token === loadToken && progress?.total) setLoading(true, 'Đang chuẩn bị trang...', (progress.loaded / progress.total) * 100);
      };

      pdfDoc = await pdfLoadingTask.promise;
      if (token !== loadToken) return;

      pageNum = 1; scale = 1.25; fitMode = isMobileViewport() ? 'width' : 'height';
      els.pageCount.textContent = pdfDoc.numPages; els.pageInput.max = pdfDoc.numPages;
      els.welcome.hidden = true; els.canvas.hidden = false;
      setViewerEnabled(true);

      await waitForLayoutReady();
      await renderPage();
      setLoading(false);
      showToast(`Đã mở thành công “${file.name}”.`);
    } catch (error) {
      if (token !== loadToken || error?.name === 'AbortError') return;
      setLoading(false); showToast(error.message, true);
      if (!pdfDoc) { els.welcome.hidden = false; els.canvas.hidden = true; els.documentName.textContent = 'Chưa chọn tài liệu'; showLibrary(); }
    }
  }

  function abortCurrentWork() {
    if (currentAbortController && !currentAbortController.signal.aborted) currentAbortController.abort();
    currentAbortController = null;
    if (currentRangeTransport) { try { currentRangeTransport.abort(); } catch (_) {} currentRangeTransport = null; }
    if (renderTask) { try { renderTask.cancel(); } catch (_) {} renderTask = null; }
    clearTimeout(zoomRenderTimer); cancelIdlePrefetch();
  }

  async function disposePdfDocument() {
    renderSerial++; clearTimeout(cleanupTimer); prefetchedPage = null; currentPageProxy = null;
    const task = pdfLoadingTask, doc = pdfDoc;
    pdfLoadingTask = null; pdfDoc = null;
    if (task) try { await task.destroy(); } catch (_) {}
    else if (doc) try { await doc.destroy(); } catch (_) {}
  }

  function isMobileViewport() { return window.matchMedia('(max-width: 860px)').matches; }
  
  // UI Toggles
  function hideLibrary() {
    if (isMobileViewport()) { els.sidebar.classList.remove('open'); return; }
    sidebarCollapsed = true; els.mainLayout.classList.add('sidebar-collapsed'); els.btnLibrary.textContent = '☰ Tủ sách'; els.btnLibrary.setAttribute('aria-expanded', 'false');
  }
  function showLibrary() {
    if (isMobileViewport()) { els.sidebar.classList.add('open'); return; }
    sidebarCollapsed = false; els.mainLayout.classList.remove('sidebar-collapsed'); els.btnLibrary.textContent = '✕ Đóng tủ sách'; els.btnLibrary.setAttribute('aria-expanded', 'true');
    if (pdfDoc) window.setTimeout(() => reapplyFitMode().catch(e => showToast(e.message, true)), 230);
  }
  function toggleLibrary() { sidebarCollapsed ? showLibrary() : hideLibrary(); }
  function waitForLayoutReady() { return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))); }
  function handleViewportResize() {
    clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(() => {
      if (!isMobileViewport()) els.sidebar.classList.remove('open');
      if (pdfDoc) reapplyFitMode().catch(e => showToast(e.message, true));
    }, 180);
  }

  // Render & Prefetch
  async function renderPage(options = {}) {
    const { loadingText = `Hiển thị trang ${pageNum}...` } = options;
    if (!pdfDoc) return;
    const docRef = pdfDoc, targetNum = pageNum, serial = ++renderSerial;
    if (renderTask) { try { renderTask.cancel(); } catch (_) {} renderTask = null; }
    setLoading(true, loadingText, 0);

    try {
      let page = (prefetchedPage && prefetchedPage.number === targetNum && prefetchedPage.token === loadToken) ? prefetchedPage.page : await docRef.getPage(targetNum);
      if (serial !== renderSerial || docRef !== pdfDoc) return;
      prefetchedPage = null;

      if (fitMode !== 'manual') {
        const baseVP = page.getViewport({ scale: 1 });
        const pad = isMobileViewport() ? 24 : 48;
        if (fitMode === 'height') {
          const H = Math.max(220, els.canvasWrap.clientHeight - pad);
          scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, H / baseVP.height));
        } else {
          const W = Math.max(260, els.canvasWrap.clientWidth - pad);
          scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, W / baseVP.width));
        }
      }

      const vp = page.getViewport({ scale }), outScale = calculateOutputScale(vp);
      els.canvas.width = Math.max(1, Math.floor(vp.width * outScale));
      els.canvas.height = Math.max(1, Math.floor(vp.height * outScale));
      els.canvas.style.width = `${Math.floor(vp.width)}px`;
      els.canvas.style.height = `${Math.floor(vp.height)}px`;

      const transform = outScale !== 1 ? [outScale, 0, 0, outScale, 0, 0] : null;
      const localTask = page.render({ canvasContext: ctx, viewport: vp, transform, intent: 'display' });
      renderTask = localTask;
      localTask.onContinue = cb => requestAnimationFrame(cb);

      await localTask.promise;
      if (serial !== renderSerial || docRef !== pdfDoc) return;

      const prev = currentPageProxy;
      currentPageProxy = page;
      updateControls(); setLoading(false);

      if (prev && prev !== page) {
        clearTimeout(cleanupTimer);
        cleanupTimer = window.setTimeout(() => { try { prev.cleanup(); } catch (_) {} }, 800);
      }
      scheduleAdjacentPagePrefetch(targetNum, docRef, serial);
    } catch (error) {
      if (serial !== renderSerial || error?.name === 'AbortError' || error?.name === 'RenderingCancelledException') return;
      setLoading(false); throw error;
    }
  }

  function calculateOutputScale(viewport) {
    const mobile = isMobileViewport(), maxPx = mobile ? MOBILE_MAX_CANVAS_PIXELS : DESKTOP_MAX_CANVAS_PIXELS;
    const targetScale = Math.min(window.devicePixelRatio || 1, mobile ? MOBILE_DPR_LIMIT : DESKTOP_DPR_LIMIT);
    const vpPx = Math.max(1, viewport.width * viewport.height);
    return Math.max(0.55, Math.min(targetScale, Math.sqrt(maxPx / vpPx)));
  }

  function scheduleAdjacentPagePrefetch(curr, docRef, serial) {
    cancelIdlePrefetch();
    if (isMobileViewport()) return; // Tiết kiệm băng thông trên thiết bị di động
    
    const prefetch = async () => {
      try {
        if (serial !== renderSerial || docRef !== pdfDoc || curr + 1 > docRef.numPages) return;
        const page = await docRef.getPage(curr + 1);
        await page.getOperatorList();
        if (serial !== renderSerial || docRef !== pdfDoc) { try { page.cleanup(); } catch (_) {} return; }
        prefetchedPage = { number: curr + 1, page, token: loadToken };
      } catch (e) {}
    };
    idlePrefetchHandle = window.requestIdleCallback ? requestIdleCallback(prefetch, { timeout: 1800 }) : window.setTimeout(prefetch, 650);
  }
  function cancelIdlePrefetch() {
    if (idlePrefetchHandle === null) return;
    window.cancelIdleCallback ? cancelIdleCallback(idlePrefetchHandle) : clearTimeout(idlePrefetchHandle);
    idlePrefetchHandle = null;
  }

  // Điều hướng và Controls
  function goToPage(val) {
    if (!pdfDoc) return;
    const tgt = Math.max(1, Math.min(pdfDoc.numPages, Math.round(Number(val) || pageNum)));
    if (tgt === pageNum && currentPageProxy) return;
    pageNum = tgt; els.canvasWrap.scrollTop = els.canvasWrap.scrollLeft = 0;
    renderPage().catch(e => showToast(e.message, true));
  }
  function setScale(val) {
    if (!pdfDoc) return;
    scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, Number(val.toFixed(2)))); fitMode = 'manual'; updateControls();
    clearTimeout(zoomRenderTimer);
    zoomRenderTimer = window.setTimeout(() => renderPage().catch(e => showToast(e.message, true)), ZOOM_RENDER_DELAY);
  }
  async function fitToWidth() { if (!pdfDoc) return; clearTimeout(zoomRenderTimer); fitMode = 'width'; updateControls(); await renderPage(); }
  async function fitToHeight() { if (!pdfDoc) return; clearTimeout(zoomRenderTimer); fitMode = 'height'; updateControls(); await renderPage(); }
  async function reapplyFitMode() { if (pdfDoc && fitMode !== 'manual') await renderPage(); }

  function updateControls() {
    const ok = Boolean(pdfDoc);
    els.pageInput.value = pageNum; els.btnPrev.disabled = !ok || pageNum <= 1; els.btnNext.disabled = !ok || pageNum >= pdfDoc.numPages;
    els.btnZoomOut.disabled = !ok || scale <= MIN_SCALE; els.btnZoomIn.disabled = !ok || scale >= MAX_SCALE;
    els.zoomLabel.textContent = `${Math.round(scale * 100)}%`;
    els.btnFit.classList.toggle('fit-active', ok && fitMode === 'width');
    els.btnFitHeight.classList.toggle('fit-active', ok && fitMode === 'height');
  }
  function setViewerEnabled(on) { [els.pageInput, els.btnZoomOut, els.btnZoomIn, els.btnFit, els.btnFitHeight].forEach(el => el.disabled = !on); if (!on) els.btnPrev.disabled = els.btnNext.disabled = true; }

  // Giao diện khác
  function setLoading(show, text = '', pct = 0) {
    els.statusBox.hidden = !show; if (!show) return;
    const safePct = Math.max(0, Math.min(100, Math.round(pct)));
    els.statusText.textContent = text; els.statusPercent.textContent = safePct > 0 ? `${safePct}%` : '';
    els.progressBar.style.width = safePct > 0 ? `${safePct}%` : '12%';
  }
  function showToast(msg, isErr = false) {
    clearTimeout(toastTimer); els.toast.textContent = msg; els.toast.className = `toast show${isErr ? ' error' : ''}`;
    toastTimer = setTimeout(() => els.toast.className = 'toast', 3500);
  }
  function handleShortcuts(e) {
    if (!pdfDoc || ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') goToPage(pageNum - 1);
    if (e.key === 'ArrowRight' || e.key === 'PageDown') goToPage(pageNum + 1);
    if (e.key === '+' || e.key === '=') setScale(scale + SCALE_STEP);
    if (e.key === '-') setScale(scale - SCALE_STEP);
    if (e.key === '0') fitToWidth(); if (e.key === '9' || e.key.toLowerCase() === 'h') fitToHeight();
    if (e.key.toLowerCase() === 'l') toggleLibrary();
  }

  // Utilities
  function getFileVersion(info) { return info.version || info.modifiedTime || info.md5Checksum || info.size || 'current'; }
  function createAbortError() { const e = new Error('Hủy'); e.name = 'AbortError'; return e; }
  function base64ToBytes(base64) {
    if (!base64) return new Uint8Array(0);
    const bin = atob(base64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
  function normalize(str) { return String(str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); }
  function formatBytes(bytes) {
    if (!bytes) return '0 B';
    const u = ['B', 'KB', 'MB', 'GB'], i = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), 3);
    return `${(bytes / Math.pow(1024, i)).toFixed(i ? 1 : 0)} ${u[i]}`;
  }
  function escapeHtml(str) { return String(str).replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c])); }
</script>
</body>
