<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lọc Dữ Liệu Tuổi Từ Excel</title>
    <!-- Nhúng thư viện SheetJS từ CDN -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 40px; 
            background-color: #f4f7f6;
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: white; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 { color: #333; margin-top: 0; }
        input[type="file"] { margin: 20px 0; }
        button { 
            background-color: #4CAF50; 
            color: white; 
            padding: 10px 20px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 16px;
        }
        button:hover { background-color: #45a049; }
        #status { margin-top: 20px; font-weight: bold; color: #2e7d32; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Phân loại dữ liệu theo độ tuổi</h2>
        <p>Tải lên file Excel có chứa cột <strong>"Ngày sinh"</strong> hoặc <strong>"Năm sinh"</strong>.</p>
        
        <input type="file" id="uploadFile" accept=".xlsx, .xls" />
        <br>
        <button onclick="processExcel()">Lọc & Tải Xuống File Mới</button>
        
        <div id="status"></div>
    </div>

    <script>
        function processExcel() {
            const fileInput = document.getElementById('uploadFile');
            const statusDiv = document.getElementById('status');
            
            if (!fileInput.files.length) {
                alert('Vui lòng chọn một file Excel!');
                return;
            }

            statusDiv.innerText = "Đang xử lý...";
            statusDiv.style.color = "#2e7d32";
            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];

                    // Bước 1: Quét file để tự động tìm dòng chứa tiêu đề (bỏ qua các dòng trống hoặc tên báo cáo)
                    const aoa = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false, dateNF: 'dd/mm/yyyy' });
                    let headerRowIndex = -1;
                    
                    for (let i = 0; i < Math.min(20, aoa.length); i++) {
                        const row = aoa[i];
                        if (!row) continue;
                        
                        // Kiểm tra xem dòng này có chứa cột nào tên "Ngày sinh" hoặc "Năm sinh" không
                        const hasBirthCol = row.some(cell => 
                            cell && typeof cell === 'string' && 
                            (cell.toLowerCase().includes('ngày sinh') || cell.toLowerCase().includes('năm sinh'))
                        );
                        
                        if (hasBirthCol) {
                            headerRowIndex = i;
                            break;
                        }
                    }

                    if (headerRowIndex === -1) {
                        throw new Error("Không tìm thấy cột 'Ngày sinh' hoặc 'Năm sinh' trong file!");
                    }

                    // Bước 2: Chỉ lấy dữ liệu bắt đầu từ dòng tiêu đề thực sự
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { range: headerRowIndex, raw: false, dateNF: 'dd/mm/yyyy' });

                    const currentYear = new Date().getFullYear();
                    const under18 = [];
                    const between18And50 = [];
                    const over50 = [];

                    jsonData.forEach(row => {
                        const birthKey = Object.keys(row).find(k => 
                            k.toLowerCase().includes('ngày sinh') || 
                            k.toLowerCase().includes('năm sinh')
                        );

                        if (birthKey && row[birthKey]) {
                            let birthYear = 0;
                            const dateStr = row[birthKey].toString().trim();

                            if (dateStr.includes('/')) {
                                const parts = dateStr.split('/');
                                birthYear = parseInt(parts[parts.length - 1], 10);
                            } else if (dateStr.includes('-')) {
                                const parts = dateStr.split('-');
                                birthYear = parseInt(parts[0].length === 4 ? parts[0] : parts[parts.length - 1], 10);
                            } else {
                                birthYear = parseInt(dateStr, 10);
                            }

                            if (!isNaN(birthYear) && birthYear > 1900) {
                                const age = currentYear - birthYear;
                                if (age < 18) {
                                    under18.push(row);
                                } else if (age <= 50) {
                                    between18And50.push(row);
                                } else {
                                    over50.push(row);
                                }
                            }
                        }
                    });

                    // Bước 3: Tạo file Excel mới và gộp các sheet
                    const newWorkbook = XLSX.utils.book_new();
                    let sheetsAdded = 0;

                    if (under18.length > 0) {
                        XLSX.utils.book_append_sheet(newWorkbook, XLSX.utils.json_to_sheet(under18), "Dưới 18 tuổi");
                        sheetsAdded++;
                    }
                    if (between18And50.length > 0) {
                        XLSX.utils.book_append_sheet(newWorkbook, XLSX.utils.json_to_sheet(between18And50), "Từ 18 đến 50");
                        sheetsAdded++;
                    }
                    if (over50.length > 0) {
                        XLSX.utils.book_append_sheet(newWorkbook, XLSX.utils.json_to_sheet(over50), "Trên 50 tuổi");
                        sheetsAdded++;
                    }

                    // Chặn lỗi xuất file rỗng nếu không có dữ liệu nào khớp
                    if (sheetsAdded === 0) {
                        throw new Error("Không có dữ liệu hợp lệ nào được tìm thấy.");
                    }

                    XLSX.writeFile(newWorkbook, "Ket_qua_phan_loai.xlsx");
                    statusDiv.innerText = "Đã xử lý và tải xuống thành công!";
                    statusDiv.style.color = "#2e7d32";

                } catch (error) {
                    console.error(error);
                    // Cải tiến thông báo lỗi chi tiết hơn trên màn hình
                    statusDiv.innerText = "Lỗi: " + error.message;
                    statusDiv.style.color = "red";
                }
            };

            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
