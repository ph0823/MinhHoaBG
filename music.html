        currentFolderId ||
        ''
    },
    signal
  ).then(data => data.file);

  fileInfoCache.set(file.id, promise);

  try {
    return await promise;
  } catch (error) {
    fileInfoCache.delete(file.id);
    throw error;
  }
}

async function fetchTrackChunk(
  file,
  info,
  index,
  signal
) {
  const data = await api(
    'getFileChunk',
    {
      fileId: file.id,
      folderId:
        file.folderId ||
        info.folderId ||
        currentFolderId ||
        '',
      index
    },
    signal,
    { retries: 4 }
  );

  return base64ToBytes(data.base64);
}

async function downloadTrackBlob(
  file,
  signal,
  options = {}
) {
  const info =
    options.info ||
    await getFileInfoCached(
      file,
      signal
    );

  const parts =
    new Array(info.totalChunks);

  const concurrency = Math.max(
    1,
    Math.min(
      info.totalChunks,
      options.concurrency ||
        DOWNLOAD_CONCURRENCY
    )
  );

  let nextIndex = 0;
  let completed = 0;

  async function worker() {
    while (true) {
      throwIfAborted(signal);

      const index = nextIndex++;

      if (index >= info.totalChunks) {
        return;
      }

      parts[index] = await fetchTrackChunk(
        file,
        info,
        index,
        signal
      );

      completed++;

      if (options.onProgress) {
        options.onProgress(
          completed,
          info.totalChunks,
          info
        );
      }
    }
  }

  await Promise.all(
    Array.from(
      { length: concurrency },
      () => worker()
    )
  );

  throwIfAborted(signal);

  /*
   * Blob nhận trực tiếp từng Uint8Array, tránh tạo thêm một bản sao
   * toàn bộ file trong RAM.
   */
  const blob = new Blob(
    parts,
    {
      type:
        info.mimeType ||
        guessMime(info.extension)
    }
  );

  return {
    info,
    blob,
    url: URL.createObjectURL(blob)
  };
}

function stopPlayerStreamSession(index) {
  const session =
    playerStreamSessions[index];

  if (!session) return;

  session.cancelled = true;

  if (session.controller) {
    try {
      session.controller.abort();
    } catch (_) {}
  }

  if (
    session.mediaSource &&
    session.mediaSource.readyState === 'open'
  ) {
    try {
      session.mediaSource.endOfStream();
    } catch (_) {}
  }

  playerStreamSessions[index] = null;
}

function releasePlayer(
  index,
  revokeUrl = true
) {
  const player = players[index];

  /*
   * Tắt gain trước khi pause/remove src để không còn một frame âm thanh
   * rò ra từ player cũ trên thiết bị xử lý chậm.
   */
  setPlayerOutputLevel(index, 0);
  stopPlayerStreamSession(index);

  try {
    player.pause();
    player.removeAttribute('src');
    player.load();
  } catch (_) {}

  if (
    revokeUrl &&
    playerObjectUrls[index]
  ) {
    try {
      URL.revokeObjectURL(
        playerObjectUrls[index]
      );
    } catch (_) {}
  }

  playerObjectUrls[index] = '';
}

function assignPlayerUrl(
  index,
  url
) {
  if (
    playerObjectUrls[index] &&
    playerObjectUrls[index] !== url
  ) {
    try {
      URL.revokeObjectURL(
        playerObjectUrls[index]
      );
    } catch (_) {}
  }

  playerObjectUrls[index] = url;

  const player = players[index];
  player.src = url;
  player.preload = 'auto';
  player.load();
}


function canUseProgressiveStreaming(info) {
  if (
    !window.MediaSource ||
    typeof MediaSource.isTypeSupported !==
      'function'
  ) {
    return false;
  }

  const extension =
    String(info.extension || '')
      .toLowerCase();

  const mime =
    String(info.mimeType || '')
      .toLowerCase();

  const isMp3 =
    extension === 'mp3' ||
    mime === 'audio/mpeg' ||
    mime === 'audio/mp3';

  return (
    isMp3 &&
    MediaSource.isTypeSupported(MSE_MIME)
  );
}

function waitForEvent(
  target,
  eventName,
  signal,
  timeoutMs = 15000
) {
  return new Promise((resolve, reject) => {
    const cleanup = () => {
      clearTimeout(timer);

      target.removeEventListener(
        eventName,
        onEvent
      );

      target.removeEventListener(
        'error',
        onError
      );

      if (signal) {
        signal.removeEventListener(
          'abort',
          onAbort
        );
      }
    };

    const onEvent = event => {
      cleanup();
      resolve(event);
    };

    const onError = () => {
      cleanup();
      reject(
        new Error(
          `Không thể xử lý sự kiện ${eventName}.`
        )
      );
    };

    const onAbort = () => {
      cleanup();
      reject(createAbortError());
    };

    const timer = window.setTimeout(() => {
      cleanup();
      reject(
        new Error(
          `Chờ ${eventName} quá thời gian cho phép.`
        )
      );
    }, timeoutMs);

    target.addEventListener(
      eventName,
      onEvent,
      { once: true }
    );

    target.addEventListener(
      'error',
      onError,
      { once: true }
    );

    if (signal) {
      signal.addEventListener(
        'abort',
        onAbort,
        { once: true }
      );
    }
  });
}

function waitForSourceBufferIdle(
  sourceBuffer,
  signal
) {
  if (!sourceBuffer.updating) {
    return Promise.resolve();
  }

  return waitForEvent(
    sourceBuffer,
    'updateend',
    signal,
    20000
  );
}

function appendSourceBufferOnce(
  sourceBuffer,
  bytes,
  signal
) {
  return new Promise((resolve, reject) => {
    const cleanup = () => {
      sourceBuffer.removeEventListener(
        'updateend',
        onDone
      );

      sourceBuffer.removeEventListener(
        'error',
        onError
      );

      if (signal) {
        signal.removeEventListener(
          'abort',
          onAbort
        );
      }
    };

    const onDone = () => {
      cleanup();
      resolve();
    };

    const onError = () => {
      cleanup();
      reject(
        new Error(
          'Không thể nối dữ liệu âm thanh.'
        )
      );
    };

    const onAbort = () => {
      cleanup();
      reject(createAbortError());
    };

    sourceBuffer.addEventListener(
      'updateend',
      onDone,
      { once: true }
    );

    sourceBuffer.addEventListener(
      'error',
      onError,
      { once: true }
    );

    if (signal) {
      signal.addEventListener(
        'abort',
        onAbort,
        { once: true }
      );
    }

    try {
      sourceBuffer.appendBuffer(bytes);
    } catch (error) {
      cleanup();
      reject(error);
    }
  });
}

function isQuotaExceededError(error) {
  const name =
    String(error && error.name || '')
      .toLowerCase();

  const message =
    String(error && error.message || error || '')
      .toLowerCase();

  return (
    name === 'quotaexceedederror' ||
    message.includes('sourcebuffer is full') ||
    message.includes('cannot free space') ||
    message.includes('quota exceeded') ||
    message.includes('quotaexceeded')
  );
}

function getBufferedAhead(player) {
  try {
    const current =
      Number(player.currentTime || 0);

    for (
      let index = 0;
      index < player.buffered.length;
      index++
    ) {
      const start =
        player.buffered.start(index);

      const end =
        player.buffered.end(index);

      if (
        current >= start - 0.15 &&
        current <= end + 0.15
      ) {
        return Math.max(
          0,
          end - current
        );
      }
    }
  } catch (_) {}

  return 0;
}

async function removePlayedBuffer(
  session,
  aggressive = false
) {
  const sourceBuffer =
    session.sourceBuffer;

  const player =
    session.player;

  if (
    !sourceBuffer ||
    !sourceBuffer.buffered ||
    sourceBuffer.buffered.length === 0
  ) {
    return false;
  }

  const current =
    Number(player.currentTime || 0);

  const keep =
    aggressive
      ? Math.min(
          6,
          PROGRESSIVE_KEEP_BEHIND
        )
      : PROGRESSIVE_KEEP_BEHIND;

  const removeEnd =
    current - keep;

  if (removeEnd <= 1) {
    return false;
  }

  let removeStart = 0;

  try {
    removeStart =
      sourceBuffer.buffered.start(0);
  } catch (_) {
    return false;
  }

  if (
    removeEnd <= removeStart + 0.5
  ) {
    return false;
  }

  await waitForSourceBufferIdle(
    sourceBuffer,
    session.signal
  );

  return new Promise((resolve, reject) => {
    const cleanup = () => {
      sourceBuffer.removeEventListener(
        'updateend',
        onDone
      );

      sourceBuffer.removeEventListener(
        'error',
        onError
      );

      session.signal.removeEventListener(
        'abort',
        onAbort
      );
    };

    const onDone = () => {
      cleanup();
      resolve(true);
    };

    const onError = () => {
      cleanup();
      resolve(false);
    };

    const onAbort = () => {
      cleanup();
      reject(createAbortError());
    };

    sourceBuffer.addEventListener(
      'updateend',
      onDone,
      { once: true }
    );

    sourceBuffer.addEventListener(
      'error',
      onError,
      { once: true }
    );

    session.signal.addEventListener(
      'abort',
      onAbort,
      { once: true }
    );

    try {
      sourceBuffer.remove(
        removeStart,
        removeEnd
      );
    } catch (_) {
      cleanup();
      resolve(false);
    }
  });
}

async function waitForProgressiveBufferRoom(
  session
) {
  while (
    !session.cancelled &&
    getBufferedAhead(session.player) >=
      PROGRESSIVE_MAX_BUFFER_AHEAD
  ) {
    await removePlayedBuffer(
      session,
      false
    );

    if (
      getBufferedAhead(session.player) <=
      PROGRESSIVE_RESUME_BUFFER_AHEAD
    ) {
      return;
    }

    await delay(
      MSE_BUFFER_CHECK_INTERVAL_MS,
      session.signal
    );
  }
}

async function appendProgressiveChunk(
  session,
  bytes
) {
  while (true) {
    throwIfAborted(session.signal);

    await waitForProgressiveBufferRoom(
      session
    );

    await waitForSourceBufferIdle(
      session.sourceBuffer,
      session.signal
    );

    try {
      await appendSourceBufferOnce(
        session.sourceBuffer,
        bytes,
        session.signal
      );

      await removePlayedBuffer(
        session,
        false
      );

      return;
    } catch (error) {
      if (!isQuotaExceededError(error)) {
        throw error;
      }

      const cleaned =
        await removePlayedBuffer(
          session,
          true
        );

      showMode(
        cleaned
          ? 'Đã dọn bộ đệm cũ • tiếp tục tải nền'
          : 'Bộ nhớ đệm đang đầy • chờ phát bớt dữ liệu'
      );

      await delay(
        cleaned
          ? 180
          : MSE_QUOTA_RETRY_DELAY_MS,
        session.signal
      );
    }
  }
}

function readUint32Be(bytes, offset) {
  if (
    !bytes ||
    offset < 0 ||
    offset + 4 > bytes.length
  ) {
    return 0;
  }

  return (
    (
      bytes[offset] * 0x1000000
    ) +
    (
      bytes[offset + 1] << 16
    ) +
    (
      bytes[offset + 2] << 8
    ) +
    bytes[offset + 3]
  ) >>> 0;
}

function readAscii4(bytes, offset) {
  if (
    !bytes ||
    offset < 0 ||
    offset + 4 > bytes.length
  ) {
    return '';
  }

  return String.fromCharCode(
    bytes[offset],
    bytes[offset + 1],
    bytes[offset + 2],
    bytes[offset + 3]
  );
}

function getMp3DataStart(bytes) {
  if (
    !bytes ||
    bytes.length < 10 ||
    bytes[0] !== 0x49 ||
    bytes[1] !== 0x44 ||
    bytes[2] !== 0x33
  ) {
    return 0;
  }

  const tagSize =
    (
      (bytes[6] & 0x7f) << 21
    ) |
    (
      (bytes[7] & 0x7f) << 14
    ) |
    (
      (bytes[8] & 0x7f) << 7
    ) |
    (bytes[9] & 0x7f);

  const hasFooter =
    Boolean(bytes[5] & 0x10);

  return Math.min(
    bytes.length,
    10 + tagSize + (hasFooter ? 10 : 0)
  );
}

function findMp3FrameHeader(bytes) {
  if (!bytes || bytes.length < 4) {
    return null;
  }

  const mpeg1Layer3 =
    [
      0, 32, 40, 48, 56, 64, 80, 96,
      112, 128, 160, 192, 224, 256, 320, 0
    ];

  const mpeg2Layer3 =
    [
      0, 8, 16, 24, 32, 40, 48, 56,
      64, 80, 96, 112, 128, 144, 160, 0
    ];

  const start =
    getMp3DataStart(bytes);

  for (
    let index = start;
    index < bytes.length - 4;
    index++
  ) {
    if (
      bytes[index] !== 0xff ||
      (bytes[index + 1] & 0xe0) !== 0xe0
    ) {
      continue;
    }

    const versionBits =
      (bytes[index + 1] >> 3) & 0x03;

    const layerBits =
      (bytes[index + 1] >> 1) & 0x03;

    const bitrateIndex =
      (bytes[index + 2] >> 4) & 0x0f;

    const sampleRateIndex =
      (bytes[index + 2] >> 2) & 0x03;

    if (
      versionBits === 0x01 ||
      layerBits !== 0x01 ||
      bitrateIndex === 0 ||
      bitrateIndex === 0x0f ||
      sampleRateIndex === 0x03
    ) {
      continue;
    }

    const bitrateTable =
      versionBits === 0x03
        ? mpeg1Layer3
        : mpeg2Layer3;

    const sampleRates =
      versionBits === 0x03
        ? [44100, 48000, 32000]
        : versionBits === 0x02
          ? [22050, 24000, 16000]
          : [11025, 12000, 8000];

    const bitrateKbps =
      bitrateTable[bitrateIndex] || 0;

    const sampleRate =
      sampleRates[sampleRateIndex] || 0;

    if (!bitrateKbps || !sampleRate) {
      continue;
    }

    const channelMode =
      (bytes[index + 3] >> 6) & 0x03;

    const mono =
      channelMode === 0x03;

    const hasCrc =
      (bytes[index + 1] & 0x01) === 0;

    const samplesPerFrame =
      versionBits === 0x03
        ? 1152
        : 576;

    const sideInfoSize =
      versionBits === 0x03
        ? (mono ? 17 : 32)
        : (mono ? 9 : 17);

    return {
      index,
      versionBits,
      bitrateKbps,
      sampleRate,
      samplesPerFrame,
      sideInfoSize,
      hasCrc
    };
  }

  return null;
}

function parseMp3VbrDuration(bytes) {
  const header =
    findMp3FrameHeader(bytes);

  if (!header) {
    return 0;
  }

  const xingOffset =
    header.index +
    4 +
    (header.hasCrc ? 2 : 0) +
    header.sideInfoSize;

  const xingMarker =
    readAscii4(bytes, xingOffset);

  if (
    xingMarker === 'Xing' ||
    xingMarker === 'Info'
  ) {
    const flags =
      readUint32Be(
        bytes,
        xingOffset + 4
      );

    if (flags & 0x01) {
      const frameCount =
        readUint32Be(
          bytes,
          xingOffset + 8
        );

      if (frameCount > 0) {
        return (
          frameCount *
          header.samplesPerFrame /
          header.sampleRate
        );
      }
    }
  }

  /*
   * VBRI thường nằm gần byte 36 của frame đầu. Quét một vùng nhỏ giúp
   * tương thích cả frame có CRC và các encoder đặt header hơi khác.
   */
  const scanStart =
    Math.max(
      header.index + 4,
      header.index + 28
    );

  const scanEnd =
    Math.min(
      bytes.length - 18,
      header.index + 96
    );

  for (
    let offset = scanStart;
    offset <= scanEnd;
    offset++
  ) {
    if (
      readAscii4(bytes, offset) !==
      'VBRI'
    ) {
      continue;
    }

    const frameCount =
      readUint32Be(
        bytes,
        offset + 14
      );

    if (frameCount > 0) {
      return (
        frameCount *
        header.samplesPerFrame /
        header.sampleRate
      );
    }
  }

  return 0;
}

function parseMp3BitrateKbps(bytes) {
  const header =
    findMp3FrameHeader(bytes);

  return header
    ? header.bitrateKbps
    : 0;
}

function estimateMp3Duration(
  bytes,
  info,
  fileName = ''
) {
  /*
   * Xing/Info/VBRI cho thời lượng chính xác hơn rất nhiều với MP3 VBR.
   * Ước lượng theo bitrate frame đầu có thể lệch vài giây và khiến
   * chuyển bài bị kích hoạt sau khi bài cũ đã kết thúc.
   */
  const vbrDuration =
    parseMp3VbrDuration(bytes);

  if (vbrDuration > 0) {
    return vbrDuration;
  }

  const nameMatch =
    String(fileName).match(
      /(?:^|[^0-9])(64|80|96|112|128|160|192|224|256|320|384|512)\s*kbps/i
    );

  const bitrate =
    parseMp3BitrateKbps(bytes) ||
    (
      nameMatch
        ? Number(nameMatch[1])
        : 0
    );

  if (
    bitrate <= 0 ||
    !info.size
  ) {
    return 0;
  }

  return (
    Number(info.size) *
    8 /
    (
      bitrate *
      1000
    )
  );
}


async function fetchTrackChunkResilient(
  file,
  info,
  index,
  signal
) {
  let cycle = 0;

  while (true) {
    throwIfAborted(signal);

    try {
      return await fetchTrackChunk(
        file,
        info,
        index,
        signal
      );
    } catch (error) {
      if (isAbortError(error)) {
        throw error;
      }

      cycle++;

      showRecoveryStatus(
        navigator.onLine
          ? `Tải nền bị gián đoạn • thử lại phần ${index + 1}/${info.totalChunks}`
          : `Mất mạng • chờ tải tiếp phần ${index + 1}/${info.totalChunks}`
      );

      if (!navigator.onLine) {
        await waitUntilOnline(signal);
      }

      await delay(
        Math.min(
          10000,
          PROGRESSIVE_RETRY_DELAY_MS *
            Math.pow(
              1.45,
              Math.min(
                cycle - 1,
                6
              )
            )
        ),
        signal
      );
    }
  }
}

async function streamRemainingTrack(
  session,
  startIndex,
  onProgress
) {
  let index = startIndex;

  try {
    while (
      index < session.info.totalChunks &&
      !session.cancelled &&
      (
        !session.ownerToken ||
        isPlayerOwner(
          session.playerIndex,
          session.ownerToken
        )
      )
    ) {
      await waitForProgressiveBufferRoom(
        session
      );

      const end =
        Math.min(
          session.info.totalChunks,
          index + PROGRESSIVE_BATCH_SIZE
        );

      const indexes = [];

      for (
        let current = index;
        current < end;
        current++
      ) {
        indexes.push(current);
      }

      const chunks =
        await Promise.all(
          indexes.map(current =>
            fetchTrackChunkResilient(
              session.file,
              session.info,
              current,
              session.signal
            )
          )
        );

      for (
        let offset = 0;
        offset < chunks.length;
        offset++
      ) {
        if (
          session.cancelled ||
          (
            session.ownerToken &&
            !isPlayerOwner(
              session.playerIndex,
              session.ownerToken
            )
          )
        ) {
          throw createAbortError();
        }

        await appendProgressiveChunk(
          session,
          chunks[offset]
        );

        session.loadedChunks++;

        if (onProgress) {
          onProgress(
            session.loadedChunks,
            session.info.totalChunks,
            session.info,
            true
          );
        }
      }

      index = end;
    }

    if (
      !session.cancelled &&
      (
        !session.ownerToken ||
        isPlayerOwner(
          session.playerIndex,
          session.ownerToken
        )
      ) &&
      session.mediaSource.readyState === 'open'
    ) {
      await waitForSourceBufferIdle(
        session.sourceBuffer,
        session.signal
      );

      /*
       * Khi đã append đủ file, lấy mốc cuối thật của SourceBuffer.
       * Đây là thời lượng đáng tin cậy nhất cho MP3 VBR và giúp bộ
       * chuyển bài không phải chờ sự kiện ended mới chạy.
       */
      const finalDuration =
        getBufferedEnd(session.player);

      if (finalDuration > 0) {
        session.estimatedDuration =
          finalDuration;

        try {
          session.mediaSource.duration =
            finalDuration;
        } catch (_) {}
      }

      try {
        session.mediaSource.endOfStream();
      } catch (_) {}
    }

    if (
      session.ownerToken &&
      !isPlayerOwner(
        session.playerIndex,
        session.ownerToken
      )
    ) {
      throw createAbortError();
    }

    session.completed = true;

    if (onProgress) {
      onProgress(
        session.info.totalChunks,
        session.info.totalChunks,
        session.info,
        true
      );
    }
  } catch (error) {
    if (!isAbortError(error)) {
      session.error = error;

      if (
        session.playerIndex ===
        activePlayerIndex
      ) {
        showRecoveryStatus(
          'Luồng tải nền đang tự khôi phục...'
        );
      }
    }
  }
}

async function prepareProgressivePlayer(
  file,
  info,
  playerIndex,
  controller,
  options = {}
) {
  const signal =
    controller.signal;

  const ownerToken =
    options.ownerToken || 0;

  throwIfPlayerOwnerLost(
    playerIndex,
    ownerToken
  );

  /*
   * Synchronous release is safe only after the owner check. A newer
   * request that claims this slot will make every later check abort.
   */
  releasePlayer(
    playerIndex,
    true
  );

  throwIfPlayerOwnerLost(
    playerIndex,
    ownerToken
  );

  const player =
    players[playerIndex];

  applyPlayerPreferences(player);

  const mediaSource =
    new MediaSource();

  const url =
    URL.createObjectURL(mediaSource);

  playerObjectUrls[playerIndex] = url;
  player.src = url;
  player.preload = 'auto';
  player.load();

  await waitForEvent(
    mediaSource,
    'sourceopen',
    signal,
    12000
  );

  throwIfPlayerOwnerLost(
    playerIndex,
    ownerToken
  );

  const sourceBuffer =
    mediaSource.addSourceBuffer(
      MSE_MIME
    );

  try {
    sourceBuffer.mode = 'sequence';
  } catch (_) {}

  const session = {
    type: 'progressive',
    file,
    info,
    player,
    playerIndex,
    controller,
    signal,
    mediaSource,
    sourceBuffer,
    url,
    ownerToken,
    loadedChunks: 0,
    completed: false,
    cancelled: false,
    estimatedDuration: 0,
    error: null
  };

  playerStreamSessions[playerIndex] =
    session;

  const initialCount =
    Math.min(
      PROGRESSIVE_INITIAL_CHUNKS,
      info.totalChunks
    );

  for (
    let index = 0;
    index < initialCount;
    index++
  ) {
    throwIfPlayerOwnerLost(
      playerIndex,
      ownerToken
    );

    const bytes =
      await fetchTrackChunkResilient(
        file,
        info,
        index,
        signal
      );

    throwIfPlayerOwnerLost(
      playerIndex,
      ownerToken
    );

    if (index === 0) {
      const estimatedDuration =
        estimateMp3Duration(
          bytes,
          info,
          file.name
        );

      if (estimatedDuration > 0) {
        session.estimatedDuration =
          estimatedDuration;

        try {
          mediaSource.duration =
            estimatedDuration;
        } catch (_) {}
      }
    }

    await appendProgressiveChunk(
      session,
      bytes
    );

    throwIfPlayerOwnerLost(
      playerIndex,
      ownerToken
    );

    session.loadedChunks++;

    if (options.onProgress) {
      options.onProgress(
        session.loadedChunks,
        info.totalChunks,
        info,
        false
      );
    }
  }

  /*
   * Tải phần tiếp theo ngay khi chunk đầu vừa được nối. Playback chỉ cần
   * một vùng đệm rất nhỏ, còn luồng nền tiếp tục bơm dữ liệu song song.
   */
  streamRemainingTrack(
    session,
    initialCount,
    options.onProgress
  );

  await waitForProgressiveReady(
    player,
    signal
  );

  throwIfPlayerOwnerLost(
    playerIndex,
    ownerToken
  );

  if (options.autoplay) {
    try {
      await player.play();
    } catch (_) {
      /*
       * Một số trình duyệt yêu cầu thêm thao tác người dùng. openAudio sẽ
       * gọi play() lần nữa sau khi cập nhật trạng thái điều khiển.
       */
    }
  }

  throwIfPlayerOwnerLost(
    playerIndex,
    ownerToken
  );

  return {
    mode: 'progressive',
    info,
    url,
    session,
    ownerToken
  };
}

async function waitForProgressiveReady(
  player,
  signal
) {
  const startedAt = Date.now();

  while (true) {
    throwIfAborted(signal);

    const bufferedAhead =
      getBufferedAhead(player);

    if (
      player.readyState >= 2 &&
      (
        bufferedAhead >=
          PROGRESSIVE_READY_SECONDS ||
        player.readyState >= 3
      )
    ) {
      return;
    }

    /*
     * Một số TV cập nhật readyState chậm dù SourceBuffer đã có dữ liệu.
     * Chỉ cần thấy một vùng buffered nhỏ là cho phép openAudio thử phát.
     */
    if (
      bufferedAhead > 0.08 &&
      Date.now() - startedAt > 180
    ) {
      return;
    }

    if (
      Date.now() - startedAt >
      PROGRESSIVE_READY_TIMEOUT_MS
    ) {
      return;
    }

    await delay(
      PROGRESSIVE_READY_POLL_MS,
      signal
    );
  }
}

async function prepareTrackPlayer(
  file,
  info,
  playerIndex,
  controller,
  options = {}
) {
  const ownerToken =
    options.ownerToken || 0;

  throwIfPlayerOwnerLost(
    playerIndex,
    ownerToken
  );

  if (canUseProgressiveStreaming(info)) {
    try {
      return await prepareProgressivePlayer(
        file,
        info,
        playerIndex,
        controller,
        options
      );
    } catch (error) {
      if (isAbortError(error)) {
        throw error;
      }

      throwIfPlayerOwnerLost(
        playerIndex,
        ownerToken
      );

      /*
       * Chỉ request còn sở hữu player mới được phép dọn MediaSource.
       * Callback cũ tuyệt đối không được xóa src của lần chọn mới hơn.
       */
      releasePlayer(
        playerIndex,
        true
      );

      showMode(
        'Thiết bị không phát nối tiếp được file này • chuyển sang chế độ tương thích'
      );
    }
  }

  const result =
    await downloadTrackBlob(
      file,
      controller.signal,
      {
        info,
        concurrency:
          options.concurrency ||
          DOWNLOAD_CONCURRENCY,
        onProgress:
          options.onProgress
      }
    );

  throwIfPlayerOwnerLost(
    playerIndex,
    ownerToken
  );

  assignPlayerUrl(
    playerIndex,
    result.url
  );

  const player =
    players[playerIndex];

  applyPlayerPreferences(player);

  await waitForMediaReady(
    player,
    controller.signal
  );

  throwIfPlayerOwnerLost(
    playerIndex,
    ownerToken
  );

  return {
    mode: 'blob',
    info: result.info,
    url: result.url,
    session: null,
    ownerToken
  };
}

function getEffectiveDuration(
  player = activeAudio()
) {
  const index =
    players.indexOf(player);

  if (index >= 0) {
    const session =
      playerStreamSessions[index];

    /*
     * Trong lúc MediaSource đang nối thêm chunk, player.duration có thể
     * thay đổi theo phần đã append. Dùng thời lượng ước lượng ổn định để
     * thanh phát không co giãn hoặc nhảy liên tục.
     */
    if (
      session &&
      session.estimatedDuration > 0
    ) {
      return session.estimatedDuration;
    }
  }

  if (
    Number.isFinite(player.duration) &&
    player.duration > 0
  ) {
    return player.duration;
  }

  return 0;
}

function getBufferedEnd(
  player = activeAudio()
) {
  let bufferedEnd = 0;

  try {
    for (
      let index = 0;
      index < player.buffered.length;
      index++
    ) {
      bufferedEnd = Math.max(
        bufferedEnd,
        player.buffered.end(index)
      );
    }
  } catch (_) {}

  return bufferedEnd;
}

function updateSeekProgressVisual(
  player = activeAudio()
) {
  if (!player || !els.seek) return;

  const duration =
    getEffectiveDuration(player);

  const current =
    Math.max(
      0,
      Number(player.currentTime || 0)
    );

  const playerIndex =
    players.indexOf(player);

  const session =
    playerIndex >= 0
      ? playerStreamSessions[playerIndex]
      : null;

  if (!(duration > 0)) {
    els.seek.style.setProperty(
      '--played-progress',
      '0%'
    );

    els.seek.style.setProperty(
      '--buffered-progress',
      '0%'
    );

    els.playedStatus.textContent =
      'Đã phát 0%';

    els.bufferedStatus.textContent =
      'Đang xác định thời lượng...';

    return;
  }

  const bufferedEnd =
    Math.min(
      duration,
      getBufferedEnd(player)
    );

  const playedPercent =
    Math.max(
      0,
      Math.min(
        100,
        current / duration * 100
      )
    );

  const bufferedPercent =
    Math.max(
      playedPercent,
      Math.min(
        100,
        bufferedEnd / duration * 100
      )
    );

  els.seek.style.setProperty(
    '--played-progress',
    `${playedPercent.toFixed(2)}%`
  );

  els.seek.style.setProperty(
    '--buffered-progress',
    `${bufferedPercent.toFixed(2)}%`
  );

  els.playedStatus.textContent =
    `Đã phát ${Math.round(playedPercent)}%`;

  if (
    session &&
    session.info &&
    session.info.totalChunks > 0
  ) {
    const downloadPercent =
      Math.max(
        0,
        Math.min(
          100,
          session.loadedChunks /
          session.info.totalChunks *
          100
        )
      );

    const bufferedSeconds =
      Math.max(
        0,
        bufferedEnd - current
      );

    els.bufferedStatus.textContent =
      session.completed
        ? 'Đã tải đủ 100%'
        : `Đệm trước ${formatTime(bufferedSeconds)} • tải ${Math.round(downloadPercent)}%`;
  } else if (player.src) {
    els.bufferedStatus.textContent =
      'Đã tải đủ 100%';
  } else {
    els.bufferedStatus.textContent =
      'Chưa có dữ liệu đệm';
  }
}

function waitForMediaReady(
  player,
  signal,
  timeoutMs = 18000
) {
  if (player.readyState >= 3) {
    return Promise.resolve();
  }

  return new Promise((resolve, reject) => {
    const cleanup = () => {
      clearTimeout(timer);

      player.removeEventListener(
        'canplay',
        onReady
      );

      player.removeEventListener(
        'loadedmetadata',
        onMetadata
      );

      player.removeEventListener(
        'error',
        onError
      );

      if (signal) {
        signal.removeEventListener(
          'abort',
          onAbort
        );
      }
    };

    const onReady = () => {
      cleanup();
      resolve();
    };

    const onMetadata = () => {
      if (player.readyState >= 2) {
        cleanup();
        resolve();
      }
    };

    const onError = () => {
      cleanup();
      reject(
        new Error(
          'Trình duyệt không thể chuẩn bị file âm thanh.'
        )
      );
    };

    const onAbort = () => {
      cleanup();
      reject(createAbortError());
    };

    const timer = window.setTimeout(() => {
      cleanup();
      reject(
        new Error(
          'Chuẩn bị file âm thanh quá thời gian chờ.'
        )
      );
    }, timeoutMs);

    player.addEventListener(
      'canplay',
      onReady,
      { once: true }
    );

    player.addEventListener(
      'loadedmetadata',
      onMetadata,
      { once: true }
    );

    player.addEventListener(
      'error',
      onError,
      { once: true }
    );

    if (signal) {
      signal.addEventListener(
        'abort',
        onAbort,
        { once: true }
      );
    }
  });
}

function applyPlayerPreferences(player) {
  player.playbackRate =
    Number(els.speed.value) || 1;
}

function getUserVolume() {
  return Math.max(
    0,
    Math.min(
      1,
      Number(els.volume.value)
    )
  );
}

function syncActiveListSelection() {
  const buttons =
    els.fileList.querySelectorAll(
      '.item[data-file-id]'
    );

  buttons.forEach(button => {
    const active =
      button.dataset.fileId ===
      activeFileId;

    button.classList.toggle(
      'active',
      active
    );

    button.setAttribute(
      'aria-current',
      active ? 'true' : 'false'
    );
  });
}

function updateCurrentTrackUi(
  file,
  info = null
) {
  currentTrack = file;
  activeFileId = file.id;

  activeIndex =
    audioItems.findIndex(
      item => item.id === file.id
    );

  els.trackTitle.textContent =
    file.name;

  if (info) {
    const duration =
      getEffectiveDuration(
        activeAudio()
      );

    els.trackSub.textContent =
      [
        formatBytes(info.size || 0),
        duration > 0
          ? formatTime(duration)
          : '',
        String(info.extension || '')
          .toUpperCase()
      ]
        .filter(Boolean)
        .join(' • ');
  }

  /*
   * Không dựng lại toàn bộ danh sách khi chuyển bài. Việc rebuild DOM
   * trước crossfade từng gây trễ rõ rệt trên TV và danh sách dài.
   */
  syncActiveListSelection();
  updateButtons();
  updateMetadata();
  updateNetworkDiagnostics();
}

async function openAudio(
  file,
  options = {}
) {
  if (!file || !file.id) return;

  const autoplay =
    options.autoplay !== false;

  shouldBePlaying = autoplay;

  /*
   * Chỉ coi bài là đang hoạt động khi file id và player thực tế cùng khớp.
   * Không đổi tiêu đề trước khi player mới đã bắt đầu và player cũ đã tắt.
   */
  if (
    file.id === activeFileId &&
    activeAudio().src &&
    !transitionInProgress
  ) {
    if (autoplay) {
      setPlayerOutputLevel(
        activePlayerIndex,
        getUserVolume()
      );
      await activeAudio().play();
    }

    return;
  }

  /*
   * Nếu đúng bài đã preload thì dùng luôn, nhưng vẫn đi qua quy trình
   * chuyển đổi có xác nhận playback và khóa owner.
   */
  if (
    !transitionInProgress &&
    standbyState.ready &&
    standbyState.track &&
    standbyState.track.id === file.id
  ) {
    const activated =
      await activateStandby(
        file,
        autoplay,
        true,
        true
      );

    if (activated) {
      return;
    }
  }

  const requestToken = ++loadToken;

  if (manualLoadController) {
    try {
      manualLoadController.abort();
    } catch (_) {}
  }

  /*
   * Hủy fade cũ và dọn mọi player không phải player đang được công nhận.
   * Đây là lớp bảo vệ chống hai bài cùng phát sau thao tác chọn liên tiếp.
   */
  cancelTransitionKeepCurrent();
  clearStandby();

  manualLoadController =
    new AbortController();

  const controller =
    manualLoadController;

  const signal =
    controller.signal;

  const hasCurrentAudio =
    Boolean(
      activeAudio().src &&
      !activeAudio().ended
    );

  const oldActiveIndex =
    activePlayerIndex;

  const targetIndex =
    hasCurrentAudio
      ? 1 - oldActiveIndex
      : oldActiveIndex;

  /*
   * Mỗi lần dùng một player đều nhận owner token mới. Callback cũ chỉ
   * được phép dọn player khi token vẫn còn thuộc về nó.
   */
  const targetOwner =
    claimPlayer(targetIndex);

  if (hasCurrentAudio) {
    standbyState = {
      token: standbyState.token + 1,
      track: file,
      info: null,
      ready: false,
      loading: true,
      playerIndex: targetIndex,
      mode: '',
      url: '',
      controller,
      ownerToken: targetOwner
    };

    showMode(
      `Đang lấy phần đầu “${file.name}” • bài hiện tại sẽ dừng ngay khi bài mới phát`
    );
  } else {
    resetTimeDisplay();

    els.trackTitle.textContent =
      file.name;

    els.trackSub.textContent =
      'Đang lấy 256 KB đầu để phát ngay...';

    els.play.disabled = true;
  }

  try {
    setPlayerOutputLevel(
      targetIndex,
      hasCurrentAudio
        ? 0
        : getUserVolume()
    );

    const info =
      await getFileInfoCached(
        file,
        signal
      );

    const prepared =
      await prepareTrackPlayer(
        file,
        info,
        targetIndex,
        controller,
        {
          concurrency:
            hasCurrentAudio
              ? PRELOAD_CONCURRENCY
              : DOWNLOAD_CONCURRENCY,

          ownerToken:
            targetOwner,

          autoplay:
            autoplay &&
            !hasCurrentAudio,

          onProgress:
            (
              completed,
              total,
              fileInfo,
              background
            ) => {
              if (
                requestToken !== loadToken ||
                !isPlayerOwner(
                  targetIndex,
                  targetOwner
                )
              ) {
                return;
              }

              const percent =
                Math.round(
                  completed /
                  total *
                  100
                );

              if (
                targetIndex ===
                activePlayerIndex
              ) {
                updateSeekProgressVisual(
                  players[targetIndex]
                );

                if (background) {
                  setLoading(
                    true,
                    `Đang phát • tải nền ${completed}/${total}`,
                    percent
                  );
                } else {
                  setLoading(
                    true,
                    `Đang chuẩn bị ${file.name} (${completed}/${total})`,
                    percent
                  );
                }
              } else {
                els.mode.hidden = false;
                els.mode.textContent =
                  background
                    ? `Bài mới đã có thể phát • tiếp tục tải nền ${percent}%`
                    : `Chuẩn bị bài mới: ${percent}%`;
              }

              if (
                background &&
                percent >= 100 &&
                targetIndex ===
                  activePlayerIndex
              ) {
                setLoading(false);
                showMode(
                  'Đã tải đủ bài • phát cục bộ ổn định'
                );
              }
            }
        }
      );

    if (
      requestToken !== loadToken ||
      signal.aborted ||
      !isPlayerOwner(
        targetIndex,
        targetOwner
      )
    ) {
      releasePlayerIfOwned(
        targetIndex,
        targetOwner,
        true
      );
      return;
    }

    if (hasCurrentAudio) {
      /*
       * Chỉ cập nhật standby nếu request này vẫn là request mới nhất.
       */
      if (
        standbyState.controller !== controller ||
        standbyState.ownerToken !== targetOwner
      ) {
        releasePlayerIfOwned(
          targetIndex,
          targetOwner,
          true
        );
        return;
      }

      standbyState.info = info;
      standbyState.ready = true;
      standbyState.loading = false;
      standbyState.mode =
        prepared.mode;
      standbyState.url =
        prepared.url;

      setLoading(false);

      const activated =
        await activateStandby(
          file,
          autoplay,
          true,
          true
        );

      if (
        !activated &&
        requestToken === loadToken &&
        !signal.aborted
      ) {
        throw new Error(
          'Bài mới đã tải nhưng chưa thể thay thế bài đang phát.'
        );
      }
    } else {
      const targetPlayer =
        players[targetIndex];

      restoreTrackPosition(
        file,
        targetPlayer
      );

      if (autoplay) {
        if (targetPlayer.paused) {
          await targetPlayer.play();
        }

        await waitForPlaybackStart(
          targetPlayer,
          signal
        );
      }

      if (
        requestToken !== loadToken ||
        signal.aborted ||
        !isPlayerOwner(
          targetIndex,
          targetOwner
        )
      ) {
        releasePlayerIfOwned(
          targetIndex,
          targetOwner,
          true
        );
        return;
      }

      activePlayerIndex =
        targetIndex;

      setPlayerOutputLevel(
        targetIndex,
        autoplay
          ? getUserVolume()
          : 0
      );

      updateCurrentTrackUi(
        file,
        info
      );

      els.play.disabled = false;
      els.seek.disabled = false;

      setLoading(false);

      showMode(
        prepared.mode === 'progressive'
          ? 'Đang phát khi file vẫn tiếp tục tải nền'
          : 'Đã tải đủ file • phát ở chế độ tương thích'
      );

      startPlaybackUiTicker();
      scheduleNextPreload();
    }
  } catch (error) {
    releasePlayerIfOwned(
      targetIndex,
      targetOwner,
      true
    );

    if (
      hasCurrentAudio &&
      oldActiveIndex ===
        activePlayerIndex &&
      activeAudio().src
    ) {
      setPlayerOutputLevel(
        oldActiveIndex,
        getUserVolume()
      );
    }

    if (isAbortError(error)) {
      return;
    }

    if (
      standbyState.controller ===
      controller
    ) {
      standbyState.loading = false;
      standbyState.ready = false;
    }

    setLoading(false);

    els.play.disabled =
      !activeAudio().src;

    showToast(
      error.message,
      true
    );
  } finally {
    if (
      manualLoadController ===
      controller
    ) {
      manualLoadController = null;
    }

    updateNetworkDiagnostics();
  }
}

function scheduleNextPreload() {
  clearTimeout(preloadTimer);

  if (
    !els.autoNext.checked ||
    audioItems.length < 2 ||
    activeIndex < 0
  ) {
    return;
  }

  preloadTimer =
    window.setTimeout(
      () => prepareNextTrack(false),
      NEXT_PRELOAD_DELAY_MS
    );
}

function getRelativeTrack(step) {
  if (
    !audioItems.length ||
    activeIndex < 0
  ) {
    return null;
  }

  const index =
    (
      activeIndex +
      step +
      audioItems.length
    ) % audioItems.length;

  return audioItems[index];
}

async function prepareNextTrack(
  force = false
) {
  if (
    !els.autoNext.checked ||
    transitionInProgress ||
    audioItems.length < 2 ||
    activeIndex < 0
  ) {
    return;
  }

  const nextTrack =
    getRelativeTrack(1);

  if (!nextTrack) return;

  if (
    standbyState.track &&
    standbyState.track.id ===
      nextTrack.id &&
    (
      standbyState.ready ||
      standbyState.loading
    )
  ) {
    return;
  }

  clearStandby();

  const token =
    standbyState.token + 1;

  const controller =
    new AbortController();

  const targetIndex =
    1 - activePlayerIndex;

  const ownerToken =
    claimPlayer(targetIndex);

  setPlayerOutputLevel(
    targetIndex,
    0
  );

  standbyState = {
    token,
    track: nextTrack,
    info: null,
    ready: false,
    loading: true,
    playerIndex: targetIndex,
    mode: '',
    url: '',
    controller,
    ownerToken
  };

  updateNetworkDiagnostics();

  try {
    const info =
      await getFileInfoCached(
        nextTrack,
        controller.signal
      );

    const prepared =
      await prepareTrackPlayer(
        nextTrack,
        info,
        targetIndex,
        controller,
        {
          concurrency:
            force
              ? DOWNLOAD_CONCURRENCY
              : PRELOAD_CONCURRENCY,

          ownerToken,

          onProgress:
            (
              completed,
              total,
              fileInfo,
              background
            ) => {
              if (
                token !==
                  standbyState.token ||
                !isPlayerOwner(
                  targetIndex,
                  ownerToken
                )
              ) {
                return;
              }

              const percent =
                Math.round(
                  completed /
                  total *
                  100
                );

              els.mode.hidden = false;

              els.mode.textContent =
                background
                  ? `Bài kế tiếp có thể phát • đang tải nền ${percent}%`
                  : `Nạp phần đầu bài kế tiếp: ${percent}%`;
            }
        }
      );

    if (
      token !== standbyState.token ||
      controller.signal.aborted ||
      !isPlayerOwner(
        targetIndex,
        ownerToken
      )
    ) {
      releasePlayerIfOwned(
        targetIndex,
        ownerToken,
        true
      );
      return;
    }

    setPlayerOutputLevel(
      targetIndex,
      0
    );

    standbyState.info = info;
    standbyState.url =
      prepared.url;
    standbyState.mode =
      prepared.mode;
    standbyState.ready = true;
    standbyState.loading = false;

    showMode(
      prepared.mode === 'progressive'
        ? `Bài kế tiếp đã có thể phát: ${nextTrack.name}`
        : `Bài kế tiếp đã tải đủ: ${nextTrack.name}`
    );

    updateNetworkDiagnostics();

    const active =
      activeAudio();

    const duration =
      getEffectiveDuration(active);

    if (
      active.ended ||
      (
        duration > 0 &&
        duration -
          active.currentTime <=
          CROSSFADE_TRIGGER_SECONDS
      )
    ) {
      startSeamlessNext();
    }
  } catch (error) {
    releasePlayerIfOwned(
      targetIndex,
      ownerToken,
      true
    );

    if (
      standbyState.token === token &&
      standbyState.controller === controller
    ) {
      standbyState.loading = false;
      standbyState.ready = false;
    }

    if (isAbortError(error)) {
      return;
    }

    showMode(
      'Chưa thể nạp bài kế tiếp • sẽ tự thử lại'
    );

    updateNetworkDiagnostics();
  }
}

async function activateStandby(
  track,
  autoplay = true,
  smooth = true,
  manualSelection = false
) {
  const newIndex =
    standbyState.playerIndex;

  const ownerToken =
    standbyState.ownerToken;

  if (
    transitionInProgress ||
    !standbyState.ready ||
    !standbyState.track ||
    standbyState.track.id !== track.id ||
    newIndex < 0 ||
    newIndex === activePlayerIndex ||
    !isPlayerOwner(
      newIndex,
      ownerToken
    )
  ) {
    return false;
  }

  /*
   * Chụp lại toàn bộ trạng thái. Các callback tải cũ không được phép
   * ghi đè hoặc giải phóng player của một lần chọn mới hơn.
   */
  const pending = {
    token: standbyState.token,
    track: standbyState.track,
    info: standbyState.info,
    playerIndex: newIndex,
    mode: standbyState.mode,
    url: standbyState.url,
    controller: standbyState.controller,
    ownerToken
  };

  transitionInProgress = true;

  const localTransitionToken =
    ++transitionToken;

  const oldIndex =
    activePlayerIndex;

  const oldPlayer =
    players[oldIndex];

  const newPlayer =
    players[newIndex];

  const baseVolume =
    getUserVolume();

  try {
    applyPlayerPreferences(newPlayer);
    newPlayer.currentTime = 0;

    setPlayerOutputLevel(
      newIndex,
      0
    );

    if (autoplay) {
      await newPlayer.play();

      /*
       * play() resolve chưa luôn đồng nghĩa đã có frame âm thanh. Chờ
       * playing/currentTime để không đổi tiêu đề trong khi bài cũ còn kêu.
       */
      await waitForPlaybackStart(
        newPlayer,
        pending.controller
          ? pending.controller.signal
          : undefined
      );
    }

    if (
      localTransitionToken !==
        transitionToken ||
      !isPlayerOwner(
        newIndex,
        ownerToken
      )
    ) {
      throw createAbortError();
    }

    const canCrossfade =
      autoplay &&
      smooth &&
      !oldPlayer.ended &&
      !oldPlayer.paused;

    const fadeDuration =
      canCrossfade
        ? (
            manualSelection
              ? Math.min(
                  MANUAL_SWITCH_FADE_MS,
                  CROSSFADE_MS
                )
              : CROSSFADE_MS
          )
        : 0;

    if (autoplay) {
      const completed =
        await crossfadePlayers(
          oldIndex,
          newIndex,
          fadeDuration,
          baseVolume,
          localTransitionToken
        );

      if (!completed) {
        throw createAbortError();
      }
    } else {
      setPlayerOutputLevel(
        oldIndex,
        0
      );
      setPlayerOutputLevel(
        newIndex,
        0
      );
    }

    if (
      localTransitionToken !==
        transitionToken ||
      !isPlayerOwner(
        newIndex,
        ownerToken
      )
    ) {
      throw createAbortError();
    }

    /*
     * Dừng tuyệt đối player cũ trước, rồi mới công bố bài mới trên UI.
     * Nhờ vậy tên bài, thanh thời gian và âm thanh luôn cùng một nguồn.
     */
    invalidateAndReleasePlayer(
      oldIndex,
      true
    );

    activePlayerIndex = newIndex;
    shouldBePlaying = autoplay;

    setPlayerOutputLevel(
      newIndex,
      autoplay
        ? baseVolume
        : 0
    );

    resetTimeDisplay();

    updateCurrentTrackUi(
      track,
      pending.info
    );

    if (
      standbyState.token ===
        pending.token &&
      standbyState.ownerToken ===
        ownerToken
    ) {
      standbyState = {
        token:
          standbyState.token + 1,
        track: null,
        info: null,
        ready: false,
        loading: false,
        playerIndex: -1,
        mode: '',
        url: '',
        controller: null,
        ownerToken: 0
      };
    }

    els.play.textContent =
      autoplay
        ? '⏸'
        : '▶';

    els.visualizerWrap.classList.toggle(
      'playing',
      autoplay
    );

    setLoading(false);
    startPlaybackUiTicker();
    scheduleNextPreload();
    updateNetworkDiagnostics();

    return true;
  } catch (error) {
    /*
     * Nếu bài mới chưa thực sự phát, giữ nguyên bài cũ và không đổi tên.
     * Player mới chỉ được dọn nếu owner token vẫn còn thuộc lần này.
     */
    if (
      oldIndex === activePlayerIndex &&
      oldPlayer.src &&
      !oldPlayer.ended
    ) {
      setPlayerOutputLevel(
        oldIndex,
        baseVolume
      );
    }

    setPlayerOutputLevel(
      newIndex,
      0
    );

    try {
      newPlayer.pause();
    } catch (_) {}

    releasePlayerIfOwned(
      newIndex,
      ownerToken,
      true
    );

    if (!isAbortError(error)) {
      showToast(
        'Không thể chuyển sang bài đã chọn: ' +
        error.message,
        true
      );
    }

    return false;
  } finally {
    if (
      localTransitionToken ===
      transitionToken
    ) {
      transitionInProgress = false;
    }
  }
}

function crossfadePlayers(
  oldIndex,
  newIndex,
  durationMs,
  baseVolume,
  token
) {
  const oldPlayer =
    players[oldIndex];

  const newPlayer =
    players[newIndex];

  const duration =
    Math.max(0, Number(durationMs) || 0);

  if (
    duration <= 0 ||
    oldPlayer.paused ||
    oldPlayer.ended
  ) {
    setPlayerOutputLevel(
      oldIndex,
      0
    );
    setPlayerOutputLevel(
      newIndex,
      baseVolume
    );
    return Promise.resolve(
      token === transitionToken
    );
  }

  setPlayerOutputLevel(
    oldIndex,
    baseVolume
  );
  setPlayerOutputLevel(
    newIndex,
    0
  );

  /*
   * Ưu tiên ramp trên AudioContext: nó chạy ở audio thread nên không bị
   * kẹt khi requestAnimationFrame chậm hoặc tab/TV giảm tần số vẽ.
   */
  const audioRampStarted =
    rampPlayerOutputLevel(
      oldIndex,
      0,
      duration
    ) &&
    rampPlayerOutputLevel(
      newIndex,
      baseVolume,
      duration
    );

  if (audioRampStarted) {
    return new Promise(resolve => {
      window.setTimeout(
        () => {
          const valid =
            token === transitionToken;

          if (valid) {
            setPlayerOutputLevel(
              oldIndex,
              0
            );
            setPlayerOutputLevel(
              newIndex,
              baseVolume
            );
          }

          resolve(valid);
        },
        duration + 36
      );
    });
  }

  /*
   * Fallback cho thiết bị không có Web Audio. Có failsafe độc lập để
   * callback vẽ bị lỗi cũng không khiến bài cũ phát vô hạn.
   */
  return new Promise(resolve => {
    let settled = false;
    let frameId = 0;

    const startedAt =
      performance.now();

    const finish = valid => {
      if (settled) return;
      settled = true;

      if (frameId) {
        cancelAnimationFrame(frameId);
      }

      clearTimeout(failsafeTimer);

      if (valid) {
        setPlayerOutputLevel(
          oldIndex,
          0
        );
        setPlayerOutputLevel(
          newIndex,
          baseVolume
        );
      }

      resolve(valid);
    };

    const frame = now => {
      if (token !== transitionToken) {
        finish(false);
        return;
      }

      try {
        const progress =
          Math.min(
            1,
            (now - startedAt) /
              duration
          );

        const oldGain =
          Math.cos(
            progress *
            Math.PI /
            2
          );

        const newGain =
          Math.sin(
            progress *
            Math.PI /
            2
          );

        setPlayerOutputLevel(
          oldIndex,
          baseVolume * oldGain
        );

        setPlayerOutputLevel(
          newIndex,
          baseVolume * newGain
        );

        if (progress < 1) {
          frameId =
            requestAnimationFrame(frame);
        } else {
          finish(true);
        }
      } catch (_) {
        finish(
          token === transitionToken
        );
      }
    };

    const failsafeTimer =
      window.setTimeout(
        () => finish(
          token === transitionToken
        ),
        duration +
          CROSSFADE_FAILSAFE_PADDING_MS
      );

    frameId =
      requestAnimationFrame(frame);
  });
}

async function startSeamlessNext() {
  if (
    transitionInProgress ||
    !els.autoNext.checked
  ) {
    return;
  }

  const nextTrack =
    getRelativeTrack(1);

  if (!nextTrack) return;

  if (
    standbyState.ready &&
    standbyState.track &&
    standbyState.track.id ===
      nextTrack.id
  ) {
    await activateStandby(
      nextTrack,
      true,
      true
    );
    return;
  }

  await prepareNextTrack(true);
}

function togglePlay() {
  const player = activeAudio();

  if (!player.src) return;

  if (player.paused) {
    shouldBePlaying = true;

    player.play().catch(error => {
      showToast(error.message, true);
    });

    els.play.textContent = '⏸';
    els.visualizerWrap.classList.add('playing');
    startPlaybackUiTicker();
  } else {
    shouldBePlaying = false;
    player.pause();
    els.play.textContent = '▶';
    els.visualizerWrap.classList.remove('playing');
  }
}

async function playRelative(step) {
  if (!audioItems.length) return;

  const target =
    getRelativeTrack(step);

  if (!target) return;

  if (
    step === 1 &&
    standbyState.ready &&
    standbyState.track &&
    standbyState.track.id ===
      target.id
  ) {
    await activateStandby(
      target,
      true,
      true
    );

    return;
  }

  await openAudio(target);
}

function restorePreferences() {
  const savedVolume =
    localStorage.getItem('audio_volume');

  const savedSpeed =
    localStorage.getItem('audio_speed');

  const savedAutoNext =
    localStorage.getItem(
      'audio_auto_next'
    );

  const savedPreset =
    localStorage.getItem(
      'audio_effect_preset'
    );

  const savedVisualizerMode =
    localStorage.getItem(
      'audio_visualizer_mode'
    );

  if (savedVolume !== null) {
    els.volume.value =
      savedVolume;
  }

  if (savedSpeed !== null) {
    els.speed.value =
      savedSpeed;
  }

  if (savedAutoNext !== null) {
    els.autoNext.checked =
      savedAutoNext === '1';
  }

  players.forEach((player, index) => {
    setPlayerOutputLevel(
      index,
      index === activePlayerIndex
        ? getUserVolume()
        : 0
    );
    applyPlayerPreferences(player);
  });

  setVisualizerMode(
    savedVisualizerMode === 'led'
      ? 'led'
      : 'wave',
    { persist: false, announce: false }
  );

  if (
    savedPreset &&
    EFFECT_PRESETS[savedPreset]
  ) {
    applyEffectPreset(
      savedPreset,
      false
    );
  } else {
    updateEffectUi();
  }
}

function configurePlayers() {
  players.forEach((player, index) => {
    player.preload = 'auto';

    player.addEventListener(
      'loadedmetadata',
      () => {
        if (index === activePlayerIndex) {
          updateMetadata();
        }
      }
    );

    player.addEventListener(
      'durationchange',
      () => {
        if (index === activePlayerIndex) {
          updateMetadata();
        }
      }
    );

    player.addEventListener(
      'timeupdate',
      () => {
        if (index === activePlayerIndex) {
          syncPlaybackUi();
        }
      }
    );

    player.addEventListener(
      'play',
      () => {
        if (index === activePlayerIndex) {
          shouldBePlaying = true;
          els.play.textContent = '⏸';
          els.visualizerWrap.classList.add('playing');
          startPlaybackUiTicker();
        }
      }
    );

    player.addEventListener(
      'pause',
      () => {
        if (
          index === activePlayerIndex &&
          !transitionInProgress
        ) {
          els.play.textContent = '▶';
          els.visualizerWrap.classList.remove('playing');
        }
      }
    );

    player.addEventListener(
      'ended',
      () => {
        if (
          index !== activePlayerIndex ||
          transitionInProgress
        ) {
          return;
        }

        if (els.autoNext.checked) {
          startSeamlessNext();
        } else {
          shouldBePlaying = false;
          els.play.textContent = '▶';
          els.visualizerWrap.classList.remove('playing');
        }
      }
    );

    player.addEventListener(
      'error',
      () => {
        if (
          index === activePlayerIndex &&
          player.error
        ) {
          showToast(
            'Không thể giải mã file âm thanh.',
            true
          );
        }
      }
    );
  });
}

function syncPlaybackUi() {
  const player = activeAudio();

  if (!player) return;

  const current =
    Number(player.currentTime || 0);

  const duration =
    getEffectiveDuration(player);

  els.current.textContent =
    formatTime(current);

  if (duration > 0) {
    els.duration.textContent =
      formatTime(duration);

    els.seek.max = duration;
    els.seek.value = Math.min(
      current,
      duration
    );

    updateSeekProgressVisual(player);

    monitorSeamlessTransition();
  } else {
    updateSeekProgressVisual(player);
  }

  savePosition();
}

function updateMetadata() {
  const player = activeAudio();

  const duration =
    getEffectiveDuration(player);

  if (duration > 0) {
    els.duration.textContent =
      formatTime(duration);

    els.seek.max =
      duration;

    els.seek.disabled = false;
  }

  updateSeekProgressVisual(player);
  applyPlayerPreferences(player);
}

function monitorSeamlessTransition() {
  if (
    !els.autoNext.checked ||
    transitionInProgress ||
    audioItems.length < 2 ||
    activeIndex < 0
  ) {
    return;
  }

  const player =
    activeAudio();

  if (
    !player ||
    !player.src ||
    player.paused ||
    player.ended
  ) {
    return;
  }

  const duration =
    getEffectiveDuration(player);

  if (!(duration > 0)) {
    return;
  }

  const remaining =
    duration -
    Number(player.currentTime || 0);

  if (
    remaining <=
      NEXT_PRELOAD_URGENT_SECONDS &&
    !standbyState.ready &&
    !standbyState.loading
  ) {
    prepareNextTrack(true);
  }

  if (
    remaining <=
      CROSSFADE_TRIGGER_SECONDS &&
    standbyState.ready
  ) {
    startSeamlessNext();
  }
}

function startTransitionMonitor() {
  if (transitionMonitorTimer) {
    return;
  }

  transitionMonitorTimer =
    window.setInterval(
      monitorSeamlessTransition,
      TRANSITION_MONITOR_INTERVAL_MS
    );
}

function stopTransitionMonitor() {
  if (!transitionMonitorTimer) {
    return;
  }

  clearInterval(
    transitionMonitorTimer
  );

  transitionMonitorTimer = 0;
}

function startPlaybackUiTicker() {
  startTransitionMonitor();

  if (playbackUiTimer) return;

  playbackUiTimer =
    window.setInterval(
      syncPlaybackUi,
      PLAYBACK_UI_INTERVAL_MS
    );
}

function stopPlaybackUiTicker() {
  stopTransitionMonitor();

  if (!playbackUiTimer) return;

  clearInterval(playbackUiTimer);
  playbackUiTimer = null;
}

function savePosition() {
  if (
    !activeFileId ||
    !activeAudio().src
  ) {
    return;
  }

  const second =
    Math.floor(
      activeAudio().currentTime || 0
    );

  if (
    second === lastSavedSecond ||
    second % 5 !== 0
  ) {
    return;
  }

  lastSavedSecond = second;

  localStorage.setItem(
    `audio_position_${activeFileId}`,
    String(second)
  );
}

function restoreTrackPosition(
  file,
  player
) {
  const saved =
    Number(
      localStorage.getItem(
        `audio_position_${file.id}`
      ) || 0
    );

  const duration =
    getEffectiveDuration(player);

  if (
    saved > 0 &&
    duration > 0 &&
    saved < duration - 8
  ) {
    try {
      player.currentTime = saved;
    } catch (_) {}
  }
}

function clearStandby() {
  clearTimeout(preloadTimer);
  preloadTimer = 0;

  const index =
    standbyState.playerIndex;

  const ownerToken =
    standbyState.ownerToken;

  standbyState.token++;

  if (standbyState.controller) {
    try {
      standbyState.controller.abort();
    } catch (_) {}
  }

  if (
    index >= 0 &&
    index !== activePlayerIndex
  ) {
    if (ownerToken) {
      releasePlayerIfOwned(
        index,
        ownerToken,
        true
      );
    } else {
      invalidateAndReleasePlayer(
        index,
        true
      );
    }
  }

  standbyState = {
    token: standbyState.token,
    track: null,
    info: null,
    ready: false,
    loading: false,
    playerIndex: -1,
    mode: '',
    url: '',
    controller: null,
    ownerToken: 0
  };

  updateNetworkDiagnostics();
}

function cancelActiveSession() {
  ++loadToken;
  ++transitionToken;

  if (manualLoadController) {
    try {
      manualLoadController.abort();
    } catch (_) {}

    manualLoadController = null;
  }

  transitionInProgress = false;

  invalidateAndReleasePlayer(
    0,
    true
  );
  invalidateAndReleasePlayer(
    1,
    true
  );

  activeFileId = '';
  activeIndex = -1;
  currentTrack = null;
}

function updateButtons() {
  const enabled =
    audioItems.length > 0;

  els.prev.disabled = !enabled;
  els.next.disabled = !enabled;
}

function cleanupEverything() {
  savePosition();
  stopPlaybackUiTicker();
  stopStreamWatchdog();
  stopConnectionDiagnostics();
  cancelDiagnosticCandidate();
  stopVisualizer();
  clearStandby();
  cancelActiveSession();

  if (audioContext) {
    try {
      audioContext.close();
    } catch (_) {}
  }
}

</script>
</body>
</html>
