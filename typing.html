<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thử Tài Gõ Phím V2 - Tinh Gọn</title>
<style>
  :root { --primary:#c62828; --accent:#1565c0; --success:#2e7d32; --bg:#f4f7f6; --text:#263238; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  button, input, select, textarea { font:inherit; }
  button { cursor:pointer; }
  .hidden { display:none !important; }
  .app { width:min(1100px, 96%); margin:18px auto; }
  .header { text-align:center; margin-bottom:16px; }
  .header h1 { margin:0; color:var(--primary); font-size:clamp(1.8rem,4vw,2.5rem); }
  .grid { display:grid; grid-template-columns:minmax(0, 2fr) minmax(280px, 1fr); gap:18px; align-items:start; }
  .card { background:#fff; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,.08); padding:20px; }
  .section-title { margin:0 0 14px; color:var(--primary); }
  .form-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .field { display:flex; flex-direction:column; gap:4px; text-align:left; }
  .field label { font-weight:700; font-size:.9rem; }
  .field input { width:100%; padding:10px; border:1px solid #b0bec5; border-radius:6px; }
  .mode-picker { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .mode-btn { border:2px solid #cfd8dc; border-radius:8px; padding:10px; background:#fafafa; font-weight:700; }
  .mode-btn.active { border-color:var(--accent); background:#e3f2fd; color:#0d47a1; }
  .btn { border:none; border-radius:6px; padding:10px 16px; color:#fff; background:var(--primary); font-weight:700; }
  .btn.success { background:var(--success); }
  .btn.secondary { background:#546e7a; }
  .btn.warning { background:#ef6c00; }
  .student-bar { display:flex; justify-content:space-between; padding:8px 12px; border-radius:6px; background:#e3f2fd; margin-bottom:12px; font-weight:700; }
  .lesson-title { font-weight:800; color:#5d4037; margin-bottom:8px; }
  .poem { min-height:180px; max-height:220px; overflow-y:auto; padding:14px; border-left:5px solid #ffa000; border-radius:6px; background:#fff8e1; white-space:pre-wrap; user-select:none; font-family:"Courier New",monospace; font-size:1.1rem; line-height:1.7; scroll-behavior:smooth; }
  .char-correct { color:#1b5e20; background:#c8e6c9; }
  .char-incorrect { color:#b71c1c; background:#ffcdd2; }
  .char-current { border-bottom:3px solid #1976d2; background:#bbdefb; }
  textarea { width:100%; height:130px; resize:none; margin-top:12px; padding:10px; border:2px solid #cfd8dc; border-radius:6px; line-height:1.5; }
  .stats { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:12px; }
  .stat { background:#f5f5f5; padding:8px; border-radius:6px; text-align:center; font-size:.8rem; }
  .stat strong { display:block; font-size:1rem; margin-top:2px; }
  .leaderboard-list { list-style:none; padding:0; margin:0; }
  .leaderboard-item { display:grid; grid-template-columns:35px 1fr auto; gap:8px; padding:8px; border-bottom:1px solid #eceff1; font-size:.9rem; }
  .leaderboard-item:first-child { background:#ffebee; color:#b71c1c; font-weight:800; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal-card { width:min(420px,95%); background:#fff; border-radius:12px; padding:20px; text-align:center; }
  @media (max-width:800px) { .grid { grid-template-columns:1fr; } .form-grid, .stats { grid-template-columns:1fr 1fr; } }
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="app">
  <header class="header">
    <h1>Thử Tài Gõ Phím</h1>
    <p>Luyện gõ thơ Tố Hữu · Đo tốc độ & độ chính xác</p>
  </header>

  <div class="grid">
    <main class="card">
      <section id="setup-screen">
        <h2 class="section-title">Thông tin học sinh</h2>
        <div class="form-grid">
          <div class="field"><label>Lớp</label><input id="class-input" placeholder="Ví dụ: 7.1"></div>
          <div class="field"><label>STT</label><input id="student-no-input" type="number" placeholder="Ví dụ: 12"></div>
          <div class="field" style="grid-column:1/-1"><label>Họ và tên</label><input id="player-name-input" placeholder="Ví dụ: Nguyễn Văn A"></div>
        </div>
        <div class="mode-picker">
          <button class="mode-btn active" data-mode="practice" type="button">Luyện tập<br><small>Đổi bài tự do</small></button>
          <button class="mode-btn" data-mode="challenge" type="button">Thử thách<br><small>Lưu Bảng Xếp Hạng</small></button>
        </div>
        <div style="margin-top:16px"><button class="btn success" id="btn-start">Bắt đầu</button></div>
      </section>

      <section id="game-screen" class="hidden">
        <div class="student-bar"><span id="student-display"></span><span id="mode-display"></span></div>
        <div class="lesson-title" id="lesson-title"></div>
        <div class="poem" id="poem-display"></div>
        <textarea id="input-field" placeholder="Gõ chính xác bài thơ phía trên..." disabled></textarea>
        <div class="stats">
          <div class="stat">Thời gian<strong><span id="timer">0.0</span>s</strong></div>
          <div class="stat">Raw WPM<strong id="raw-wpm">0</strong></div>
          <div class="stat">Net WPM<strong id="net-wpm">0</strong></div>
          <div class="stat">Chính xác<strong><span id="accuracy">100</span>%</strong></div>
          <div class="stat">Lỗi lỗi<strong id="error-count">0</strong></div>
        </div>
        <div style="margin-top:14px; display:flex; gap:10px;">
          <button class="btn warning" id="btn-next">Đổi bài khác 🎲</button>
          <button class="btn secondary" id="btn-exit">Đổi người chơi</button>
        </div>
      </section>
    </main>

    <aside class="card">
      <h2 class="section-title">🏆 Bảng Xếp Hạng</h2>
      <ol class="leaderboard-list" id="leaderboard"></ol>
    </aside>
  </div>
</div>

<div class="modal hidden" id="result-modal">
  <div class="modal-card">
    <h2>Kết quả lượt chơi</h2>
    <h1 style="color:var(--primary); margin:10px 0;"><span id="res-wpm">0</span> WPM</h1>
    <p>Chính xác: <strong><span id="res-acc">0</span>%</strong> | Lỗi: <strong><span id="res-err">0</span></strong> | Thời gian: <strong><span id="res-time">0</span>s</strong></p>
    <p id="res-status" style="font-size:.85rem; color:#666;"></p>
    <div style="margin-top:15px; display:flex; justify-content:center; gap:10px;">
      <button class="btn success" id="btn-again">Chơi tiếp</button>
      <button class="btn secondary" id="btn-close">Đóng</button>
    </div>
  </div>
</div>

<script>
// --- FIREBASE CONFIG ---
const firebaseConfig = {
  apiKey: "AIzaSyDmzXo6VGoXP6zAkJ_kVDdIFKC-i2uOW7o",
  authDomain: "luyen-go.firebaseapp.com",
  databaseURL: "https://luyen-go-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "luyen-go",
  storageBucket: "luyen-go.firebasestorage.app",
  messagingSenderId: "79498233127",
  appId: "1:79498233127:web:a6c2e2bab71ba737ca9502"
};
firebase.initializeApp(firebaseConfig);
const database = firebase.database();
const scoresRef = database.ref('typing_best_scores_v2');

// --- DỮ LIỆU THƠ TỐ HỮU (GIỮ NGUYÊN VĂN BẢN MẪU) ---
const lessons = [
  { id:'tu-ay', title:'Từ ấy', text: `Từ ấy trong tôi bừng nắng hạ\nMặt trời chân lý chói qua tim\nHồn tôi là một vườn hoa lá\nRất đậm hương và rộn tiếng chim\n\nTôi buộc lòng tôi với mọi người\nĐể tình trang trải với muôn nơi\nĐể hồn tôi với bao hồn khổ\nGần gũi nhau thêm mạnh khối đời\n\nTôi đã là con của vạn nhà\nLà em của vạn kiếp phôi pha\nLà anh của vạn đầu em nhỏ\nKhông áo cơm, cù bất cù bơ...\n        Tháng 7-1938 Máu lửa` },
  { id:'luom', title:'Lượm', text: `Ngày Huế đổ máu\nChú Hà Nội về\nTình cờ chú cháu\nGặp nhau Hàng Bè.\n\nCháu bé loắt choắt\nCái xắc xinh xinh\nCái chân thoăn thoắt\nCái đầu nghênh nghênh\n\nCa-lô đội lệch\nMồm huýt sáo vang\nNhư con chim chích\nNhảy trên đường vàng…\n\nCháu đi liên lạc\nVui lắm chú à\nỞ đồn Mang Cá\nThích hơn ở nhà !\n\nCháu cười híp mí,\nMá đỏ bồ quân\n- Thôi, chào đồng chí !\nCháu đi xa dần…\n\nCháu đi đường cháu\nChú lên đường ra\nĐến nay tháng sáu\nChợt nghe tin nhà.\n\nRa thế\nLượm ơi !` },
  { id:'viet-bac', title:'Việt Bắc', text: `Mình về mình có nhớ ta\nMười lăm năm ấy thiết tha mặn nồng\nMình về mình có nhớ không\nNhìn cây nhớ núi, nhìn sông nhớ nguồn?\n\nTiếng ai tha thiết bên cồn\nBâng khuâng trong dạ, bồn chồn bước đi\nÁo chàm đưa buổi phân ly\nCầm tay nhau biết nói gì hôm nay...\n\n- Mình đi, có nhớ những ngày\nMưa nguồn suối lũ, những mây cùng mù?\nMình về, có nhớ chiến khu\nMiếng cơm chấm muối, mối thù nặng vai?\nMình về, rừng núi nhớ ai\nTrám bùi để rụng, măng mai để già.\nMình đi, có nhớ những nhà\nHắt hiu lau xám, đậm đà lòng son\nMình về, còn nhớ núi non\nNhớ khi kháng Nhật, thuở còn Việt Minh\nMình đi, mình có nhớ mình\nTân Trào, Hồng Thái, mái đình cây đa?\n\n- Ta với mình, mình với ta\nLòng ta sau trước mặn mà đinh ninh\nMình đi, mình lại nhớ mình\nNguồn bao nhiêu nước nghĩa tình bấy nhiêu...` },
  { id:'truyen-co', title:'Truyện cổ nước mình', text: `Tôi yêu truyện cổ nước tôi\nVừa nhân hậu lại tuyệt vời sâu xa\nThương người rồi mới thương ta\nYêu nhau dù mấy cách xa cũng tìm\nỞ hiền thì lại gặp hiền\nNgười ngay thì gặp người tiên độ trì\nMang theo truyện cổ tôi đi\nNghe trong cuộc sống thầm thì tiếng xưa\nVàng cơn nắng, trắng cơn mưa\nCon sông chảy có rặng dừa nghiêng soi\nĐời cha ông với đời tôi\nNhư con sông với chân trời đã xa\nChỉ còn truyện cổ thiết tha\nCho tôi nhận mặt ông cha của mình\nRất công bằng, rất thông minh\nVừa độ lượng lại đa tình, đa mang.\nThị thơm thì giấu người thơm\nChăm làm thì được áo cơm cửa nhà\nĐẽo cày theo ý người ta\nSẽ thành khúc gỗ chẳng ra việc gì\n\nTôi nghe truyện cổ thầm thì\nLời cha ông dạy cũng vì đời sau.\nĐậm đà cái tích trầu cau\nMiếng trầu đỏ thắm nặng sâu tình người.\nSẽ đi qua cuộc đời tôi\nBấy nhiêu thời nữa chuyển dời xa xôi.\nNhưng bao truyện cổ trên đời\nVẫn luôn mới mẻ rạng ngời lương tâm.` }
];

// --- TRẠNG THÁI GAME ---
let state = { mode:'practice', student:{}, currentLesson:{}, started:false, completed:false, startTime:0, totalTyped:0, errors:0, interval:null };

const els = {
  setup: document.getElementById('setup-screen'),
  game: document.getElementById('game-screen'),
  classIn: document.getElementById('class-input'),
  noIn: document.getElementById('student-no-input'),
  nameIn: document.getElementById('player-name-input'),
  btnStart: document.getElementById('btn-start'),
  poem: document.getElementById('poem-display'),
  input: document.getElementById('input-field'),
  timer: document.getElementById('timer'),
  rawWpm: document.getElementById('raw-wpm'),
  netWpm: document.getElementById('net-wpm'),
  acc: document.getElementById('accuracy'),
  err: document.getElementById('error-count'),
  leaderboard: document.getElementById('leaderboard')
};

// Mode switch
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.mode = btn.dataset.mode;
  });
});

els.btnStart.addEventListener('click', () => {
  if(!els.classIn.value || !els.noIn.value || !els.nameIn.value.trim()){ alert('Vui lòng nhập đủ thông tin!'); return; }
  state.student = { class: els.classIn.value.trim(), no: els.noIn.value, name: els.nameIn.value.trim() };
  document.getElementById('student-display').innerText = `${state.student.class} - STT ${state.student.no} - ${state.student.name}`;
  document.getElementById('mode-display').innerText = state.mode === 'challenge' ? 'Thử thách' : 'Luyện tập';
  document.getElementById('btn-next').classList.toggle('hidden', state.mode === 'challenge');
  els.setup.classList.add('hidden'); els.game.classList.remove('hidden');
  loadLesson();
});

function loadLesson() {
  clearInterval(state.interval);
  state.started = state.completed = false;
  state.totalTyped = state.errors = 0;
  els.input.value = ''; els.input.disabled = false;
  els.timer.innerText = "0.0"; els.rawWpm.innerText = "0"; els.netWpm.innerText = "0"; els.acc.innerText = "100"; els.err.innerText = "0";
  
  state.currentLesson = lessons[Math.floor(Math.random() * lessons.length)];
  document.getElementById('lesson-title').innerText = `Bài: ${state.currentLesson.title}`;
  els.poem.innerHTML = state.currentLesson.text.split('').map((char, i) => `<span class="${i===0?'char-current':''}">${char}</span>`).join('');
  els.input.focus();
}

els.input.addEventListener('input', () => {
  if (state.completed) return;
  if (!state.started && els.input.value.length > 0) {
    state.started = true;
    state.startTime = Date.now();
    state.interval = setInterval(updateStats, 100);
  }

  const typed = els.input.value;
  const target = state.currentLesson.text;
  const spans = els.poem.querySelectorAll('span');
  
  let correct = 0, errors = 0;
  spans.forEach((span, i) => {
    span.className = '';
    if (i < typed.length) {
      if (typed[i] === target[i]) { span.classList.add('char-correct'); correct++; }
      else { span.classList.add('char-incorrect'); errors++; }
    } else if (i === typed.length) {
      span.classList.add('char-current');
      span.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });

  state.totalTyped = typed.length;
  state.errors = errors;
  updateStats();

  if (typed === target) {
    state.completed = true;
    clearInterval(state.interval);
    els.input.disabled = true;
    finishGame();
  }
});

function updateStats() {
  const elapsed = state.started ? Math.max((Date.now() - state.startTime) / 1000, 0.1) : 0;
  const minutes = elapsed / 60;
  const rawWpm = minutes > 0 ? Math.round((state.totalTyped / 5) / minutes) : 0;
  const netWpm = minutes > 0 ? Math.max(0, Math.round(rawWpm - (state.errors / minutes))) : 0;
  const accuracy = state.totalTyped > 0 ? Math.round(((state.totalTyped - state.errors) / state.totalTyped) * 100) : 100;

  els.timer.innerText = elapsed.toFixed(1);
  els.rawWpm.innerText = rawWpm;
  els.netWpm.innerText = netWpm;
  els.acc.innerText = accuracy;
  els.err.innerText = state.errors;

  return { elapsed, netWpm, accuracy };
}

function finishGame() {
  const stats = updateStats();
  document.getElementById('res-wpm').innerText = stats.netWpm;
  document.getElementById('res-acc').innerText = stats.accuracy;
  document.getElementById('res-err').innerText = state.errors;
  document.getElementById('res-time').innerText = stats.elapsed.toFixed(1);
  
  const statusEl = document.getElementById('res-status');
  if (state.mode === 'challenge') {
    if (stats.accuracy >= 85) {
      scoresRef.child(`${state.student.class}_${state.student.no}`).set({
        name: state.student.name, class: state.student.class, no: state.student.no,
        netWpm: stats.netWpm, accuracy: stats.accuracy, time: stats.elapsed
      });
      statusEl.innerText = "✅ Thành tích đã được cập nhật lên Bảng Xếp Hạng!";
    } else { statusEl.innerText = "⚠️ Độ chính xác dưới 85%, không lưu Bảng Xếp Hạng."; }
  } else { statusEl.innerText = "Chế độ Luyện tập (Không lưu BXH)."; }
  
  document.getElementById('result-modal').classList.remove('hidden');
}

// Bảng xếp hạng Realtime
scoresRef.orderByChild('netWpm').limitToLast(10).on('value', snapshot => {
  const list = [];
  snapshot.forEach(child => list.push(child.val()));
  list.sort((a,b) => b.netWpm - a.netWpm);
  els.leaderboard.innerHTML = list.length === 0 ? '<li style="padding:10px; color:#888;">Chưa có dữ liệu</li>' :
    list.map((item, i) => `<li class="leaderboard-item"><span>#${i+1}</span><span>${item.name}<br><small style="color:#666">${item.class} - STT ${item.no}</small></span><span><strong>${item.netWpm} WPM</strong><br><small style="color:#666">${item.accuracy}%</small></span></li>`).join('');
});

document.getElementById('btn-next').addEventListener('click', loadLesson);
document.getElementById('btn-exit').addEventListener('click', () => { els.game.classList.add('hidden'); els.setup.classList.remove('hidden'); });
document.getElementById('btn-again').addEventListener('click', () => { document.getElementById('result-modal').classList.add('hidden'); loadLesson(); });
document.getElementById('btn-close').addEventListener('click', () => document.getElementById('result-modal').classList.add('hidden'));
</script>
</body>
</html>
