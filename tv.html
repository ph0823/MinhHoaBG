const CONTROLS_IDLE_MS=5000;

// CÂN BẰNG ÂM LƯỢNG GIỮA CÁC KÊNH
// Dùng headroom 78% để còn khoảng nâng tương đối cho các kênh phát nhỏ.
// Không dùng Web Audio/GainNode vì nhiều nguồn HLS/radio ngoài không cho CORS trên TV/webOS.
const VOLUME_MASTER=0.78;
const VOLUME_TRIM_MIN=0.55;
const VOLUME_TRIM_MAX=1.28;
const VOLUME_TRIM_STEP=0.05;
let applyingNormalizedVolume=false;

function volumeTrimKey(index){
  const ch=channels[index];
  return 'tv.volumeTrim.'+(ch&&ch.name?ch.name:index);
}
function getChannelVolumeTrim(index){
  const n=parseFloat(localStorage.getItem(volumeTrimKey(index)));
  return Number.isFinite(n)?Math.max(VOLUME_TRIM_MIN,Math.min(VOLUME_TRIM_MAX,n)):1;
}
function setChannelVolumeTrim(index,value){
  const trim=Math.max(VOLUME_TRIM_MIN,Math.min(VOLUME_TRIM_MAX,value));
  localStorage.setItem(volumeTrimKey(index),trim.toFixed(2));
  return trim;
}
function applyNormalizedVolume(index=currentIndex){
  const trim=getChannelVolumeTrim(index);
  const target=Math.max(0,Math.min(1,VOLUME_MASTER*trim));
  applyingNormalizedVolume=true;
  try{video.volume=target}catch(_){ }
  applyingNormalizedVolume=false;
  return {trim,target};
}
function adjustChannelVolumeTrim(delta){
  const oldTrim=getChannelVolumeTrim(currentIndex);
  const trim=setChannelVolumeTrim(currentIndex,oldTrim+delta);
  const info=applyNormalizedVolume(currentIndex);
  const pct=Math.round(info.target*100);
  setStatus('Âm lượng '+channels[currentIndex].name+': '+pct+'%',false,1400);
  console.info('[Volume balance]',channels[currentIndex].name,'trim=',trim.toFixed(2),'output=',pct+'%');
}
function resetChannelVolumeTrim(){
  localStorage.removeItem(volumeTrimKey(currentIndex));
  const info=applyNormalizedVolume(currentIndex);
  setStatus('Đã đặt lại âm lượng '+channels[currentIndex].name,false,1400);
  console.info('[Volume balance] reset',channels[currentIndex].name,'output=',Math.round(info.target*100)+'%');
}

// Sóng radio mô phỏng: mỗi cột có nhịp và biên độ riêng để tạo cảm giác âm thanh sống động.
// Không dùng Web Audio Analyser để tránh lỗi CORS với các luồng radio bên ngoài và giảm tải cho TV/webOS.
for(let i=0;i<30;i++){
  const b=document.createElement('i');
  b.className='bar';
  const center=1-Math.abs(i-14.5)/14.5;
  const duration=.48+Math.random()*.72;
  const delay=-(Math.random()*1.4);
  const base=.55+center*.65+Math.random()*.28;
  b.style.animationDuration=duration.toFixed(2)+'s';
  b.style.animationDelay=delay.toFixed(2)+'s';
  b.style.height=(70+base*72).toFixed(0)+'px';
  visualizer.appendChild(b);
}

function showChannelInfo(){}
function setStatus(text,loading=false,autoHide=0){clearTimeout(statusTimer);statusEl.innerHTML=(loading?'<span class="spinner"></span>':'')+text;statusEl.classList.toggle('show',!!text);if(text)showChannelInfo(loading?0:Math.max(autoHide,1800));if(autoHide)statusTimer=setTimeout(()=>{statusEl.classList.remove('show');if(!loading)app.classList.remove('hud-visible')},autoHide)}
function centerActiveCard(card){
  if(!card)return;
  // Trên TV không dùng scrollIntoView vì một số webOS sẽ cuộn cả viewport,
  // làm hình bị đẩy lên và lộ dải trống ở đáy màn hình.
  if(isWebOS){
    const target=card.offsetLeft-(playlist.clientWidth-card.offsetWidth)/2;
    playlist.scrollLeft=Math.max(0,target);
  }else if(card.scrollIntoView){
    card.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  }
}
function lockTvViewport(){
  if(!isWebOS)return;
  // Đưa viewport về đúng gốc mà không làm mất khả năng mở thanh ứng dụng bằng phím ↓.
  try{window.scrollTo(0,0)}catch(_){ }
  document.documentElement.scrollTop=0;
  document.body.scrollTop=0;
}
function setMenu(open,focusActive=false){if(open&&isWebOS&&app.classList.contains('apps-open')){app.classList.remove('apps-open');tvApps.setAttribute('aria-hidden','true')}app.classList.toggle('menu-open',open);menu.setAttribute('aria-hidden',String(!open));$('#menuBtn').setAttribute('aria-expanded',String(open));$('#mobileMenu').setAttribute('aria-expanded',String(open));$('#mobileMenu').textContent=open?'✕ Đóng':'☰ Kênh';if(open&&focusActive){const card=playlist.children[currentIndex];if(card){if(card.focus){try{card.focus({preventScroll:true})}catch(_){card.focus()}}centerActiveCard(card)}}else if(!open){if(video.focus){try{video.focus({preventScroll:true})}catch(_){video.focus()}}}if(isWebOS){lockTvViewport();requestAnimationFrame(lockTvViewport);setTimeout(lockTvViewport,80);app.classList.remove('controls-idle');if(open)clearTimeout(controlsTimer);else scheduleQuickControlsHide()}}
function setApps(open,focusFirst=false){
  if(!isWebOS)return;
  lockTvViewport();
  if(open)setMenu(false);
  app.classList.toggle('apps-open',open);
  tvApps.setAttribute('aria-hidden',String(!open));
  if(open){
    clearTimeout(controlsTimer);
    app.classList.remove('controls-idle');
    if(focusFirst){const first=tvApps.querySelector('[data-tvapp]');if(first)first.focus({preventScroll:true})}
  }else{
    video.focus({preventScroll:true});
    scheduleQuickControlsHide();
  }
}
function moveTvApp(step){
  const items=[...tvApps.querySelectorAll('[data-tvapp]')];
  if(!items.length)return;
  let i=items.indexOf(document.activeElement);
  if(i<0)i=0;
  items[(i+step+items.length)%items.length].focus({preventScroll:true});
}
function showQuickControls(){
  if(!isWebOS)return;
  clearTimeout(controlsTimer);
  app.classList.remove('controls-idle');
  // Khi menu đang mở, giữ nút điều khiển hiển thị để tránh gây rối khi thao tác.
  if(app.classList.contains('menu-open'))return;
  controlsTimer=setTimeout(()=>app.classList.add('controls-idle'),CONTROLS_IDLE_MS);
}
function scheduleQuickControlsHide(){
  if(!isWebOS)return;
  clearTimeout(controlsTimer);
  if(app.classList.contains('menu-open')){app.classList.remove('controls-idle');return;}
  controlsTimer=setTimeout(()=>app.classList.add('controls-idle'),CONTROLS_IDLE_MS);
}
function updateRecall(){const enabled=previousIndex!==null;recallButtons.forEach(b=>b.disabled=!enabled);if(enabled){const name=channels[previousIndex].name;recallButtons.forEach(b=>b.title='Quay lại '+name)}}
function updateUI(){const ch=channels[currentIndex];currentName.textContent=ch.name;currentType.textContent=ch.type==='radio'?'Phát thanh trực tuyến':'Truyền hình trực tiếp';visualizer.style.display=ch.type==='radio'?'flex':'none';visualizer.classList.toggle('playing',ch.type==='radio'&&!video.paused);[...playlist.children].forEach((el,i)=>{el.classList.toggle('active',i===currentIndex);el.setAttribute('aria-selected',String(i===currentIndex))});localStorage.setItem('tv.lastChannel',currentIndex)}
function updateMuteUI(){const muted=video.muted;muteBtn.textContent=muted?'🔇':'🔊';muteBtn.title=muted?'Bật tiếng':'Tắt tiếng';muteBtn.setAttribute('aria-label',muteBtn.title);muteActionBtn.textContent=muted?'🔇 Bật tiếng':'🔊 Tắt tiếng'}
function toggleMute(){video.muted=!video.muted;updateMuteUI();setStatus(video.muted?'Đã tắt tiếng':'Đã bật tiếng',false,1200)}
function showStartPlayback(label){
  startPlayback.textContent=label||'▶ Nhấn OK hoặc chạm để phát';
  startPlayback.classList.add('show');
  focusPlayPrompt();
}
function hideStartPlayback(){startPlayback.classList.remove('show');}
function destroyStream(){
  // Vô hiệu hóa các callback cũ; bộ đếm phiên nằm trong loadChannel.
  if(hls){try{hls.destroy()}catch(e){console.warn('[TV Player] hls.destroy',e)}hls=null}
  try{video.pause();video.removeAttribute('src');video.load()}catch(e){console.warn('[TV Player] reset media',e)}
}
function confirmPlayback(){
  playbackConfirmed=true;autoplayBlocked=false;startupRetries=0;
  clearStartupTimers();hideStartPlayback();setStatus('',false);
  if(document.activeElement===startPlayback){try{video.focus({preventScroll:true})}catch(_){video.focus()}}
  mediaLog('playing confirmed');
}
function armStartupWatchdog(token){
  clearTimeout(startupWatchdog);
  startupWatchdog=setTimeout(function(){
    if(token!==loadToken||!playWanted||playbackConfirmed||autoplayBlocked)return;
    mediaLog('startup timeout', 'attempt='+startupRetries);
    if(startupRetries<MAX_STARTUP_RETRIES){
      startupRetries++;
      setStatus('Đang thử kết nối lại kênh…',true);
      loadChannel(currentIndex,{remember:false,force:true,recovery:true});
    }else{
      setStatus('Chưa phát được '+channels[currentIndex].name,false,3000);
      showStartPlayback('▶ Thử phát lại');
    }
  },STARTUP_TIMEOUT_MS);
}
function tryPlay(fromUser=false){
  if(fromUser){playWanted=true;autoplayBlocked=false;}
  if(!playWanted)return;
  const token=loadToken,request=++playRequestId;
  mediaLog('play requested', fromUser?'user':'automatic');
  let result;
  try{result=video.play()}
  catch(e){
    console.warn('[TV Player] synchronous play failure',e);
    if(token===loadToken){if(e&&e.name==='NotAllowedError')autoplayBlocked=true;showStartPlayback('▶ Nhấn OK hoặc chạm để phát')}
    return;
  }
  if(result&&typeof result.then==='function')result.then(function(){
    if(token!==loadToken||request!==playRequestId)return;
    // A resolved play() is not necessarily video/audio flowing. Wait for playing.
    mediaLog('play promise resolved');
  }).catch(function(e){
    if(token!==loadToken||request!==playRequestId||!playWanted)return;
    console.warn('[TV Player] play() rejected',e&&e.name,e&&e.message);
    if(e&&e.name==='NotAllowedError'){
      autoplayBlocked=true;
      clearTimeout(startupWatchdog);
      showStartPlayback('▶ Nhấn OK hoặc chạm để phát');
    }else if(e&&e.name!=='AbortError'){
      showStartPlayback('▶ Thử phát lại');
    }
  });
}
function userStartPlayback(){
  // Thao tác OK/click phải trực tiếp thực hiện video.play() để mở khóa tiếng.
  playWanted=true;autoplayBlocked=false;
  if(video.error || video.networkState===HTMLMediaElement.NETWORK_NO_SOURCE || !video.getAttribute('src')&&!hls){
    mediaLog('user requested fresh stream');
    loadChannel(currentIndex,{remember:false,force:true});
    tryPlay(true);
    return;
  }
  tryPlay(true);
  armStartupWatchdog(loadToken);
}
function togglePlayByUser(){
  if(video.paused||startPlayback.classList.contains('show'))userStartPlayback();
  else{playWanted=false;clearStartupTimers();video.pause();hideStartPlayback();}
}
function loadChannel(index,options){
  options=options||{};
  index=(index+channels.length)%channels.length;
  if(!options.force&&index===currentIndex&&video.currentSrc)return;
  if(options.remember!==false&&index!==currentIndex)previousIndex=currentIndex;
  if(!options.recovery)startupRetries=0;
  currentIndex=index;retryCount=0;playWanted=true;autoplayBlocked=false;playbackConfirmed=false;
  clearStartupTimers();hideStartPlayback();updateRecall();updateUI();applyNormalizedVolume(index);
  const token=++loadToken;
  destroyStream();
  setStatus('Đang mở '+channels[index].name+'…',true);
  mediaLog('start load', 'token='+token+(options.recovery?' recovery':' initial'));
  // Hiển thị nút thật để người dùng thao tác khi TV chặn autoplay.
  startPromptTimer=setTimeout(function(){
    if(token===loadToken&&playWanted&&!playbackConfirmed)showStartPlayback();
  },1500);
  armStartupWatchdog(token);
  const ch=channels[index],isHls=/\.m3u8(?:$|\?)/i.test(ch.url);
  function ready(){
    if(token!==loadToken||!playWanted||playbackConfirmed)return;
    mediaLog('media ready');
    if(!autoplayBlocked)tryPlay(false);
  }
  if(isHls&&video.canPlayType('application/vnd.apple.mpegurl')){
    video.addEventListener('loadedmetadata',ready,{once:true});
    video.src=ch.url;
    try{video.load()}catch(e){console.warn('[TV Player] native HLS load',e)}
    // Một số bản webOS không gửi loadedmetadata cho lần mở đầu.
    tryPlay(false);
  }else if(isHls&&window.Hls&&Hls.isSupported()){
    const player=new Hls({lowLatencyMode:false,backBufferLength:10,maxBufferLength:20,maxMaxBufferLength:30,startLevel:-1,capLevelToPlayerSize:true,enableWorker:true});
    hls=player;
    player.on(Hls.Events.MANIFEST_PARSED,function(){if(token===loadToken)ready()});
    player.on(Hls.Events.ERROR,function(_,data){
      if(token!==loadToken)return;
      console.warn('[TV Player] HLS error',data&&data.type,data&&data.details,'fatal=',data&&data.fatal);
      if(!data||!data.fatal)return;
      retryCount++;
      if(retryCount<=3&&data.type===Hls.ErrorTypes.NETWORK_ERROR){
        setStatus('Mạng gián đoạn, đang thử lại…',true);
        const delay=Math.min(4000,retryCount*1000);
        setTimeout(function(){if(token===loadToken&&hls===player)player.startLoad()},delay);
      }else if(retryCount<=2&&data.type===Hls.ErrorTypes.MEDIA_ERROR){
        player.recoverMediaError();
      }else{
        setStatus('Kênh đang gặp lỗi phát',false,2500);
        if(startupRetries<MAX_STARTUP_RETRIES){
          startupRetries++;loadChannel(currentIndex,{remember:false,force:true,recovery:true});
        }else{clearTimeout(startupWatchdog);showStartPlayback('▶ Thử phát lại')}
      }
    });
    player.attachMedia(video);player.loadSource(ch.url);
  }else{
    video.addEventListener('loadedmetadata',ready,{once:true});
    video.src=ch.url;
    try{video.load()}catch(e){console.warn('[TV Player] direct load',e)}
    tryPlay(false);
  }
}
function selectChannel(index){loadChannel(index);setMenu(false)}
function changeChannel(step){selectChannel(currentIndex+step);setStatus(channels[currentIndex].name,false,1300)}
function recall(){if(previousIndex===null)return;const target=previousIndex;previousIndex=currentIndex;updateRecall();loadChannel(target,{remember:false});setMenu(false);setStatus('Quay lại '+channels[target].name,false,1600)}

channels.forEach((ch,i)=>{const b=document.createElement('button');b.className='channelCard';b.type='button';b.setAttribute('role','option');b.innerHTML=`${ch.name}${ch.type==='radio'?'<span class="tag">radio</span>':''}`;b.addEventListener('click',()=>selectChannel(i));b.addEventListener('keydown',e=>{if(isWebOS&&e.key==='ArrowDown'){e.preventDefault();setMenu(false);setApps(true,true);return}if(isWebOS&&e.key==='ArrowUp'){e.preventDefault();setMenu(false);return}if(e.key==='ArrowRight'||(!isWebOS&&e.key==='ArrowDown')){e.preventDefault();playlist.children[(i+1)%channels.length].focus({preventScroll:true});centerActiveCard(playlist.children[(i+1)%channels.length])}if(e.key==='ArrowLeft'||(!isWebOS&&e.key==='ArrowUp')){e.preventDefault();playlist.children[(i-1+channels.length)%channels.length].focus({preventScroll:true});centerActiveCard(playlist.children[(i-1+channels.length)%channels.length])}});playlist.appendChild(b)});

$('#menuBtn').onclick=()=>setMenu(!app.classList.contains('menu-open'),true);$('#mobileMenu').onclick=()=>setMenu(!app.classList.contains('menu-open'),true);
$('#recallBtn').onclick=$('#recallFloat').onclick=recall;muteBtn.onclick=muteActionBtn.onclick=toggleMute;
video.addEventListener('volumechange',()=>{
  updateMuteUI();
  // Nếu trình duyệt thay đổi media-volume ngoài cơ chế cân bằng, giữ lại cấu hình theo kênh.
  // Nút âm lượng vật lý của TV thường thay đổi system volume nên không bị ảnh hưởng.
  if(!applyingNormalizedVolume&&!video.muted){
    const expected=Math.min(1,VOLUME_MASTER*getChannelVolumeTrim(currentIndex));
    if(Math.abs(video.volume-expected)>0.02)applyNormalizedVolume(currentIndex);
  }
});
$('#mobilePrev').onclick=()=>changeChannel(-1);$('#mobileNext').onclick=()=>changeChannel(1);
playBtn.onclick=togglePlayByUser;startPlayback.onclick=e=>{e.stopPropagation();userStartPlayback()};video.addEventListener('click',togglePlayByUser);visualizer.addEventListener('click',togglePlayByUser);
// Nhấn vùng đen còn lại của màn hình cũng kích hoạt phát, không chỉ phần tử video.
app.addEventListener('click',e=>{if(e.target===app)togglePlayByUser()});
video.addEventListener('play',()=>{playBtn.textContent='⏸ Tạm dừng';visualizer.classList.toggle('playing',channels[currentIndex].type==='radio');setStatus('',false)});video.addEventListener('pause',()=>{playBtn.textContent='▶ Phát tiếp';visualizer.classList.remove('playing')});video.addEventListener('waiting',()=>setStatus('Đang tải dữ liệu…',true));video.addEventListener('playing',confirmPlayback);video.addEventListener('error',()=>{mediaLog('media error','code='+(video.error&&video.error.code));if(playWanted&&!playbackConfirmed){setStatus('Kênh đang gặp lỗi phát',false,3000);showStartPlayback('▶ Thử phát lại')}});['loadstart','loadedmetadata','canplay','waiting','stalled','emptied'].forEach(function(ev){video.addEventListener(ev,function(){mediaLog(ev)})});
function toggleFullscreen(){if(isWebOS){document.body.classList.toggle('tv-mode');const on=document.body.classList.contains('tv-mode');$('#fullscreenBtn').textContent=on?'⛶ Chế độ TV':'⛶ Toàn màn hình';setMenu(false);return}if(!document.fullscreenElement){const enterFs=app.requestFullscreen||app.webkitRequestFullscreen;if(enterFs){enterFs.call(app);app.classList.add('fullscreen')}}else{const exitFs=document.exitFullscreen||document.webkitExitFullscreen;if(exitFs){exitFs.call(document);app.classList.remove('fullscreen')}}}
$('#fullscreenBtn').onclick=toggleFullscreen;video.addEventListener('dblclick',toggleFullscreen);document.addEventListener('fullscreenchange',()=>app.classList.toggle('fullscreen',!!document.fullscreenElement));

function handleTvBack(){const now=Date.now();if(now-lastBackAt<350)return;lastBackAt=now;if(app.classList.contains('apps-open')){setApps(false);return}if(app.classList.contains('menu-open')){setMenu(false);return}recall()}

document.addEventListener('keydown',e=>{const inMenu=app.classList.contains('menu-open');const key=e.key;
const isTvBack=e.keyCode===461||key==='GoBack'||key==='BrowserBack';
const isDesktopBack=key==='Escape'||key==='Backspace';

// LG webOS: Back luôn là Recall và không rời chế độ TV CSS fullscreen.
if(isTvBack){e.preventDefault();e.stopPropagation();handleTvBack();return}

// Máy tính: Escape/Backspace đóng menu trước, sau đó mới thoát Fullscreen API.
if(isDesktopBack){e.preventDefault();if(app.classList.contains('apps-open'))setApps(false);else if(inMenu)setMenu(false);else if(!isWebOS&&document.fullscreenElement)toggleFullscreen();return}

const appsOpen=app.classList.contains('apps-open');
if(isWebOS&&appsOpen){
  if(key==='ArrowLeft'){e.preventDefault();moveTvApp(-1);return}
  if(key==='ArrowRight'){e.preventDefault();moveTvApp(1);return}
  if(key==='ArrowUp'){e.preventDefault();setApps(false);return}
  if(key==='ArrowDown'){e.preventDefault();return}
  if(key==='Enter'||key===' '){const a=document.activeElement&&document.activeElement.closest?document.activeElement.closest('[data-tvapp]'):null;if(a){e.preventDefault();a.click();return}}
}
if(isWebOS&&!inMenu&&!appsOpen&&key==='ArrowDown'){e.preventDefault();setApps(true,true);return}
if(!inMenu&&!appsOpen&&(key==='ArrowLeft'||key==='ChannelDown')){e.preventDefault();changeChannel(-1)}
if(!inMenu&&!appsOpen&&(key==='ArrowRight'||key==='ChannelUp')){e.preventDefault();changeChannel(1)}
if(!inMenu&&!appsOpen&&(key==='Enter'||key===' ')){if(startPlayback.classList.contains('show')){e.preventDefault();userStartPlayback();return}if(document.activeElement===video||document.activeElement===document.body){e.preventDefault();if(video.paused||startPlayback.classList.contains('show'))userStartPlayback();else setMenu(true,true)}}
// Hiệu chỉnh nhanh mức bù của từng kênh: + tăng, - giảm, 0 đặt lại.
// Mức này được nhớ riêng theo tên kênh và tự áp dụng ở lần mở sau.
if(!inMenu&&!appsOpen&&(key==='+'||key==='=')){e.preventDefault();adjustChannelVolumeTrim(VOLUME_TRIM_STEP);return}
if(!inMenu&&!appsOpen&&(key==='-'||key==='_')){e.preventDefault();adjustChannelVolumeTrim(-VOLUME_TRIM_STEP);return}
if(!inMenu&&!appsOpen&&key==='0'){e.preventDefault();resetChannelVolumeTrim();return}
if(key==='r'||key==='R'){e.preventDefault();recall()}
if(key==='m'||key==='M'){e.preventDefault();toggleMute()}
});

// Tự ẩn nút Mute/Menu sau 5 giây không thao tác trên TV webOS; di chuột, click hoặc nhấn phím sẽ hiện lại.
if(isWebOS){
  ['mousemove','pointermove','pointerdown','touchstart'].forEach(evt=>document.addEventListener(evt,showQuickControls,{passive:true}));
  document.addEventListener('keydown',showQuickControls,true);
  $('.quickActions').addEventListener('mouseenter',showQuickControls);
  $('.quickActions').addEventListener('focusin',showQuickControls);
}

// Một số bản webOS gửi Back qua History API thay vì keyCode 461.
try{history.replaceState({tvApp:true},'',location.href);history.pushState({tvApp:true},'',location.href)}catch(_){ }
window.addEventListener('popstate',()=>{handleTvBack();try{history.pushState({tvApp:true},'',location.href)}catch(_){ }});


// Giữ viewport TV cố định ngay cả khi webOS thay đổi vùng hiển thị sau thao tác menu/focus.
if(isWebOS){
  window.addEventListener('resize',lockTvViewport);
  window.addEventListener('orientationchange',lockTvViewport);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)lockTvViewport()});
}

updateUI();updateMuteUI();loadChannel(currentIndex,{remember:false});setTimeout(()=>{lockTvViewport();if(!startPlayback.classList.contains('show')){try{video.focus({preventScroll:true})}catch(_){video.focus()}}},300);showQuickControls();
