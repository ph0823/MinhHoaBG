<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>Thư viện mp3 Nhi hư - Google Drive</title>
<style>
:root{--p:#7c3aed;--pd:#6d28d9;--bg:#f1f5f9;--text:#172033;--muted:#64748b;--border:#dbe3ea;--danger:#b91c1c}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button,input,select{font:inherit}[hidden]{display:none!important}.app{min-height:100%;display:grid;grid-template-rows:auto 1fr}
.top{display:flex;align-items:center;gap:12px;padding:12px 18px;background:#fff;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:13px;background:#ede9fe;display:grid;place-items:center;font-size:24px}.brand h1{margin:0;font-size:18px}.brand small{color:var(--muted)}
.status{margin-left:auto;min-width:260px}.status-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px}.bar{height:7px;background:#e2e8f0;border-radius:999px;overflow:hidden}.bar>div{height:100%;width:0;background:var(--p)}
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;padding:14px;min-height:0}.sidebar,.player{background:#fff;border:1px solid var(--border);border-radius:15px;overflow:hidden}
.sidebar{display:grid;grid-template-rows:auto auto 1fr;height:calc(100vh - 96px)}.head{padding:14px;border-bottom:1px solid var(--border)}.folder{font-weight:800}.crumb{font-size:12px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{padding:12px 14px;border-bottom:1px solid var(--border)}.search input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px}.folder-actions{display:flex;gap:8px;margin-top:10px}.folder-actions button{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:#f5f3ff;color:var(--p);font-weight:750;cursor:pointer}.folder-actions button:disabled{opacity:.45;cursor:not-allowed}
.list{list-style:none;padding:8px;margin:0;overflow:auto}.item{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;align-items:center;width:100%;padding:10px;border:0;border-radius:11px;background:transparent;text-align:left;color:var(--text);cursor:pointer}.item:hover,.item.active{background:#f5f3ff}.item.active{outline:1px solid #c4b5fd}
.icon{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:#f1f5f9;font-size:20px}.name{font-weight:700;font-size:14px;overflow-wrap:anywhere}.meta{font-size:11px;color:var(--muted);margin-top:3px}.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.player{display:grid;place-items:center;padding:28px;min-height:calc(100vh - 96px);background:linear-gradient(145deg,#fff,#f5f3ff)}.card{width:min(620px,100%);text-align:center}.cover{width:180px;height:180px;border-radius:34px;margin:0 auto 22px;display:grid;place-items:center;font-size:78px;background:linear-gradient(145deg,#ede9fe,#ddd6fe)}
.title{font-size:24px;font-weight:850;margin:0 0 6px;overflow-wrap:anywhere}.sub{color:var(--muted);margin-bottom:22px}.seek{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:10px;font-size:12px;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--p)}
.controls{display:flex;justify-content:center;align-items:center;gap:14px;margin:22px 0}.ctrl{width:48px;height:48px;border-radius:50%;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:20px}.play{width:66px;height:66px;background:var(--p);color:#fff;border-color:var(--p);font-size:26px}.ctrl:disabled{opacity:.45;cursor:not-allowed}
.options{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:16px;color:var(--muted);font-size:13px}.options label{display:flex;align-items:center;gap:7px}.options select{padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:#fff}
.loading{padding:14px 18px;margin:16px auto 0;background:#fff;border:1px solid var(--border);border-radius:12px;color:var(--p);font-weight:700;max-width:420px}.toast{position:fixed;right:18px;bottom:18px;max-width:min(420px,calc(100vw - 36px));padding:12px 14px;border-radius:11px;background:#0f172a;color:#fff;opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateY(0)}.toast.error{background:var(--danger)}
.menu{display:none}@media(max-width:820px){.status{display:none}.menu{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--border);border-radius:10px;background:#fff}.layout{grid-template-columns:1fr;padding:10px}.sidebar{position:fixed;z-index:10;left:0;top:67px;bottom:0;width:min(88vw,360px);height:auto;border-radius:0 15px 15px 0;transform:translateX(-105%);transition:.22s}.sidebar.open{transform:translateX(0)}.player{min-height:calc(100vh - 88px);padding:18px}.cover{width:145px;height:145px;font-size:64px}.title{font-size:20px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<button id="menu" class="menu">☰</button>
<div class="brand"><div class="logo">🎧</div><div><h1>Thư viện âm thanh</h1><small>Phát file từ Google Drive</small></div></div>
<div id="status" class="status" hidden><div class="status-row"><span id="statusText">Đang tải...</span><span id="statusPct">0%</span></div><div class="bar"><div id="progress"></div></div></div>
</header>

<main class="layout">
<aside id="sidebar" class="sidebar">
<div class="head"><div id="folderTitle" class="folder">Đang kết nối...</div><div id="breadcrumb" class="crumb">Thư mục gốc</div><div class="folder-actions"><button id="playFolder" type="button" disabled>▶ Phát tất cả</button></div></div>
<div class="search"><input id="search" type="search" placeholder="Tìm thư mục hoặc file âm thanh..."></div>
<ul id="fileList" class="list"><li class="empty">Đang tải danh sách...</li></ul>
</aside>

<section class="player">
<div class="card">
<div class="cover">🎵</div>
<h2 id="trackTitle" class="title">Chưa chọn bài</h2>
<div id="trackSub" class="sub">Chọn một file âm thanh trong danh sách.</div>
<div class="seek"><span id="current">0:00</span><input id="seek" type="range" min="0" max="100" value="0" disabled><span id="duration">0:00</span></div>
<div class="controls"><button id="prev" class="ctrl" disabled>⏮</button><button id="play" class="ctrl play" disabled>▶</button><button id="next" class="ctrl" disabled>⏭</button></div>
<div class="options">
<label>🔊 <input id="volume" type="range" min="0" max="1" value="1" step=".05"></label>
<label>Tốc độ <select id="speed"><option value=".75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
<label><input id="autoNext" type="checkbox" checked> Tự phát bài sau</label>
</div>
<div id="loading" class="loading" hidden>Đang tải âm thanh...</div>
<audio id="audio" preload="metadata"></audio>
</div>
</section>
</main>
</div>
<div id="toast" class="toast"></div>

<script>
const WEB_APP_URL='https://script.google.com/macros/s/AKfycbz9Fd3kzo7TCoGvKO4AhHl_iv0LiCB3Y2L4bqkvrpjMwWYHtDscRm5JhPMthQaSw8lZ5A/exec';
const APP_TYPE='audio';
const $=id=>document.getElementById(id);
const els={menu:$('menu'),sidebar:$('sidebar'),folderTitle:$('folderTitle'),breadcrumb:$('breadcrumb'),playFolder:$('playFolder'),search:$('search'),fileList:$('fileList'),status:$('status'),statusText:$('statusText'),statusPct:$('statusPct'),progress:$('progress'),trackTitle:$('trackTitle'),trackSub:$('trackSub'),current:$('current'),duration:$('duration'),seek:$('seek'),prev:$('prev'),play:$('play'),next:$('next'),volume:$('volume'),speed:$('speed'),autoNext:$('autoNext'),loading:$('loading'),audio:$('audio'),toast:$('toast')};
let folderStack=[],currentItems=[],audioItems=[],activeFileId='',activeIndex=-1,objectUrl='',loadToken=0,toastTimer=null,currentFolderId='',currentFolderName='',folderScanToken=0;

document.addEventListener('DOMContentLoaded',init);
function init(){bind();restore();loadDirectory('',true)}
function bind(){
  els.menu.onclick=()=>els.sidebar.classList.toggle('open');
  els.search.oninput=renderList;
  els.playFolder.onclick=playAllCurrentFolder;
  els.play.onclick=togglePlay;
  els.prev.onclick=()=>playRelative(-1);
  els.next.onclick=()=>playRelative(1);
  els.volume.oninput=()=>{els.audio.volume=+els.volume.value;localStorage.setItem('audio_volume',els.volume.value)};
  els.speed.onchange=()=>{els.audio.playbackRate=+els.speed.value;localStorage.setItem('audio_speed',els.speed.value)};
  els.autoNext.onchange=()=>localStorage.setItem('audio_auto_next',els.autoNext.checked?'1':'0');
  els.seek.oninput=()=>{if(Number.isFinite(els.audio.duration))els.audio.currentTime=+els.seek.value};
  els.audio.onloadedmetadata=onMetadata;
  els.audio.ontimeupdate=onTimeUpdate;
  els.audio.onplay=()=>els.play.textContent='⏸';
  els.audio.onpause=()=>els.play.textContent='▶';
  els.audio.onended=()=>{savePosition();if(els.autoNext.checked)playRelative(1)};
  window.addEventListener('beforeunload',()=>{savePosition();if(objectUrl)URL.revokeObjectURL(objectUrl)});
}
async function api(action,params={}){
  const url=new URL(WEB_APP_URL);url.searchParams.set('action',action);url.searchParams.set('appType',APP_TYPE);url.searchParams.set('_',Date.now());
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,String(v)));
  const res=await fetch(url,{cache:'no-store',redirect:'follow'});if(!res.ok)throw new Error(`Máy chủ trả về HTTP ${res.status}.`);
  const data=await res.json();if(data.ok===false||data.error)throw new Error(data.error||'Máy chủ xử lý thất bại.');return data;
}
async function loadDirectory(folderId,reset=false){
  setLoading(true,'Đang lấy danh sách âm thanh...',15);els.fileList.innerHTML='<li class="empty">Đang tải...</li>';
  try{
    const data=await api('list',folderId?{folderId}:{});
    currentItems=Array.isArray(data.files)?data.files:[];
    audioItems=currentItems.filter(x=>!x.isFolder);
    currentFolderId=data.folder.id;
    currentFolderName=data.folder.name;
    activeIndex=audioItems.findIndex(x=>x.id===activeFileId);
    folderStack=Array.isArray(data.breadcrumbs)&&data.breadcrumbs.length?data.breadcrumbs:[{id:data.folder.id,name:data.folder.name}];
    if(reset&&folderStack.length>1)folderStack=[folderStack[0]];
    els.folderTitle.textContent=data.folder.name;
    els.breadcrumb.textContent=folderStack.map(x=>x.name).join(' › ');
    els.search.value='';
    els.playFolder.disabled=currentItems.length===0;
    els.playFolder.textContent=audioItems.length?`▶ Phát ${audioItems.length} bài`:'▶ Quét và phát';
    renderList();
    updateButtons();
  }catch(e){els.fileList.innerHTML=`<li class="empty">❌ ${esc(e.message)}</li>`;els.playFolder.disabled=true;els.playFolder.textContent='Không thể phát';toast(e.message,true)}finally{setLoading(false)}
}
function renderList(){
  const k=norm(els.search.value),filtered=currentItems.filter(x=>norm(x.name).includes(k)),frag=document.createDocumentFragment();
  if(folderStack.length>1)frag.appendChild(makeItem({name:'Quay lại thư mục trước',isFolder:true},true));
  if(!filtered.length){const li=document.createElement('li');li.className='empty';li.textContent=k?'Không tìm thấy nội dung phù hợp.':'Thư mục không có file âm thanh.';frag.appendChild(li)}
  else filtered.forEach(x=>frag.appendChild(makeItem(x,false)));
  els.fileList.replaceChildren(frag);
}
function makeItem(item,isBack){
  const li=document.createElement('li'),b=document.createElement('button');b.className='item'+(!isBack&&item.id===activeFileId?' active':'');
  b.innerHTML=`<span class="icon">${isBack?'↩️':item.isFolder?'📁':'🎵'}</span><span><div class="name">${esc(item.name)}</div>${!isBack&&!item.isFolder?`<div class="meta">${fmtBytes(item.size||0)}</div>`:''}</span>`;
  b.onclick=()=>{if(isBack)return goBack();if(item.isFolder)return openFolder(item);openAudio(item)};li.appendChild(b);return li;
}
function goBack(){if(folderStack.length>1)loadDirectory(folderStack[folderStack.length-2].id)}
async function openFolder(folder){
  const token=++folderScanToken;
  els.folderTitle.textContent='Đang mở ' + folder.name + '...';
  els.playFolder.disabled=true;
  els.playFolder.textContent='Đang tải...';
  els.fileList.innerHTML='<li class="empty">Đang tải nội dung thư mục...</li>';
  try{
    await loadDirectory(folder.id);
  }catch(e){
    if(token===folderScanToken)toast(e.message,true);
  }
}

async function playAllCurrentFolder(){
  if(!currentFolderId)return;
  const token=++folderScanToken;
  els.playFolder.disabled=true;
  els.playFolder.textContent='Đang quét...';
  setLoading(true,'Đang quét các bài hát trong thư mục...',10);

  try{
    const playlistData=await api('playlist',{folderId:currentFolderId});
    const tracks=Array.isArray(playlistData.tracks)?playlistData.tracks:[];
    if(token!==folderScanToken)return;
    if(!tracks.length)throw new Error('Không tìm thấy file âm thanh trong thư mục này hoặc các thư mục con.');

    audioItems=tracks;
    activeIndex=0;
    els.playFolder.textContent=`▶ Phát ${tracks.length} bài`;
    toast(`Đã tạo danh sách phát “${currentFolderName}” gồm ${tracks.length} bài.`);
    await openAudio(tracks[0]);
  }catch(e){
    if(token!==folderScanToken)return;
    toast(e.message,true);
  }finally{
    if(token===folderScanToken){
      els.playFolder.disabled=false;
      setLoading(false);
    }
  }
}

async function openAudio(file){
  const token=++loadToken;activeFileId=file.id;activeIndex=audioItems.findIndex(x=>x.id===file.id);renderList();updateButtons();els.sidebar.classList.remove('open');
  els.trackTitle.textContent=file.name;els.trackSub.textContent='Đang tải từ Google Drive...';els.loading.hidden=false;els.play.disabled=true;els.seek.disabled=true;
  try{
    savePosition();els.audio.pause();
    const info=(await api('getFileInfo',{fileId:file.id})).file,chunks=new Array(info.totalChunks);
    for(let i=0;i<info.totalChunks;i++){
      if(token!==loadToken)return;const pct=Math.round(((i+1)/info.totalChunks)*92);els.loading.textContent=`Đang tải âm thanh: ${i+1}/${info.totalChunks}`;setLoading(true,`Đang tải ${file.name} (${i+1}/${info.totalChunks})...`,pct);
      chunks[i]=b64((await api('getFileChunk',{fileId:file.id,index:i})).base64);
    }
    if(token!==loadToken)return;setLoading(true,'Đang chuẩn bị phát...',97);
    const blob=new Blob([join(chunks,info.size)],{type:info.mimeType||guessMime(info.extension)});
    if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(blob);els.audio.src=objectUrl;els.audio.load();await waitMeta();
    const saved=+(localStorage.getItem(posKey(file.id))||0);if(saved>0&&saved<els.audio.duration-5)els.audio.currentTime=saved;
    els.trackSub.textContent=`${fmtBytes(info.size)} • ${fmtTime(els.audio.duration)}`;els.play.disabled=false;els.seek.disabled=false;els.loading.hidden=true;setLoading(false);
    try{await els.audio.play()}catch(_){toast('File đã sẵn sàng. Nhấn nút Phát để nghe.')}
  }catch(e){if(token!==loadToken)return;els.loading.hidden=true;els.trackSub.textContent='Không thể tải file.';setLoading(false);toast(e.message,true);console.error(e)}
}
function waitMeta(){if(Number.isFinite(els.audio.duration)&&els.audio.duration>0)return Promise.resolve();return new Promise((resolve,reject)=>{const ok=()=>{clean();resolve()},bad=()=>{clean();reject(new Error('Không đọc được thông tin file âm thanh.'))},clean=()=>{els.audio.removeEventListener('loadedmetadata',ok);els.audio.removeEventListener('error',bad)};els.audio.addEventListener('loadedmetadata',ok,{once:true});els.audio.addEventListener('error',bad,{once:true})})}
function togglePlay(){if(!els.audio.src)return;els.audio.paused?els.audio.play().catch(e=>toast(e.message,true)):els.audio.pause()}
function playRelative(step){if(!audioItems.length)return;let i=activeIndex+step;if(i<0)i=audioItems.length-1;if(i>=audioItems.length)i=0;openAudio(audioItems[i])}
function onMetadata(){els.duration.textContent=fmtTime(els.audio.duration);els.seek.max=Number.isFinite(els.audio.duration)?els.audio.duration:0;els.audio.playbackRate=+els.speed.value;els.audio.volume=+els.volume.value}
function onTimeUpdate(){els.current.textContent=fmtTime(els.audio.currentTime);els.seek.value=els.audio.currentTime||0;if(Math.floor(els.audio.currentTime)%5===0)savePosition()}
function savePosition(){if(activeFileId&&Number.isFinite(els.audio.currentTime))localStorage.setItem(posKey(activeFileId),String(els.audio.currentTime))}
function posKey(id){return`audio_position_${id}`}
function updateButtons(){const ok=audioItems.length>0&&activeIndex>=0;els.prev.disabled=!ok;els.next.disabled=!ok}
function restore(){const v=localStorage.getItem('audio_volume'),s=localStorage.getItem('audio_speed'),a=localStorage.getItem('audio_auto_next');if(v!==null)els.volume.value=v;if(s!==null)els.speed.value=s;if(a!==null)els.autoNext.checked=a==='1';els.audio.volume=+els.volume.value;els.audio.playbackRate=+els.speed.value}
function setLoading(show,text='',pct=0){els.status.hidden=!show;if(!show)return;const p=Math.max(0,Math.min(100,Math.round(pct)));els.statusText.textContent=text;els.statusPct.textContent=`${p}%`;els.progress.style.width=`${p}%`}
function toast(msg,err=false){clearTimeout(toastTimer);els.toast.textContent=msg;els.toast.className=`toast show${err?' error':''}`;toastTimer=setTimeout(()=>els.toast.className='toast',3500)}
function b64(s){const x=atob(s),a=new Uint8Array(x.length);for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return a}
function join(parts,n){const r=new Uint8Array(n);let o=0;parts.forEach(p=>{r.set(p,o);o+=p.length});return r}
function norm(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function fmtBytes(n){if(!n)return'0 B';const u=['B','KB','MB','GB'],i=Math.min(Math.floor(Math.log(n)/Math.log(1024)),u.length-1);return`${(n/Math.pow(1024,i)).toFixed(i?1:0)} ${u[i]}`}
function fmtTime(v){if(!Number.isFinite(v)||v<0)return'0:00';const h=Math.floor(v/3600),m=Math.floor(v%3600/60),s=Math.floor(v%60);return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`}
function guessMime(e){return({mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',wav:'audio/wav',ogg:'audio/ogg',oga:'audio/ogg',opus:'audio/ogg',flac:'audio/flac',webm:'audio/webm'})[String(e||'').toLowerCase()]||'audio/mpeg'}
function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script>
</body>
</html>
