<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Demo TRUYENQQ trên Vercel</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    .chapter { color: blue; cursor: pointer; margin: 5px 0; }
    img { max-width: 80%; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>Danh sách chương từ TRUYENQQ</h1>
  <div id="chapters"></div>
  <div id="pages"></div>

  <script>
    async function loadChapters() {
      const res = await fetch("/api/truyenqq?slug=doraemon"); // slug ví dụ
      const data = await res.json();
      const container = document.getElementById("chapters");

      data.chapters.forEach(ch => {
        const div = document.createElement("div");
        div.className = "chapter";
        div.textContent = ch.title;
        div.onclick = () => loadChapterDetail(ch.link);
        container.appendChild(div);
      });
    }

    async function loadChapterDetail(link) {
      const res = await fetch(`/api/truyenqq?chapter=${encodeURIComponent(link)}`);
      const data = await res.json();
      const container = document.getElementById("pages");
      container.innerHTML = "";

      data.pages.forEach(src => {
        const img = document.createElement("img");
        img.src = src;
        container.appendChild(img);
      });
    }

    loadChapters();
  </script>
</body>
</html>
