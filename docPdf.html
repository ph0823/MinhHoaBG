<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Tủ sách Google Drive - 2026</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --surface: #ffffff;
      --bg: #eef2f5;
      --text: #172033;
      --muted: #64748b;
      --border: #dbe3ea;
      --danger: #b91c1c;
      --shadow: 0 10px 28px rgba(15, 23, 42, .09);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; color: var(--text); background: var(--bg);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
    
    /* Header & Toolbar */
    .topbar {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 18px; background: var(--surface); border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(15, 23, 42, .05); z-index: 5;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 250px; }
    .brand-icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: #ccfbf1; font-size: 23px; }
    .brand h1 { margin: 0; font-size: 18px; }
    .brand small { display: block; margin-top: 2px; color: var(--muted); }
    .status { margin-left: auto; min-width: 260px; max-width: 460px; }
    .status-row { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    .progress { height: 7px; overflow: hidden; background: #e2e8f0; border-radius: 999px; }
    .progress > div { height: 100%; width: 0; background: var(--primary); transition: width .2s ease; }
    
    /* Layout */
    .layout {
      min-height: 0; display: grid; grid-template-columns: 330px minmax(0, 1fr);
      gap: 14px; padding: 14px; transition: grid-template-columns .24s ease, gap .24s ease;
    }
    .sidebar, .viewer {
      min-height: 0; background: var(--surface); border-radius: 14px;
      box-shadow: var(--shadow); border: 1px solid var(--border);
    }
    .sidebar {
      display: grid; grid-template-rows: auto auto 1fr; overflow: hidden; min-width: 0;
      opacity: 1; transform: translateX(0);
      transition: opacity .18s ease, transform .24s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .layout.sidebar-collapsed { grid-template-columns: 0 minmax(0, 1fr); gap: 0; }
    .layout.sidebar-collapsed .sidebar { opacity: 0; transform: translateX(-18px); pointer-events: none; border-color: transparent; box-shadow: none; }
    
    /* File List */
    .sidebar-head { padding: 14px; border-bottom: 1px solid var(--border); }
    .folder-title { font-weight: 750; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .breadcrumb { margin-top: 6px; font-size: 12px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .search-wrap { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .search-wrap input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; outline: none; }
    .search-wrap input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15, 118, 110, .12); }
    .file-list { list-style: none; padding: 8px; margin: 0; overflow: auto; }
    .file-item {
      display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center;
      width: 100%; padding: 10px; border: 0; border-radius: 10px; background: transparent; text-align: left; color: var(--text);
    }
    .file-item:hover, .file-item.active { background: #ecfdf5; }
    .file-item.active { outline: 1px solid #99f6e4; }
    .file-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; background: #f1f5f9; font-size: 19px; }
    .file-name { font-size: 14px; font-weight: 650; overflow-wrap: anywhere; }
    .file-meta { margin-top: 3px; font-size: 11px; color: var(--muted); }
    .empty { padding: 30px 16px; text-align: center; color: var(--muted); }
    
    /* Viewer & Toolbars */
    .viewer { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
    .toolbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px;
      padding: 10px; border-bottom: 1px solid var(--border); background: #fbfdfe;
    }
    .toolbar button, .toolbar input { height: 36px; border: 1px solid var(--border); border-radius: 9px; background: white; color: var(--text); }
    .toolbar button { padding: 0 12px; font-weight: 650; }
    .toolbar button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .toolbar button:disabled { opacity: .45; cursor: not-allowed; }
    .toolbar .primary { background: var(--primary); color: white; border-color: var(--primary); }
    .toolbar .primary:hover:not(:disabled) { background: var(--primary-dark); color: white; }
    .toolbar .fit-active { background: var(--primary); color: white; border-color: var(--primary); }
    .toolbar .library-toggle { color: var(--primary); border-color: #99f6e4; background: #ecfdf5; }
    .page-input { width: 62px; padding: 0 8px; text-align: center; }
    .divider { width: 1px; height: 24px; background: var(--border); margin: 0 2px; }
    .document-name { flex: 1 1 200px; min-width: 140px; max-width: 420px; margin-right: auto; padding: 0 8px; font-weight: 700; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    
    /* PDF Canvas View */
    .viewer { position: relative; }
    .canvas-wrap { min-height: 0; overflow: auto; padding: 24px; text-align: center; background: #cbd5e1; }
    .canvas-stage { display: inline-block; position: relative; min-width: 1px; min-height: 1px; line-height: 0; }
    canvas { display: block; background: white; box-shadow: 0 8px 30px rgba(15, 23, 42, .25); }

    /* Điều hướng nổi khi đọc ở chế độ Vừa cao */
    .page-nav {
      position: fixed; top: 50%; z-index: 40; display: none; place-items: center;
      width: 58px; height: 92px; transform: translateY(-50%);
      border: 1px solid rgba(255,255,255,.5); border-radius: 18px;
      background: rgba(15,23,42,.62); color: #fff;
      font-size: 46px; font-weight: 300; line-height: 1;
      box-shadow: 0 12px 34px rgba(15,23,42,.28);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      opacity: .68; transition: opacity .18s ease, transform .18s ease, background .18s ease;
      user-select: none; -webkit-user-select: none; touch-action: manipulation;
    }
    .page-nav:hover:not(:disabled), .page-nav:focus-visible {
      opacity: 1; background: rgba(15,118,110,.9); transform: translateY(-50%) scale(1.05);
    }
    .page-nav:disabled { opacity: .16; cursor: default; }
    .page-nav-prev { left: max(12px, env(safe-area-inset-left)); }
    .page-nav-next { right: max(12px, env(safe-area-inset-right)); }
    .page-indicator {
      position: fixed; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 40;
      display: none; transform: translateX(-50%); padding: 8px 14px;
      border-radius: 999px; background: rgba(15,23,42,.7); color: #fff;
      font-size: 13px; font-weight: 700; letter-spacing: .02em;
      box-shadow: 0 6px 20px rgba(15,23,42,.2);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      pointer-events: none;
    }

    /* Chế độ Vừa cao toàn màn hình */
    body.fit-height-mode { overflow: hidden; background: #334155; }
    body.fit-height-mode .app { height: 100dvh; grid-template-rows: 1fr; }
    body.fit-height-mode .topbar { display: none; }
    body.fit-height-mode .layout,
    body.fit-height-mode .layout.sidebar-collapsed {
      height: 100dvh; min-height: 0; padding: 0; gap: 0; grid-template-columns: 0 minmax(0,1fr);
    }
    body.fit-height-mode .sidebar {
      opacity: 0; transform: translateX(-100%); pointer-events: none; border: 0; box-shadow: none;
    }
    body.fit-height-mode .viewer {
      height: 100dvh; min-height: 0; border: 0; border-radius: 0; box-shadow: none;
      grid-template-rows: 1fr; background: #334155;
    }
    body.fit-height-mode .toolbar {
      position: fixed; top: max(10px, env(safe-area-inset-top)); left: 50%; z-index: 45;
      width: max-content; max-width: calc(100vw - 150px); transform: translateX(-50%);
      padding: 7px 9px; border: 1px solid rgba(255,255,255,.55); border-radius: 14px;
      background: rgba(255,255,255,.9); box-shadow: 0 10px 28px rgba(15,23,42,.22);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    body.fit-height-mode .toolbar .library-toggle,
    body.fit-height-mode .toolbar .document-name,
    body.fit-height-mode .toolbar #btnPrev,
    body.fit-height-mode .toolbar #btnNext,
    body.fit-height-mode .toolbar .divider { display: none; }
    body.fit-height-mode .canvas-wrap {
      height: 100dvh; min-height: 100dvh; padding: 4px; overflow: auto;
      display: flex; align-items: center; justify-content: center; background: #334155;
      scrollbar-width: thin; overscroll-behavior: contain;
    }
    body.fit-height-mode .canvas-stage { margin: auto; }
    body.fit-height-mode canvas { box-shadow: 0 10px 36px rgba(0,0,0,.36); }
    body.fit-height-mode .page-nav,
    body.fit-height-mode .page-indicator { display: grid; }
    
    /* Ebook Mobi View */
    .ebook-wrap {
      min-height: 0; overflow: auto; padding: 30px; background: #f1f5f9; 
      display: flex; justify-content: center;
    }
    .ebook-content {
      max-width: 800px; width: 100%; background: white; padding: 40px; 
      border-radius: 12px; box-shadow: 0 8px 30px rgba(15, 23, 42, .1);
      font-family: "Segoe UI", Arial, sans-serif; line-height: 1.8;
    }

    /* Common */
    .hidden { display: none !important; }
    .welcome { height: 100%; display: grid; place-items: center; color: #475569; }
    .welcome-box { max-width: 480px; padding: 28px; text-align: center; background: rgba(255,255,255,.72); border-radius: 16px; }
    .welcome-icon { font-size: 56px; }
    .toast {
      position: fixed; right: 18px; bottom: 18px; z-index: 20; max-width: min(420px, calc(100vw - 36px));
      padding: 12px 14px; border-radius: 11px; background: #0f172a; color: white; box-shadow: var(--shadow);
      opacity: 0; transform: translateY(12px); pointer-events: none; transition: .2s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: var(--danger); }
    .mobile-menu { display: none; }
    
    @media (max-width: 860px) {
      body { overflow: auto; }
      .app { min-height: 100%; height: auto; }
      .topbar { position: sticky; top: 0; }
      .brand { min-width: 0; }
      .brand small, .status { display: none; }
      .mobile-menu { display: inline-grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 10px; background: white; }
      .layout, .layout.sidebar-collapsed { grid-template-columns: 1fr; gap: 14px; min-height: calc(100vh - 66px); }
      .sidebar, .layout.sidebar-collapsed .sidebar {
        position: fixed; inset: 66px auto 0 0; z-index: 10; width: min(88vw, 350px);
        border-radius: 0 14px 14px 0; opacity: 1; pointer-events: auto; border-color: var(--border);
        box-shadow: var(--shadow); transform: translateX(-105%); transition: transform .22s ease;
      }
      .sidebar.open, .layout.sidebar-collapsed .sidebar.open { transform: translateX(0); }
      .viewer { min-height: calc(100vh - 94px); }
      .canvas-wrap, .ebook-wrap { padding: 12px; }
      .document-name { flex-basis: 100%; max-width: none; text-align: center; }
      .divider { display: none; }
      .page-nav { width: 46px; height: 76px; border-radius: 15px; font-size: 38px; }
      .page-nav-prev { left: max(6px, env(safe-area-inset-left)); }
      .page-nav-next { right: max(6px, env(safe-area-inset-right)); }
      body.fit-height-mode .toolbar { max-width: calc(100vw - 112px); overflow-x: auto; flex-wrap: nowrap; }
      body.fit-height-mode .toolbar #btnZoomOut,
      body.fit-height-mode .toolbar #btnZoomIn,
      body.fit-height-mode .toolbar #zoomLabel,
      body.fit-height-mode .toolbar #btnFit { display: none; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button id="mobileMenu" class="mobile-menu" type="button">☰</button>
    <div class="brand">
      <div class="brand-icon">📚</div>
      <div><h1>Tủ sách XNhi</h1><small>Hỗ trợ PDF & MOBI</small></div>
    </div>
    <div id="statusBox" class="status" hidden>
      <div class="status-row"><span id="statusText">Đang xử lý...</span><span id="statusPercent">0%</span></div>
      <div class="progress"><div id="progressBar"></div></div>
    </div>
  </header>

  <main id="mainLayout" class="layout">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <div id="folderTitle" class="folder-title">Đang kết nối...</div>
        <div id="breadcrumb" class="breadcrumb">Thư mục gốc</div>
      </div>
      <div class="search-wrap"><input id="searchInput" type="search" placeholder="Tìm file PDF hoặc MOBI..." autocomplete="off"></div>
      <ul id="fileList" class="file-list"><li class="empty">Đang tải...</li></ul>
    </aside>

    <section class="viewer">
      <div class="toolbar">
        <button id="btnLibrary" class="library-toggle" type="button">☰ Tủ sách</button>
        <div id="documentName" class="document-name">Chưa chọn tài liệu</div>
        
        <!-- Các nút này chủ yếu dành cho PDF -->
        <span class="pdf-controls" style="display:contents;">
          <button id="btnPrev" type="button" disabled>← Trước</button>
          <input id="pageInput" class="page-input" type="number" min="1" value="1" disabled>
          <span>/ <strong id="pageCount">0</strong></span>
          <button id="btnNext" type="button" disabled>Sau →</button>
          <span class="divider"></span>
          <button id="btnZoomOut" type="button" disabled>−</button>
          <strong id="zoomLabel">100%</strong>
          <button id="btnZoomIn" type="button" disabled>+</button>
          <button id="btnFit" type="button" disabled>↔ Vừa ngang</button>
          <button id="btnFitHeight" type="button" disabled>↕ Vừa cao</button>
        </span>
      </div>
      
      <!-- Vùng hiển thị Welcome -->
      <div id="welcome" class="welcome">
        <div class="welcome-box"><div class="welcome-icon">📄</div><h2>Chọn một file để bắt đầu</h2><p>Hỗ trợ đọc PDF phân mảnh và tải siêu tốc file MOBI.</p></div>
      </div>

      <!-- Vùng hiển thị PDF -->
      <div id="canvasWrap" class="canvas-wrap hidden">
        <button id="pagePrevOverlay" class="page-nav page-nav-prev" type="button" aria-label="Trang trước" title="Trang trước (←)">‹</button>
        <div class="canvas-stage"><canvas id="pdfCanvas"></canvas></div>
        <button id="pageNextOverlay" class="page-nav page-nav-next" type="button" aria-label="Trang sau" title="Trang sau (→)">›</button>
        <div id="pageIndicator" class="page-indicator" aria-live="polite">Trang 1 / 1</div>
      </div>
      
      <!-- Vùng hiển thị MOBI (Ebook) -->
      <div id="ebookWrap" class="ebook-wrap hidden">
        <div id="ebookContent" class="ebook-content"></div>
      </div>
    </section>
  </main>
</div>
<div id="toast" class="toast" role="status"></div>

<script>
  const WEB_APP_URL =
    'https://script.google.com/macros/s/AKfycbz9Fd3kzo7TCoGvKO4AhHl_iv0LiCB3Y2L4bqkvrpjMwWYHtDscRm5JhPMthQaSw8lZ5A/exec';

  const ROOT_MARKER = '';

  const MIN_SCALE = 0.5;
  const MAX_SCALE = 3;
  const SCALE_STEP = 0.2;

  const MAX_PARALLEL_CHUNK_REQUESTS = 4;
  const GLOBAL_CHUNK_CACHE_LIMIT = 48 * 1024 * 1024;

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const els = {
    mainLayout: document.getElementById('mainLayout'),
    sidebar: document.getElementById('sidebar'),
    mobileMenu: document.getElementById('mobileMenu'),
    btnLibrary: document.getElementById('btnLibrary'),

    folderTitle: document.getElementById('folderTitle'),
    breadcrumb: document.getElementById('breadcrumb'),
    searchInput: document.getElementById('searchInput'),
    fileList: document.getElementById('fileList'),

    statusBox: document.getElementById('statusBox'),
    statusText: document.getElementById('statusText'),
    statusPercent: document.getElementById('statusPercent'),
    progressBar: document.getElementById('progressBar'),

    documentName: document.getElementById('documentName'),

    btnPrev: document.getElementById('btnPrev'),
    pageInput: document.getElementById('pageInput'),
    pageCount: document.getElementById('pageCount'),
    btnNext: document.getElementById('btnNext'),

    btnZoomOut: document.getElementById('btnZoomOut'),
    zoomLabel: document.getElementById('zoomLabel'),
    btnZoomIn: document.getElementById('btnZoomIn'),
    btnFit: document.getElementById('btnFit'),
    btnFitHeight: document.getElementById('btnFitHeight'),
    pagePrevOverlay: document.getElementById('pagePrevOverlay'),
    pageNextOverlay: document.getElementById('pageNextOverlay'),
    pageIndicator: document.getElementById('pageIndicator'),

    canvasWrap: document.getElementById('canvasWrap'),
    canvas: document.getElementById('pdfCanvas'),

    ebookWrap: document.getElementById('ebookWrap'),
    ebookContent: document.getElementById('ebookContent'),

    welcome: document.getElementById('welcome'),
    toast: document.getElementById('toast'),

    pdfControls: document.querySelectorAll(
      '.pdf-controls button, .pdf-controls input'
    )
  };

  const ctx = els.canvas.getContext('2d', {
    alpha: false
  });

  /*
   * Cache chunk dùng chung.
   */
  const globalChunkCache = new Map();
  const pendingChunkRequests = new Map();

  let globalChunkCacheBytes = 0;

  /*
   * Trạng thái thư mục.
   */
  let folderStack = [];
  let currentItems = [];
  let currentFolderId = ROOT_MARKER;

  /*
   * Trạng thái tài liệu.
   */
  let activeFileId = '';
  let currentMode = '';

  /*
   * Trạng thái PDF.
   */
  let pdfDoc = null;
  let pdfLoadingTask = null;
  let currentRangeTransport = null;
  let renderTask = null;

  let pageNum = 1;
  let scale = 1.25;
  let fitMode = 'width';
  let sidebarWasCollapsedBeforeHeight = false;
  let swipeStartX = null;
  let swipeStartY = null;

  /*
   * Quản lý hủy và chống xung đột.
   */
  let currentAbortController = null;
  let loadToken = 0;
  let renderSerial = 0;
  let toastTimer = null;

  /*
   * URL Blob MOBI hiện tại.
   */
  let currentMobiBlobUrl = '';

  document.addEventListener('DOMContentLoaded', init);
  window.addEventListener('beforeunload', cleanupBeforeUnload);

  function init() {
    bindEvents();
    updateLibraryButton();
    loadDirectory(ROOT_MARKER, true);
  }

  function bindEvents() {
    els.mobileMenu.addEventListener('click', () => {
      els.sidebar.classList.toggle('open');
    });

    els.btnLibrary.addEventListener('click', toggleLibrary);

    els.searchInput.addEventListener('input', renderFileList);

    els.btnPrev.addEventListener('click', () => {
      goToPage(pageNum - 1);
    });

    els.btnNext.addEventListener('click', () => {
      goToPage(pageNum + 1);
    });

    els.pagePrevOverlay.addEventListener('click', () => {
      goToPage(pageNum - 1);
    });

    els.pageNextOverlay.addEventListener('click', () => {
      goToPage(pageNum + 1);
    });

    els.canvasWrap.addEventListener('pointerdown', event => {
      if (fitMode !== 'height' || event.pointerType === 'mouse') return;
      swipeStartX = event.clientX;
      swipeStartY = event.clientY;
    });

    els.canvasWrap.addEventListener('pointerup', event => {
      if (fitMode !== 'height' || swipeStartX === null || swipeStartY === null) return;
      const dx = event.clientX - swipeStartX;
      const dy = event.clientY - swipeStartY;
      swipeStartX = null;
      swipeStartY = null;
      if (Math.abs(dx) < 55 || Math.abs(dx) <= Math.abs(dy) * 1.25) return;
      goToPage(dx < 0 ? pageNum + 1 : pageNum - 1);
    });

    els.pageInput.addEventListener('change', () => {
      const requestedPage = Number.parseInt(
        els.pageInput.value,
        10
      );

      if (!Number.isInteger(requestedPage)) {
        els.pageInput.value = pageNum;
        return;
      }

      goToPage(requestedPage);
    });

    els.pageInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        els.pageInput.blur();
      }
    });

    els.btnZoomOut.addEventListener('click', () => {
      setScale(scale - SCALE_STEP);
    });

    els.btnZoomIn.addEventListener('click', () => {
      setScale(scale + SCALE_STEP);
    });

    els.btnFit.addEventListener('click', fitToWidth);
    els.btnFitHeight.addEventListener('click', fitToHeight);

    window.addEventListener(
      'resize',
      debounce(() => {
        if (!pdfDoc) return;

        if (fitMode === 'width' || fitMode === 'height') {
          renderPage();
        }
      }, 180)
    );

    document.addEventListener('keydown', event => {
      if (!pdfDoc || currentMode !== 'pdf') return;

      const tagName =
        document.activeElement?.tagName?.toLowerCase() || '';

      if (
        tagName === 'input' ||
        tagName === 'textarea' ||
        tagName === 'select'
      ) {
        return;
      }

      if (event.key === 'ArrowLeft' || event.key === 'PageUp') {
        event.preventDefault();
        goToPage(pageNum - 1);
      }

      if (
        event.key === 'ArrowRight' ||
        event.key === 'PageDown'
      ) {
        event.preventDefault();
        goToPage(pageNum + 1);
      }

      if (event.key === 'Escape' && fitMode === 'height') {
        event.preventDefault();
        fitToWidth();
        return;
      }

      if (event.key === '+' || event.key === '=') {
        event.preventDefault();
        setScale(scale + SCALE_STEP);
      }

      if (event.key === '-') {
        event.preventDefault();
        setScale(scale - SCALE_STEP);
      }

      if (event.key === 'Home') {
        event.preventDefault();
        goToPage(1);
      }

      if (event.key === 'End') {
        event.preventDefault();
        goToPage(pdfDoc.numPages);
      }
    });
  }

  /*
   * Gọi Google Apps Script.
   *
   * Quan trọng:
   * Không dùng điều kiện "v && ..." vì index=0 là giá trị hợp lệ.
   */
  async function api(
    action,
    params = {},
    options = {}
  ) {
    const {
      signal,
      cache = 'no-store',
      bustCache = true,
      retries = 1
    } = options;

    let lastError = null;

    for (let attempt = 0; attempt <= retries; attempt++) {
      try {
        const url = new URL(WEB_APP_URL);

        url.searchParams.set('action', action);
        url.searchParams.set('appType', 'pdf');

        if (bustCache) {
          url.searchParams.set('_', String(Date.now()));
        }

        Object.entries(params).forEach(([key, value]) => {
          const hasValue =
            value !== undefined &&
            value !== null &&
            value !== '';

          if (hasValue) {
            url.searchParams.set(key, String(value));
          }
        });

        const response = await fetch(url.toString(), {
          method: 'GET',
          cache,
          signal
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        let data;

        try {
          data = await response.json();
        } catch (error) {
          throw new Error(
            'Máy chủ trả về dữ liệu không đúng định dạng JSON.'
          );
        }

        if (!data || data.ok !== true) {
          throw new Error(
            data?.error || 'Máy chủ báo lỗi không xác định.'
          );
        }

        return data;
      } catch (error) {
        if (isAbortError(error)) {
          throw error;
        }

        lastError = error;

        if (attempt < retries) {
          await delay(350 * (attempt + 1));
        }
      }
    }

    throw lastError || new Error('Không kết nối được máy chủ.');
  }

  async function loadDirectory(folderId, reset = false) {
    const requestedFolderId = folderId || ROOT_MARKER;

    setLoading(true, 'Đang nạp danh sách tài liệu...', 12);

    try {
      const params = requestedFolderId
        ? { folderId: requestedFolderId }
        : {};

      const data = await api('list', params, {
        retries: 1
      });

      currentFolderId = data.folder.id;
      currentItems = Array.isArray(data.files)
        ? data.files
        : [];

      if (
        Array.isArray(data.breadcrumbs) &&
        data.breadcrumbs.length
      ) {
        folderStack = data.breadcrumbs.map(item => ({
          id: item.id,
          name: item.name
        }));
      } else if (reset || folderStack.length === 0) {
        folderStack = [{
          id: data.folder.id,
          name: data.folder.name
        }];
      }

      els.folderTitle.textContent =
        data.folder.name || 'Tủ sách';

      els.breadcrumb.textContent =
        folderStack.length
          ? folderStack.map(item => item.name).join(' › ')
          : 'Thư mục gốc';

      renderFileList();
      setLoading(false);
    } catch (error) {
      setLoading(false);

      els.fileList.innerHTML =
        '<li class="empty">Không tải được danh sách tài liệu.</li>';

      showToast(
        getErrorMessage(error),
        true
      );
    }
  }

  function renderFileList() {
    const keyword = normalize(els.searchInput.value);

    const filtered = currentItems.filter(item => {
      const name = normalize(item.name);
      const extension = getExtension(item.name);

      return (
        name.includes(keyword) &&
        (
          item.isFolder ||
          extension === 'pdf' ||
          extension === 'mobi'
        )
      );
    });

    const fragment = document.createDocumentFragment();

    if (folderStack.length > 1) {
      fragment.appendChild(
        makeItem(
          {
            name: 'Thư mục trước',
            isFolder: true
          },
          true
        )
      );
    }

    filtered.forEach(item => {
      fragment.appendChild(makeItem(item, false));
    });

    if (!fragment.childNodes.length) {
      const emptyItem = document.createElement('li');
      emptyItem.className = 'empty';
      emptyItem.textContent = keyword
        ? 'Không tìm thấy tài liệu phù hợp.'
        : 'Thư mục chưa có file PDF hoặc MOBI.';

      fragment.appendChild(emptyItem);
    }

    els.fileList.replaceChildren(fragment);
  }

  function makeItem(item, isBack) {
    const li = document.createElement('li');

    const extension = getExtension(item.name);

    const icon = isBack
      ? '↩️'
      : item.isFolder
        ? '📁'
        : extension === 'mobi'
          ? '📖'
          : '📄';

    const button = document.createElement('button');

    button.type = 'button';

    button.className =
      `file-item ${
        !isBack && item.id === activeFileId
          ? 'active'
          : ''
      }`;

    const iconSpan = document.createElement('span');
    iconSpan.className = 'file-icon';
    iconSpan.textContent = icon;

    const detailSpan = document.createElement('span');

    const nameDiv = document.createElement('div');
    nameDiv.className = 'file-name';
    nameDiv.textContent = item.name;

    detailSpan.appendChild(nameDiv);

    if (!isBack && !item.isFolder) {
      const metaDiv = document.createElement('div');
      metaDiv.className = 'file-meta';

      const sizeText = formatBytes(
        Number(item.size) || 0
      );

      metaDiv.textContent =
        extension === 'mobi'
          ? `${sizeText} · MOBI`
          : `${sizeText} · PDF`;

      detailSpan.appendChild(metaDiv);
    }

    button.append(iconSpan, detailSpan);

    button.addEventListener('click', async () => {
      if (isBack) {
        const parent =
          folderStack[folderStack.length - 2];

        if (parent) {
          await loadDirectory(parent.id);
        }

        return;
      }

      if (item.isFolder) {
        await loadDirectory(item.id);
        return;
      }

      if (extension === 'mobi') {
        await openMobi(item);
      } else {
        await openPdf(item);
      }
    });

    li.appendChild(button);

    return li;
  }

  /*
   * MOBI:
   * Phiên bản này tải file an toàn và cho tải xuống.
   * Việc hiển thị nội dung MOBI cần thêm trình phân tích MOBI riêng.
   */
  async function openMobi(file) {
    const token = ++loadToken;

    abortCurrentWork();

    currentAbortController = new AbortController();
    const signal = currentAbortController.signal;

    activeFileId = file.id;
    currentMode = 'mobi';
    setFitHeightScreen(false);

    renderFileList();
    closeMobileSidebar();

    els.documentName.textContent = file.name;

    els.welcome.classList.add('hidden');
    els.canvasWrap.classList.add('hidden');
    els.ebookWrap.classList.remove('hidden');

    resetPdfControls();

    els.ebookContent.innerHTML = `
      <div style="text-align:center; padding:50px 20px;">
        Đang chuẩn bị tải sách MOBI...
      </div>
    `;

    revokeCurrentMobiUrl();

    try {
      setLoading(
        true,
        'Đang đọc thông tin sách MOBI...',
        5
      );

      const targetFolderId =
        file.folderId || currentFolderId;

      const infoData = await api(
        'getFileInfo',
        {
          fileId: file.id,
          folderId: targetFolderId
        },
        {
          signal,
          retries: 1
        }
      );

      if (
        token !== loadToken ||
        signal.aborted
      ) {
        return;
      }

      const info = infoData.file;
      const totalChunks = Number(info.totalChunks);

      if (
        !Number.isInteger(totalChunks) ||
        totalChunks < 1
      ) {
        throw new Error(
          'Máy chủ trả về số chunk MOBI không hợp lệ.'
        );
      }

      const version =
        info.version ||
        info.updatedAt ||
        info.size;

      const chunks = new Array(totalChunks);
      const limiter = createLimiter(
        MAX_PARALLEL_CHUNK_REQUESTS
      );

      let loadedChunks = 0;

      const jobs = Array.from(
        { length: totalChunks },
        (_, index) => {
          return limiter(async () => {
            if (signal.aborted) {
              throw createAbortError();
            }

            const bytes = await fetchChunkBytes({
              fileId: file.id,
              folderId: targetFolderId,
              index,
              version,
              signal
            });

            if (
              token !== loadToken ||
              signal.aborted
            ) {
              throw createAbortError();
            }

            chunks[index] = bytes;
            loadedChunks++;

            const percent =
              5 +
              Math.round(
                loadedChunks / totalChunks * 90
              );

            setLoading(
              true,
              `Đang tải sách MOBI (${loadedChunks}/${totalChunks})...`,
              percent
            );
          });
        }
      );

      await Promise.all(jobs);

      if (
        token !== loadToken ||
        signal.aborted
      ) {
        return;
      }

      setLoading(
        true,
        'Đang ghép dữ liệu sách...',
        97
      );

      const totalLength = chunks.reduce(
        (sum, chunk) => {
          if (!(chunk instanceof Uint8Array)) {
            throw new Error(
              'Một phần dữ liệu MOBI bị thiếu.'
            );
          }

          return sum + chunk.byteLength;
        },
        0
      );

      const fullData = new Uint8Array(totalLength);
      let offset = 0;

      for (const chunk of chunks) {
        fullData.set(chunk, offset);
        offset += chunk.byteLength;
      }

      const blob = new Blob(
        [fullData],
        {
          type:
            info.mimeType ||
            'application/x-mobipocket-ebook'
        }
      );

      renderMobiContainer(blob, file.name);

      setLoading(false);

      showToast(
        `Đã chuẩn bị xong “${file.name}”.`
      );
    } catch (error) {
      if (
        token !== loadToken ||
        isAbortError(error)
      ) {
        return;
      }

      setLoading(false);

      els.ebookContent.innerHTML = `
        <div style="text-align:center; padding:40px 20px;">
          <h3 style="color:var(--danger);">
            Không tải được sách MOBI
          </h3>
          <p>${escapeHtml(getErrorMessage(error))}</p>
        </div>
      `;

      showToast(
        getErrorMessage(error),
        true
      );
    }
  }

  function renderMobiContainer(blob, filename) {
    revokeCurrentMobiUrl();

    currentMobiBlobUrl =

    const safeFilename = escapeHtml(filename);
    const safeUrl = escapeHtml(currentMobiBlobUrl);

    els.ebookContent.innerHTML = `
      <div style="text-align:center;">

        </div>

        <h2 style="

          overflow-wrap:anywhere;
        ">

        </h2>

        <div style="
          max-width:620px;
          margin:0 auto 24px;
          padding:18px;
          border:1px solid #99f6e4;
          border-radius:12px;
          background:#ecfdf5;
          color:#134e4a;
          text-align:left;
          line-height:1.6;
        ">
          <strong>Lưu ý:</strong>
          Trình duyệt không có bộ đọc MOBI tích hợp.
          Ứng dụng đã tải và ghép file thành công nhưng hiện chỉ
          có thể cung cấp file để mở bằng ứng dụng đọc sách MOBI.
        </div>

        <a
          href="${safeUrl}"
          download="${safeFilename}"
          style="
            display:inline-block;
            padding:12px 22px;
            border-radius:10px;
            background:var(--primary);
            color:white;
            text-decoration:none;
            font-weight:700;
            box-shadow:0 4px 12px rgba(15,118,110,.22);
          "
        >

    `;
  }

  async function openPdf(file) {
    const token = ++loadToken;

    abortCurrentWork();

    currentAbortController = new AbortController();
    const signal = currentAbortController.signal;

    activeFileId = file.id;
    currentMode = 'pdf';
    setFitHeightScreen(false);

    renderFileList();
    closeMobileSidebar();

    els.documentName.textContent = file.name;

    els.welcome.classList.add('hidden');
    els.ebookWrap.classList.add('hidden');
    els.canvasWrap.classList.remove('hidden');

    revokeCurrentMobiUrl();
    resetPdfControls();

    try {
      setLoading(
        true,
        'Đang chuẩn bị luồng PDF...',
        5
      );

      const targetFolderId =
        file.folderId || currentFolderId;

      const infoData = await api(
        'getFileInfo',
        {
          fileId: file.id,
          folderId: targetFolderId
        },
        {
          signal,
          retries: 1
        }
      );

      if (
        token !== loadToken ||
        signal.aborted
      ) {
        return;
      }

      const info = infoData.file;
      const fileSize = Number(info.size);
      const totalChunks = Number(info.totalChunks);

      if (
        !Number.isFinite(fileSize) ||
        fileSize <= 0
      ) {
        throw new Error(
          'Kích thước file PDF không hợp lệ.'
        );
      }

      if (
        !Number.isInteger(totalChunks) ||
        totalChunks < 1
      ) {
        throw new Error(
          'Số chunk PDF không hợp lệ.'
        );
      }

      const version =
        info.version ||
        info.updatedAt ||
        info.size;

      const firstChunk = await fetchChunkBytes({
        fileId: file.id,
        folderId: targetFolderId,
        index: 0,
        version,
        signal
      });

      if (
        token !== loadToken ||
        signal.aborted
      ) {
        return;
      }

      currentRangeTransport = createPdfTransport(
        file,
        info,
        token,
        firstChunk,
        signal,
        targetFolderId
      );

      /*
       * Tải trước một số vùng thường chứa bảng xref.
       * Không chờ các tác vụ này để tránh làm chậm việc mở trang đầu.
       */
      const prefetchIndexes = new Set([
        totalChunks - 1,
        totalChunks - 2,
        1
      ]);

      prefetchIndexes.forEach(index => {
        if (
          index > 0 &&
          index < totalChunks
        ) {
          currentRangeTransport
            .prefetchChunk(index)
            .catch(() => {
              /*
               * Prefetch chỉ là tối ưu phụ.
               * PDF.js vẫn có thể yêu cầu lại khi cần.
               */
            });
        }
      });

      pdfLoadingTask = pdfjsLib.getDocument({
        range: currentRangeTransport,
        length: fileSize,
        disableAutoFetch: true,
        disableStream: true,
        rangeChunkSize:
          currentRangeTransport.chunkSize,
        verbosity: 0
      });

      pdfDoc = await pdfLoadingTask.promise;

      if (
        token !== loadToken ||
        signal.aborted
      ) {
        return;
      }

      pageNum = 1;
      scale = 1.25;
      fitMode = 'width';

      els.pageCount.textContent =
        String(pdfDoc.numPages);

      els.pageInput.min = '1';
      els.pageInput.max =
        String(pdfDoc.numPages);

      await renderPage();

      if (token === loadToken) {
        setLoading(false);
      }
    } catch (error) {
      if (
        token !== loadToken ||
        isAbortError(error)
      ) {
        return;
      }

      setLoading(false);

      showToast(
        getErrorMessage(error),
        true
      );

      await releasePdfResources();

      els.canvasWrap.classList.add('hidden');
      els.welcome.classList.remove('hidden');

      els.documentName.textContent =
        'Chưa chọn tài liệu';

      activeFileId = '';
      currentMode = '';

      renderFileList();
      resetPdfControls();
    }
  }

  function createPdfTransport(
    file,
    info,
    token,
    firstChunk,
    signal,
    targetFolderId
  ) {
    const fileSize = Number(info.size);
    const chunkSize =
      Number(info.chunkSize) ||
      firstChunk.byteLength;

    const totalChunks =
      Number(info.totalChunks);

    const version =
      info.version ||
      info.updatedAt ||
      info.size;

    const transport =
      new pdfjsLib.PDFDataRangeTransport(
        fileSize,
        firstChunk.slice(),
        false,
        file.name
      );

    const requestLimit = createLimiter(
      MAX_PARALLEL_CHUNK_REQUESTS
    );

    transport.requestDataRange =
      async function requestDataRange(begin, end) {
        try {
          if (
            token !== loadToken ||
            signal.aborted
          ) {
            return;
          }

          const safeBegin = Math.max(
            0,
            Math.min(
              fileSize,
              Math.floor(Number(begin) || 0)
            )
          );

          const safeEnd = Math.max(
            safeBegin,
            Math.min(
              fileSize,
              Math.ceil(Number(end) || safeBegin)
            )
          );

          if (safeEnd <= safeBegin) {
            return;
          }

          const firstIndex = Math.floor(
            safeBegin / chunkSize
          );

          const lastIndex = Math.floor(
            (safeEnd - 1) / chunkSize
          );

          const indexes = [];

          for (
            let index = firstIndex;
            index <= lastIndex;
            index++
          ) {
            if (
              index >= 0 &&
              index < totalChunks
            ) {
              indexes.push(index);
            }
          }

          if (!indexes.length) {
            throw new Error(
              'PDF.js yêu cầu vùng dữ liệu không hợp lệ.'
            );
          }

          const parts = await Promise.all(
            indexes.map(index => {
              return requestLimit(() => {
                return fetchChunkBytes({
                  fileId: file.id,
                  folderId: targetFolderId,
                  index,
                  version,
                  signal
                });
              });
            })
          );

          if (
            token !== loadToken ||
            signal.aborted
          ) {
            return;
          }

          const result = new Uint8Array(
            safeEnd - safeBegin
          );

          let outputOffset = 0;

          parts.forEach((part, arrayIndex) => {
            const chunkIndex =
              indexes[arrayIndex];

            const chunkStart =
              chunkIndex * chunkSize;

            const sourceStart = Math.max(
              0,
              safeBegin - chunkStart
            );

            const sourceEnd = Math.min(
              part.byteLength,
              safeEnd - chunkStart
            );

            if (sourceEnd <= sourceStart) {
              return;
            }

            const slice = part.subarray(
              sourceStart,
              sourceEnd
            );

            result.set(slice, outputOffset);
            outputOffset += slice.byteLength;
          });

          const finalResult =
            outputOffset === result.byteLength
              ? result
              : result.slice(0, outputOffset);

          if (!finalResult.byteLength) {
            throw new Error(
              'Không nhận được dữ liệu PDF trong vùng yêu cầu.'
            );
          }

          transport.onDataRange(
            safeBegin,
            finalResult
          );

          transport.onDataProgress?.(
            Math.min(
              safeEnd,
              fileSize
            ),
            fileSize
          );
        } catch (error) {
          if (
            token !== loadToken ||
            signal.aborted ||
            isAbortError(error)
          ) {
            return;
          }

          console.error(
            'Lỗi tải vùng PDF:',
            error
          );

          showToast(
            `Lỗi tải dữ liệu PDF: ${getErrorMessage(error)}`,
            true
          );

          try {
            pdfLoadingTask?.destroy();
          } catch (destroyError) {
            console.warn(destroyError);
          }
        }
      };

    transport.prefetchChunk =
      async function prefetchChunk(index) {
        const safeIndex = Number(index);

        if (
          !Number.isInteger(safeIndex) ||
          safeIndex < 0 ||
          safeIndex >= totalChunks ||
          signal.aborted
        ) {
          return;
        }

        await fetchChunkBytes({
          fileId: file.id,
          folderId: targetFolderId,
          index: safeIndex,
          version,
          signal
        });
      };

    transport.chunkSize = chunkSize;
    transport.totalChunks = totalChunks;
    transport.fileSize = fileSize;

    return transport;
  }

  async function fetchChunkBytes({
    fileId,
    folderId,
    index,
    version,
    signal
  }) {
    const cacheKey =
      `${fileId}_${version}_${index}`;

    const cached = getGlobalChunk(cacheKey);

    if (cached) {
      return cached;
    }

    if (pendingChunkRequests.has(cacheKey)) {
      return pendingChunkRequests.get(cacheKey);
    }

    const requestPromise = (async () => {
      const chunkData = await api(
        'getFileChunk',
        {
          fileId,
          folderId,
          index,
          v: version
        },
        {
          signal,
          cache: 'default',
          bustCache: false,
          retries: 2
        }
      );

      if (signal?.aborted) {
        throw createAbortError();
      }

      const bytes = base64ToBytes(
        chunkData.base64
      );

      const expectedLength =
        Number(chunkData.byteLength);

      if (
        Number.isFinite(expectedLength) &&
        expectedLength >= 0 &&
        bytes.byteLength !== expectedLength
      ) {
        throw new Error(
          `Chunk ${index} không đủ dữ liệu: ` +
          `nhận ${bytes.byteLength}/${expectedLength} byte.`
        );
      }

      putGlobalChunk(cacheKey, bytes);

      return bytes;
    })();

    pendingChunkRequests.set(
      cacheKey,
      requestPromise
    );

    try {
      return await requestPromise;
    } finally {
      pendingChunkRequests.delete(cacheKey);
    }
  }

  function calculateOutputScale(viewport) {
    const maxPixels =
      window.innerWidth <= 860
        ? 4_000_000
        : 8_000_000;

    const preferredPixelRatio = Math.min(
      window.devicePixelRatio || 1,
      1.5
    );

    const viewportPixels = Math.max(
      1,
      viewport.width * viewport.height
    );

    const memorySafeScale = Math.sqrt(
      maxPixels / viewportPixels
    );

    return Math.max(
      0.55,
      Math.min(
        preferredPixelRatio,
        memorySafeScale
      )
    );
  }

  async function renderPage() {
    if (!pdfDoc || currentMode !== 'pdf') {
      return;
    }

    const serial = ++renderSerial;
    const requestedPage = pageNum;

    if (renderTask) {
      try {
        renderTask.cancel();
      } catch (error) {
        console.warn(error);
      }

      renderTask = null;
    }

    setLoading(
      true,
      `Đang hiển thị trang ${requestedPage}...`,
      15
    );

    try {
      const page = await pdfDoc.getPage(
        requestedPage
      );

      if (
        serial !== renderSerial ||
        requestedPage !== pageNum
      ) {
        return;
      }

      const baseViewport =
        page.getViewport({
          scale: 1
        });

      const isHeightScreen = fitMode === 'height' && document.body.classList.contains('fit-height-mode');
      const horizontalPadding = isHeightScreen ? 8 : (window.innerWidth <= 860 ? 24 : 48);
      const verticalPadding = isHeightScreen ? 8 : (window.innerWidth <= 860 ? 24 : 48);

      if (fitMode === 'height') {
        const viewportHeight = window.visualViewport?.height || els.canvasWrap.clientHeight || window.innerHeight;
        const availableHeight = Math.max(
          180,
          Math.min(els.canvasWrap.clientHeight || viewportHeight, viewportHeight) - verticalPadding
        );

        scale = clamp(
          availableHeight /
            baseViewport.height,
          MIN_SCALE,
          MAX_SCALE
        );
      } else if (fitMode === 'width') {
        const availableWidth = Math.max(
          240,
          els.canvasWrap.clientWidth -
            horizontalPadding
        );

        scale = clamp(
          availableWidth /
            baseViewport.width,
          MIN_SCALE,
          MAX_SCALE
        );
      }

      const viewport =
        page.getViewport({
          scale
        });

      const outputScale =
        calculateOutputScale(viewport);

      const canvasWidth = Math.max(
        1,
        Math.floor(
          viewport.width * outputScale
        )
      );

      const canvasHeight = Math.max(
        1,
        Math.floor(
          viewport.height * outputScale
        )
      );

      els.canvas.width = canvasWidth;
      els.canvas.height = canvasHeight;

      els.canvas.style.width =
        `${Math.floor(viewport.width)}px`;

      els.canvas.style.height =
        `${Math.floor(viewport.height)}px`;

      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(
        0,
        0,
        canvasWidth,
        canvasHeight
      );
      ctx.restore();

      const transform =
        outputScale !== 1
          ? [
              outputScale,
              0,
              0,
              outputScale,
              0,
              0
            ]
          : null;

      renderTask = page.render({
        canvasContext: ctx,
        viewport,
        transform,
        background: '#ffffff'
      });

      await renderTask.promise;

      if (
        serial !== renderSerial ||
        requestedPage !== pageNum
      ) {
        return;
      }

      updatePdfControls();

      /*
       * Đưa vùng cuộn về đầu trang khi chuyển sang trang khác.
       */
      els.canvasWrap.scrollTop = 0;
      els.canvasWrap.scrollLeft = 0;
    } catch (error) {
      if (
        error?.name ===
        'RenderingCancelledException'
      ) {
        return;
      }

      if (serial === renderSerial) {
        showToast(
          `Lỗi vẽ trang PDF: ${getErrorMessage(error)}`,
          true
        );
      }
    } finally {
      if (serial === renderSerial) {
        renderTask = null;
        setLoading(false);
      }
    }
  }

  function goToPage(page) {
    if (!pdfDoc) return;

    const parsedPage = Number.parseInt(
      page,
      10
    );

    if (!Number.isInteger(parsedPage)) {
      els.pageInput.value = pageNum;
      return;
    }

    const nextPage = clamp(
      parsedPage,
      1,
      pdfDoc.numPages
    );

    if (nextPage === pageNum) {
      els.pageInput.value = pageNum;
      return;
    }

    pageNum = nextPage;
    renderPage();
  }

  function setScale(nextScale) {
    if (!pdfDoc) return;

    setFitHeightScreen(false);
    scale = clamp(
      Number(nextScale) || scale,
      MIN_SCALE,
      MAX_SCALE
    );

    fitMode = 'manual';
    renderPage();
  }

  function fitToWidth() {
    if (!pdfDoc) return;

    setFitHeightScreen(false);
    fitMode = 'width';
    requestAnimationFrame(renderPage);
  }

  function fitToHeight() {
    if (!pdfDoc) return;

    fitMode = 'height';
    setFitHeightScreen(true);

    requestAnimationFrame(() => {
      requestAnimationFrame(renderPage);
    });
  }

  function setFitHeightScreen(enabled) {
    const isEnabled = document.body.classList.contains('fit-height-mode');
    if (enabled === isEnabled) return;

    if (enabled) {
      sidebarWasCollapsedBeforeHeight = els.mainLayout.classList.contains('sidebar-collapsed');
      els.mainLayout.classList.add('sidebar-collapsed');
      els.sidebar.classList.remove('open');
      document.body.classList.add('fit-height-mode');
      els.btnFitHeight.setAttribute('aria-pressed', 'true');
    } else {
      document.body.classList.remove('fit-height-mode');
      els.btnFitHeight.setAttribute('aria-pressed', 'false');
      if (!sidebarWasCollapsedBeforeHeight && window.innerWidth > 860) {
        els.mainLayout.classList.remove('sidebar-collapsed');
      }
      updateLibraryButton();
    }
  }

  function updatePdfControls() {
    const enabled =
      Boolean(pdfDoc) &&
      currentMode === 'pdf';

    els.pdfControls.forEach(element => {
      element.disabled = !enabled;
    });

    if (!enabled) {
      return;
    }

    els.pageInput.value =
      String(pageNum);

    els.pageCount.textContent =
      String(pdfDoc.numPages);

    els.btnPrev.disabled =
      pageNum <= 1;

    els.btnNext.disabled =
      pageNum >= pdfDoc.numPages;

    els.pagePrevOverlay.disabled = pageNum <= 1;
    els.pageNextOverlay.disabled = pageNum >= pdfDoc.numPages;
    els.pageIndicator.textContent = `Trang ${pageNum} / ${pdfDoc.numPages}`;

    els.btnZoomOut.disabled =
      scale <= MIN_SCALE + 0.001;

    els.btnZoomIn.disabled =
      scale >= MAX_SCALE - 0.001;

    els.zoomLabel.textContent =
      `${Math.round(scale * 100)}%`;

    els.btnFit.classList.toggle(
      'fit-active',
      fitMode === 'width'
    );

    els.btnFitHeight.classList.toggle(
      'fit-active',
      fitMode === 'height'
    );
  }

  function resetPdfControls() {
    els.pdfControls.forEach(element => {
      element.disabled = true;
    });

    els.pageInput.value = '1';
    els.pageCount.textContent = '0';
    els.zoomLabel.textContent = '100%';
    els.pagePrevOverlay.disabled = true;
    els.pageNextOverlay.disabled = true;
    els.pageIndicator.textContent = 'Trang 0 / 0';

    els.btnFit.classList.remove(
      'fit-active'
    );

    els.btnFitHeight.classList.remove(
      'fit-active'
    );
  }

  function toggleLibrary() {
    if (window.innerWidth <= 860) {
      els.sidebar.classList.toggle('open');
      return;
    }

    els.mainLayout.classList.toggle(
      'sidebar-collapsed'
    );

    updateLibraryButton();

    if (
      pdfDoc &&
      (
        fitMode === 'width' ||
        fitMode === 'height'
      )
    ) {
      setTimeout(() => {
        renderPage();
      }, 280);
    }
  }

  function updateLibraryButton() {
    const collapsed =
      els.mainLayout.classList.contains(
        'sidebar-collapsed'
      );

    els.btnLibrary.textContent =
      collapsed
        ? '☰ Mở tủ sách'
        : '✕ Đóng tủ sách';
  }

  function closeMobileSidebar() {
    if (window.innerWidth <= 860) {
      els.sidebar.classList.remove('open');
    }
  }

  function abortCurrentWork() {
    if (currentAbortController) {
      currentAbortController.abort();
      currentAbortController = null;
    }

    renderSerial++;

    if (renderTask) {
      try {
        renderTask.cancel();
      } catch (error) {
        console.warn(error);
      }

      renderTask = null;
    }

    if (pdfLoadingTask) {
      try {
        pdfLoadingTask.destroy();
      } catch (error) {
        console.warn(error);
      }

      pdfLoadingTask = null;
    }

    if (pdfDoc) {
      try {
        pdfDoc.destroy();
      } catch (error) {
        console.warn(error);
      }

      pdfDoc = null;
    }

    currentRangeTransport = null;

    clearCanvas();
  }

  async function releasePdfResources() {
    renderSerial++;

    if (renderTask) {
      try {
        renderTask.cancel();
      } catch (error) {
        console.warn(error);
      }

      renderTask = null;
    }

    if (pdfLoadingTask) {
      try {
        await pdfLoadingTask.destroy();
      } catch (error) {
        console.warn(error);
      }

      pdfLoadingTask = null;
    }

    if (pdfDoc) {
      try {
        await pdfDoc.destroy();
      } catch (error) {
        console.warn(error);
      }

      pdfDoc = null;
    }

    currentRangeTransport = null;
    clearCanvas();
  }

  function clearCanvas() {
    els.canvas.width = 1;
    els.canvas.height = 1;
    els.canvas.style.width = '1px';
    els.canvas.style.height = '1px';

    ctx.clearRect(
      0,
      0,
      els.canvas.width,
      els.canvas.height
    );
  }

  function createLimiter(maximum) {
    const max = Math.max(
      1,
      Number(maximum) || 1
    );

    let active = 0;
    const queue = [];

    const runNext = () => {
      while (
        active < max &&
        queue.length > 0
      ) {
        const job = queue.shift();
        active++;

        Promise.resolve()
          .then(job.task)
          .then(job.resolve, job.reject)
          .finally(() => {
            active--;
            runNext();
          });
      }
    };

    return task => {
      return new Promise(
        (resolve, reject) => {
          queue.push({
            task,
            resolve,
            reject
          });

          runNext();
        }
      );
    };
  }

  function getGlobalChunk(key) {
    const bytes =
      globalChunkCache.get(key);

    if (!bytes) {
      return null;
    }

    /*
     * Di chuyển phần tử vừa dùng xuống cuối Map
     * để tạo cơ chế LRU đơn giản.
     */
    globalChunkCache.delete(key);
    globalChunkCache.set(key, bytes);

    return bytes;
  }

  function putGlobalChunk(key, bytes) {
    if (!(bytes instanceof Uint8Array)) {
      return;
    }

    if (
      bytes.byteLength >
      GLOBAL_CHUNK_CACHE_LIMIT / 2
    ) {
      return;
    }

    const oldBytes =
      globalChunkCache.get(key);

    if (oldBytes) {
      globalChunkCacheBytes -=
        oldBytes.byteLength;

      globalChunkCache.delete(key);
    }

    globalChunkCache.set(key, bytes);

    globalChunkCacheBytes +=
      bytes.byteLength;

    while (
      globalChunkCacheBytes >
        GLOBAL_CHUNK_CACHE_LIMIT &&
      globalChunkCache.size > 0
    ) {
      const oldestKey =
        globalChunkCache.keys().next().value;

      const oldestBytes =
        globalChunkCache.get(oldestKey);

      globalChunkCache.delete(oldestKey);

      globalChunkCacheBytes -=
        oldestBytes?.byteLength || 0;
    }

    globalChunkCacheBytes = Math.max(
      0,
      globalChunkCacheBytes
    );
  }

  function setLoading(
    show,
    text = '',
    percent = 0
  ) {
    els.statusBox.hidden = !show;

    if (!show) {
      els.statusText.textContent = '';
      els.statusPercent.textContent = '';
      els.progressBar.style.width = '0%';
      return;
    }

    const safePercent = clamp(
      Number(percent) || 0,
      0,
      100
    );

    els.statusText.textContent =
      text || 'Đang xử lý...';

    els.statusPercent.textContent =
      `${Math.round(safePercent)}%`;

    els.progressBar.style.width =
      `${safePercent}%`;
  }

  function showToast(
    message,
    isError = false
  ) {
    if (toastTimer) {
      clearTimeout(toastTimer);
    }

    els.toast.textContent =
      String(message || '');

    els.toast.className =
      `toast show ${isError ? 'error' : ''}`;

    toastTimer = setTimeout(() => {
      els.toast.className = 'toast';
      toastTimer = null;
    }, 3600);
  }

  function base64ToBytes(base64) {
    if (typeof base64 !== 'string') {
      throw new Error(
        'Dữ liệu chunk không phải chuỗi Base64.'
      );
    }

    let binary;

    try {
      binary = atob(base64);
    } catch (error) {
      throw new Error(
        'Không giải mã được dữ liệu Base64.'
      );
    }

    const bytes =
      new Uint8Array(binary.length);

    for (
      let index = 0;
      index < binary.length;
      index++
    ) {
      bytes[index] =
        binary.charCodeAt(index);
    }

    return bytes;
  }

  function normalize(value) {
    return String(value || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .trim();
  }

  function getExtension(filename) {
    const name = String(filename || '');
    const dotIndex = name.lastIndexOf('.');

    if (dotIndex < 0) {
      return '';
    }

    return name
      .slice(dotIndex + 1)
      .toLowerCase()
      .trim();
  }

  function formatBytes(bytes) {
    const value = Number(bytes);

    if (
      !Number.isFinite(value) ||
      value <= 0
    ) {
      return '0 B';
    }

    const units = [
      'B',
      'KB',
      'MB',
      'GB'
    ];

    const index = Math.min(
      units.length - 1,
      Math.floor(
        Math.log(value) /
        Math.log(1024)
      )
    );

    const number =
      value / Math.pow(1024, index);

    return (
      index === 0
        ? number.toFixed(0)
        : number.toFixed(1)
    ) + ' ' + units[index];
  }

  function escapeHtml(value) {
    return String(value || '')
      .replace(
        /[&<>'"]/g,
        character => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        })[character]
      );
  }

  function getErrorMessage(error) {
    if (!error) {
      return 'Đã xảy ra lỗi không xác định.';
    }

    if (typeof error === 'string') {
      return error;
    }

    return (
      error.message ||
      'Đã xảy ra lỗi không xác định.'
    );
  }

  function isAbortError(error) {
    return Boolean(
      error &&
      (
        error.name === 'AbortError' ||
        error.code === 20 ||
        error.message === 'AbortError' ||
        /aborted|aborterror/i.test(
          String(error.message || '')
        )
      )
    );
  }

  function createAbortError() {
    try {
      return new DOMException(
        'Tác vụ đã bị hủy.',
        'AbortError'
      );
    } catch (error) {
      const abortError =
        new Error('AbortError');

      abortError.name = 'AbortError';

      return abortError;
    }
  }

  function revokeCurrentMobiUrl() {
    if (!currentMobiBlobUrl) return;

    URL.revokeObjectURL(
      currentMobiBlobUrl
    );

    currentMobiBlobUrl = '';
  }

  function cleanupBeforeUnload() {
    setFitHeightScreen(false);
    abortCurrentWork();
    revokeCurrentMobiUrl();
    globalChunkCache.clear();
    pendingChunkRequests.clear();
    globalChunkCacheBytes = 0;
  }

  function clamp(value, min, max) {
    return Math.min(
      max,
      Math.max(min, value)
    );
  }

  function debounce(callback, wait) {
    let timer = null;

    return function debounced(...args) {
      clearTimeout(timer);

      timer = setTimeout(() => {
        callback.apply(this, args);
      }, wait);
    };
  }

  function delay(milliseconds) {
    return new Promise(resolve => {
      setTimeout(resolve, milliseconds);
    });
  }
</script>
