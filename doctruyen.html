<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Đọc Truyện Tranh</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --primary-color: #ff5252;
            --card-bg: #1e1e1e;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        header { margin-bottom: 20px; }
        input[type="text"] {
            padding: 10px;
            width: 60%;
            max-width: 400px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: var(--primary-color);
            color: white;
            cursor: pointer;
            margin-left: 5px;
            transition: 0.2s;
        }
        button:hover:not(:disabled) { background-color: #ff1744; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        
        #section-title {
            text-align: left;
            padding-left: 20px;
            margin-top: 20px;
            color: var(--primary-color);
        }

        /* Grid Truyện */
        #results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .manga-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }
        .manga-card:hover { transform: scale(1.05); }
        .manga-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
        }
        .manga-card h3 {
            font-size: 14px;
            padding: 12px 10px;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Phân trang */
        .pagination {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .pagination span { font-weight: bold; }

        /* Chi tiết truyện & Chapter */
        #details, #reader { display: none; }
        .chapter-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 600px;
            margin: 20px auto;
        }
        .chapter-item {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 5px;
            cursor: pointer;
            text-align: left;
        }
        .chapter-item:hover { background-color: #333; }
        
        /* Khung Đọc Truyện */
        .page-image {
            max-width: 100%;
            margin-bottom: 10px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        
        .nav-buttons { margin-bottom: 20px; text-align: left; padding-left: 20px; }
        #loading { display: none; margin: 20px; color: var(--primary-color); font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1 style="cursor: pointer;" onclick="loadHomePage(1)">📖 Manga Reader</h1>
        <div id="search-bar">
            <input type="text" id="searchInput" placeholder="Nhập tên truyện (VD: One Piece, Naruto)..." onkeypress="if(event.key === 'Enter') searchManga(1)">
            <button onclick="searchManga(1)">Tìm kiếm</button>
        </div>
    </header>

    <div id="loading">Đang tải dữ liệu, vui lòng chờ...</div>

    <!-- Màn hình chính -->
    <div id="home-screen">
        <h2 id="section-title">🔥 Truyện Mới Cập Nhật</h2>
        <div id="results"></div>
        <div class="pagination" id="pagination"></div>
    </div>

    <!-- Màn hình 2: Chi tiết truyện -->
    <div id="details">
        <div class="nav-buttons">
            <button onclick="showHome()">⬅ Quay lại danh sách</button>
        </div>
        <h2 id="manga-title">Tên Truyện</h2>
        <div class="chapter-list" id="chapter-list"></div>
    </div>

    <!-- Màn hình 3: Đọc truyện -->
    <div id="reader">
        <div class="nav-buttons">
            <button onclick="showDetails()">⬅ Quay lại mục lục</button>
        </div>
        <div id="reader-pages"></div>
    </div>

    <script>
        const API_BASE = "https://api.mangadex.org";
        const UPLOAD_BASE = "https://uploads.mangadex.org";
        
        // BẬT/TẮT PROXY: Đổi thành 'false' nếu bạn đã cấu hình Vercel Rewrite
        const USE_PROXY = true; 

        // Hàm bọc URL để xử lý lỗi CORS an toàn với allorigins
        function buildUrl(path) {
            const targetUrl = API_BASE + path;
            if (USE_PROXY) {
                // Phải encodeURIComponent để các ký tự &, ? trong URL không bị hỏng
                return "https://api.allorigins.win/raw?url=" + encodeURIComponent(targetUrl);
            }
            return targetUrl;
        }
        
        let currentPage = 1;
        const limit = 12;
        let isSearching = false;
        let currentQuery = "";

        window.onload = () => loadHomePage(1);

        async function loadHomePage(page = 1) {
            isSearching = false;
            currentPage = page;
            const offset = (page - 1) * limit;
            
            const path = `/manga?limit=${limit}&offset=${offset}&includes[]=cover_art&availableTranslatedLanguage[]=vi&availableTranslatedLanguage[]=en&hasAvailableChapters=true&order[latestUploadedChapter]=desc`;
            
            document.getElementById("section-title").innerText = "🔥 Truyện Mới Cập Nhật";
            document.getElementById("searchInput").value = ""; 
            await fetchAndRenderManga(buildUrl(path));
        }

        async function searchManga(page = 1) {
            const query = document.getElementById("searchInput").value.trim();
            if (!query) {
                loadHomePage(1);
                return;
            }
            
            isSearching = true;
            currentQuery = query;
            currentPage = page;
            const offset = (page - 1) * limit;
            
            const path = `/manga?title=${encodeURIComponent(currentQuery)}&limit=${limit}&offset=${offset}&includes[]=cover_art&availableTranslatedLanguage[]=vi&availableTranslatedLanguage[]=en`;
            
            document.getElementById("section-title").innerText = `🔍 Kết quả tìm kiếm cho: "${currentQuery}"`;
            await fetchAndRenderManga(buildUrl(path));
        }

        async function fetchAndRenderManga(url) {
            showLoading(true);
            showHome();
            const resultsDiv = document.getElementById("results");
            resultsDiv.innerHTML = "";
            
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error("Mạng hoặc Proxy gặp lỗi!");
                const data = await res.json();
                
                if (!data.data || data.data.length === 0) {
                    resultsDiv.innerHTML = "<p>Không tìm thấy truyện nào.</p>";
                    renderPagination(0);
                } else {
                    data.data.forEach(manga => {
                        const title = manga.attributes.title?.en || manga.attributes.title?.vi || manga.attributes.title?.["ja-ro"] || "Không rõ tên";
                        
                        const coverRel = manga.relationships?.find(rel => rel.type === 'cover_art');
                        const coverFileName = coverRel ? coverRel.attributes.fileName : null;
                        const coverUrl = coverFileName ? `${UPLOAD_BASE}/covers/${manga.id}/${coverFileName}.256.jpg` : "https://via.placeholder.com/160x240?text=No+Cover";

                        const card = document.createElement("div");
                        card.className = "manga-card";
                        card.innerHTML = `
                            <img src="${coverUrl}" alt="${title}" loading="lazy">
                            <h3>${title}</h3>
                        `;
                        card.onclick = () => getChapters(manga.id, title);
                        resultsDiv.appendChild(card);
                    });
                    renderPagination(data.total);
                }
            } catch (err) {
                console.error("Fetch Error:", err);
                resultsDiv.innerHTML = `<p style='color: #ff5252;'>Lỗi tải dữ liệu: ${err.message}. Thử lại sau.</p>`;
            }
            showLoading(false);
        }

        function renderPagination(totalItems) {
            const totalPages = Math.ceil(totalItems / limit);
            const paginationDiv = document.getElementById("pagination");
            paginationDiv.innerHTML = "";
            
            if (totalPages > 1) {
                const prevBtn = document.createElement("button");
                prevBtn.innerText = "⬅ Trang trước";
                prevBtn.disabled = currentPage === 1;
                prevBtn.onclick = () => isSearching ? searchManga(currentPage - 1) : loadHomePage(currentPage - 1);
                
                const pageInfo = document.createElement("span");
                pageInfo.innerText = ` Trang ${currentPage} / ${totalPages > 800 ? "800+" : totalPages} `;
                
                const nextBtn = document.createElement("button");
                nextBtn.innerText = "Trang sau ➡";
                const maxPages = Math.floor(10000 / limit); 
                nextBtn.disabled = currentPage >= totalPages || currentPage >= maxPages;
                nextBtn.onclick = () => isSearching ? searchManga(currentPage + 1) : loadHomePage(currentPage + 1);
                
                paginationDiv.appendChild(prevBtn);
                paginationDiv.appendChild(pageInfo);
                paginationDiv.appendChild(nextBtn);
            }
        }

        async function getChapters(mangaId, title) {
            showLoading(true);
            document.getElementById("home-screen").style.display = "none";
            document.getElementById("reader").style.display = "none";
            document.getElementById("details").style.display = "block";
            
            document.getElementById("manga-title").innerText = title;
            const chapterList = document.getElementById("chapter-list");
            chapterList.innerHTML = "";

            try {
                const path = `/manga/${mangaId}/feed?translatedLanguage[]=vi&translatedLanguage[]=en&order[chapter]=desc&limit=100`;
                const res = await fetch(buildUrl(path));
                const data = await res.json();
                
                if(!data.data || data.data.length === 0) {
                    chapterList.innerHTML = "<p>Truyện này chưa có chapter (Tiếng Việt/Anh).</p>";
                } else {
                    data.data.forEach(ch => {
                        const chNum = ch.attributes.chapter ? `Chapter ${ch.attributes.chapter}` : "Oneshot";
                        const chTitle = ch.attributes.title ? `- ${ch.attributes.title}` : "";
                        const lang = ch.attributes.translatedLanguage ? ch.attributes.translatedLanguage.toUpperCase() : "N/A";
                        
                        const btn = document.createElement("div");
                        btn.className = "chapter-item";
                        btn.innerHTML = `<strong>[${lang}]</strong> ${chNum} ${chTitle}`;
                        btn.onclick = () => readChapter(ch.id);
                        chapterList.appendChild(btn);
                    });
                }
            } catch (err) {
                console.error("Chapter Error:", err);
            }
            showLoading(false);
        }

        async function readChapter(chapterId) {
            showLoading(true);
            document.getElementById("details").style.display = "none";
            document.getElementById("reader").style.display = "block";
            
            const readerPages = document.getElementById("reader-pages");
            readerPages.innerHTML = "";

            try {
                const path = `/at-home/server/${chapterId}`;
                const res = await fetch(buildUrl(path));
                const data = await res.json();
                
                const baseUrl = data.baseUrl;
                const hash = data.chapter.hash;
                const pages = data.chapter.data;

                pages.forEach(page => {
                    const imgUrl = `${baseUrl}/data/${hash}/${page}`;
                    const img = document.createElement("img");
                    img.className = "page-image";
                    img.src = imgUrl;
                    img.loading = "lazy";
                    readerPages.appendChild(img);
                });
            } catch (err) {
                console.error("Read Error:", err);
            }
            showLoading(false);
            window.scrollTo(0,0);
        }

        function showHome() {
            document.getElementById("home-screen").style.display = "block";
            document.getElementById("details").style.display = "none";
            document.getElementById("reader").style.display = "none";
        }

        function showDetails() {
            document.getElementById("home-screen").style.display = "none";
            document.getElementById("details").style.display = "block";
            document.getElementById("reader").style.display = "none";
        }

        function showLoading(show) {
            document.getElementById("loading").style.display = show ? "block" : "none";
        }
    </script>
</body>
</html>
