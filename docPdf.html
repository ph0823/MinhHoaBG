<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Tủ sách XNhi Google Drive - 2026</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --surface: #ffffff;
      --bg: #eef2f5;
      --text: #172033;
      --muted: #64748b;
      --border: #dbe3ea;
      --danger: #b91c1c;
      --shadow: 0 10px 28px rgba(15, 23, 42, .09);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; color: var(--text); background: var(--bg);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
    
    /* Header & Toolbar */
    .topbar {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 18px; background: var(--surface); border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(15, 23, 42, .05); z-index: 5;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 250px; }
    .brand-icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: #ccfbf1; font-size: 23px; }
    .brand h1 { margin: 0; font-size: 18px; }
    .brand small { display: block; margin-top: 2px; color: var(--muted); }
    .status { margin-left: auto; min-width: 260px; max-width: 460px; }
    .status-row { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    .progress { height: 7px; overflow: hidden; background: #e2e8f0; border-radius: 999px; }
    .progress > div { height: 100%; width: 0; background: var(--primary); transition: width .2s ease; }
    
    /* Layout */
    .layout {
      min-height: 0; display: grid; grid-template-columns: 330px minmax(0, 1fr);
      gap: 14px; padding: 14px; transition: grid-template-columns .24s ease, gap .24s ease;
    }
    .sidebar, .viewer {
      min-height: 0; background: var(--surface); border-radius: 14px;
      box-shadow: var(--shadow); border: 1px solid var(--border);
    }
    .sidebar {
      display: grid; grid-template-rows: auto auto 1fr; overflow: hidden; min-width: 0;
      opacity: 1; transform: translateX(0);
      transition: opacity .18s ease, transform .24s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .layout.sidebar-collapsed { grid-template-columns: 0 minmax(0, 1fr); gap: 0; }
    .layout.sidebar-collapsed .sidebar { opacity: 0; transform: translateX(-18px); pointer-events: none; border-color: transparent; box-shadow: none; }
    
    /* File List */
    .sidebar-head { padding: 14px; border-bottom: 1px solid var(--border); }
    .folder-title { font-weight: 750; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .breadcrumb { margin-top: 6px; font-size: 12px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .search-wrap { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .search-wrap input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; outline: none; }
    .search-wrap input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15, 118, 110, .12); }
    .file-list { list-style: none; padding: 8px; margin: 0; overflow: auto; }
    .file-item {
      display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center;
      width: 100%; padding: 10px; border: 0; border-radius: 10px; background: transparent; text-align: left; color: var(--text);
    }
    .file-item:hover, .file-item.active { background: #ecfdf5; }
    .file-item.active { outline: 1px solid #99f6e4; }
    .file-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; background: #f1f5f9; font-size: 19px; }
    .file-name { font-size: 14px; font-weight: 650; overflow-wrap: anywhere; }
    .file-meta { margin-top: 3px; font-size: 11px; color: var(--muted); }
    .empty { padding: 30px 16px; text-align: center; color: var(--muted); }
    
    /* Viewer & Toolbars */
    .viewer { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
    .toolbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px;
      padding: 10px; border-bottom: 1px solid var(--border); background: #fbfdfe;
    }
    .toolbar button, .toolbar input { height: 36px; border: 1px solid var(--border); border-radius: 9px; background: white; color: var(--text); }
    .toolbar button { padding: 0 12px; font-weight: 650; }
    .toolbar button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .toolbar button:disabled { opacity: .45; cursor: not-allowed; }
    .toolbar .primary { background: var(--primary); color: white; border-color: var(--primary); }
    .toolbar .primary:hover:not(:disabled) { background: var(--primary-dark); color: white; }
    .toolbar .fit-active { background: var(--primary); color: white; border-color: var(--primary); }
    .toolbar .library-toggle { color: var(--primary); border-color: #99f6e4; background: #ecfdf5; }
    .page-input { width: 62px; padding: 0 8px; text-align: center; }
    .divider { width: 1px; height: 24px; background: var(--border); margin: 0 2px; }
    .document-name { flex: 1 1 200px; min-width: 140px; max-width: 420px; margin-right: auto; padding: 0 8px; font-weight: 700; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    
    /* PDF Canvas View */
    .canvas-wrap { min-height: 0; overflow: auto; padding: 24px; text-align: center; background: #cbd5e1; }
    .canvas-stage { display: inline-block; position: relative; min-width: 1px; min-height: 1px; }
    canvas { display: block; background: white; box-shadow: 0 8px 30px rgba(15, 23, 42, .25); }
    
    /* Ebook Mobi View */
    .ebook-wrap {
      min-height: 0; overflow: auto; padding: 30px; background: #f1f5f9; 
      display: flex; justify-content: center;
    }
    .ebook-content {
      max-width: 800px; width: 100%; background: white; padding: 40px; 
      border-radius: 12px; box-shadow: 0 8px 30px rgba(15, 23, 42, .1);
      font-family: "Segoe UI", Arial, sans-serif; line-height: 1.8;
    }

    /* Common */
    .hidden { display: none !important; }
    .welcome { height: 100%; display: grid; place-items: center; color: #475569; }
    .welcome-box { max-width: 480px; padding: 28px; text-align: center; background: rgba(255,255,255,.72); border-radius: 16px; }
    .welcome-icon { font-size: 56px; }
    .toast {
      position: fixed; right: 18px; bottom: 18px; z-index: 20; max-width: min(420px, calc(100vw - 36px));
      padding: 12px 14px; border-radius: 11px; background: #0f172a; color: white; box-shadow: var(--shadow);
      opacity: 0; transform: translateY(12px); pointer-events: none; transition: .2s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: var(--danger); }
    .mobile-menu { display: none; }
    
    @media (max-width: 860px) {
      body { overflow: auto; }
      .app { min-height: 100%; height: auto; }
      .topbar { position: sticky; top: 0; }
      .brand { min-width: 0; }
      .brand small, .status { display: none; }
      .mobile-menu { display: inline-grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 10px; background: white; }
      .layout, .layout.sidebar-collapsed { grid-template-columns: 1fr; gap: 14px; min-height: calc(100vh - 66px); }
      .sidebar, .layout.sidebar-collapsed .sidebar {
        position: fixed; inset: 66px auto 0 0; z-index: 10; width: min(88vw, 350px);
        border-radius: 0 14px 14px 0; opacity: 1; pointer-events: auto; border-color: var(--border);
        box-shadow: var(--shadow); transform: translateX(-105%); transition: transform .22s ease;
      }
      .sidebar.open, .layout.sidebar-collapsed .sidebar.open { transform: translateX(0); }
      .viewer { min-height: calc(100vh - 94px); }
      .canvas-wrap, .ebook-wrap { padding: 12px; }
      .document-name { flex-basis: 100%; max-width: none; text-align: center; }
      .divider { display: none; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button id="mobileMenu" class="mobile-menu" type="button">☰</button>
    <div class="brand">
      <div class="brand-icon">📚</div>
      <div><h1>Tủ sách XNhi</h1><small>Hỗ trợ PDF & MOBI</small></div>
    </div>
    <div id="statusBox" class="status" hidden>
      <div class="status-row"><span id="statusText">Đang xử lý...</span><span id="statusPercent">0%</span></div>
      <div class="progress"><div id="progressBar"></div></div>
    </div>
  </header>

  <main id="mainLayout" class="layout">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <div id="folderTitle" class="folder-title">Đang kết nối...</div>
        <div id="breadcrumb" class="breadcrumb">Thư mục gốc</div>
      </div>
      <div class="search-wrap"><input id="searchInput" type="search" placeholder="Tìm file PDF hoặc MOBI..." autocomplete="off"></div>
      <ul id="fileList" class="file-list"><li class="empty">Đang tải...</li></ul>
    </aside>

    <section class="viewer">
      <div class="toolbar">
        <button id="btnLibrary" class="library-toggle" type="button">☰ Tủ sách</button>
        <div id="documentName" class="document-name">Chưa chọn tài liệu</div>
        
        <!-- Các nút này chủ yếu dành cho PDF -->
        <span class="pdf-controls" style="display:contents;">
          <button id="btnPrev" type="button" disabled>← Trước</button>
          <input id="pageInput" class="page-input" type="number" min="1" value="1" disabled>
          <span>/ <strong id="pageCount">0</strong></span>
          <button id="btnNext" type="button" disabled>Sau →</button>
          <span class="divider"></span>
          <button id="btnZoomOut" type="button" disabled>−</button>
          <strong id="zoomLabel">100%</strong>
          <button id="btnZoomIn" type="button" disabled>+</button>
          <button id="btnFit" type="button" disabled>↔ Vừa ngang</button>
          <button id="btnFitHeight" type="button" disabled>↕ Vừa cao</button>
        </span>
      </div>
      
      <!-- Vùng hiển thị Welcome -->
      <div id="welcome" class="welcome">
        <div class="welcome-box"><div class="welcome-icon">📄</div><h2>Chọn một file để bắt đầu</h2><p>Hỗ trợ đọc PDF phân mảnh và tải siêu tốc file MOBI.</p></div>
      </div>

      <!-- Vùng hiển thị PDF -->
      <div id="canvasWrap" class="canvas-wrap hidden">
        <div class="canvas-stage"><canvas id="pdfCanvas"></canvas></div>
      </div>
      
      <!-- Vùng hiển thị MOBI (Ebook) -->
      <div id="ebookWrap" class="ebook-wrap hidden">
        <div id="ebookContent" class="ebook-content"></div>
      </div>
    </section>
  </main>
</div>
<div id="toast" class="toast" role="status"></div>

<script>
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbz9Fd3kzo7TCoGvKO4AhHl_iv0LiCB3Y2L4bqkvrpjMwWYHtDscRm5JhPMthQaSw8lZ5A/exec';
  const ROOT_MARKER = '';
  const MIN_SCALE = 0.5, MAX_SCALE = 3, SCALE_STEP = 0.2;
  const MAX_PARALLEL_CHUNK_REQUESTS = 4; // Tăng luồng song song để tải Ebook lẹ hơn
  const GLOBAL_CHUNK_CACHE_LIMIT = 48 * 1024 * 1024;

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const els = {
    mainLayout: document.getElementById('mainLayout'), sidebar: document.getElementById('sidebar'),
    mobileMenu: document.getElementById('mobileMenu'), btnLibrary: document.getElementById('btnLibrary'),
    folderTitle: document.getElementById('folderTitle'), breadcrumb: document.getElementById('breadcrumb'),
    searchInput: document.getElementById('searchInput'), fileList: document.getElementById('fileList'),
    statusBox: document.getElementById('statusBox'), statusText: document.getElementById('statusText'),
    statusPercent: document.getElementById('statusPercent'), progressBar: document.getElementById('progressBar'),
    documentName: document.getElementById('documentName'), btnPrev: document.getElementById('btnPrev'),
    pageInput: document.getElementById('pageInput'), pageCount: document.getElementById('pageCount'),
    btnNext: document.getElementById('btnNext'), btnZoomOut: document.getElementById('btnZoomOut'),
    zoomLabel: document.getElementById('zoomLabel'), btnZoomIn: document.getElementById('btnZoomIn'),
    btnFit: document.getElementById('btnFit'), btnFitHeight: document.getElementById('btnFitHeight'),
    canvasWrap: document.getElementById('canvasWrap'), canvas: document.getElementById('pdfCanvas'),
    ebookWrap: document.getElementById('ebookWrap'), ebookContent: document.getElementById('ebookContent'),
    welcome: document.getElementById('welcome'), toast: document.getElementById('toast'),
    pdfControls: document.querySelectorAll('.pdf-controls button, .pdf-controls input')
  };

  const ctx = els.canvas.getContext('2d', { alpha: false });
  const globalChunkCache = new Map();
  let globalChunkCacheBytes = 0, folderStack = [], currentItems = [], currentFolderId = ROOT_MARKER;
  let activeFileId = '', pdfDoc = null, pdfLoadingTask = null, currentRangeTransport = null, currentAbortController = null;
  let pageNum = 1, scale = 1.25, fitMode = 'width';
  let renderTask = null, renderSerial = 0, loadToken = 0;
  let currentMode = ''; // 'pdf' hoặc 'mobi'

  document.addEventListener('DOMContentLoaded', init);

  function init() {
    bindEvents();
    els.btnLibrary.textContent = '✕ Đóng tủ sách';
    loadDirectory(ROOT_MARKER, true);
  }

  function bindEvents() {
    els.mobileMenu.addEventListener('click', () => els.sidebar.classList.toggle('open'));
    els.btnLibrary.addEventListener('click', toggleLibrary);
    els.searchInput.addEventListener('input', renderFileList);
    
    els.btnPrev.addEventListener('click', () => goToPage(pageNum - 1));
    els.btnNext.addEventListener('click', () => goToPage(pageNum + 1));
    els.pageInput.addEventListener('change', () => goToPage(Number(els.pageInput.value)));
    els.btnZoomOut.addEventListener('click', () => setScale(scale - SCALE_STEP));
    els.btnZoomIn.addEventListener('click', () => setScale(scale + SCALE_STEP));
    els.btnFit.addEventListener('click', fitToWidth);
    els.btnFitHeight.addEventListener('click', fitToHeight);
  }

  async function api(action, params = {}, options = {}) {
    const { signal, cache = 'no-store', bustCache = true, retries = 1 } = options;
    let lastError;
    for (let attempt = 0; attempt <= retries; attempt++) {
      try {
        const url = new URL(WEB_APP_URL);
        url.searchParams.set('action', action);
        url.searchParams.set('appType', 'pdf'); // API chung vẫn xài
        if (bustCache) url.searchParams.set('_', Date.now().toString());
        Object.entries(params).forEach(([k, v]) => v && url.searchParams.set(k, String(v)));
        
        const response = await fetch(url.toString(), { method: 'GET', cache, signal });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (!data.ok) throw new Error(data.error || 'Lỗi server');
        return data;
      } catch (error) {
        if (error?.name === 'AbortError') throw error;
        lastError = error;
        if (attempt < retries) await delay(300);
      }
    }
    throw lastError;
  }

  async function loadDirectory(folderId, reset = false) {
    setLoading(true, 'Đang nạp file...', 15);
    try {
      const data = await api('list', folderId ? { folderId } : {});
      currentFolderId = data.folder.id;
      currentItems = Array.isArray(data.files) ? data.files : [];
      if (reset) folderStack = [{ id: data.folder.id, name: data.folder.name }];
      els.folderTitle.textContent = data.folder.name;
      els.breadcrumb.textContent = folderStack.map(i => i.name).join(' › ');
      renderFileList();
      setLoading(false);
    } catch (e) {
      setLoading(false);
      showToast(e.message, true);
    }
  }

  function renderFileList() {
    const kw = normalize(els.searchInput.value);
    
    // HỖ TRỢ HIỂN THỊ CẢ FILE PDF VÀ MOBI
    const filtered = currentItems.filter(item => {
      const name = normalize(item.name);
      return name.includes(kw) && (item.isFolder || name.endsWith('.pdf') || name.endsWith('.mobi'));
    });
    
    const fragment = document.createDocumentFragment();
    if (folderStack.length > 1) fragment.appendChild(makeItem({ name: 'Thư mục trước', isFolder: true }, true));
    
    filtered.forEach(item => fragment.appendChild(makeItem(item, false)));
    els.fileList.replaceChildren(fragment);
  }

  function makeItem(item, isBack) {
    const li = document.createElement('li');
    const ext = item.name.split('.').pop().toLowerCase();
    const icon = isBack ? '↩️' : (item.isFolder ? '📁' : (ext === 'mobi' ? '📖' : '📄'));
    
    const btn = document.createElement('button');
    btn.className = `file-item ${!isBack && item.id === activeFileId ? 'active' : ''}`;
    btn.innerHTML = `<span class="file-icon">${icon}</span><span><div class="file-name">${escapeHtml(item.name)}</div>${!isBack && !item.isFolder ? `<div class="file-meta">${formatBytes(item.size)}</div>` : ''}</span>`;
    
    btn.addEventListener('click', () => {
      if (isBack) { folderStack.pop(); loadDirectory(folderStack[folderStack.length - 1].id); }
      else if (item.isFolder) { folderStack.push({ id: item.id, name: item.name }); loadDirectory(item.id); }
      else if (ext === 'mobi') openMobi(item); // Chuyển luồng đọc sang MOBI
      else openPdf(item);
    });
    li.appendChild(btn); return li;
  }

  // --- LOGIC XỬ LÝ ĐỌC MOBI HIỆU SUẤT CAO ---
  async function openMobi(file) {
    const token = ++loadToken;
    abortCurrentWork();
    currentAbortController = new AbortController();
    const signal = currentAbortController.signal;

    activeFileId = file.id;
    currentMode = 'mobi';
    renderFileList();
    if (window.innerWidth <= 860) els.sidebar.classList.remove('open');
    els.documentName.textContent = file.name;

    // Reset Giao Diện
    els.welcome.classList.add('hidden');
    els.canvasWrap.classList.add('hidden');
    els.ebookWrap.classList.remove('hidden');
    els.ebookContent.innerHTML = `<div style="text-align:center; padding: 50px;">Đang thiết lập luồng tải tốc độ cao...</div>`;
    
    // Tắt các nút của PDF
    els.pdfControls.forEach(el => el.disabled = true);

    try {
      setLoading(true, 'Đọc thông tin sách MOBI...', 5);
      const infoData = await api('getFileInfo', { fileId: file.id }, { signal });
      if (token !== loadToken) return;
      
      const info = infoData.file;
      const totalChunks = Number(info.totalChunks);
      const version = info.version || info.size;
      
      let loadedChunks = 0;
      const chunks = new Array(totalChunks);
      const limiter = createLimiter(MAX_PARALLEL_CHUNK_REQUESTS);
      
      const promises = [];
      for (let i = 0; i < totalChunks; i++) {
        promises.push(limiter(async () => {
          if (signal.aborted) throw new Error('AbortError');
          const cacheKey = `${file.id}_${version}_${i}`;
          let bytes = getGlobalChunk(cacheKey);
          
          if (!bytes) {
            const chunkData = await api('getFileChunk', { fileId: file.id, index: i, v: version }, { signal, cache: 'default' });
            if (signal.aborted) throw new Error('AbortError');
            bytes = base64ToBytes(chunkData.base64);
            putGlobalChunk(cacheKey, bytes);
          }
          
          chunks[i] = bytes;
          loadedChunks++;
          setLoading(true, `Tải dữ liệu sách...`, (loadedChunks / totalChunks) * 100);
        }));
      }
      
      await Promise.all(promises);
      if (token !== loadToken) return;
      
      setLoading(true, 'Đang ghép nối file...', 99);
      
      // Gộp các Uint8Array lại thành file MOBI hoàn chỉnh
      const totalLen = chunks.reduce((acc, c) => acc + c.length, 0);
      const fullData = new Uint8Array(totalLen);
      let offset = 0;
      for (const c of chunks) { fullData.set(c, offset); offset += c.length; }
      
      const blob = new Blob([fullData], { type: 'application/x-mobipocket-ebook' });
      
      // Chuyển dữ liệu vào Reader Wrapper
      renderMobiContainer(blob, file.name);
      
      setLoading(false);
      showToast(`Đã tải xong “${file.name}”.`);
    } catch (e) {
      if (token !== loadToken || e.message === 'AbortError') return;
      setLoading(false);
      els.ebookContent.innerHTML = `<h3 style="color:red">Lỗi tải MOBI: ${escapeHtml(e.message)}</h3>`;
      showToast(e.message, true);
    }
  }

  function renderMobiContainer(blob, filename) {
    const blobUrl = URL.createObjectURL(blob);
    
    // Giao diện đọc Mobi hoặc Fallback (Vì JS thuần không có CDN render MOBI ổn định ngay lập tức)
    els.ebookContent.innerHTML = `
      <div style="text-align: center;">
        <h1 style="font-size: 50px; margin: 0 0 10px 0;">📖</h1>
        <h2 style="margin-bottom: 20px; color: var(--primary-dark);">${escapeHtml(filename)}</h2>
        <p style="color: var(--muted); margin-bottom: 20px;">
          Tài liệu MOBI đã được ghép nối và nạp vào bộ nhớ RAM của trình duyệt thành công.
        </p>
        <div style="padding: 20px; background: #ecfdf5; border-radius: 8px; display: inline-block; text-align: left;">
          <strong>💡 Developer Note:</strong><br>
          File đã sẵn sàng ở dạng <code>Blob</code>. Bạn có thể sử dụng các thư viện như 
          <a href="https://github.com/johnfactotum/foliate-js" target="_blank">foliate-js</a> 
          nhúng vào hàm này để render trực tiếp HTML của sách.
        </div>
        <br><br>
        <a href="${blobUrl}" download="${escapeHtml(filename)}" 
           style="display:inline-block; padding: 12px 24px; background: var(--primary); color: white; text-decoration: none; border-radius: 8px; font-weight: bold; box-shadow: 0 4px 10px rgba(15,118,110,0.2);">
           ⬇️ Tải xuống file .MOBI
        </a>
      </div>
    `;
  }

  // --- LOGIC XỬ LÝ ĐỌC PDF (Giữ nguyên cấu trúc xịn của bạn) ---
  async function openPdf(file) {
    const token = ++loadToken;
    abortCurrentWork();
    currentAbortController = new AbortController();
    const signal = currentAbortController.signal;

    activeFileId = file.id;
    currentMode = 'pdf';
    renderFileList();
    if (window.innerWidth <= 860) els.sidebar.classList.remove('open');
    els.documentName.textContent = file.name;

    els.welcome.classList.add('hidden');
    els.ebookWrap.classList.add('hidden');
    els.canvasWrap.classList.remove('hidden');
    els.pdfControls.forEach(el => el.disabled = true);

    try {
      setLoading(true, 'Đang chuẩn bị luồng PDF...', 5);
      const infoData = await api('getFileInfo', { fileId: file.id }, { signal });
      const info = infoData.file;
      const version = info.version || info.size;

      const cacheKey = `${file.id}_${version}_0`;
      let firstChunk = getGlobalChunk(cacheKey);
      
      if (!firstChunk) {
        const cData = await api('getFileChunk', { fileId: file.id, index: 0, v: version }, { signal, cache: 'default' });
        firstChunk = base64ToBytes(cData.base64);
        putGlobalChunk(cacheKey, firstChunk);
      }

      currentRangeTransport = createPdfTransport(file, info, token, firstChunk, signal);
      currentRangeTransport.prefetchChunk(Number(info.totalChunks) - 1); // Prefetch table reference

      pdfLoadingTask = pdfjsLib.getDocument({
        range: currentRangeTransport, length: Number(info.size), disableAutoFetch: true,
        rangeChunkSize: currentRangeTransport.chunkSize, verbosity: 0
      });

      pdfDoc = await pdfLoadingTask.promise;
      if (token !== loadToken) return;

      pageNum = 1; els.pageCount.textContent = pdfDoc.numPages; els.pageInput.max = pdfDoc.numPages;
      await renderPage();
      setLoading(false);
    } catch (e) {
      if (token !== loadToken || e.message === 'AbortError') return;
      setLoading(false); showToast(e.message, true);
    }
  }

  function createPdfTransport(file, info, token, firstChunk, signal) {
    const transport = new pdfjsLib.PDFDataRangeTransport(Number(info.size), firstChunk.slice(), false, file.name);
    const chunkSize = Number(info.chunkSize) || firstChunk.length;
    const totalChunks = Number(info.totalChunks);
    const version = info.version || info.size;
    const requestLimit = createLimiter(MAX_PARALLEL_CHUNK_REQUESTS);
    
    transport.requestDataRange = async function(begin, end) {
      try {
        if (token !== loadToken || signal.aborted) return;
        const firstIdx = Math.floor(begin / chunkSize), lastIdx = Math.floor((end - 1) / chunkSize);
        const indexes = Array.from({ length: lastIdx - firstIdx + 1 }, (_, i) => firstIdx + i);
        
        const parts = await Promise.all(indexes.map(idx => requestLimit(async () => {
          const cKey = `${file.id}_${version}_${idx}`;
          let b = getGlobalChunk(cKey);
          if (!b) {
            const data = await api('getFileChunk', { fileId: file.id, index: idx, v: version }, { signal, cache: 'default' });
            b = base64ToBytes(data.base64);
            putGlobalChunk(cKey, b);
          }
          return b;
        })));
        
        const res = new Uint8Array(end - begin);
        let offset = 0;
        parts.forEach((p, i) => {
          const cStart = indexes[i] * chunkSize;
          const sStart = Math.max(0, begin - cStart), sEnd = Math.min(p.length, end - cStart);
          if (sEnd > sStart) { res.set(p.subarray(sStart, sEnd), offset); offset += sEnd - sStart; }
        });
        this.onDataRange(begin, res);
      } catch (e) {}
    };
    transport.prefetchChunk = (idx) => transport.requestDataRange(idx * chunkSize, (idx + 1) * chunkSize);
    transport.chunkSize = chunkSize; transport.totalChunks = totalChunks;
    return transport;
  }

  async function renderPage() {
    if (!pdfDoc) return;
    setLoading(true, `Hiển thị trang ${pageNum}...`, 0);
    const page = await pdfDoc.getPage(pageNum);
    
    const vpBase = page.getViewport({ scale: 1 });
    if (fitMode === 'height') scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, (els.canvasWrap.clientHeight - 48) / vpBase.height));
    else if (fitMode === 'width') scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, (els.canvasWrap.clientWidth - 48) / vpBase.width));
    
    const vp = page.getViewport({ scale });
    els.canvas.width = Math.floor(vp.width * 1.5);
    els.canvas.height = Math.floor(vp.height * 1.5);
    els.canvas.style.width = `${Math.floor(vp.width)}px`;
    els.canvas.style.height = `${Math.floor(vp.height)}px`;
    
    if (renderTask) renderTask.cancel();
    renderTask = page.render({ canvasContext: ctx, viewport: vp, transform: [1.5, 0, 0, 1.5, 0, 0] });
    await renderTask.promise;
    
    updatePdfControls();
    setLoading(false);
  }

  // --- TIỆN ÍCH CHUNG ---
  function abortCurrentWork() {
    if (currentAbortController) currentAbortController.abort();
    if (renderTask) { try { renderTask.cancel(); } catch (e){} }
  }

  function createLimiter(max) {
    let active = 0; const queue = [];
    const next = () => {
      while (active < max && queue.length) {
        const { t, res, rej } = queue.shift();
        active++; Promise.resolve().then(t).then(res, rej).finally(() => { active--; next(); });
      }
    };
    return (t) => new Promise((res, rej) => { queue.push({ t, res, rej }); next(); });
  }

  function getGlobalChunk(key) { return globalChunkCache.get(key); }
  function putGlobalChunk(key, bytes) {
    if (bytes.length > GLOBAL_CHUNK_CACHE_LIMIT / 2) return;
    globalChunkCache.set(key, bytes);
    globalChunkCacheBytes += bytes.length;
    while (globalChunkCacheBytes > GLOBAL_CHUNK_CACHE_LIMIT) {
      const k = globalChunkCache.keys().next().value;
      globalChunkCacheBytes -= globalChunkCache.get(k).length;
      globalChunkCache.delete(k);
    }
  }

  function goToPage(p) { if (!pdfDoc) return; pageNum = Math.max(1, Math.min(pdfDoc.numPages, p)); renderPage(); }
  function setScale(s) { scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, s)); fitMode = 'manual'; renderPage(); }
  function fitToWidth() { fitMode = 'width'; renderPage(); }
  function fitToHeight() { fitMode = 'height'; renderPage(); }
  
  function updatePdfControls() {
    const on = !!pdfDoc;
    els.pdfControls.forEach(el => el.disabled = !on);
    els.pageInput.value = pageNum;
    els.btnPrev.disabled = pageNum <= 1;
    els.btnNext.disabled = pageNum >= pdfDoc.numPages;
    els.zoomLabel.textContent = `${Math.round(scale * 100)}%`;
  }

  function toggleLibrary() { els.mainLayout.classList.toggle('sidebar-collapsed'); if (pdfDoc) setTimeout(renderPage, 300); }
  function setLoading(show, txt = '', pct = 0) { els.statusBox.hidden = !show; els.statusText.textContent = txt; els.progressBar.style.width = `${pct}%`; }
  function showToast(msg, err = false) { els.toast.textContent = msg; els.toast.className = `toast show ${err ? 'error' : ''}`; setTimeout(() => els.toast.className = 'toast', 3000); }
  function base64ToBytes(b64) { const bin = atob(b64), b = new Uint8Array(bin.length); for(let i=0; i<bin.length; i++) b[i]=bin.charCodeAt(i); return b; }
  function normalize(s) { return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); }
  function formatBytes(b) { const u = ['B','KB','MB','GB'], i = Math.min(3, Math.floor(Math.log(b||1)/Math.log(1024))); return `${(b/1024**i).toFixed(1)} ${u[i]}`; }
  function escapeHtml(s) { return String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
  function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
</body>
