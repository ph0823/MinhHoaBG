function bindQuestion(){document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>updateAnswer(b.dataset.choice,b.dataset.value));document.querySelectorAll('[data-answer]').forEach(b=>{let handle=()=>{const id=b.dataset.answer,n=+b.dataset.index,cur=Array.isArray(rec.answers[id])?rec.answers[id].slice():[];cur[n]=b.value;updateAnswer(id,cur)};b.addEventListener(b.tagName==='INPUT'?'change':'change',handle)});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{let p=b.dataset.tab;if(p==='END')idx=tasks.length+bonus.length;else if(p==='D')idx=tasks.length;else idx=tasks.findIndex(t=>t.part===p);rec.meta.currentActivity=idx;saveLocal();render()});let s=$('submit');if(s)s.onclick=submit;let r=$('reviewMistakes');if(r)r.onclick=()=>{$('mistakes').innerHTML=grade(rec).details.filter(x=>!x.correct).map(x=>`<div class="wrong">${e(x.id)} · ${e(x.title)} · ${x.points.toFixed(2)}/${x.max.toFixed(2)} điểm</div>`).join('')||'<div class="info">Không có câu sai.</div>'};let u=$('retrySubmit');if(u)u.onclick=()=>sync(true)}
async function ensureAnonymous(){initFirebase();if(auth.currentUser&&!auth.currentUser.isAnonymous)await auth.signOut();if(!auth.currentUser)await auth.signInAnonymously();uid=auth.currentUser.uid;ref=db.ref(ROOT+'/'+uid)}
function sameIdentity(x,c,n,name){return x&&x.className===c&&Number(x.studentNo)===Number(n)&&String(x.name).trim().toLowerCase()===name.trim().toLowerCase()}
async function openStudent(c,n,name,k){key=k;let draft=local(k);rec=draft||newRecord(c,n,name);if(rec.submissionPending&&!rec.submitted)rec.submissionPending=false;idx=Math.max(0,Math.min(tasks.length+bonus.length,Number(rec.meta?.currentActivity||0)));$('login').classList.add('hidden');$('student').classList.remove('hidden');render();saveLocal();try{await ensureAnonymous();const s=JSON.parse(localStorage.getItem(SESSION)||'{}');const remoteSnap=await ref.once('value');let remote=remoteSnap.val();if(remote&&!sameIdentity(remote,c,n,name)){
// Anonymous user already owns another student's record: rotate UID safely.
await auth.signOut();await auth.signInAnonymously();uid=auth.currentUser.uid;ref=db.ref(ROOT+'/'+uid);remote=null;rec.syncedRevision=0;rec.revision=0;
}
if(remote&&sameIdentity(remote,c,n,name)){
 if(remote.submittedAt){rec={...remote,submitted:true,submissionPending:false,serverConfirmed:true,syncedRevision:Number(remote.revision||0)};}
 else if(!draft||(!draft.dirty&&Number(remote.revision||0)>Number(draft.syncedRevision||draft.revision||0))){rec={...remote,serverConfirmed:true,dirty:false,syncedRevision:Number(remote.revision||0)};}else if(draft&&remote){rec.syncedRevision=Number(draft.syncedRevision||0);rec.dirty=true;}
}
rec.meta=rec.meta||{worksheetId:WID,version:VERSION,currentActivity:idx};saveLocal();render();if(!rec.submitted||!rec.serverConfirmed)await sync();
}catch(err){console.error('Student init/sync',err);saveLabel('Chưa đồng bộ',true)}}
async function start(){let c=$('cls').value,n=$('stt').value,name=$('fullname').value.trim().replace(/\s+/g,' ');if(!c||!n||name.length<2){toast('Nhập đủ lớp, STT và họ tên.');return}$('start').disabled=true;try{await openStudent(c,n,name,ident(c,n,name))}finally{$('start').disabled=false}}
function recoverOffer(){try{let s=JSON.parse(localStorage.getItem(SESSION)||'{}'),d=local(s.key);if(!d)return;$('recovery').classList.remove('hidden');$('recoverLabel').textContent=`Bài đang lưu: ${d.className} · STT ${d.studentNo} · ${d.name}`;$('recover').onclick=()=>{openStudent(d.className,d.studentNo,d.name,s.key);$('recovery').classList.add('hidden')}}catch(err){console.warn('Recovery',err)}}
// Writes are serialized. Final submission only becomes immutable after server acknowledgement.
function queueWrite(final=false){
 const target=rec, targetRef=ref, targetKey=key, targetUid=uid, generation=writeGeneration;
 if(!target||!targetRef||teacherMode)return Promise.resolve(false);
 const job=async()=>{
  if(rec!==target||ref!==targetRef||key!==targetKey||uid!==targetUid||writeGeneration!==generation)return false;
  if(!auth?.currentUser||auth.currentUser.uid!==targetUid)throw Error('Phiên học sinh thay đổi');
  const wantedAnswers=JSON.stringify(target.answers||{});
  const baseRevision=Number(target.syncedRevision||0);
  let conflict=false, submittedRemote=false;
  const result=await targetRef.transaction(remote=>{
   if(remote){
    if(!sameIdentity(remote,target.className,target.studentNo,target.name)){conflict=true;return;}
    if(remote.submittedAt){submittedRemote=true;return;}
    if(Number(remote.revision||0)!==baseRevision){conflict=true;return;}
   }else if(baseRevision!==0){conflict=true;return;}
   const nextRevision=Number(remote?.revision||0)+1;
   const obj={...(remote||{}),className:target.className,studentNo:Number(target.studentNo),name:target.name,
     ownerUid:targetUid,createdAt:remote?.createdAt||target.createdAt,
     updatedAt:firebase.database.ServerValue.TIMESTAMP,
     answers:JSON.parse(wantedAnswers),revision:nextRevision,
     submitted:!!final,meta:{worksheetId:WID,version:VERSION,currentActivity:idx}};
   if(final)obj.submittedAt=firebase.database.ServerValue.TIMESTAMP;
   return obj;
  },undefined,false);
  if(!result.committed){
   const remote=(await targetRef.once('value')).val();
   if(remote?.submittedAt&&sameIdentity(remote,target.className,target.studentNo,target.name)){
    // Never overwrite a server-confirmed submission.
    rec={...remote,submitted:true,submissionPending:false,serverConfirmed:true,dirty:false,syncedRevision:Number(remote.revision||0)};
    saveLocal();render();return true;
   }
   if(conflict)throw Error('Dữ liệu đã đổi từ phiên khác; giữ bản nháp trên máy để tránh ghi đè');
   throw Error('Ghi dữ liệu chưa được xác nhận');
  }
  if(rec!==target||ref!==targetRef||key!==targetKey||writeGeneration!==generation)return false;
  const saved=result.snapshot.val();
  if(!saved||!sameIdentity(saved,target.className,target.studentNo,target.name)|| (final&&!saved.submittedAt))throw Error('Máy chủ chưa xác nhận dữ liệu');
  target.syncedRevision=Number(saved.revision||0);
  if(final){
   target.submitted=true;target.submissionPending=false;target.submittedAt=saved.submittedAt;
   target.serverConfirmed=true;target.dirty=false;target.answers=saved.answers||{};
  }else{
   target.dirty=JSON.stringify(target.answers||{})!==wantedAnswers;
   target.serverConfirmed=!target.dirty;
  }
  saveLocal();render();
  return true;
 };
 const promise=writeQueue.catch(()=>{}).then(job);
 writeQueue=promise.catch(err=>{console.error('[PHT Tin9 B6] ghi Firebase',err);});
 return promise;
}
async function sync(force=false){
 if(!rec||teacherMode||!ref)return false;
 if(rec.serverConfirmed&&rec.submitted)return true;
 if(rec.submissionPending&&!force)return false;
 try{
  const ok=await queueWrite(!!rec.submissionPending);
  if(ok)saveLabel('');
  return ok;
 }catch(err){console.error('[PHT Tin9 B6] đồng bộ',err);if(rec){rec.serverConfirmed=false;rec.dirty=true;saveLocal();}saveLabel('Chưa đồng bộ',true);return false;}
}
async function submit(){
 if(!rec||rec.submitted||rec.submissionPending)return;
 const missing=tasks.filter(t=>!isComplete(t,rec.answers||{}));
 if(missing.length){toast('Còn '+missing.length+' nhiệm vụ chưa hoàn thành.');idx=tasks.indexOf(missing[0]);render();return;}
 clearTimeout(saveTimer);
 rec.submissionPending=true;rec.serverConfirmed=false;rec.dirty=true;saveLocal();render();
 const student=rec;
 const ok=await sync(true);
 if(rec!==student&&rec?.submitted){toast(rec.name+': Bài đã được nộp.');return;}
 if(ok&&student.submitted&&student.serverConfirmed)toast(student.name+': Bài đã được nộp.');
 else {student.submissionPending=false;student.submitted=false;student.serverConfirmed=false;student.dirty=true;saveLocal();toast(student.name+': Chưa gửi được bài. Em có thể nộp lại.');}
 render();
}
async function leave(){writeGeneration++;writeQueue=Promise.resolve();if(rec&&!rec.serverConfirmed)saveLocal();clearTimeout(saveTimer);try{if(auth?.currentUser&&auth.currentUser.isAnonymous)await auth.signOut()}catch(err){console.warn('Signout',err)}rec=null;key='';uid='';ref=null;$('student').classList.add('hidden');$('login').classList.remove('hidden');try{localStorage.removeItem(SESSION)}catch(err){}$('cls').value='';$('stt').value='';$('fullname').value='';$('recovery').classList.add('hidden')}
async function teacherLogin(){writeGeneration++;writeQueue=Promise.resolve();try{$('teacherMsg').textContent='';initFirebase();if(auth.currentUser)await auth.signOut();let result=await auth.signInWithEmailAndPassword($('email').value.trim(),$('pass').value);let isTeacher=(await db.ref(ROLE+'/'+result.user.uid).once('value')).val()===true;if(!isTeacher){await auth.signOut();throw Error('Tài khoản chưa được cấp quyền giáo viên')}teacherMode=true;uid=result.user.uid;$('login').classList.add('hidden');$('teacher').classList.remove('hidden');watchTeacher()}catch(err){console.error('Teacher login',err);$('teacherMsg').textContent='Đăng nhập không thành công hoặc chưa có quyền.'}}
function grouped(){let groups={};Object.entries(rowsData).forEach(([u,r])=>{if(!r||!r.className||!r.studentNo||!r.name)return;let k=ident(r.className,r.studentNo,r.name);(groups[k]??=[]).push({uid:u,...r})});return Object.entries(groups).map(([k,entries])=>{entries.sort((a,b)=>Number(!!b.submittedAt)-Number(!!a.submittedAt)||Number(b.updatedAt||0)-Number(a.updatedAt||0));return {key:k,items:entries,r:entries[0]}}).sort((a,b)=>a.r.className.localeCompare(b.r.className,'vi',{numeric:true})||a.r.studentNo-b.r.studentNo)}
function filtered(){return grouped().filter(x=>{let f=$('filterClass').value,s=$('filterStatus').value,r=x.r;let needs=x.items.length>1||!r.submittedAt||grade(r).total<7||progress(r)<tasks.length||grade(r).details.some(d=>d.id.startsWith('C')&&!d.correct);return(f==='all'||r.className===f)&&(s==='all'||(s==='submitted'&&r.submittedAt)||(s==='draft'&&!r.submittedAt)||(s==='needs'&&needs))})}
function watchTeacher(){const rr=db.ref(ROOT);watchFn=snap=>{rowsData=snap.val()||{};$('teacherStatus').textContent='Đã kết nối Firebase';renderTeacher()};rr.on('value',watchFn,err=>{$('teacherStatus').textContent='Không tải được dữ liệu';console.error('Teacher read',err)})}
function renderTeacher(){if(!teacherMode)return;let all=grouped(),classes=[...new Set(all.map(x=>x.r.className))].sort(),v=$('filterClass').value;$('filterClass').innerHTML='<option value="all">Tất cả lớp</option>'+classes.map(c=>`<option value="${e(c)}">${e(c)}</option>`).join('');$('filterClass').value=classes.includes(v)?v:'all';let view=filtered(),submitted=all.filter(x=>x.r.submittedAt);$('summary').innerHTML=`<b>${all.length}</b> học sinh · <b>${submitted.length}</b> đã nộp · <b>${all.length-submitted.length}</b> chưa nộp · Trung bình ${submitted.length?(submitted.reduce((s,x)=>s+grade(x.r).total,0)/submitted.length).toFixed(2):'—'}/10`;
$('rows').innerHTML=view.map(x=>{let r=x.r,g=grade(r);return `<tr><td>${e(r.className)}</td><td>${r.studentNo}</td><td>${e(r.name)}${x.items.length>1?` <span class="tag bad">${x.items.length} UID</span>`:''}</td><td>${progress(r)}/${tasks.length}</td><td>${r.submittedAt?g.total.toFixed(2):'—'}</td><td>${r.submittedAt?'<span class="tag ok">Đã nộp</span>':'<span class="tag">Chưa nộp</span>'}</td><td><button class="btn secondary small" data-detail="${e(x.key)}">Xem</button> <button class="btn danger small" data-del="${e(x.key)}">Xoá</button></td></tr>`}).join('')||'<tr><td colspan="7">Chưa có học sinh trong bộ lọc.</td></tr>';
$('rows').querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>showDetail(b.dataset.detail));$('rows').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delRecord(b.dataset.del))}
function answerName(t,v){let opts=t.options||[];return Array.isArray(v)?v.map(a=>opts.find(o=>o[0]===a)?.[1]||a||'Chưa chọn').join(' / '):(opts.find(o=>o[0]===v)?.[1]||v||'Chưa chọn')}
function showDetail(k){let arr=filtered(),i=arr.findIndex(x=>x.key===k);if(i<0)return;teacherDetailKey=k;let {r,items}=arr[i],g=grade(r),errors=g.details.filter(x=>!x.correct);$('details').innerHTML=`<div class="detail" id="detailHead"><div class="sectionTop"><h3>${e(r.name)} · ${e(r.className)} · STT ${r.studentNo}</h3><button class="btn secondary small" id="closeDetails">Đóng</button></div><div class="row"><button class="btn secondary small" id="prevStudent" ${i===0?'disabled':''}>← HS trước</button><button class="btn secondary small" id="nextStudent" ${i===arr.length-1?'disabled':''}>HS sau →</button><strong>${r.submittedAt?g.total.toFixed(2)+'/10':'Chưa nộp'}</strong><span>${progress(r)}/${tasks.length} nhiệm vụ</span></div><p class="mini">${items.length>1?'Có nhiều UID cùng danh tính, cần đối chiếu.':''} Phần D: ${bonusResults(r).filter(x=>x.done).length}/3 bài nâng cao đúng.</p><h3>${errors.length} câu sai hoặc còn thiếu</h3>${errors.map(d=>{let t=tasks.find(x=>x.id===d.id);return `<div class="wrong"><b>${e(d.id)}: ${e(d.title)}</b><div>HS chọn: ${e(answerName(t,d.answer))}</div><div>Đáp án đúng: ${e(answerName(t,d.right))}</div><small>Điểm: ${d.points.toFixed(2)}/${d.max.toFixed(2)}</small></div>`}).join('')||'<div class="info">Đáp án tự chấm đều đúng.</div>'}</div>`;$('closeDetails').onclick=()=>{$('details').innerHTML='';teacherDetailKey=''};$('prevStudent').onclick=()=>showDetail(arr[i-1].key);$('nextStudent').onclick=()=>showDetail(arr[i+1].key);$('detailHead').scrollIntoView({behavior:'smooth',block:'start'})}
async function delRecord(k){let g=grouped().find(x=>x.key===k);if(!g||!confirm(`Xoá ${g.items.length} hồ sơ của ${g.r.name}?`))return;try{await Promise.all(g.items.map(x=>db.ref(ROOT+'/'+x.uid).remove()));$('details').innerHTML=''}catch(err){console.error('Teacher delete',err);alert('Không xoá được dữ liệu.')}}
function csvExport(){let data=[['Lớp','STT','Họ tên','UID','Ngày nộp','Tiến độ','Điểm /10','Câu sai','Nâng cao']];filtered().forEach(g=>{let r=g.r,gradeR=grade(r);data.push([r.className,r.studentNo,r.name,g.items.map(x=>x.uid).join(' | '),r.submittedAt?new Date(r.submittedAt).toLocaleString('vi-VN'):'',progress(r)+'/'+tasks.length,r.submittedAt?gradeR.total.toFixed(2):'',gradeR.details.filter(x=>!x.correct).map(x=>x.id).join('; '),bonusResults(r).filter(x=>x.done).length+'/3'])});let content='\ufeff'+data.map(row=>row.map(v=>{let x=String(v??'');if(/^[=+@\-]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'}).join(',')).join('\r\n');let u=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='PHT_Tin9_Bai6_Tiet1_KetQua.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
async function teacherLogout(){if(db&&watchFn)db.ref(ROOT).off('value',watchFn);watchFn=null;teacherMode=false;rowsData={};await auth.signOut();$('teacher').classList.add('hidden');$('login').classList.remove('hidden');$('pass').value=''}
function init(){for(let i=1;i<=12;i++){$('cls').insertAdjacentHTML('beforeend',`<option value="9A${i}">9A${i}</option>`)}for(let i=1;i<=52;i++){$('stt').insertAdjacentHTML('beforeend',`<option value="${i}">${i}</option>`)}$('start').onclick=start;$('leave').onclick=leave;$('prev').onclick=()=>{idx=Math.max(0,idx-1);rec.meta.currentActivity=idx;saveLocal();render();window.scrollTo({top:0,behavior:'smooth'})};$('next').onclick=()=>{idx=Math.min(tasks.length+bonus.length,idx+1);rec.meta.currentActivity=idx;saveLocal();render();window.scrollTo({top:0,behavior:'smooth'})};$('retry').onclick=()=>sync(true);$('teacherOpen').onclick=()=>$('teacherLogin').classList.remove('hidden');$('closeTeacherLogin').onclick=()=>$('teacherLogin').classList.add('hidden');$('teacherSignIn').onclick=teacherLogin;$('pass').onkeydown=x=>{if(x.key==='Enter')teacherLogin()};$('teacherSignOut').onclick=teacherLogout;$('filterClass').onchange=renderTeacher;$('filterStatus').onchange=renderTeacher;$('export').onclick=csvExport;$('dismissRecover').onclick=()=>$('recovery').classList.add('hidden');recoverOffer();window.addEventListener('online',()=>{if(rec&&!teacherMode)sync()});window.addEventListener('pagehide',saveLocal);try{initFirebase()}catch(err){console.warn('Firebase bootstrap',err);$('initStatus').textContent='Chưa kết nối hệ thống'}}
