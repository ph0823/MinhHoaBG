<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>Trình phát mp3</title>
<style>
:root{
  --p:#7c3aed;--pd:#6d28d9;--bg:#f1f5f9;--text:#172033;
  --muted:#64748b;--border:#dbe3ea;--danger:#b91c1c
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif
}
button,input,select{font:inherit}
[hidden]{display:none!important}
.app{min-height:100%;display:grid;grid-template-rows:auto 1fr}
.top{
  display:flex;align-items:center;gap:12px;padding:12px 18px;
  background:#fff;border-bottom:1px solid var(--border)
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:42px;height:42px;border-radius:13px;background:#ede9fe;
  display:grid;place-items:center;font-size:24px
}
.brand h1{margin:0;font-size:18px}
.brand small{color:var(--muted)}
.status{margin-left:auto;min-width:320px;max-width:470px}
.status-row{
  display:flex;justify-content:space-between;gap:10px;
  font-size:12px;color:var(--muted);margin-bottom:5px
}
.status-row span:first-child{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.bar{height:7px;background:#e2e8f0;border-radius:999px;overflow:hidden}
.bar>div{height:100%;width:0;background:var(--p);transition:width .2s}
.layout{
  display:grid;grid-template-columns:340px minmax(0,1fr);
  gap:14px;padding:14px;min-height:0
}
.sidebar,.player{
  background:#fff;border:1px solid var(--border);
  border-radius:15px;overflow:hidden
}
.sidebar{
  display:grid;grid-template-rows:auto auto 1fr;
  height:calc(100vh - 96px)
}
.head{padding:14px;border-bottom:1px solid var(--border)}
.folder{font-weight:800}
.crumb{
  font-size:12px;color:var(--muted);margin-top:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.folder-actions{display:flex;gap:8px;margin-top:10px}
.folder-actions button{
  flex:1;padding:8px 10px;border:1px solid var(--border);
  border-radius:9px;background:#f5f3ff;color:var(--p);
  font-weight:750;cursor:pointer
}
.folder-actions button:disabled{opacity:.45;cursor:not-allowed}
.search{padding:12px 14px;border-bottom:1px solid var(--border)}
.search input{
  width:100%;padding:10px 12px;border:1px solid var(--border);
  border-radius:10px
}
.list{list-style:none;padding:8px;margin:0;overflow:auto}
.item{
  display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;
  align-items:center;width:100%;padding:10px;border:0;border-radius:11px;
  background:transparent;text-align:left;color:var(--text);cursor:pointer
}
.item:hover,.item.active{background:#f5f3ff}
.item.active{outline:1px solid #c4b5fd}
.icon{
  width:38px;height:38px;display:grid;place-items:center;
  border-radius:10px;background:#f1f5f9;font-size:20px
}
.name{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.meta{font-size:11px;color:var(--muted);margin-top:3px}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.player{
  display:grid;place-items:center;padding:28px;
  min-height:calc(100vh - 96px);
  background:linear-gradient(145deg,#fff,#f5f3ff)
}
.card{width:min(620px,100%);text-align:center}
.cover{
  width:180px;height:180px;border-radius:34px;margin:0 auto 22px;
  display:grid;place-items:center;font-size:78px;
  background:linear-gradient(145deg,#ede9fe,#ddd6fe)
}
.title{
  font-size:24px;font-weight:850;margin:0 0 6px;
  overflow-wrap:anywhere
}
.sub{color:var(--muted);margin-bottom:22px}
.seek{
  display:grid;grid-template-columns:48px 1fr 48px;
  align-items:center;gap:10px;font-size:12px;color:var(--muted)
}
input[type=range]{width:100%;accent-color:var(--p)}
.controls{
  display:flex;justify-content:center;align-items:center;
  gap:14px;margin:22px 0
}
.ctrl{
  width:48px;height:48px;border-radius:50%;
  border:1px solid var(--border);background:#fff;
  cursor:pointer;font-size:20px
}
.play{
  width:66px;height:66px;background:var(--p);
  color:#fff;border-color:var(--p);font-size:26px
}
.ctrl:disabled{opacity:.45;cursor:not-allowed}
.options{
  display:flex;flex-wrap:wrap;justify-content:center;
  align-items:center;gap:16px;color:var(--muted);font-size:13px
}
.options label{display:flex;align-items:center;gap:7px}
.options select{
  padding:7px 9px;border:1px solid var(--border);
  border-radius:8px;background:#fff
}

.visualizer-wrap{
  width:min(420px,100%);height:74px;margin:-8px auto 14px;
  padding:8px 10px;border:1px solid #ddd6fe;border-radius:14px;
  background:linear-gradient(180deg,rgba(245,243,255,.96),rgba(237,233,254,.68));
  overflow:hidden
}
#visualizer{display:block;width:100%;height:100%}
.cover.playing{
  animation:coverPulse 1.35s ease-in-out infinite;
  box-shadow:0 0 0 0 rgba(124,58,237,.3)
}
@keyframes coverPulse{
  0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(124,58,237,.24)}
  50%{transform:scale(1.025);box-shadow:0 0 0 14px rgba(124,58,237,0)}
}
.effects-panel{
  width:min(560px,100%);margin:16px auto 0;padding:12px 14px;
  border:1px solid var(--border);border-radius:13px;background:rgba(255,255,255,.82)
}
.effects-title{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin-bottom:10px;font-size:13px;font-weight:800;color:var(--text)
}
.effects-grid{
  display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(135px,1fr) minmax(135px,1fr);
  gap:10px;align-items:end
}
.effects-grid label{
  display:grid;gap:5px;text-align:left;font-size:12px;color:var(--muted)
}
.effects-grid select{
  height:36px;padding:0 9px;border:1px solid var(--border);
  border-radius:9px;background:#fff;color:var(--text)
}
.effect-value{font-variant-numeric:tabular-nums;color:var(--p);font-weight:750}
.effect-badge{
  padding:4px 9px;border-radius:999px;background:#ede9fe;
  color:var(--p);font-size:11px;white-space:nowrap
}
@media(max-width:620px){
  .effects-grid{grid-template-columns:1fr}
  .visualizer-wrap{height:64px}
}

.loading{
  padding:14px 18px;margin:16px auto 0;background:#fff;
  border:1px solid var(--border);border-radius:12px;
  color:var(--p);font-weight:700;max-width:440px
}
.mode{
  display:inline-block;margin-top:8px;padding:5px 10px;
  border-radius:999px;background:#ede9fe;color:var(--p);
  font-size:11px;font-weight:750
}
.toast{
  position:fixed;right:18px;bottom:18px;
  max-width:min(420px,calc(100vw - 36px));
  padding:12px 14px;border-radius:11px;background:#0f172a;
  color:#fff;opacity:0;transform:translateY(12px);
  pointer-events:none;transition:.2s;z-index:20
}
.toast.show{opacity:1;transform:translateY(0)}
.toast.error{background:var(--danger)}
.menu{display:none}
@media(max-width:820px){
  .status{display:none}
  .menu{
    display:grid;place-items:center;width:40px;height:40px;
    border:1px solid var(--border);border-radius:10px;background:#fff
  }
  .layout{grid-template-columns:1fr;padding:10px}
  .sidebar{
    position:fixed;z-index:10;left:0;top:67px;bottom:0;
    width:min(88vw,360px);height:auto;border-radius:0 15px 15px 0;
    transform:translateX(-105%);transition:.22s
  }
  .sidebar.open{transform:translateX(0)}
  .player{min-height:calc(100vh - 88px);padding:18px}
  .cover{width:145px;height:145px;font-size:64px}
  .title{font-size:20px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button id="menu" class="menu" type="button">☰</button>
    <div class="brand">
      <div class="logo">🎧</div>
      <div>
        <h1>Thư viện âm thanh</h1>
        <small>Phát nhanh theo từng phần từ Google Drive</small>
      </div>
    </div>
    <div id="status" class="status" hidden>
      <div class="status-row">
        <span id="statusText">Đang tải...</span>
        <span id="statusPct">0%</span>
      </div>
      <div class="bar"><div id="progress"></div></div>
    </div>
  </header>

  <main class="layout">
    <aside id="sidebar" class="sidebar">
      <div class="head">
        <div id="folderTitle" class="folder">Đang kết nối...</div>
        <div id="breadcrumb" class="crumb">Thư mục gốc</div>
        <div class="folder-actions">
          <button id="playFolder" type="button" disabled>▶ Phát tất cả</button>
        </div>
      </div>

      <div class="search">
        <input id="search" type="search" placeholder="Tìm thư mục hoặc file âm thanh...">
      </div>

      <ul id="fileList" class="list">
        <li class="empty">Đang tải danh sách...</li>
      </ul>
    </aside>

    <section class="player">
      <div class="card">
        <div id="cover" class="cover">🎵</div>
        <div class="visualizer-wrap" aria-label="Hiệu ứng phổ âm thanh">
          <canvas id="visualizer"></canvas>
        </div>

        <h2 id="trackTitle" class="title">Chưa chọn bài</h2>
        <div id="trackSub" class="sub">Chọn một file âm thanh trong danh sách.</div>

        <div class="seek">
          <span id="current">0:00</span>
          <input id="seek" type="range" min="0" max="100" value="0" disabled>
          <span id="duration">0:00</span>
        </div>

        <div class="controls">
          <button id="prev" class="ctrl" type="button" disabled>⏮</button>
          <button id="play" class="ctrl play" type="button" disabled>▶</button>
          <button id="next" class="ctrl" type="button" disabled>⏭</button>
        </div>

        <div class="options">
          <label>🔊
            <input id="volume" type="range" min="0" max="1" value="1" step=".05">
          </label>

          <label>Tốc độ
            <select id="speed">
              <option value=".75">0.75×</option>
              <option value="1" selected>1×</option>
              <option value="1.25">1.25×</option>
              <option value="1.5">1.5×</option>
              <option value="2">2×</option>
            </select>
          </label>

          <label>
            <input id="autoNext" type="checkbox" checked>
            Tự phát bài sau
          </label>
        </div>

        <div class="effects-panel">
          <div class="effects-title">
            <span>🎚️ Hiệu ứng âm thanh</span>
            <span id="effectBadge" class="effect-badge">Đang tắt</span>
          </div>

          <div class="effects-grid">
            <label>
              Chế độ âm thanh
              <select id="effectPreset">
                <option value="off">Tắt hiệu ứng</option>
                <option value="bass">Tăng âm trầm</option>
                <option value="vocal">Rõ giọng hát</option>
                <option value="concert">Không gian sân khấu</option>
                <option value="night">Nghe ban đêm</option>
                <option value="custom">Tùy chỉnh</option>
              </select>
            </label>

            <label>
              Bass: <span id="bassValue" class="effect-value">0 dB</span>
              <input id="bassBoost" type="range" min="-8" max="12" value="0" step="1">
            </label>

            <label>
              Độ vang: <span id="echoValue" class="effect-value">0%</span>
              <input id="echoLevel" type="range" min="0" max="45" value="0" step="1">
            </label>
          </div>
        </div>

        <div id="loading" class="loading" hidden>Đang chuẩn bị phát...</div>
        <div id="mode" class="mode" hidden></div>

        <audio id="audioA" preload="auto"></audio>
        <audio id="audioB" preload="auto"></audio>
      </div>
    </section>
  </main>
</div>

<div id="toast" class="toast"></div>

<script>
const WEB_APP_URL =
  'https://script.google.com/macros/s/AKfycbz9Fd3kzo7TCoGvKO4AhHl_iv0LiCB3Y2L4bqkvrpjMwWYHtDscRm5JhPMthQaSw8lZ5A/exec';

const APP_TYPE = 'audio';
const MSE_MIME = 'audio/mpeg';
const API_RETRIES = 9;
const RETRY_BASE_MS = 650;
const RETRY_MAX_MS = 15000;
const REQUEST_TIMEOUT_MS = 25000;
const INITIAL_CHUNKS_BEFORE_PLAY = 2;
const PREFETCH_SECONDS = 45;
const CACHE_DB_NAME = 'gdrive-music-chunks-v5';
const CACHE_STORE_NAME = 'chunks';
const CACHE_DB_VERSION = 1;
const MAX_CACHE_ENTRIES = 320;
const PLAYBACK_UI_INTERVAL_MS = 250;
const RECOVERY_BUFFER_TARGET_SECONDS = 300;

const $ = id => document.getElementById(id);

const els = {
  menu: $('menu'),
  sidebar: $('sidebar'),
  folderTitle: $('folderTitle'),
  breadcrumb: $('breadcrumb'),
  playFolder: $('playFolder'),
  search: $('search'),
  fileList: $('fileList'),
  status: $('status'),
  statusText: $('statusText'),
  statusPct: $('statusPct'),
  progress: $('progress'),
  trackTitle: $('trackTitle'),
  trackSub: $('trackSub'),
  current: $('current'),
  duration: $('duration'),
  seek: $('seek'),
  prev: $('prev'),
  play: $('play'),
  next: $('next'),
  volume: $('volume'),
  speed: $('speed'),
  autoNext: $('autoNext'),
  cover: $('cover'),
  visualizer: $('visualizer'),
  effectPreset: $('effectPreset'),
  bassBoost: $('bassBoost'),
  bassValue: $('bassValue'),
  echoLevel: $('echoLevel'),
  echoValue: $('echoValue'),
  effectBadge: $('effectBadge'),
  loading: $('loading'),
  mode: $('mode'),
  toast: $('toast')
};

const players = [
  $('audioA'),
  $('audioB')
];

let activePlayerIndex = 0;
let folderStack = [];
let currentItems = [];
let audioItems = [];
let currentFolderId = '';
let currentFolderName = '';
let activeFileId = '';
let activeIndex = -1;
let loadToken = 0;
let folderToken = 0;
let toastTimer = null;
let activeSession = null;
let cacheWriteCount = 0;
let cacheDbPromise = null;
let playbackUiTimer = null;
let lastEffectiveDuration = 0;
let lastSavedSecond = -1;

let audioContext = null;
let analyserNode = null;
let bassFilterNode = null;
let trebleFilterNode = null;
let compressorNode = null;
let dryGainNode = null;
let delayNode = null;
let feedbackGainNode = null;
let wetGainNode = null;
let masterGainNode = null;
let mediaSourceNodes = [];
let visualizerFrame = 0;
let frequencyData = null;

const effectState = {
  preset: 'off',
  bass: 0,
  treble: 0,
  echo: 0,
  feedback: 0,
  delay: 0.18,
  compressorRatio: 1,
  master: 1
};

const EFFECT_PRESETS = Object.freeze({
  off: {
    label: 'Đang tắt',
    bass: 0, treble: 0, echo: 0, feedback: 0,
    delay: 0.18, compressorRatio: 1, master: 1
  },
  bass: {
    label: 'Tăng âm trầm',
    bass: 8, treble: 1, echo: 0.02, feedback: 0.04,
    delay: 0.16, compressorRatio: 3, master: 0.92
  },
  vocal: {
    label: 'Rõ giọng hát',
    bass: -2, treble: 5, echo: 0.015, feedback: 0.025,
    delay: 0.13, compressorRatio: 2.5, master: 0.96
  },
  concert: {
    label: 'Không gian sân khấu',
    bass: 3, treble: 2, echo: 0.26, feedback: 0.22,
    delay: 0.22, compressorRatio: 3.5, master: 0.88
  },
  night: {
    label: 'Nghe ban đêm',
    bass: 2, treble: -3, echo: 0.05, feedback: 0.05,
    delay: 0.16, compressorRatio: 6, master: 0.78
  }
});

const networkState = {
  offline: !navigator.onLine,
  retrying: 0,
  failures: 0,
  lastSuccessAt: 0,
  urgent: false,
  recoveryMessage: ''
};

let standbyState = {
  token: 0,
  track: null,
  ready: false,
  url: '',
  controller: null
};

const fileInfoCache = new Map();

class RetryableRequestError extends Error {
  constructor(message, status = 0) {
    super(message);
    this.name = 'RetryableRequestError';
    this.status = status;
  }
}

document.addEventListener('DOMContentLoaded', init);

function activeAudio() {
  return players[activePlayerIndex];
}

function standbyAudio() {
  return players[1 - activePlayerIndex];
}

function init() {
  bindEvents();
  restorePreferences();
  configurePlayers();
  bindNetworkEvents();
  startVisualizer();
  openChunkDb().then(() => pruneChunkCache()).catch(() => {});
  loadDirectory('', true);
}

function bindEvents() {
  els.menu.addEventListener(
    'click',
    () => els.sidebar.classList.toggle('open')
  );

  els.search.addEventListener(
    'input',
    renderList
  );

  els.playFolder.addEventListener(
    'click',
    () => {
      ensureAudioEffects().catch(() => {});
      playAllCurrentFolder();
    }
  );

  els.play.addEventListener(
    'click',
    () => {
      ensureAudioEffects().catch(() => {});
      togglePlay();
    }
  );

  els.prev.addEventListener(
    'click',
    () => {
      ensureAudioEffects().catch(() => {});
      playRelative(-1);
    }
  );

  els.next.addEventListener(
    'click',
    () => {
      ensureAudioEffects().catch(() => {});
      playRelative(1);
    }
  );

  els.effectPreset.addEventListener('change', () => {
    ensureAudioEffects().catch(() => {});
    applyEffectPreset(els.effectPreset.value, true);
  });

  els.bassBoost.addEventListener('input', () => {
    ensureAudioEffects().catch(() => {});
    els.effectPreset.value = 'custom';
    effectState.preset = 'custom';
    effectState.bass = Number(els.bassBoost.value);
    effectState.treble = 0;
    updateEffectNodes();
    updateEffectUi();
    saveEffectPreferences();
  });

  els.echoLevel.addEventListener('input', () => {
    ensureAudioEffects().catch(() => {});
    els.effectPreset.value = 'custom';
    effectState.preset = 'custom';
    effectState.echo = Number(els.echoLevel.value) / 100;
    effectState.feedback = Math.min(0.32, effectState.echo * 0.82);
    effectState.delay = 0.2;
    effectState.compressorRatio = 3;
    effectState.master = 0.92;
    updateEffectNodes();
    updateEffectUi();
    saveEffectPreferences();
  });

  els.volume.addEventListener('input', () => {
    players.forEach(
      player => player.volume = Number(els.volume.value)
    );

    localStorage.setItem(
      'audio_volume',
      els.volume.value
    );
  });

  els.speed.addEventListener('change', () => {
    players.forEach(
      player => player.playbackRate = Number(els.speed.value)
    );

    localStorage.setItem(
      'audio_speed',
      els.speed.value
    );
  });

  els.autoNext.addEventListener('change', () => {
    localStorage.setItem(
      'audio_auto_next',
      els.autoNext.checked ? '1' : '0'
    );

    if (els.autoNext.checked) {
      prepareNextTrack();
    } else {
      clearStandby();
    }
  });

  els.seek.addEventListener('input', () => {
    const player = activeAudio();

    if (Number.isFinite(player.duration)) {
      player.currentTime = Number(els.seek.value);
    }
  });

  window.addEventListener(
    'beforeunload',
    cleanupEverything
  );
}

function configurePlayers() {
  players.forEach((player, index) => {
    player.preload = 'auto';

    player.addEventListener('loadedmetadata', () => {
      if (index === activePlayerIndex) {
        updateMetadata();
      }
    });

    player.addEventListener('durationchange', () => {
      if (index === activePlayerIndex) {
        updateMetadata();
      }
    });

    player.addEventListener('timeupdate', () => {
      if (index === activePlayerIndex) {
        updateTime();
      }
    });

    player.addEventListener('play', () => {
      if (index === activePlayerIndex) {
        ensureAudioEffects().catch(() => {});
        els.play.textContent = '⏸';
        els.cover.classList.add('playing');
        startPlaybackUiTicker();
      }
    });

    player.addEventListener('playing', () => {
      if (index === activePlayerIndex) {
        networkState.urgent = false;
        startPlaybackUiTicker();
        syncPlaybackUi();
        refreshPlaybackStatus();
      }
    });

    player.addEventListener('pause', () => {
      if (index === activePlayerIndex) {
        els.play.textContent = '▶';
        els.cover.classList.remove('playing');
        syncPlaybackUi();
      }
    });

    player.addEventListener('waiting', () => {
      if (index === activePlayerIndex) {
        networkState.urgent = true;
        showRecoveryStatus('Bộ đệm sắp hết, đang khôi phục đường truyền...');
      }
    });

    player.addEventListener('stalled', () => {
      if (index === activePlayerIndex) {
        networkState.urgent = true;
        showRecoveryStatus('Đường truyền tạm dừng, đang thử lại...');
      }
    });

    player.addEventListener('canplay', () => {
      if (index === activePlayerIndex && !networkState.offline) {
        networkState.urgent = false;
        refreshPlaybackStatus();
      }
    });

    player.addEventListener('ended', () => {
      if (index === activePlayerIndex) {
        syncPlaybackUi();
        handleEnded();
      }
    });

    player.addEventListener('error', () => {
      if (
        index === activePlayerIndex &&
        player.error &&
        activeFileId
      ) {
        showToast(
          'Trình duyệt không thể giải mã file âm thanh này.',
          true
        );
      }
    });
  });
}

function bindNetworkEvents() {
  window.addEventListener('offline', () => {
    networkState.offline = true;
    networkState.urgent = true;
    showRecoveryStatus(
      `Mất kết nối Internet • còn bộ đệm ${Math.round(getBufferAhead(activeAudio()))} giây`
    );
  });

  window.addEventListener('online', () => {
    networkState.offline = false;
    networkState.failures = 0;
    showRecoveryStatus('Đã có mạng • tự động tiếp tục tải...');
  });

  const connection = navigator.connection;
  if (connection && typeof connection.addEventListener === 'function') {
    connection.addEventListener('change', () => {
      refreshPlaybackStatus();
    });
  }
}

async function api(
  action,
  params = {},
  signal = undefined,
  options = {}
) {
  const maxAttempts = Number.isInteger(options.retries)
    ? options.retries + 1
    : API_RETRIES + 1;

  let lastError = null;

  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    throwIfAborted(signal);

    if (!navigator.onLine) {
      await waitUntilOnline(signal);
    }

    try {
      const data = await apiOnce(action, params, signal);
      networkState.lastSuccessAt = Date.now();
      networkState.failures = Math.max(0, networkState.failures - 1);
      return data;
    } catch (error) {
      if (isAbortError(error)) {
        throw error;
      }

      lastError = error;

      const retryable = isRetryableError(error);
      if (!retryable || attempt >= maxAttempts) {
        throw error;
      }

      networkState.failures++;
      networkState.retrying++;

      const waitMs = calculateRetryDelay(attempt);

      showRecoveryStatus(
        navigator.onLine
          ? `Kết nối chập chờn • thử lại ${attempt}/${maxAttempts - 1} sau ${(waitMs / 1000).toFixed(1)} giây`
          : 'Mất kết nối • đang chờ mạng trở lại...'
      );

      try {
        await delay(waitMs, signal);
      } finally {
        networkState.retrying = Math.max(0, networkState.retrying - 1);
      }
    }
  }

  throw lastError || new Error('Không thể kết nối máy chủ.');
}

async function apiOnce(action, params, signal) {
  const url = new URL(WEB_APP_URL);

  url.searchParams.set('action', action);
  url.searchParams.set('appType', APP_TYPE);
  url.searchParams.set('_', Date.now().toString());

  Object.entries(params).forEach(([key, value]) => {
    if (
      value !== '' &&
      value !== null &&
      value !== undefined
    ) {
      url.searchParams.set(
        key,
        String(value)
      );
    }
  });

  const response = await fetchWithTimeout(
    url.toString(),
    {
      method: 'GET',
      cache: 'no-store',
      redirect: 'follow'
    },
    signal,
    REQUEST_TIMEOUT_MS
  );

  if (!response.ok) {
    const message = `Máy chủ trả về HTTP ${response.status}.`;

    if (isRetryableHttpStatus(response.status)) {
      throw new RetryableRequestError(
        message,
        response.status
      );
    }

    throw new Error(message);
  }

  let data;

  try {
    data = await response.json();
  } catch (_) {
    throw new RetryableRequestError(
      'Phản hồi máy chủ bị gián đoạn hoặc không đầy đủ.'
    );
  }

  if (data.ok === false || data.error) {
    const message = data.error || 'Máy chủ xử lý thất bại.';

    if (isRetryableServerMessage(message)) {
      throw new RetryableRequestError(message);
    }

    throw new Error(message);
  }

  return data;
}

function fetchWithTimeout(url, options, externalSignal, timeoutMs) {
  const controller = new AbortController();
  let timedOut = false;

  const onExternalAbort = () => controller.abort();

  if (externalSignal) {
    if (externalSignal.aborted) {
      controller.abort();
    } else {
      externalSignal.addEventListener(
        'abort',
        onExternalAbort,
        { once: true }
      );
    }
  }

  const timer = setTimeout(() => {
    timedOut = true;
    controller.abort();
  }, timeoutMs);

  return fetch(
    url,
    {
      ...options,
      signal: controller.signal
    }
  ).catch(error => {
    if (timedOut) {
      throw new RetryableRequestError(
        'Yêu cầu quá thời gian chờ.'
      );
    }

    if (externalSignal && externalSignal.aborted) {
      throw new DOMException(
        'Đã hủy tải.',
        'AbortError'
      );
    }

    if (error instanceof TypeError) {
      throw new RetryableRequestError(
        'Không kết nối được tới máy chủ.'
      );
    }

    throw error;
  }).finally(() => {
    clearTimeout(timer);

    if (externalSignal) {
      externalSignal.removeEventListener(
        'abort',
        onExternalAbort
      );
    }
  });
}

function isRetryableHttpStatus(status) {
  return [
    408,
    425,
    429,
    500,
    502,
    503,
    504
  ].includes(status);
}

function isRetryableServerMessage(message) {
  const text = String(message || '').toLowerCase();

  return [
    'temporarily',
    'tạm thời',
    'too many',
    'quá nhiều',
    'service invoked',
    'timeout',
    'thời gian',
    'drive api không trả được byte-range',
    'http 429',
    'http 500',
    'http 502',
    'http 503',
    'http 504'
  ].some(term => text.includes(term));
}

function isRetryableError(error) {
  return (
    error instanceof RetryableRequestError ||
    error instanceof TypeError ||
    !navigator.onLine
  );
}

function calculateRetryDelay(attempt) {
  const exponential = Math.min(
    RETRY_MAX_MS,
    RETRY_BASE_MS * Math.pow(2, attempt - 1)
  );

  const jitter = Math.floor(
    Math.random() * Math.min(900, exponential * 0.3)
  );

  return exponential + jitter;
}

function waitUntilOnline(signal) {
  if (navigator.onLine) {
    return Promise.resolve();
  }

  return new Promise((resolve, reject) => {
    const cleanup = () => {
      window.removeEventListener('online', onOnline);

      if (signal) {
        signal.removeEventListener('abort', onAbort);
      }
    };

    const onOnline = () => {
      cleanup();
      resolve();
    };

    const onAbort = () => {
      cleanup();
      reject(new DOMException('Đã hủy tải.', 'AbortError'));
    };

    window.addEventListener('online', onOnline, { once: true });

    if (signal) {
      signal.addEventListener('abort', onAbort, { once: true });
    }
  });
}

function delay(milliseconds, signal) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      cleanup();
      resolve();
    }, milliseconds);

    const cleanup = () => {
      clearTimeout(timer);

      if (signal) {
        signal.removeEventListener('abort', onAbort);
      }
    };

    const onAbort = () => {
      cleanup();
      reject(new DOMException('Đã hủy tải.', 'AbortError'));
    };

    if (signal) {
      signal.addEventListener('abort', onAbort, { once: true });
    }
  });
}

function throwIfAborted(signal) {
  if (signal && signal.aborted) {
    throw new DOMException('Đã hủy tải.', 'AbortError');
  }
}

function isAbortError(error) {
  return error && error.name === 'AbortError';
}

async function loadDirectory(folderId, reset = false) {
  const token = ++folderToken;

  setLoading(
    true,
    'Đang lấy danh sách âm thanh...',
    15
  );

  els.fileList.innerHTML =
    '<li class="empty">Đang tải...</li>';

  try {
    const data = await api(
      'list',
      folderId ? { folderId } : {},
      undefined,
      { retries: 5 }
    );

    if (token !== folderToken) return;

    currentItems = Array.isArray(data.files)
      ? data.files
      : [];

    audioItems = currentItems.filter(
      item => !item.isFolder
    );

    currentFolderId = data.folder.id;
    currentFolderName = data.folder.name;

    activeIndex = audioItems.findIndex(
      item => item.id === activeFileId
    );

    folderStack =
      Array.isArray(data.breadcrumbs) && data.breadcrumbs.length
        ? data.breadcrumbs
        : [{
            id: data.folder.id,
            name: data.folder.name
          }];

    if (reset && folderStack.length > 1) {
      folderStack = [folderStack[0]];
    }

    els.folderTitle.textContent = data.folder.name;

    els.breadcrumb.textContent = folderStack
      .map(item => item.name)
      .join(' › ');

    els.search.value = '';

    els.playFolder.disabled = currentItems.length === 0;

    els.playFolder.textContent = audioItems.length
      ? `▶ Phát ${audioItems.length} bài`
      : '▶ Quét và phát';

    renderList();
    updateButtons();
  } catch (error) {
    if (token !== folderToken) return;

    els.fileList.innerHTML =
      `<li class="empty">❌ ${escapeHtml(error.message)}</li>`;

    els.playFolder.disabled = true;
    els.playFolder.textContent = 'Không thể phát';

    showToast(error.message, true);
  } finally {
    if (token === folderToken) {
      setLoading(false);
    }
  }
}

function renderList() {
  const keyword = normalizeText(els.search.value);

  const filtered = currentItems.filter(
    item => normalizeText(item.name).includes(keyword)
  );

  const fragment = document.createDocumentFragment();

  if (folderStack.length > 1) {
    fragment.appendChild(
      makeItem(
        {
          name: 'Quay lại thư mục trước',
          isFolder: true
        },
        true
      )
    );
  }

  if (!filtered.length) {
    const li = document.createElement('li');
    li.className = 'empty';

    li.textContent = keyword
      ? 'Không tìm thấy nội dung phù hợp.'
      : 'Thư mục không có file âm thanh.';

    fragment.appendChild(li);
  } else {
    filtered.forEach(
      item => fragment.appendChild(makeItem(item, false))
    );
  }

  els.fileList.replaceChildren(fragment);
}

function makeItem(item, isBack) {
  const li = document.createElement('li');
  const button = document.createElement('button');

  button.type = 'button';
  button.className =
    'item' +
    (
      !isBack && item.id === activeFileId
        ? ' active'
        : ''
    );

  button.innerHTML =
    `<span class="icon">${
      isBack ? '↩️' : item.isFolder ? '📁' : '🎵'
    }</span>` +
    `<span>` +
      `<div class="name">${escapeHtml(item.name)}</div>` +
      (
        !isBack && !item.isFolder
          ? `<div class="meta">${formatBytes(item.size || 0)}</div>`
          : ''
      ) +
    `</span>`;

  button.addEventListener('click', () => {
    if (isBack) {
      goBack();
      return;
    }

    if (item.isFolder) {
      openFolder(item);
      return;
    }

    ensureAudioEffects().catch(() => {});
    openAudio(item);
  });

  li.appendChild(button);
  return li;
}

function goBack() {
  if (folderStack.length <= 1) return;

  loadDirectory(
    folderStack[folderStack.length - 2].id
  );
}

async function openFolder(folder) {
  els.folderTitle.textContent =
    'Đang mở ' + folder.name + '...';

  els.playFolder.disabled = true;
  els.playFolder.textContent = 'Đang tải...';

  els.fileList.innerHTML =
    '<li class="empty">Đang tải nội dung thư mục...</li>';

  await loadDirectory(folder.id);
}

async function playAllCurrentFolder() {
  if (!currentFolderId) return;

  const token = ++folderToken;

  els.playFolder.disabled = true;
  els.playFolder.textContent = 'Đang quét...';

  setLoading(
    true,
    'Đang tạo danh sách phát...',
    10
  );

  try {
    const data = await api(
      'playlist',
      { folderId: currentFolderId },
      undefined,
      { retries: 5 }
    );

    if (token !== folderToken) return;

    const tracks = Array.isArray(data.tracks)
      ? data.tracks
      : [];

    if (!tracks.length) {
      throw new Error(
        'Không tìm thấy file âm thanh trong thư mục này.'
      );
    }

    audioItems = tracks;
    activeIndex = 0;

    els.playFolder.textContent =
      `▶ Phát ${tracks.length} bài`;

    showToast(
      `Đã tạo danh sách “${currentFolderName}” gồm ${tracks.length} bài.`
    );

    await openAudio(tracks[0]);
  } catch (error) {
    if (token === folderToken) {
      showToast(error.message, true);
    }
  } finally {
    if (token === folderToken) {
      els.playFolder.disabled = false;
      setLoading(false);
    }
  }
}

async function getFileInfo(file, signal) {
  if (fileInfoCache.has(file.id)) {
    return fileInfoCache.get(file.id);
  }

  const promise = api(
    'getFileInfo',
    {
      fileId: file.id,
      folderId: file.folderId || ''
    },
    signal,
    { retries: 6 }
  ).then(data => data.file);

  fileInfoCache.set(file.id, promise);

  try {
    return await promise;
  } catch (error) {
    fileInfoCache.delete(file.id);
    throw error;
  }
}

async function fetchChunk(file, info, index, signal) {
  const cached = await getCachedChunk(file, info, index);

  if (cached) {
    return cached;
  }

  const data = await api(
    'getFileChunk',
    {
      fileId: file.id,
      folderId: file.folderId || info.folderId || '',
      index: index
    },
    signal,
    { retries: API_RETRIES }
  );

  const bytes = base64ToBytes(data.base64);

  putCachedChunk(file, info, index, bytes).catch(() => {});

  return bytes;
}

function canUseProgressiveMse(info) {
  if (
    !window.MediaSource ||
    typeof MediaSource.isTypeSupported !== 'function'
  ) {
    return false;
  }

  const extension = String(info.extension || '').toLowerCase();
  const mime = String(info.mimeType || '').toLowerCase();

  const isMp3 =
    extension === 'mp3' ||
    mime === 'audio/mpeg' ||
    mime === 'audio/mp3';

  return isMp3 && MediaSource.isTypeSupported(MSE_MIME);
}

async function openAudio(file, options = {}) {
  ensureAudioEffects().catch(() => {});
  const autoplay = options.autoplay !== false;

  if (
    standbyState.ready &&
    standbyState.track &&
    standbyState.track.id === file.id
  ) {
    await activateStandby(file, autoplay);
    return;
  }

  const token = ++loadToken;

  savePosition();
  cancelActiveSession();
  clearStandby();

  activeFileId = file.id;

  activeIndex = audioItems.findIndex(
    item => item.id === file.id
  );

  renderList();
  updateButtons();

  els.sidebar.classList.remove('open');

  els.trackTitle.textContent = file.name;
  els.trackSub.textContent = 'Đang lấy phần đầu của bài hát...';
  els.loading.hidden = false;
  els.loading.textContent = 'Đang chuẩn bị phát ổn định...';
  els.mode.hidden = true;
  els.play.disabled = true;
  els.seek.disabled = true;

  resetTimeDisplay();
  lastEffectiveDuration = 0;
  lastSavedSecond = -1;
  startPlaybackUiTicker();

  const controller = new AbortController();

  try {
    const info = await getFileInfo(file, controller.signal);

    if (token !== loadToken) return;

    if (canUseProgressiveMse(info)) {
      await startProgressiveMse(
        file,
        info,
        token,
        controller,
        autoplay
      );
    } else {
      await startFullBlob(
        file,
        info,
        token,
        controller,
        autoplay
      );
    }
  } catch (error) {
    if (token !== loadToken || isAbortError(error)) {
      return;
    }

    els.loading.hidden = true;
    els.trackSub.textContent = 'Không thể tải file.';
    setLoading(false);

    showToast(error.message, true);
    console.error(error);
  }
}

async function startProgressiveMse(
  file,
  info,
  token,
  controller,
  autoplay
) {
  const player = activeAudio();
  const mediaSource = new MediaSource();
  const mediaUrl = URL.createObjectURL(mediaSource);

  const session = {
    type: 'mse',
    token: token,
    controller: controller,
    player: player,
    mediaSource: mediaSource,
    sourceBuffer: null,
    url: mediaUrl,
    cancelled: false,
    loadedChunks: 0,
    totalChunks: info.totalChunks,
    file: file,
    info: info
  };

  activeSession = session;

  player.src = mediaUrl;
  player.load();

  await waitEvent(
    mediaSource,
    'sourceopen',
    12000,
    controller.signal
  );

  throwIfSessionInactive(session);

  const sourceBuffer = mediaSource.addSourceBuffer(MSE_MIME);
  session.sourceBuffer = sourceBuffer;

  try {
    sourceBuffer.mode = 'sequence';
  } catch (_) {}

  const initialCount = Math.min(
    INITIAL_CHUNKS_BEFORE_PLAY,
    info.totalChunks
  );

  let firstChunkBytes = null;

  for (let index = 0; index < initialCount; index++) {
    setLoading(
      true,
      `Đang lấy phần đầu ${index + 1}/${initialCount} của ${file.name}...`,
      Math.max(3, Math.round((index + 1) / info.totalChunks * 100))
    );

    const bytes = await fetchChunk(
      file,
      info,
      index,
      controller.signal
    );

    if (index === 0) {
      firstChunkBytes = bytes;
    }

    throwIfSessionInactive(session);

    await appendSourceBuffer(
      sourceBuffer,
      bytes,
      controller.signal,
      player
    );

    session.loadedChunks++;
  }

  const estimatedDuration = estimateMp3Duration(
    firstChunkBytes,
    info.size,
    file.name
  );

  if (estimatedDuration > 0) {
    session.estimatedDuration = estimatedDuration;
    lastEffectiveDuration = estimatedDuration;

    try {
      if (
        mediaSource.readyState === 'open' &&
        (!Number.isFinite(mediaSource.duration) || mediaSource.duration <= 0)
      ) {
        mediaSource.duration = estimatedDuration;
      }
    } catch (_) {}

    updateMetadata();
  }

  await waitForPlayable(
    player,
    9000,
    controller.signal
  ).catch(() => {});

  throwIfSessionInactive(session);

  restorePosition(file, player);
  applyPlayerSettings(player);

  markReady(
    file,
    info,
    'Đang phát • tự khôi phục khi mạng chập chờn',
    autoplay
  );

  streamRemainingChunks(
    session,
    file,
    info,
    initialCount
  ).catch(error => {
    if (
      !session.cancelled &&
      token === loadToken &&
      !isAbortError(error)
    ) {
      showRecoveryStatus(
        'Tạm dừng tải nền • đang tiếp tục thử lại...'
      );

      console.error(error);
    }
  });
}

async function streamRemainingChunks(
  session,
  file,
  info,
  startIndex
) {
  let nextLaunch = startIndex;
  let nextAppend = startIndex;

  const inFlight = new Map();
  const ready = new Map();

  const launch = index => {
    const promise = fetchChunk(
      file,
      info,
      index,
      session.controller.signal
    ).then(bytes => {
      ready.set(index, bytes);
      inFlight.delete(index);
      return index;
    }).catch(error => {
      inFlight.delete(index);
      throw error;
    });

    inFlight.set(index, promise);
  };

  while (nextAppend < info.totalChunks) {
    throwIfSessionInactive(session);

    const concurrency = getAdaptiveConcurrency(session.player);

    while (
      inFlight.size < concurrency &&
      nextLaunch < info.totalChunks
    ) {
      launch(nextLaunch++);
    }

    if (ready.has(nextAppend)) {
      const bytes = ready.get(nextAppend);
      ready.delete(nextAppend);

      await appendSourceBuffer(
        session.sourceBuffer,
        bytes,
        session.controller.signal,
        session.player
      );

      session.loadedChunks++;
      nextAppend++;

      updateBackgroundProgress(file, session);
      continue;
    }

    if (!inFlight.size) {
      throw new Error('Không còn yêu cầu tải nào đang hoạt động.');
    }

    await Promise.race(inFlight.values());
  }

  await waitSourceBufferIdle(
    session.sourceBuffer,
    session.controller.signal
  );

  if (
    !session.cancelled &&
    session.mediaSource.readyState === 'open'
  ) {
    try {
      session.mediaSource.endOfStream();
    } catch (_) {}
  }

  if (!session.cancelled && session.token === loadToken) {
    setLoading(false);

    els.trackSub.textContent =
      `${formatBytes(info.size)} • ${formatTime(activeAudio().duration)}`;

    showMode('Đã tải đủ bài • đã lưu bộ đệm ngoại tuyến');

    prepareNextTrack();
  }
}

function getAdaptiveConcurrency(player) {
  const connection = navigator.connection || {};
  let concurrency = 4;

  if (connection.saveData) {
    concurrency = 1;
  } else if (connection.effectiveType === 'slow-2g') {
    concurrency = 1;
  } else if (connection.effectiveType === '2g') {
    concurrency = 1;
  } else if (connection.effectiveType === '3g') {
    concurrency = 2;
  } else if (connection.effectiveType === '4g') {
    concurrency = 4;
  }

  const bufferAhead = getBufferAhead(player);

  if (networkState.urgent || bufferAhead < 12) {
    concurrency = Math.min(6, concurrency + 2);
  } else if (bufferAhead > 100) {
    concurrency = Math.min(concurrency, 2);
  }

  if (networkState.failures >= 3) {
    concurrency = Math.min(concurrency, 2);
  }

  if (networkState.failures >= 6) {
    concurrency = 1;
  }

  if (!navigator.onLine) {
    concurrency = 1;
  }

  return Math.max(1, concurrency);
}

async function appendSourceBuffer(
  sourceBuffer,
  bytes,
  signal,
  player,
  allowCleanup = true
) {
  await waitSourceBufferIdle(sourceBuffer, signal);

  try {
    await appendSourceBufferOnce(sourceBuffer, bytes, signal);
  } catch (error) {
    if (
      allowCleanup &&
      error &&
      error.name === 'QuotaExceededError'
    ) {
      const cleaned = await releaseOldBuffer(
        sourceBuffer,
        player,
        signal
      );

      if (cleaned) {
        await appendSourceBuffer(
          sourceBuffer,
          bytes,
          signal,
          player,
          false
        );
        return;
      }
    }

    throw error;
  }
}

function appendSourceBufferOnce(sourceBuffer, bytes, signal) {
  return new Promise((resolve, reject) => {
    const cleanup = () => {
      sourceBuffer.removeEventListener('updateend', onUpdateEnd);
      sourceBuffer.removeEventListener('error', onError);

      if (signal) {
        signal.removeEventListener('abort', onAbort);
      }
    };

    const onUpdateEnd = () => {
      cleanup();
      resolve();
    };

    const onError = () => {
      cleanup();
      reject(new Error('Không thể nối dữ liệu MP3.'));
    };

    const onAbort = () => {
      cleanup();
      reject(new DOMException('Đã hủy tải.', 'AbortError'));
    };

    sourceBuffer.addEventListener(
      'updateend',
      onUpdateEnd,
      { once: true }
    );

    sourceBuffer.addEventListener(
      'error',
      onError,
      { once: true }
    );

    if (signal) {
      signal.addEventListener('abort', onAbort, { once: true });
    }

    try {
      sourceBuffer.appendBuffer(bytes);
    } catch (error) {
      cleanup();
      reject(error);
    }
  });
}

async function releaseOldBuffer(sourceBuffer, player, signal) {
  if (
    !sourceBuffer.buffered ||
    sourceBuffer.buffered.length === 0 ||
    player.currentTime < 60
  ) {
    return false;
  }

  const removeEnd = Math.max(0, player.currentTime - 30);

  if (removeEnd <= 0) {
    return false;
  }

  await waitSourceBufferIdle(sourceBuffer, signal);

  return new Promise((resolve, reject) => {
    const cleanup = () => {
      sourceBuffer.removeEventListener('updateend', onDone);
      sourceBuffer.removeEventListener('error', onError);

      if (signal) {
        signal.removeEventListener('abort', onAbort);
      }
    };

    const onDone = () => {
      cleanup();
      resolve(true);
    };

    const onError = () => {
      cleanup();
      resolve(false);
    };

    const onAbort = () => {
      cleanup();
      reject(new DOMException('Đã hủy tải.', 'AbortError'));
    };

    sourceBuffer.addEventListener('updateend', onDone, { once: true });
    sourceBuffer.addEventListener('error', onError, { once: true });

    if (signal) {
      signal.addEventListener('abort', onAbort, { once: true });
    }

    try {
      sourceBuffer.remove(0, removeEnd);
    } catch (_) {
      cleanup();
      resolve(false);
    }
  });
}

function waitSourceBufferIdle(sourceBuffer, signal) {
  if (!sourceBuffer.updating) {
    return Promise.resolve();
  }

  return waitEvent(
    sourceBuffer,
    'updateend',
    15000,
    signal
  );
}

async function startFullBlob(
  file,
  info,
  token,
  controller,
  autoplay
) {
  showMode('Chế độ tương thích • tải song song có tự nối lại');

  const parts = await downloadAllChunks(
    file,
    info,
    getAdaptiveConcurrency(activeAudio()),
    controller.signal,
    (completed, total) => {
      if (token !== loadToken) return;

      const percent = Math.round(completed / total * 94);

      els.loading.textContent =
        `Đang tải ổn định: ${completed}/${total}`;

      setLoading(
        true,
        `Đang tải ${file.name} (${completed}/${total})...`,
        percent
      );
    }
  );

  if (token !== loadToken) return;

  const blob = new Blob(
    [concatUint8Arrays(parts, info.size)],
    {
      type: info.mimeType || guessMime(info.extension)
    }
  );

  const url = URL.createObjectURL(blob);
  const player = activeAudio();

  activeSession = {
    type: 'blob',
    token: token,
    controller: controller,
    player: player,
    url: url,
    cancelled: false
  };

  player.src = url;
  player.load();

  await waitForPlayable(player, 12000, controller.signal);

  restorePosition(file, player);
  applyPlayerSettings(player);

  markReady(
    file,
    info,
    'Đã tải đủ • có bộ đệm ngoại tuyến',
    autoplay
  );

  prepareNextTrack();
}

async function downloadAllChunks(
  file,
  info,
  concurrency,
  signal,
  onProgress
) {
  const parts = new Array(info.totalChunks);
  let nextIndex = 0;
  let completed = 0;

  async function worker() {
    while (true) {
      throwIfAborted(signal);

      const index = nextIndex++;

      if (index >= info.totalChunks) {
        return;
      }

      parts[index] = await fetchChunk(
        file,
        info,
        index,
        signal
      );

      completed++;

      if (onProgress) {
        onProgress(completed, info.totalChunks);
      }
    }
  }

  const workerCount = Math.min(
    Math.max(1, concurrency),
    info.totalChunks
  );

  await Promise.all(
    Array.from({ length: workerCount }, () => worker())
  );

  return parts;
}

function markReady(file, info, modeText, autoplay) {
  const player = activeAudio();

  els.loading.hidden = true;
  els.play.disabled = false;
  els.seek.disabled = false;

  const duration = getEffectiveDuration(player);

  els.trackSub.textContent =
    `${formatBytes(info.size)} • ${formatTime(duration)}`;

  showMode(modeText);
  updateMetadata();
  startPlaybackUiTicker();

  if (autoplay) {
    player.play().catch(() => {
      showToast('Bài đã sẵn sàng. Nhấn nút Phát để nghe.');
    });
  }
}

function updateBackgroundProgress(file, session) {
  const percent = Math.round(
    session.loadedChunks / session.totalChunks * 100
  );

  setLoading(
    true,
    networkState.offline
      ? `Mất mạng • đang dùng bộ đệm của ${file.name}`
      : `Đang đệm nền ${file.name}`,
    percent
  );

  showMode(
    networkState.offline
      ? `Mất mạng • còn ${Math.round(getBufferAhead(session.player))} giây bộ đệm`
      : `Đang phát • đã đệm ${percent}% • tự nối lại khi lỗi`
  );
}

async function prepareNextTrack() {
  if (
    !els.autoNext.checked ||
    audioItems.length < 2 ||
    activeIndex < 0 ||
    !navigator.onLine
  ) {
    return;
  }

  const next = getRelativeTrack(1);

  if (!next) return;

  if (
    standbyState.ready &&
    standbyState.track &&
    standbyState.track.id === next.id
  ) {
    return;
  }

  clearStandby();

  const token = ++standbyState.token;
  const controller = new AbortController();

  standbyState.controller = controller;
  standbyState.track = next;

  try {
    const info = await getFileInfo(next, controller.signal);

    const parts = await downloadAllChunks(
      next,
      info,
      Math.min(2, getAdaptiveConcurrency(activeAudio())),
      controller.signal
    );

    if (token !== standbyState.token) return;

    const blob = new Blob(
      [concatUint8Arrays(parts, info.size)],
      {
        type: info.mimeType || guessMime(info.extension)
      }
    );

    const url = URL.createObjectURL(blob);
    const player = standbyAudio();

    player.src = url;
    player.load();

    await waitForPlayable(player, 15000, controller.signal);

    if (token !== standbyState.token) {
      URL.revokeObjectURL(url);
      return;
    }

    applyPlayerSettings(player);

    standbyState.url = url;
    standbyState.ready = true;

    showMode('Đã nạp sẵn bài kế tiếp • chuyển bài liền mạch');
  } catch (error) {
    if (!isAbortError(error) && token === standbyState.token) {
      standbyState.ready = false;
    }
  }
}

async function activateStandby(track, autoplay = true) {
  if (
    !standbyState.ready ||
    !standbyState.track ||
    standbyState.track.id !== track.id
  ) {
    await openAudio(track, { autoplay: autoplay });
    return;
  }

  savePosition();

  const oldPlayer = activeAudio();

  cancelActiveSession(false);

  activePlayerIndex = 1 - activePlayerIndex;

  const newPlayer = activeAudio();
  const url = standbyState.url;

  activeSession = {
    type: 'blob',
    token: ++loadToken,
    controller: null,
    player: newPlayer,
    url: url,
    cancelled: false
  };

  standbyState = {
    token: standbyState.token + 1,
    track: null,
    ready: false,
    url: '',
    controller: null
  };

  resetPlayer(oldPlayer);

  activeFileId = track.id;

  activeIndex = audioItems.findIndex(
    item => item.id === track.id
  );

  els.trackTitle.textContent = track.name;
  els.trackSub.textContent = 'Đã nạp trước • chuyển bài nhanh';
  els.loading.hidden = true;
  els.play.disabled = false;
  els.seek.disabled = false;

  renderList();
  updateButtons();
  lastEffectiveDuration = 0;
  updateMetadata();
  startPlaybackUiTicker();

  showMode('Phát từ bộ nhớ đệm');

  applyPlayerSettings(newPlayer);

  if (autoplay) {
    newPlayer.play().catch(() => {
      showToast('Nhấn nút Phát để tiếp tục.');
    });
  }

  prepareNextTrack();
}

async function handleEnded() {
  savePosition();

  if (!els.autoNext.checked) return;

  const next = getRelativeTrack(1);

  if (!next) return;

  if (
    standbyState.ready &&
    standbyState.track &&
    standbyState.track.id === next.id
  ) {
    await activateStandby(next, true);
    return;
  }

  openAudio(next);
}

async function playRelative(step) {
  const target = getRelativeTrack(step);

  if (!target) return;

  if (
    step === 1 &&
    standbyState.ready &&
    standbyState.track &&
    standbyState.track.id === target.id
  ) {
    await activateStandby(target, true);
    return;
  }

  openAudio(target);
}

function getRelativeTrack(step) {
  if (!audioItems.length) return null;

  let index = activeIndex + step;

  if (index < 0) {
    index = audioItems.length - 1;
  }

  if (index >= audioItems.length) {
    index = 0;
  }

  return audioItems[index];
}

function togglePlay() {
  const player = activeAudio();

  if (!player.src) return;

  if (player.paused) {
    player.play().catch(
      error => showToast(error.message, true)
    );
  } else {
    player.pause();
  }
}

function getEffectiveDuration(player = activeAudio()) {
  const nativeDuration = Number(player && player.duration);

  if (Number.isFinite(nativeDuration) && nativeDuration > 0) {
    lastEffectiveDuration = nativeDuration;
    return nativeDuration;
  }

  const sessionDuration = Number(
    activeSession && activeSession.estimatedDuration
  );

  if (Number.isFinite(sessionDuration) && sessionDuration > 0) {
    lastEffectiveDuration = sessionDuration;
    return sessionDuration;
  }

  return lastEffectiveDuration > 0
    ? lastEffectiveDuration
    : 0;
}

function updateMetadata() {
  const player = activeAudio();
  const duration = getEffectiveDuration(player);

  els.duration.textContent = formatTime(duration);

  if (duration > 0) {
    els.seek.max = duration;
  } else {
    els.seek.max = Math.max(
      100,
      Number(player.currentTime || 0) + 1
    );
  }

  applyPlayerSettings(player);
  syncPlaybackUi();
}

function updateTime() {
  syncPlaybackUi();
}

function startPlaybackUiTicker() {
  if (playbackUiTimer) return;

  playbackUiTimer = window.setInterval(
    syncPlaybackUi,
    PLAYBACK_UI_INTERVAL_MS
  );
}

function stopPlaybackUiTicker() {
  if (!playbackUiTimer) return;

  clearInterval(playbackUiTimer);
  playbackUiTimer = null;
}

function syncPlaybackUi() {
  const player = activeAudio();

  if (!player) return;

  const current = Number.isFinite(player.currentTime)
    ? Math.max(0, player.currentTime)
    : 0;

  const duration = getEffectiveDuration(player);

  els.current.textContent = formatTime(current);

  if (duration > 0) {
    els.duration.textContent = formatTime(duration);
    els.seek.max = duration;
    els.seek.value = Math.min(current, duration);
  } else {
    // Không để max=0 vì input range sẽ bị khóa ở đầu thanh.
    els.seek.max = Math.max(100, current + 1);
    els.seek.value = current;
  }

  const currentSecond = Math.floor(current);

  if (
    currentSecond >= 0 &&
    currentSecond % 5 === 0 &&
    currentSecond !== lastSavedSecond
  ) {
    lastSavedSecond = currentSecond;
    savePosition();
  }

  if (
    els.autoNext.checked &&
    duration > 0 &&
    duration - current <= PREFETCH_SECONDS &&
    !standbyState.ready
  ) {
    prepareNextTrack();
  }

  if (
    networkState.offline ||
    networkState.retrying > 0 ||
    networkState.urgent
  ) {
    updateRecoveryProgress();
  }
}

function estimateMp3Duration(bytes, totalSize, fileName = '') {
  if (!totalSize) return 0;

  const nameBitrateMatch = String(fileName).match(
    /(64|80|96|112|128|160|192|224|256|320)\s*kbps/i
  );

  const bitrateFromName = nameBitrateMatch
    ? Number(nameBitrateMatch[1])
    : 0;

  if (!bytes || bytes.length < 4) {
    return bitrateFromName
      ? totalSize * 8 / (bitrateFromName * 1000)
      : 0;
  }

  let offset = 0;

  // Bỏ qua ID3v2.
  if (
    bytes.length >= 10 &&
    bytes[0] === 0x49 &&
    bytes[1] === 0x44 &&
    bytes[2] === 0x33
  ) {
    const tagSize =
      ((bytes[6] & 0x7f) << 21) |
      ((bytes[7] & 0x7f) << 14) |
      ((bytes[8] & 0x7f) << 7) |
      (bytes[9] & 0x7f);

    offset = 10 + tagSize;

    if (bytes[5] & 0x10) {
      offset += 10;
    }
  }

  const mpeg1Layer3 = [
    0, 32, 40, 48, 56, 64, 80, 96,
    112, 128, 160, 192, 224, 256, 320, 0
  ];

  const mpeg2Layer3 = [
    0, 8, 16, 24, 32, 40, 48, 56,
    64, 80, 96, 112, 128, 144, 160, 0
  ];

  const limit = Math.min(
    bytes.length - 4,
    Math.max(offset + 262144, 262144)
  );

  for (let index = offset; index < limit; index++) {
    const b0 = bytes[index];
    const b1 = bytes[index + 1];
    const b2 = bytes[index + 2];

    if (
      b0 !== 0xff ||
      (b1 & 0xe0) !== 0xe0
    ) {
      continue;
    }

    const versionBits = (b1 >> 3) & 0x03;
    const layerBits = (b1 >> 1) & 0x03;
    const bitrateIndex = (b2 >> 4) & 0x0f;
    const sampleRateIndex = (b2 >> 2) & 0x03;

    // Chỉ xử lý MPEG Layer III hợp lệ.
    if (
      versionBits === 1 ||
      layerBits !== 1 ||
      bitrateIndex === 0 ||
      bitrateIndex === 15 ||
      sampleRateIndex === 3
    ) {
      continue;
    }

    const bitrateTable =
      versionBits === 3
        ? mpeg1Layer3
        : mpeg2Layer3;

    const bitrateKbps =
      bitrateTable[bitrateIndex];

    if (!bitrateKbps) continue;

    const audioBytes = Math.max(
      0,
      totalSize - offset
    );

    const duration =
      audioBytes * 8 /
      (bitrateKbps * 1000);

    if (
      Number.isFinite(duration) &&
      duration > 1
    ) {
      return duration;
    }
  }

  if (bitrateFromName) {
    return totalSize * 8 / (bitrateFromName * 1000);
  }

  return 0;
}

function getBufferAhead(player) {
  if (!player || !player.buffered || player.buffered.length === 0) {
    return 0;
  }

  const current = player.currentTime || 0;

  for (let index = 0; index < player.buffered.length; index++) {
    const start = player.buffered.start(index);
    const end = player.buffered.end(index);

    if (current >= start && current <= end) {
      return Math.max(0, end - current);
    }
  }

  return 0;
}

function refreshPlaybackStatus() {
  if (!activeFileId) return;

  if (networkState.offline) {
    showRecoveryStatus(
      `Mất mạng • còn ${Math.round(getBufferAhead(activeAudio()))} giây bộ đệm`
    );
    return;
  }

  if (networkState.retrying > 0) return;

  networkState.recoveryMessage = '';

  if (activeSession && activeSession.type === 'mse') {
    const percent = Math.round(
      activeSession.loadedChunks / activeSession.totalChunks * 100
    );

    showMode(`Đang phát • đã đệm ${percent}% • kết nối ổn định`);
  }
}

function showRecoveryStatus(message) {
  networkState.recoveryMessage = message || '';
  updateRecoveryProgress();
}

function updateRecoveryProgress() {
  const player = activeAudio();
  const bufferAhead = getBufferAhead(player);
  const duration = getEffectiveDuration(player);

  const targetSeconds = Math.max(
    60,
    Math.min(
      RECOVERY_BUFFER_TARGET_SECONDS,
      duration > 0
        ? duration
        : RECOVERY_BUFFER_TARGET_SECONDS
    )
  );

  const bufferPercent = Math.max(
    1,
    Math.min(
      100,
      bufferAhead / targetSeconds * 100
    )
  );

  els.status.hidden = false;

  els.statusText.textContent =
    networkState.recoveryMessage ||
    (
      networkState.offline
        ? 'Mất kết nối • đang phát bằng dữ liệu đã đệm...'
        : 'Đường truyền chập chờn • đang tự động thử lại...'
    );

  els.statusPct.textContent =
    bufferAhead > 0
      ? `${Math.round(bufferAhead)} giây`
      : 'đang thử lại';

  // Trước đây chiều rộng giữ nguyên phần trăm tải cũ.
  // Bây giờ thanh này biểu diễn lượng bộ đệm còn lại và thay đổi liên tục.
  els.progress.style.width =
    `${bufferPercent}%`;

  showMode(
    bufferAhead > 0
      ? `${els.statusText.textContent} • còn ${Math.round(bufferAhead)} giây`
      : els.statusText.textContent
  );
}

function savePosition() {
  const player = activeAudio();

  if (activeFileId && Number.isFinite(player.currentTime)) {
    localStorage.setItem(
      positionKey(activeFileId),
      String(player.currentTime)
    );
  }
}

function restorePosition(file, player) {
  const saved = Number(
    localStorage.getItem(positionKey(file.id)) || 0
  );

  if (
    saved > 0 &&
    Number.isFinite(player.duration) &&
    saved < player.duration - 5
  ) {
    try {
      player.currentTime = saved;
    } catch (_) {}
  }
}

function positionKey(id) {
  return `audio_position_${id}`;
}

function updateButtons() {
  const enabled = audioItems.length > 0 && activeIndex >= 0;
  els.prev.disabled = !enabled;
  els.next.disabled = !enabled;
}

function restorePreferences() {
  const volume = localStorage.getItem('audio_volume');
  const speed = localStorage.getItem('audio_speed');
  const autoNext = localStorage.getItem('audio_auto_next');
  const savedPreset = localStorage.getItem('audio_effect_preset') || 'off';
  const savedBass = Number(localStorage.getItem('audio_effect_bass'));
  const savedEcho = Number(localStorage.getItem('audio_effect_echo'));

  if (volume !== null) {
    els.volume.value = volume;
  }

  if (speed !== null) {
    els.speed.value = speed;
  }

  if (autoNext !== null) {
    els.autoNext.checked = autoNext === '1';
  }

  players.forEach(applyPlayerSettings);

  if (savedPreset === 'custom') {
    effectState.preset = 'custom';
    effectState.bass = Number.isFinite(savedBass) ? savedBass : 0;
    effectState.treble = 0;
    effectState.echo = Number.isFinite(savedEcho) ? savedEcho : 0;
    effectState.feedback = Math.min(0.32, effectState.echo * 0.82);
    effectState.delay = 0.2;
    effectState.compressorRatio = 3;
    effectState.master = 0.92;
    els.effectPreset.value = 'custom';
  } else {
    applyEffectPreset(
      Object.prototype.hasOwnProperty.call(EFFECT_PRESETS, savedPreset)
        ? savedPreset
        : 'off',
      false
    );
  }

  updateEffectUi();
}

function applyPlayerSettings(player) {
  player.volume = Number(els.volume.value);
  player.playbackRate = Number(els.speed.value);
}


async function ensureAudioEffects() {
  const AudioContextClass =
    window.AudioContext ||
    window.webkitAudioContext;

  if (!AudioContextClass) {
    els.effectPreset.disabled = true;
    els.bassBoost.disabled = true;
    els.echoLevel.disabled = true;
    els.effectBadge.textContent = 'Trình duyệt không hỗ trợ';
    return;
  }

  if (!audioContext) {
    audioContext = new AudioContextClass();

    bassFilterNode = audioContext.createBiquadFilter();
    bassFilterNode.type = 'lowshelf';
    bassFilterNode.frequency.value = 180;

    trebleFilterNode = audioContext.createBiquadFilter();
    trebleFilterNode.type = 'highshelf';
    trebleFilterNode.frequency.value = 3200;

    compressorNode = audioContext.createDynamicsCompressor();
    compressorNode.threshold.value = -18;
    compressorNode.knee.value = 18;
    compressorNode.attack.value = 0.012;
    compressorNode.release.value = 0.24;

    dryGainNode = audioContext.createGain();
    delayNode = audioContext.createDelay(0.8);
    feedbackGainNode = audioContext.createGain();
    wetGainNode = audioContext.createGain();
    analyserNode = audioContext.createAnalyser();
    masterGainNode = audioContext.createGain();

    analyserNode.fftSize = 256;
    analyserNode.smoothingTimeConstant = 0.82;
    frequencyData = new Uint8Array(
      analyserNode.frequencyBinCount
    );

    bassFilterNode
      .connect(trebleFilterNode)
      .connect(compressorNode);

    compressorNode.connect(dryGainNode);
    dryGainNode.connect(analyserNode);

    compressorNode.connect(delayNode);
    delayNode.connect(feedbackGainNode);
    feedbackGainNode.connect(delayNode);
    delayNode.connect(wetGainNode);
    wetGainNode.connect(analyserNode);

    analyserNode
      .connect(masterGainNode)
      .connect(audioContext.destination);

    mediaSourceNodes = players.map(player => {
      const source =
        audioContext.createMediaElementSource(player);

      const gain =
        audioContext.createGain();

      gain.gain.value = 1;
      source.connect(gain);
      gain.connect(bassFilterNode);

      return {
        source: source,
        gain: gain
      };
    });

    updateEffectNodes();
  }

  if (audioContext.state === 'suspended') {
    await audioContext.resume();
  }
}

function applyEffectPreset(name, persist = true) {
  const preset =
    EFFECT_PRESETS[name] ||
    EFFECT_PRESETS.off;

  effectState.preset = name;
  effectState.bass = preset.bass;
  effectState.treble = preset.treble;
  effectState.echo = preset.echo;
  effectState.feedback = preset.feedback;
  effectState.delay = preset.delay;
  effectState.compressorRatio = preset.compressorRatio;
  effectState.master = preset.master;

  els.effectPreset.value = name;
  els.bassBoost.value = String(preset.bass);
  els.echoLevel.value = String(
    Math.round(preset.echo * 100)
  );

  updateEffectNodes();
  updateEffectUi();

  if (persist) {
    saveEffectPreferences();
  }
}

function updateEffectNodes() {
  if (!audioContext) return;

  const now = audioContext.currentTime;

  bassFilterNode.gain.setTargetAtTime(
    effectState.bass,
    now,
    0.035
  );

  trebleFilterNode.gain.setTargetAtTime(
    effectState.treble,
    now,
    0.035
  );

  delayNode.delayTime.setTargetAtTime(
    effectState.delay,
    now,
    0.035
  );

  feedbackGainNode.gain.setTargetAtTime(
    Math.min(0.35, effectState.feedback),
    now,
    0.035
  );

  wetGainNode.gain.setTargetAtTime(
    Math.min(0.42, effectState.echo),
    now,
    0.035
  );

  dryGainNode.gain.setTargetAtTime(
    1,
    now,
    0.035
  );

  compressorNode.ratio.setTargetAtTime(
    effectState.compressorRatio,
    now,
    0.04
  );

  compressorNode.threshold.setTargetAtTime(
    effectState.preset === 'night' ? -28 : -18,
    now,
    0.04
  );

  masterGainNode.gain.setTargetAtTime(
    effectState.master,
    now,
    0.04
  );
}

function updateEffectUi() {
  els.bassBoost.value =
    String(effectState.bass);

  els.echoLevel.value =
    String(
      Math.round(effectState.echo * 100)
    );

  els.bassValue.textContent =
    `${effectState.bass > 0 ? '+' : ''}${effectState.bass} dB`;

  els.echoValue.textContent =
    `${Math.round(effectState.echo * 100)}%`;

  const preset =
    EFFECT_PRESETS[effectState.preset];

  els.effectBadge.textContent =
    preset
      ? preset.label
      : 'Tùy chỉnh';
}

function saveEffectPreferences() {
  localStorage.setItem(
    'audio_effect_preset',
    effectState.preset
  );

  localStorage.setItem(
    'audio_effect_bass',
    String(effectState.bass)
  );

  localStorage.setItem(
    'audio_effect_echo',
    String(effectState.echo)
  );
}

function startVisualizer() {
  if (visualizerFrame) return;

  const canvas = els.visualizer;
  const context = canvas.getContext('2d');

  const draw = () => {
    visualizerFrame =
      requestAnimationFrame(draw);

    const rect =
      canvas.getBoundingClientRect();

    const dpr =
      Math.min(
        window.devicePixelRatio || 1,
        2
      );

    const width =
      Math.max(1, Math.floor(rect.width * dpr));

    const height =
      Math.max(1, Math.floor(rect.height * dpr));

    if (
      canvas.width !== width ||
      canvas.height !== height
    ) {
      canvas.width = width;
      canvas.height = height;
    }

    context.clearRect(
      0,
      0,
      width,
      height
    );

    const barCount = 34;
    const gap = 3 * dpr;
    const barWidth =
      Math.max(
        2 * dpr,
        (width - gap * (barCount - 1)) / barCount
      );

    const active =
      analyserNode &&
      frequencyData &&
      !activeAudio().paused;

    if (active) {
      analyserNode.getByteFrequencyData(
        frequencyData
      );
    }

    const gradient =
      context.createLinearGradient(
        0,
        height,
        0,
        0
      );

    gradient.addColorStop(
      0,
      '#7c3aed'
    );

    gradient.addColorStop(
      0.55,
      '#a855f7'
    );

    gradient.addColorStop(
      1,
      '#ec4899'
    );

    context.fillStyle = gradient;

    for (
      let index = 0;
      index < barCount;
      index++
    ) {
      let level;

      if (active) {
        const sourceIndex =
          Math.min(
            frequencyData.length - 1,
            Math.floor(
              index /
              barCount *
              frequencyData.length *
              0.72
            )
          );

        level =
          frequencyData[sourceIndex] / 255;
      } else {
        level =
          0.08 +
          0.035 *
          Math.sin(
            performance.now() / 620 +
            index * 0.62
          );
      }

      const barHeight =
        Math.max(
          3 * dpr,
          level * height * 0.9
        );

      const x =
        index * (barWidth + gap);

      const y =
        height - barHeight;

      const radius =
        Math.min(
          barWidth / 2,
          4 * dpr
        );

      drawRoundedRect(
        context,
        x,
        y,
        barWidth,
        barHeight,
        radius
      );
    }
  };

  draw();
}

function drawRoundedRect(
  context,
  x,
  y,
  width,
  height,
  radius
) {
  context.beginPath();

  if (typeof context.roundRect === 'function') {
    context.roundRect(
      x,
      y,
      width,
      height,
      radius
    );
  } else {
    context.rect(
      x,
      y,
      width,
      height
    );
  }

  context.fill();
}

function stopVisualizer() {
  if (visualizerFrame) {
    cancelAnimationFrame(
      visualizerFrame
    );
    visualizerFrame = 0;
  }
}


function showMode(text) {
  els.mode.hidden = false;
  els.mode.textContent = text;
}

function setLoading(visible, text = '', percent = 0) {
  if (!visible && (networkState.offline || networkState.retrying > 0)) {
    showRecoveryStatus(
      networkState.offline
        ? 'Mất kết nối • đang dùng bộ đệm và chờ mạng trở lại...'
        : 'Đường truyền chập chờn • đang tự động thử lại...'
    );
    return;
  }

  els.status.hidden = !visible;

  if (!visible) return;

  const safePercent = Math.max(
    0,
    Math.min(100, Math.round(percent))
  );

  els.statusText.textContent = text;
  els.statusPct.textContent = `${safePercent}%`;
  els.progress.style.width = `${safePercent}%`;
}

function resetTimeDisplay() {
  els.current.textContent = '0:00';
  els.duration.textContent = '0:00';
  els.seek.value = 0;
  els.seek.max = 100;
  lastEffectiveDuration = 0;
  lastSavedSecond = -1;
}

function showToast(message, isError = false) {
  clearTimeout(toastTimer);

  els.toast.textContent = message;
  els.toast.className = `toast show${isError ? ' error' : ''}`;

  toastTimer = setTimeout(
    () => els.toast.className = 'toast',
    3500
  );
}

function throwIfSessionInactive(session) {
  throwIfAborted(session.controller && session.controller.signal);

  if (
    session.cancelled ||
    session.token !== loadToken
  ) {
    throw new DOMException('Đã hủy tải.', 'AbortError');
  }
}

function cancelActiveSession(resetAudio = true) {
  const session = activeSession;
  activeSession = null;

  if (!session) {
    if (resetAudio) {
      resetPlayer(activeAudio());
    }

    return;
  }

  session.cancelled = true;

  if (session.controller) {
    try {
      session.controller.abort();
    } catch (_) {}
  }

  if (resetAudio) {
    resetPlayer(session.player);
  }

  if (session.url) {
    try {
      URL.revokeObjectURL(session.url);
    } catch (_) {}
  }
}

function clearStandby() {
  standbyState.token++;

  if (standbyState.controller) {
    try {
      standbyState.controller.abort();
    } catch (_) {}
  }

  resetPlayer(standbyAudio());

  if (standbyState.url) {
    try {
      URL.revokeObjectURL(standbyState.url);
    } catch (_) {}
  }

  standbyState = {
    token: standbyState.token,
    track: null,
    ready: false,
    url: '',
    controller: null
  };
}

function resetPlayer(player) {
  try {
    player.pause();
    player.removeAttribute('src');
    player.load();
  } catch (_) {}
}

function cleanupEverything() {
  savePosition();
  stopPlaybackUiTicker();
  stopVisualizer();
  cancelActiveSession();
  clearStandby();

  if (audioContext) {
    try {
      audioContext.close();
    } catch (_) {}
  }
}

function waitEvent(target, eventName, timeout, signal) {
  return new Promise((resolve, reject) => {
    let timer = null;

    const cleanup = () => {
      clearTimeout(timer);
      target.removeEventListener(eventName, onEvent);

      if (signal) {
        signal.removeEventListener('abort', onAbort);
      }
    };

    const onEvent = event => {
      cleanup();
      resolve(event);
    };

    const onAbort = () => {
      cleanup();
      reject(new DOMException('Đã hủy tải.', 'AbortError'));
    };

    target.addEventListener(eventName, onEvent, { once: true });

    if (signal) {
      signal.addEventListener('abort', onAbort, { once: true });
    }

    timer = setTimeout(() => {
      cleanup();
      reject(new Error(`Chờ sự kiện ${eventName} quá lâu.`));
    }, timeout);
  });
}

function waitForPlayable(player, timeout, signal) {
  if (player.readyState >= 3) {
    return Promise.resolve();
  }

  return Promise.race([
    waitEvent(player, 'canplay', timeout, signal),
    waitEvent(player, 'loadedmetadata', timeout, signal)
  ]);
}

function base64ToBytes(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);

  for (let index = 0; index < binary.length; index++) {
    bytes[index] = binary.charCodeAt(index);
  }

  return bytes;
}

function concatUint8Arrays(parts, totalLength) {
  const result = new Uint8Array(totalLength);
  let offset = 0;

  parts.forEach(part => {
    result.set(part, offset);
    offset += part.length;
  });

  return result;
}

function normalizeText(value) {
  return String(value || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .trim();
}

function formatBytes(bytes) {
  if (!bytes) return '0 B';

  const units = ['B', 'KB', 'MB', 'GB'];

  const index = Math.min(
    Math.floor(Math.log(bytes) / Math.log(1024)),
    units.length - 1
  );

  return (
    bytes / Math.pow(1024, index)
  ).toFixed(index ? 1 : 0) + ' ' + units[index];
}

function formatTime(value) {
  if (!Number.isFinite(value) || value < 0) {
    return '0:00';
  }

  const hours = Math.floor(value / 3600);
  const minutes = Math.floor(value % 3600 / 60);
  const seconds = Math.floor(value % 60);

  return hours
    ? `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`
    : `${minutes}:${String(seconds).padStart(2, '0')}`;
}

function guessMime(extension) {
  return ({
    mp3: 'audio/mpeg',
    m4a: 'audio/mp4',
    aac: 'audio/aac',
    wav: 'audio/wav',
    ogg: 'audio/ogg',
    oga: 'audio/ogg',
    opus: 'audio/ogg',
    flac: 'audio/flac',
    webm: 'audio/webm'
  })[String(extension || '').toLowerCase()] || 'audio/mpeg';
}

function escapeHtml(value) {
  return String(value).replace(
    /[&<>'"]/g,
    character => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      "'": '&#39;',
      '"': '&quot;'
    })[character]
  );
}

function openChunkDb() {
  if (!('indexedDB' in window)) {
    return Promise.reject(new Error('IndexedDB không được hỗ trợ.'));
  }

  if (cacheDbPromise) {
    return cacheDbPromise;
  }

  cacheDbPromise = new Promise((resolve, reject) => {
    const request = indexedDB.open(CACHE_DB_NAME, CACHE_DB_VERSION);

    request.onupgradeneeded = () => {
      const db = request.result;

      if (!db.objectStoreNames.contains(CACHE_STORE_NAME)) {
        const store = db.createObjectStore(
          CACHE_STORE_NAME,
          { keyPath: 'key' }
        );

        store.createIndex(
          'lastAccess',
          'lastAccess',
          { unique: false }
        );
      }
    };

    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });

  return cacheDbPromise;
}

function chunkCacheKey(file, info, index) {
  const version = info.updatedAt || info.size || 'v1';
  return `${file.id}:${version}:${index}`;
}

async function getCachedChunk(file, info, index) {
  try {
    const db = await openChunkDb();
    const key = chunkCacheKey(file, info, index);

    const record = await idbRequest(
      db
        .transaction(CACHE_STORE_NAME, 'readonly')
        .objectStore(CACHE_STORE_NAME)
        .get(key)
    );

    if (!record || !record.data) {
      return null;
    }

    touchCachedChunk(key).catch(() => {});

    return new Uint8Array(record.data);
  } catch (_) {
    return null;
  }
}

async function putCachedChunk(file, info, index, bytes) {
  try {
    const db = await openChunkDb();
    const key = chunkCacheKey(file, info, index);
    const data = bytes.buffer.slice(
      bytes.byteOffset,
      bytes.byteOffset + bytes.byteLength
    );

    const transaction = db.transaction(
      CACHE_STORE_NAME,
      'readwrite'
    );

    transaction.objectStore(CACHE_STORE_NAME).put({
      key: key,
      fileId: file.id,
      index: index,
      size: bytes.byteLength,
      lastAccess: Date.now(),
      data: data
    });

    await idbTransactionDone(transaction);

    cacheWriteCount++;

    if (cacheWriteCount % 30 === 0) {
      pruneChunkCache().catch(() => {});
    }
  } catch (_) {}
}

async function touchCachedChunk(key) {
  const db = await openChunkDb();
  const transaction = db.transaction(
    CACHE_STORE_NAME,
    'readwrite'
  );
  const store = transaction.objectStore(CACHE_STORE_NAME);
  const record = await idbRequest(store.get(key));

  if (record) {
    record.lastAccess = Date.now();
    store.put(record);
  }

  await idbTransactionDone(transaction);
}

async function pruneChunkCache() {
  const db = await openChunkDb();
  const transaction = db.transaction(
    CACHE_STORE_NAME,
    'readwrite'
  );
  const store = transaction.objectStore(CACHE_STORE_NAME);
  const count = await idbRequest(store.count());

  let removeCount = Math.max(0, count - MAX_CACHE_ENTRIES);

  if (removeCount > 0) {
    await new Promise((resolve, reject) => {
      const request = store.index('lastAccess').openCursor();

      request.onsuccess = () => {
        const cursor = request.result;

        if (!cursor || removeCount <= 0) {
          resolve();
          return;
        }

        store.delete(cursor.primaryKey);
        removeCount--;
        cursor.continue();
      };

      request.onerror = () => reject(request.error);
    });
  }

  await idbTransactionDone(transaction);
}

function idbRequest(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function idbTransactionDone(transaction) {
  return new Promise((resolve, reject) => {
    transaction.oncomplete = () => resolve();
    transaction.onerror = () => reject(transaction.error);
    transaction.onabort = () => reject(transaction.error);
  });
}
