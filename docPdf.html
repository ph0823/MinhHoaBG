<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tủ Sách & Nhạc</title>
  
  <!-- Thư viện Google Identity Services & PDF.js -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    :root { --p: #0f766e; --bg: #f8fafc; --text: #1e293b; --border: #cbd5e1; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    header { background: white; padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.2rem; color: var(--p); }
    button { padding: 8px 16px; background: var(--p); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:hover { opacity: 0.9; }
    button:disabled { background: var(--border); cursor: not-allowed; }

    .layout { display: flex; flex: 1; min-height: 0; }
    
    /* Sidebar List */
    .sidebar { width: 320px; background: white; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .file-list { flex: 1; overflow-y: auto; list-style: none; padding: 8px; }
    .file-item { display: flex; align-items: center; padding: 12px; margin-bottom: 4px; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
    .file-item:hover { background: #f1f5f9; }
    .file-item .icon { font-size: 20px; margin-right: 12px; }
    .file-item .name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    /* Main Viewer */
    .viewer { flex: 1; display: flex; flex-direction: column; background: #e2e8f0; position: relative; }
    .viewer-placeholder { margin: auto; color: #64748b; font-size: 1.1rem; }
    
    /* PDF Viewer */
    #pdf-container { flex: 1; overflow: auto; text-align: center; padding: 20px; display: none; }
    #pdf-canvas { max-width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.1); background: white; margin-bottom: 20px;}
    .pdf-controls { background: white; padding: 12px; display: flex; justify-content: center; gap: 16px; align-items: center; border-bottom: 1px solid var(--border); display: none;}
    
    /* Audio Player */
    #audio-container { position: absolute; bottom: 0; left: 0; right: 0; background: white; padding: 20px; border-top: 1px solid var(--border); box-shadow: 0 -4px 15px rgba(0,0,0,0.05); display: none; text-align: center; }
    #audio-player { width: 100%; max-width: 600px; outline: none; margin-top: 12px;}
    #audio-title { font-weight: bold; font-size: 1.2rem; color: var(--p); }
  </style>
</head>
<body>

  <header>
    <h1>📚 Thư Viện Nhi</h1>
    <div id="auth-section">
      <button id="btn-login" onclick="handleAuthClick()">Kết nối Google Drive</button>
      <span id="user-status" style="margin-left: 10px; font-weight: bold; color: #16a34a; display: none;">Đã kết nối</span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <ul class="file-list" id="file-list">
        <li style="padding: 20px; text-align: center; color: #64748b;">Vui lòng kết nối Drive để tải danh sách.</li>
      </ul>
    </aside>

    <main class="viewer">
      <div id="placeholder" class="viewer-placeholder">Chọn một file PDF hoặc MP3 để mở</div>

      <!-- PDF UI -->
      <div id="pdf-controls" class="pdf-controls">
        <button id="btn-prev" onclick="changePage(-1)">Thụt lui</button>
        <span>Trang <span id="page-num">0</span> / <span id="page-count">0</span></span>
        <button id="btn-next" onclick="changePage(1)">Tiếp theo</button>
      </div>
      <div id="pdf-container">
        <canvas id="pdf-canvas"></canvas>
      </div>

      <!-- Audio UI -->
      <div id="audio-container">
        <div id="audio-title">Đang tải nhạc...</div>
        <audio id="audio-player" controls preload="auto"></audio>
      </div>
    </main>
  </div>

  <script>
    // ==========================================
    // CẤU HÌNH HỆ THỐNG (ĐIỀN THÔNG TIN CỦA BẠN)
    // ==========================================
    const CLIENT_ID = '660983736125-gvdcpfho9dd6vb2an5i8bb8epoto7i12.apps.googleusercontent.com'; 
    const ROOT_FOLDER_ID = '1zxPsOQeaZF4GOa7ZXiWsKr03LATCOFP6'; // ID thư mục gốc Google Drive

    const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';
    let tokenClient;
    let accessToken = null;
    
    // PDF.js State
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    let pdfDoc = null, pageNum = 1, pageRendering = false, pageNumPending = null;
    const canvas = document.getElementById('pdf-canvas'), ctx = canvas.getContext('2d');

    // ==========================================
    // 1. KHỞI TẠO OAUTH 2.0 GOOGLE IDENTITY SERVICES
    // ==========================================
    window.onload = function () {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (tokenResponse) => {
          if (tokenResponse && tokenResponse.access_token) {
            accessToken = tokenResponse.access_token;
            document.getElementById('btn-login').style.display = 'none';
            document.getElementById('user-status').style.display = 'inline';
            loadDriveFiles(ROOT_FOLDER_ID); // Load thư mục gốc
          }
        },
      });
    };

    function handleAuthClick() {
      tokenClient.requestAccessToken();
    }

    // ==========================================
    // 2. LẤY DANH SÁCH FILE TRỰC TIẾP TỪ DRIVE API
    // ==========================================
    async function loadDriveFiles(folderId) {
      const listEl = document.getElementById('file-list');
      listEl.innerHTML = '<li style="padding: 12px; text-align:center;">Đang tải...</li>';

      try {
        // Query chỉ lấy thư mục, pdf, mp3, m4a không bị xóa
        const query = `'${folderId}' in parents and trashed = false and (mimeType = 'application/vnd.google-apps.folder' or mimeType = 'application/pdf' or mimeType contains 'audio/')`;
        const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name,mimeType)&orderBy=folder,name&access_token=${accessToken}`;
        
        const response = await fetch(url);
        const data = await response.json();

        if (!data.files || data.files.length === 0) {
          listEl.innerHTML = '<li style="padding: 12px; text-align:center;">Thư mục trống.</li>';
          return;
        }

        listEl.innerHTML = '';
        if (folderId !== ROOT_FOLDER_ID) {
           listEl.innerHTML += `<li class="file-item" onclick="loadDriveFiles('${ROOT_FOLDER_ID}')"><span class="icon">🔙</span><span class="name">Quay lại thư mục gốc</span></li>`;
        }

        data.files.forEach(file => {
          const isFolder = file.mimeType === 'application/vnd.google-apps.folder';
          const isAudio = file.mimeType.includes('audio/');
          const icon = isFolder ? '📁' : (isAudio ? '🎵' : '📄');
          
          listEl.innerHTML += `
            <li class="file-item" onclick="openFile('${file.id}', '${file.name}', '${file.mimeType}')">
              <span class="icon">${icon}</span>
              <span class="name">${file.name}</span>
            </li>
          `;
        });
      } catch (err) {
        listEl.innerHTML = `<li style="padding: 12px; color: red;">Lỗi tải dữ liệu</li>`;
        console.error(err);
      }
    }

    // ==========================================
    // 3. XỬ LÝ MỞ FILE (ĐIỀU HƯỚNG SANG PDF HOẶC AUDIO)
    // ==========================================
    function openFile(fileId, fileName, mimeType) {
      if (mimeType === 'application/vnd.google-apps.folder') {
        loadDriveFiles(fileId);
        return;
      }

      document.getElementById('placeholder').style.display = 'none';
      
      if (mimeType.includes('audio/')) {
        playAudio(fileId, fileName);
      } else if (mimeType === 'application/pdf') {
        renderPDF(fileId);
      } else {
        alert("Định dạng không được hỗ trợ!");
      }
    }

    // ==========================================
    // 4. MODULE AUDIO (STREAMING BẰNG THẺ <AUDIO>)
    // Bí quyết: Truyền access_token thẳng vào URL alt=media
    // ==========================================
    function playAudio(fileId, fileName) {
      // Ẩn PDF
      document.getElementById('pdf-container').style.display = 'none';
      document.getElementById('pdf-controls').style.display = 'none';
      
      // Hiện Audio
      document.getElementById('audio-container').style.display = 'block';
      document.getElementById('audio-title').innerText = fileName;

      const audioPlayer = document.getElementById('audio-player');
      
      // URL trực tiếp lấy Media từ Drive, đính kèm token
      const mediaUrl = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&access_token=${accessToken}`;
      
      audioPlayer.src = mediaUrl;
      audioPlayer.play().catch(e => console.log("Auto-play bị chặn bởi trình duyệt, người dùng cần click play."));
    }

    // ==========================================
    // 5. MODULE PDF (PDF.JS TỰ ĐỘNG CHIA RANGE REQUESTS)
    // Bí quyết: Bỏ access_token vào httpHeaders
    // ==========================================
    async function renderPDF(fileId) {
      // Ẩn Audio
      document.getElementById('audio-container').style.display = 'none';
      const audioPlayer = document.getElementById('audio-player');
      audioPlayer.pause();
      
      // Hiện PDF
      document.getElementById('pdf-container').style.display = 'block';
      document.getElementById('pdf-controls').style.display = 'flex';
      
      const mediaUrl = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`;

      // Cung cấp header cho PDF.js, nó sẽ tự động gửi byte-range requests HTTP 206
      const loadingTask = pdfjsLib.getDocument({
        url: mediaUrl,
        httpHeaders: {
          'Authorization': `Bearer ${accessToken}`
        }
      });

      try {
        pdfDoc = await loadingTask.promise;
        document.getElementById('page-count').textContent = pdfDoc.numPages;
        pageNum = 1;
        renderPage(pageNum);
      } catch (err) {
        console.error('Lỗi khi load PDF:', err);
        alert("Không thể tải PDF. Token có thể đã hết hạn.");
      }
    }

    async function renderPage(num) {
      pageRendering = true;
      const page = await pdfDoc.getPage(num);
      
      // Scale để vừa màn hình
      const containerWidth = document.getElementById('pdf-container').clientWidth - 40;
      const unscaledViewport = page.getViewport({scale: 1});
      const scale = Math.min(containerWidth / unscaledViewport.width, 1.5); // Max scale 1.5
      
      const viewport = page.getViewport({ scale: scale });
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      const renderContext = {
        canvasContext: ctx,
        viewport: viewport
      };
      
      await page.render(renderContext).promise;
      pageRendering = false;
      
      if (pageNumPending !== null) {
        renderPage(pageNumPending);
        pageNumPending = null;
      }
      
      document.getElementById('page-num').textContent = num;
    }

    function queueRenderPage(num) {
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    function changePage(offset) {
      if (!pdfDoc) return;
      if (pageNum + offset <= 0 || pageNum + offset > pdfDoc.numPages) return;
      pageNum += offset;
      queueRenderPage(pageNum);
    }
  </script>
</body>
</html>
