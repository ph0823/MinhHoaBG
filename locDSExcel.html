<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lọc Dữ Liệu Tuổi Từ Excel</title>
    <!-- Nhúng thư viện SheetJS từ CDN -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 40px; 
            background-color: #f4f7f6;
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: white; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 { color: #333; margin-top: 0; }
        input[type="file"] { margin: 20px 0; }
        button { 
            background-color: #4CAF50; 
            color: white; 
            padding: 10px 20px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 16px;
        }
        button:hover { background-color: #45a049; }
        #status { margin-top: 20px; font-weight: bold; color: #2e7d32; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Phân loại dữ liệu theo độ tuổi</h2>
        <p>Tải lên file Excel có chứa cột <strong>"Ngày sinh"</strong> hoặc <strong>"Năm sinh"</strong>.</p>
        
        <input type="file" id="uploadFile" accept=".xlsx, .xls" />
        <br>
        <button onclick="processExcel()">Lọc & Tải Xuống File Mới</button>
        
        <div id="status"></div>
    </div>

    <script>
        function processExcel() {
            const fileInput = document.getElementById('uploadFile');
            const statusDiv = document.getElementById('status');
            
            if (!fileInput.files.length) {
                alert('Vui lòng chọn một file Excel!');
                return;
            }

            statusDiv.innerText = "Đang xử lý...";
            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    // Đọc file Excel, cellDates: true giúp tự động parse định dạng ngày của Excel
                    const workbook = XLSX.read(data, { type: 'array', cellDates: true });

                    // Lấy sheet đầu tiên
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];

                    // Chuyển sheet thành mảng JSON. dateNF định dạng lại ngày tháng thành chuỗi
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { raw: false, dateNF: 'dd/mm/yyyy' });

                    const currentYear = new Date().getFullYear();
                    const under18 = [];
                    const between18And50 = [];
                    const over50 = [];

                    jsonData.forEach(row => {
                        // Tìm linh hoạt tên cột (có thể là "Ngày sinh", "ngày Sinh", "Năm sinh"...)
                        const birthKey = Object.keys(row).find(k => 
                            k.toLowerCase().includes('ngày sinh') || 
                            k.toLowerCase().includes('năm sinh')
                        );

                        if (birthKey && row[birthKey]) {
                            let birthYear = 0;
                            const dateStr = row[birthKey].toString().trim();

                            // Bóc tách năm sinh từ chuỗi (hỗ trợ dạng DD/MM/YYYY hoặc chỉ YYYY)
                            if (dateStr.includes('/')) {
                                const parts = dateStr.split('/');
                                birthYear = parseInt(parts[parts.length - 1], 10);
                            } else if (dateStr.includes('-')) {
                                const parts = dateStr.split('-');
                                // Kiểm tra xem năm nằm ở đầu (YYYY-MM-DD) hay cuối (DD-MM-YYYY)
                                birthYear = parseInt(parts[0].length === 4 ? parts[0] : parts[parts.length - 1], 10);
                            } else {
                                birthYear = parseInt(dateStr, 10);
                            }

                            // Phân loại nếu lấy được năm hợp lệ
                            if (!isNaN(birthYear) && birthYear > 1900) {
                                const age = currentYear - birthYear;
                                if (age < 18) {
                                    under18.push(row);
                                } else if (age <= 50) {
                                    between18And50.push(row);
                                } else {
                                    over50.push(row);
                                }
                            }
                        }
                    });

                    // Tạo một Workbook mới để chứa kết quả
                    const newWorkbook = XLSX.utils.book_new();

                    // Thêm các sheet nếu có dữ liệu
                    if (under18.length > 0) {
                        const ws1 = XLSX.utils.json_to_sheet(under18);
                        XLSX.utils.book_append_sheet(newWorkbook, ws1, "Dưới 18 tuổi");
                    }
                    if (between18And50.length > 0) {
                        const ws2 = XLSX.utils.json_to_sheet(between18And50);
                        XLSX.utils.book_append_sheet(newWorkbook, ws2, "Từ 18 đến 50");
                    }
                    if (over50.length > 0) {
                        const ws3 = XLSX.utils.json_to_sheet(over50);
                        XLSX.utils.book_append_sheet(newWorkbook, ws3, "Trên 50 tuổi");
                    }

                    // Kích hoạt trình duyệt tải file xuống
                    XLSX.writeFile(newWorkbook, "Ket_qua_phan_loai.xlsx");
                    statusDiv.innerText = "Đã xử lý và tải xuống thành công!";
                    statusDiv.style.color = "#2e7d32";

                } catch (error) {
                    console.error(error);
                    statusDiv.innerText = "Có lỗi xảy ra trong quá trình xử lý file.";
                    statusDiv.style.color = "red";
                }
            };

            // Bắt đầu đọc file dưới dạng mảng byte
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
