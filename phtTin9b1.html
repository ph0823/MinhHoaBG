<style>
:root{
  --primary:#1565c0;--primary2:#0d47a1;--accent:#ff8f00;--success:#2e7d32;
  --danger:#c62828;--bg:#f5f7fb;--card:#fff;--text:#263238;--muted:#607d8b;
  --border:#d7e0e8;--soft:#eaf3ff;--purple:#6a1b9a;
}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{max-width:1220px;margin:auto;padding:18px}
.header{background:linear-gradient(135deg,#e3f2fd,#fff8e1);border:1px solid var(--border);border-radius:18px;padding:18px 22px;margin-bottom:16px}
.header h1{margin:0;color:var(--primary2);font-size:clamp(1.5rem,4vw,2.2rem)}
.header p{margin:6px 0 0;color:var(--muted)}
.topbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.badge{padding:7px 10px;border-radius:999px;background:#eef3f8;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 5px 18px rgba(0,0,0,.05)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700}
input,select,textarea{width:100%;border:1.5px solid #b9c7d4;border-radius:9px;padding:10px;background:#fff}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(21,101,192,.12);border-color:var(--primary)}
.btn{border:none;border-radius:9px;padding:10px 15px;font-weight:700;background:var(--primary);color:#fff}
.btn.secondary{background:#546e7a}
.btn.success{background:var(--success)}
.btn.warning{background:var(--accent)}
.btn.danger{background:var(--danger)}
.btn.light{background:#edf3f8;color:#263238}
.btn:disabled{opacity:.5;cursor:not-allowed}
.notice{padding:10px 12px;border-radius:10px;background:#fff8e1;color:#7a4a00;margin-top:12px}
.progress-shell{height:10px;background:#e0e7ee;border-radius:999px;overflow:hidden}
.progress-bar{height:100%;background:var(--success);width:0;transition:.2s}
.activity-nav{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:15px 0}
.act-btn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px 6px;font-weight:700;color:#455a64}
.act-btn.active{background:var(--soft);border-color:var(--primary);color:var(--primary2)}
.act-btn.done{background:#e8f5e9;border-color:#81c784;color:#1b5e20}
.activity h2{margin-top:0;color:var(--primary2)}
.subtask{border:1px solid var(--border);border-radius:12px;padding:14px;margin:12px 0;background:#fcfdff}
.subtask h3{margin:0 0 10px;font-size:1.02rem;color:#37474f}
.option{display:block;padding:8px 10px;border:1px solid #e4e9ee;border-radius:8px;margin:7px 0;background:#fff}
.option input{width:auto;margin-right:8px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid var(--border);padding:9px;vertical-align:top}
th{background:#edf5ff}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match-card{border:1px solid var(--border);border-radius:10px;padding:10px;background:#fff}
.sequence{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seq-step{padding:10px 12px;border-radius:10px;background:#eef5ff;border:1px solid #b8d5f5;font-weight:700}
.teacher-table td,.teacher-table th{font-size:.9rem}
.score-pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8f5e9;color:#1b5e20;font-weight:700}
.small{font-size:.85rem;color:var(--muted)}
.footer-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:15px}
.result-box{border:1px solid #c8e6c9;background:#f1f8e9;border-radius:12px;padding:14px}
.warn-box{border:1px solid #ffe0b2;background:#fff8e1;border-radius:12px;padding:14px}
.teacher-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.teacher-toolbar select{max-width:180px}
.firebase-status{margin-top:10px;padding:9px 11px;border-radius:8px;background:#eceff1;color:#455a64;font-size:.88rem}
.firebase-status.ok{background:#e8f5e9;color:#1b5e20}
.firebase-status.error{background:#ffebee;color:#b71c1c}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.kpi>div{background:#f7f9fb;border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
.kpi strong{display:block;font-size:1.35rem;color:var(--primary2)}
@media(max-width:800px){
  .grid2,.match-grid{grid-template-columns:1fr}
  .activity-nav{grid-template-columns:repeat(4,1fr)}
  .kpi{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:520px){
  .app{padding:8px}
  .activity-nav{grid-template-columns:repeat(2,1fr)}
}
</style>

        ],r)}

          ["purpose","Mục đích sử dụng"],["many","Tìm càng nhiều trang càng tốt"],["first","Chỉ mở kết quả đầu tiên"]

        <p>Chọn những thiết bị/hoạt động sẽ bị ảnh hưởng mạnh:</p>
        ${multiCheck("a7_affected",[
          ["traffic","Đèn giao thông thông minh"],["atm","Máy ATM"],["factory","Robot nhà máy"],["washer","Máy giặt"],
          ["phone","Điện thoại thông minh"],["pencil","Bút chì"],["notebook","Vở giấy"],["chair","Ghế gỗ"],["ruler","Thước nhựa"]
        ],r)}
        ${textArea("a7_consequence",r,"Viết 1-2 câu mô tả điều có thể xảy ra.")}
      </div>
      <div class="subtask">
        <h3>2. Điều em học được từ Internet</h3>
        ${inputText("a7_learned",r,"Kiến thức/kĩ năng em từng học được")}
        ${inputText("a7_source",r,"Nguồn Internet em sử dụng")}

          ["steps","Đếm bước chân"],["heart","Đo nhịp tim"],["notify","Nhận thông báo"],["sleep","Theo dõi giấc ngủ"],["time","Hiển thị thời gian"],["gps","Định vị"]
        ],r)}

function allData(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")}catch{return {}}
}
function saveAll(data){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}
function studentKey(cls,no){
  return `${String(cls).replace(/[^0-9A-Za-z._-]/g,"_")}_${String(no).padStart(2,"0")}`
}
function firebaseStudentPath(cls,no){return studentKey(cls,no)}
function setFirebaseStatus(message,type=""){
  const el=document.getElementById("firebaseStatus");
  if(!el)return;
  el.textContent=message;
  el.className="firebase-status"+(type?` ${type}`:"");
}
async function initFirebase(){
  try{
    setFirebaseStatus("Đang kết nối Firebase...");
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth=firebase.auth();
    if(auth.currentUser){firebaseUser=auth.currentUser;}
    else{const r=await auth.signInAnonymously();firebaseUser=r.user;}
    database=firebase.database();
    resultsRef=database.ref(FIREBASE_ROOT);
    firebaseReady=true;
    setFirebaseStatus("Firebase đã kết nối · Dữ liệu sẽ đồng bộ tự động.","ok");
    startFirebaseListener();
    console.log("Firebase Auth OK:",firebaseUser.uid);
  }catch(err){
    firebaseReady=false;
    setFirebaseStatus("Không thể kết nối Firebase · Vẫn lưu tạm trên máy.","error");
    console.error("Firebase init error:",err);
  }
}
function startFirebaseListener(){
  if(firebaseListenerStarted||!resultsRef)return;
  firebaseListenerStarted=true;
  resultsRef.on("value",snap=>{
    firebaseRecords=snap.val()||{};
    if(!document.getElementById("teacherScreen").classList.contains("hidden")) renderTeacher();
  },err=>console.error("Firebase listener error:",err));
}
async function syncCurrentToFirebase(){
  if(!firebaseReady||!resultsRef||!currentKey||!currentRecord)return false;
  const payload={...currentRecord,authUid:firebaseUser?.uid||"",updatedAt:firebase.database.ServerValue.TIMESTAMP};
  try{
    await resultsRef.child(currentKey).set(payload);
    return true;
  }catch(err){console.error("Firebase save error:",err);return false;}
}
async function loadRemoteRecord(key){
  if(!firebaseReady||!resultsRef)return null;
  try{const snap=await resultsRef.child(key).once("value");return snap.val()||null}catch(err){console.error("Firebase read error:",err);return null}
}
function defaultRecord(cls,no,name){
  return {className:cls,studentNo:Number(no),name:name,answers:{},done:[false,false,false,false,false,false,false],authUid:firebaseUser?.uid||"",updatedAt:Date.now()}
}
function esc(v){return String(v??"").replace(/[&<>"']/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]))}
function getVal(r,k){return r.answers?.[k]??""}
function isChecked(r,k,v){return Array.isArray(r.answers?.[k])&&r.answers[k].includes(v)}

function inputText(k,r,ph=""){
  return `<input data-key="${k}" value="${esc(getVal(r,k))}" placeholder="${esc(ph)}">`
}
function textArea(k,r,ph=""){
  return `<textarea data-key="${k}" placeholder="${esc(ph)}">${esc(getVal(r,k))}</textarea>`
}
function selectField(k,label,opts,r){
  const cur=getVal(r,k);
  return `<div class="field"><label>${esc(label)}</label><select data-key="${k}">
    ${opts.map(o=>`<option value="${esc(o)}" ${cur===o?"selected":""}>${esc(o||"-- Chọn --")}</option>`).join("")}
  </select></div>`
}
function radioGroup(k,opts,r){
  const cur=getVal(r,k);
  return opts.map(([v,t])=>`<label class="option"><input type="radio" name="${k}" data-key="${k}" value="${v}" ${cur===v?"checked":""}>${esc(v)}. ${esc(t)}</label>`).join("")
}
function multiCheck(k,opts,r){
  return opts.map(([v,t])=>`<label class="option"><input type="checkbox" data-key="${k}" value="${v}" ${isChecked(r,k,v)?"checked":""}>${esc(t)}</label>`).join("")
}

function renderNav(){
  const nav=document.getElementById("activityNav");
  nav.innerHTML=activities.map((a,i)=>`<button class="act-btn ${i===currentActivity?"active":""} ${currentRecord.done[i]?"done":""}" data-act="${i}">HĐ ${i+1}</button>`).join("");
  nav.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{currentActivity=Number(b.dataset.act);renderActivity()});
}
function renderActivity(){
  renderNav();
  const card=document.getElementById("activityCard");
  card.innerHTML=activities[currentActivity].render(currentRecord)+`
    <div class="footer-actions">
      <button class="btn light" id="prevAct" ${currentActivity===0?"disabled":""}>← Hoạt động trước</button>
      <div>
        <button class="btn success" id="completeAct">${currentRecord.done[currentActivity]?"Đã hoàn thành ✓":"Hoàn thành hoạt động"}</button>
        <button class="btn" id="nextAct" ${currentActivity===activities.length-1?"disabled":""}>Hoạt động tiếp →</button>
      </div>
    </div>`;
  bindAnswerEvents(card);
  document.getElementById("prevAct").onclick=()=>{if(currentActivity>0){currentActivity--;renderActivity()}};
  document.getElementById("nextAct").onclick=()=>{if(currentActivity<6){currentActivity++;renderActivity()}};
  document.getElementById("completeAct").onclick=()=>{
    if(!activityHasSomeWork(currentActivity,currentRecord)){alert("Hãy thực hiện ít nhất một nhiệm vụ trước khi đánh dấu hoàn thành.");return}
    currentRecord.done[currentActivity]=true;persistCurrent();renderActivity();updateProgress();
  };
  updateProgress();
}
function bindAnswerEvents(root){
  root.querySelectorAll("[data-key]").forEach(el=>{
    el.addEventListener("input",capture);
    el.addEventListener("change",capture);
  });
}
function capture(e){
  const el=e.target,k=el.dataset.key;
  if(el.type==="checkbox"){
    const checked=[...document.querySelectorAll(`input[type=checkbox][data-key="${CSS.escape(k)}"]:checked`)].map(x=>x.value);
    currentRecord.answers[k]=checked;
  }else{
    currentRecord.answers[k]=el.value;
  }
  currentRecord.updatedAt=Date.now();
  document.getElementById("saveStatus").textContent="Đang lưu...";
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{persistCurrent();document.getElementById("saveStatus").textContent="Đã lưu";},300);
}
function persistCurrent(){
  if(!currentKey||!currentRecord)return;
  currentRecord.updatedAt=Date.now();
  currentRecord.authUid=firebaseUser?.uid||currentRecord.authUid||"";
  const d=allData();d[currentKey]=currentRecord;saveAll(d);
  clearTimeout(remoteSaveTimer);
  remoteSaveTimer=setTimeout(async()=>{
    const ok=await syncCurrentToFirebase();
    const el=document.getElementById("saveStatus");
    if(el) el.textContent=ok?"Đã lưu · Đã đồng bộ":"Đã lưu trên máy";
  },500);
}
function activityHasSomeWork(index,r){
  const prefixes=[["a1_"],["a2_"],["a3_"],["a4_"],["a5_"],["a6_"],["a7_"]][index];
  return Object.entries(r.answers||{}).some(([k,v])=>prefixes.some(p=>k.startsWith(p))&&(Array.isArray(v)?v.length>0:String(v).trim()!==""))
}
function updateProgress(){
  const n=currentRecord.done.filter(Boolean).length;
  document.getElementById("progressBar").style.width=`${n/7*100}%`;
}
async function enterStudent(){
  const cls=document.getElementById("studentClass").value;
  const no=document.getElementById("studentNo").value;
  const name=document.getElementById("studentName").value.trim().replace(/\s+/g," ");
  if(!cls){alert("Vui lòng chọn lớp.");return}
  if(!no){alert("Vui lòng chọn STT.");return}
  const key=studentKey(cls,no),d=allData();
  const remote=await loadRemoteRecord(key);
  const local=d[key]||null;
  const chosen = remote && local ? ((remote.updatedAt||0)>=(local.updatedAt||0)?remote:local) : (remote||local);
  if(chosen){
    currentRecord=chosen;
    if(name) currentRecord.name=name;
  }else{
    if(!name){alert("Vui lòng nhập họ và tên.");return}
    currentRecord=defaultRecord(cls,no,name);
  }
  currentKey=key;persistCurrent();currentActivity=Math.max(0,currentRecord.done.findIndex(x=>!x));if(currentActivity<0)currentActivity=6;
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("teacherScreen").classList.add("hidden");
  document.getElementById("studentScreen").classList.remove("hidden");
  document.getElementById("studentBadge").textContent=`${currentRecord.className} · STT ${currentRecord.studentNo} · ${currentRecord.name}`;
  renderActivity();
}
document.getElementById("startBtn").onclick=enterStudent;
document.getElementById("backLoginBtn").onclick=()=>{persistCurrent();document.getElementById("studentScreen").classList.add("hidden");document.getElementById("loginScreen").classList.remove("hidden")};

function teacherOpen(){
  const pin=prompt("Nhập mã giáo viên:");
  if(pin!==TEACHER_PIN){alert("Mã giáo viên không đúng.");return}
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("studentScreen").classList.add("hidden");
  document.getElementById("teacherScreen").classList.remove("hidden");
  renderTeacher();
}
document.getElementById("teacherBtn").onclick=teacherOpen;
document.getElementById("teacherBackBtn").onclick=()=>{document.getElementById("teacherScreen").classList.add("hidden");document.getElementById("loginScreen").classList.remove("hidden")};

function renderTeacher(){
  const d=(firebaseReady?firebaseRecords:allData()),records=Object.values(d).sort((a,b)=>a.className.localeCompare(b.className,"vi",{numeric:true})||a.studentNo-b.studentNo);
  const classes=[...new Set(records.map(r=>r.className))];
  const filter=document.getElementById("teacherClassFilter"),cur=filter.value;
  filter.innerHTML='<option value="all">Tất cả lớp</option>'+classes.map(c=>`<option>${esc(c)}</option>`).join("");
  if(cur==="all"||classes.includes(cur))filter.value=cur;
  const view=filter.value==="all"?records:records.filter(r=>r.className===filter.value);
  document.getElementById("kpiStudents").textContent=view.length;
  document.getElementById("kpiCompleted").textContent=view.filter(r=>r.done.filter(Boolean).length===7).length;
  const avg=view.length?Math.round(view.reduce((s,r)=>s+r.done.filter(Boolean).length/7*100,0)/view.length):0;
  document.getElementById("kpiAvg").textContent=avg+"%";
  document.getElementById("kpiRecent").textContent=view.length?new Date(Math.max(...view.map(r=>r.updatedAt||0))).toLocaleString("vi-VN"):"-";
  document.getElementById("teacherBody").innerHTML=view.map(r=>{
    const n=r.done.filter(Boolean).length;
    const key=studentKey(r.className,r.studentNo);
    return `<tr><td>${esc(r.className)}</td><td>${r.studentNo}</td><td>${esc(r.name)}</td><td><span class="score-pill">${Math.round(n/7*100)}%</span></td><td>${n}/7</td><td>${new Date(r.updatedAt||0).toLocaleString("vi-VN")}</td><td><button class="btn light" data-detail="${esc(key)}">Xem</button></td></tr>`
  }).join("")||'<tr><td colspan="7" class="small">Chưa có dữ liệu.</td></tr>';
  document.querySelectorAll("[data-detail]").forEach(b=>b.onclick=()=>showDetail(b.dataset.detail));
}
document.getElementById("teacherClassFilter").onchange=renderTeacher;

function showDetail(key){
  const source=(firebaseReady?firebaseRecords:allData());const r=source[key];if(!r)return;
  const a=r.answers||{};
  document.getElementById("teacherDetail").innerHTML=`
    <div class="card">
      <h3>${esc(r.className)} · STT ${r.studentNo} · ${esc(r.name)}</h3>
      <p><b>Hoạt động đã hoàn thành:</b> ${r.done.map((x,i)=>x?`HĐ${i+1}`:"").filter(Boolean).join(", ")||"Chưa có"}</p>
      <details open><summary><b>Phiếu 1</b></summary><pre>${esc(JSON.stringify(filterAnswers(a,"a1_"),null,2))}</pre></details>
      <details><summary><b>Phiếu 2</b></summary><pre>${esc(JSON.stringify(filterAnswers(a,"a2_"),null,2))}</pre></details>
      <details><summary><b>Phiếu 3</b></summary><pre>${esc(JSON.stringify(filterAnswers(a,"a3_"),null,2))}</pre></details>
      <details><summary><b>Phiếu 4</b></summary><pre>${esc(JSON.stringify(filterAnswers(a,"a4_"),null,2))}</pre></details>
      <details><summary><b>Phiếu 5</b></summary><pre>${esc(JSON.stringify(filterAnswers(a,"a5_"),null,2))}</pre></details>
      <details><summary><b>Phiếu 6</b></summary><pre>${esc(JSON.stringify(filterAnswers(a,"a6_"),null,2))}</pre></details>
      <details><summary><b>Phiếu 7</b></summary><pre>${esc(JSON.stringify(filterAnswers(a,"a7_"),null,2))}</pre></details>
    </div>`;
}
function filterAnswers(a,p){return Object.fromEntries(Object.entries(a).filter(([k])=>k.startsWith(p)))}

function download(name,text,type){
  const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500);
}
document.getElementById("exportJsonBtn").onclick=()=>download("ket_qua_tin9_bai1.json",JSON.stringify((firebaseReady?firebaseRecords:allData()),null,2),"application/json");
document.getElementById("exportCsvBtn").onclick=()=>{
  const recs=Object.values(firebaseReady?firebaseRecords:allData());
  const rows=[["Lớp","STT","Họ tên","Số HĐ hoàn thành","Tiến độ %","Cập nhật"]];
  recs.forEach(r=>rows.push([r.className,r.studentNo,r.name,r.done.filter(Boolean).length,Math.round(r.done.filter(Boolean).length/7*100),new Date(r.updatedAt||0).toLocaleString("vi-VN")]));
  const csv="\uFEFF"+rows.map(row=>row.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n");
  download("ket_qua_tin9_bai1.csv",csv,"text/csv;charset=utf-8");
};
document.getElementById("importJsonBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const obj=JSON.parse(await f.text());saveAll(obj);if(firebaseReady&&resultsRef){await resultsRef.set(obj)}alert("Đã nhập dữ liệu.");renderTeacher()}catch{alert("File JSON không hợp lệ.")}
  e.target.value="";
};
document.getElementById("clearAllBtn").onclick=()=>{
  if(confirm("Xóa toàn bộ kết quả trên máy này và trên Firebase?")){localStorage.removeItem(STORAGE_KEY);if(firebaseReady&&resultsRef){resultsRef.remove().catch(console.error)}document.getElementById("teacherDetail").innerHTML="";firebaseRecords={};renderTeacher()}
};
initFirebase();
</script>
