<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý học kì - Phiếu học tập số</title>
<style>
:root{--primary:#1565c0;--primary2:#0d47a1;--success:#2e7d32;--warning:#ef6c00;--danger:#c62828;--bg:#f4f7fb;--card:#fff;--text:#263238;--muted:#607d8b;--border:#d7e0e8;--soft:#eaf3ff}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{max-width:1400px;margin:auto;padding:18px}.header{background:linear-gradient(135deg,#e3f2fd,#fff8e1);border:1px solid var(--border);border-radius:18px;padding:18px 22px;margin-bottom:16px}.header h1{margin:0;color:var(--primary2);font-size:clamp(1.5rem,4vw,2.2rem)}.header p{margin:6px 0 0;color:var(--muted)}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 5px 18px rgba(0,0,0,.05)}.topbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:none;border-radius:9px;padding:10px 15px;font-weight:700;background:var(--primary);color:#fff}.btn.secondary{background:#546e7a}.btn.success{background:var(--success)}.btn.warning{background:var(--warning)}.btn.danger{background:var(--danger)}.btn.light{background:#edf3f8;color:#263238}.btn:disabled{opacity:.5;cursor:not-allowed}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-weight:700}input,select{width:100%;border:1.5px solid #b9c7d4;border-radius:9px;padding:10px;background:#fff}.small{font-size:.86rem;color:var(--muted)}.status{margin-top:10px;padding:10px 12px;border-radius:10px;background:#fff8e1;color:#7a4a00}.status.error{background:#ffebee;color:#b71c1c}.status.ok{background:#e8f5e9;color:#1b5e20}.toolbar{display:grid;grid-template-columns:180px 180px 1fr auto;gap:10px;align-items:end;margin:14px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tab{border:1px solid var(--border);background:#fff;color:#455a64;border-radius:10px;padding:9px 13px;font-weight:700}.tab.active{background:var(--soft);border-color:var(--primary);color:var(--primary2)}.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.kpi>div{background:#f7f9fb;border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}.kpi strong{display:block;font-size:1.35rem;color:var(--primary2)}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px;background:#fff}table{width:100%;border-collapse:collapse;min-width:820px}th,td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:9px;vertical-align:top}th:last-child,td:last-child{border-right:none}tr:last-child td{border-bottom:none}th{background:#edf5ff;position:sticky;top:0;z-index:2}.center{text-align:center}.good{color:#1b5e20;font-weight:700}.warn{color:#ef6c00;font-weight:700}.bad{color:#b71c1c;font-weight:700}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef3f8;font-size:.82rem;font-weight:700}.matrix-cell{min-width:90px;text-align:center}.matrix-ok{background:#f1f8e9}.matrix-part{background:#fff8e1}.matrix-none{background:#fafafa;color:#90a4ae}.section-title{margin:0 0 10px;color:var(--primary2)}.empty{padding:22px;text-align:center;color:var(--muted)}
@media(max-width:900px){.toolbar{grid-template-columns:1fr 1fr}.kpi{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.app{padding:8px}.grid2,.toolbar{grid-template-columns:1fr}}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
<div class="app">
  <div class="header"><h1>QUẢN LÝ PHIẾU HỌC TẬP - HỌC KÌ</h1><p>Trang trung tâm dành cho giáo viên · đọc dữ liệu từ nhiều phiếu dùng chung Firebase</p></div>

  <section id="loginCard" class="card">
    <h2 class="section-title">Đăng nhập giáo viên</h2>
    <div class="grid2">
      <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="giaovien@example.com"></div>
      <div class="field"><label>Mật khẩu</label><input id="password" type="password" autocomplete="current-password" placeholder="Mật khẩu"></div>
    </div>
    <div class="topbar" style="margin-top:12px"><button id="loginBtn" class="btn">Đăng nhập</button></div>
    <div id="loginStatus" class="status hidden"></div>
  </section>

  <section id="dashboard" class="hidden">
    <div class="card">
      <div class="topbar" style="justify-content:space-between">
        <div><h2 class="section-title">Tổng hợp học kì</h2><div class="small">Dữ liệu được đọc theo danh mục phiếu khai báo trong WORKSHEET_CATALOG.</div></div>
        <button id="logoutBtn" class="btn light">Đăng xuất</button>
      </div>

      <div class="toolbar">
        <div class="field"><label>Khối</label><select id="gradeFilter"></select></div>
        <div class="field"><label>Lớp</label><select id="classFilter"></select></div>
        <div class="field"><label>Học kì / nhóm phiếu</label><select id="semesterFilter"></select></div>
        <button id="refreshBtn" class="btn secondary">Tải lại</button>
      </div>

      <div class="kpi">
        <div><strong id="kpiWorksheets">0</strong>Phiếu</div>
        <div><strong id="kpiStudents">0</strong>Học sinh</div>
        <div><strong id="kpiSubmissions">0</strong>Lượt có dữ liệu</div>
        <div><strong id="kpiCompletion">0%</strong>Tỉ lệ hoàn thành</div>
      </div>

      <div class="tabs">
        <button class="tab active" data-view="worksheets">Theo phiếu</button>
        <button class="tab" data-view="students">Theo học sinh</button>
        <button class="tab" data-view="missing">Chưa làm / Chưa xong</button>
      </div>

      <div class="topbar" style="margin-bottom:12px"><button id="exportCsvBtn" class="btn success">Xuất CSV</button><span id="loadStatus" class="small"></span></div>
      <div id="content"></div>
    </div>
  </section>
</div>

<script>
"use strict";

const firebaseConfig = {
  apiKey: "AIzaSyDmzXo6VGoXP6zAkJ_kVDdIFKC-i2uOW7o",
  authDomain: "luyen-go.firebaseapp.com",
  databaseURL: "https://luyen-go-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "luyen-go",
  storageBucket: "luyen-go.firebasestorage.app",
  messagingSenderId: "79498233127",
  appId: "1:79498233127:web:a6c2e2bab71ba737ca9502"
};

const TEACHERS_PATH = "app_secure/teachers";

/* Mỗi khi có phiếu mới, thêm 1 object vào danh mục này.
   id PHẢI trùng APP_CONFIG.worksheetId trong phiếu. */
const WORKSHEET_CATALOG = [
  {id:"tin9_bai1",title:"Tin 9 - Bài 1: Thế giới kĩ thuật số",grade:"9",semester:"HK1",type:"pht",totalActivities:7},
  {id:"tin9_ai_bai1",title:"Tin 9 - Chuyên đề AI - Bài 1",grade:"9",semester:"HK1",type:"pht",totalActivities:6},
  {id:"tin6_ai_bai1_tn",title:"Tin 6 - AI quanh em - Trắc nghiệm",grade:"6",semester:"HK1",type:"quiz",totalQuestions:20}
];

let db=null, teacherUser=null, allWorksheetData={}, currentView="worksheets";

function esc(v){return String(v??"").replace(/[&<>"']/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]))}
function normalizeDone(done){if(Array.isArray(done))return done.map(Boolean);if(done&&typeof done==="object")return Object.keys(done).sort((a,b)=>Number(a)-Number(b)).map(k=>Boolean(done[k]));return []}
function normalizeRecord(uid,raw,worksheet){
  if(!raw||typeof raw!=="object")return null;
  const className=String(raw.className??"").trim(), studentNo=Number(raw.studentNo), name=String(raw.name??"").trim();
  if(!className||!Number.isFinite(studentNo)||studentNo<=0)return null;
  const done=normalizeDone(raw.done), score=Number(raw.firstScore??raw.score), total=Number(raw.total??worksheet.totalQuestions??0);
  let completionPercent=0, completed=false;
  if(worksheet.type==="quiz"){
    completed=raw.completed===true||(Number.isFinite(score)&&total>0);
    completionPercent=completed?100:0;
  }else{
    const totalActs=Number(worksheet.totalActivities)||done.length||1, doneCount=done.filter(Boolean).length;
    completionPercent=Math.round(doneCount/totalActs*100); completed=doneCount>=totalActs;
  }
  return {uid:String(uid),worksheetId:worksheet.id,worksheetTitle:worksheet.title,worksheetType:worksheet.type,grade:String(worksheet.grade),semester:String(worksheet.semester),className,studentNo,name:name||"(Chưa có tên)",done,score:Number.isFinite(score)?score:null,total:Number.isFinite(total)&&total>0?total:null,completed,completionPercent,updatedAt:Number(raw.updatedAt)||0,raw};
}
function studentKey(record){return `${record.className}__${String(record.studentNo).padStart(3,"0")}`}
function selectedCatalog(){const grade=document.getElementById("gradeFilter").value,semester=document.getElementById("semesterFilter").value;return WORKSHEET_CATALOG.filter(w=>(grade==="all"||String(w.grade)===grade)&&(semester==="all"||String(w.semester)===semester))}
function allNormalizedRecords(){
  const allowed=new Set(selectedCatalog().map(x=>x.id)), classFilter=document.getElementById("classFilter").value, rows=[];
  for(const worksheet of WORKSHEET_CATALOG){
    if(!allowed.has(worksheet.id))continue;
    for(const [uid,raw] of Object.entries(allWorksheetData[worksheet.id]||{})){
      const rec=normalizeRecord(uid,raw,worksheet); if(!rec)continue; if(classFilter!=="all"&&rec.className!==classFilter)continue; rows.push(rec);
    }
  }
  return rows;
}
function buildFilters(){
  const grades=[...new Set(WORKSHEET_CATALOG.map(w=>String(w.grade)))].sort((a,b)=>Number(a)-Number(b));
  const semesters=[...new Set(WORKSHEET_CATALOG.map(w=>String(w.semester)))].sort();
  gradeFilter.innerHTML='<option value="all">Tất cả</option>'+grades.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");
  semesterFilter.innerHTML='<option value="all">Tất cả</option>'+semesters.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");
  rebuildClassFilter();
}
function rebuildClassFilter(){
  const prev=classFilter.value||"all", grade=gradeFilter.value, classes=new Set();
  for(const worksheet of WORKSHEET_CATALOG){
    if(grade!=="all"&&String(worksheet.grade)!==grade)continue;
    Object.values(allWorksheetData[worksheet.id]||{}).forEach(raw=>{const cls=String(raw?.className??"").trim();if(cls)classes.add(cls)});
  }
  const arr=[...classes].sort((a,b)=>a.localeCompare(b,"vi",{numeric:true}));
  classFilter.innerHTML='<option value="all">Tất cả lớp</option>'+arr.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");
  classFilter.value=arr.includes(prev)?prev:"all";
}
async function loginTeacher(){
  const email=document.getElementById("email").value.trim(), password=document.getElementById("password").value, status=document.getElementById("loginStatus");
  if(!email||!password){status.textContent="Vui lòng nhập email và mật khẩu.";status.className="status error";return}
  status.textContent="Đang đăng nhập...";status.className="status";
  try{
    if(!firebase.apps.length)firebase.initializeApp(firebaseConfig); const auth=firebase.auth(); if(auth.currentUser)await auth.signOut();
    const cred=await auth.signInWithEmailAndPassword(email,password); db=firebase.database();
    const roleSnap=await db.ref(`${TEACHERS_PATH}/${cred.user.uid}`).once("value");
    if(roleSnap.val()!==true){await auth.signOut();throw new Error("Tài khoản chưa được cấp quyền giáo viên.")}
    teacherUser=cred.user; loginCard.classList.add("hidden"); dashboard.classList.remove("hidden"); document.getElementById("password").value=""; status.classList.add("hidden");
    buildFilters(); await loadAllData();
  }catch(err){console.error(err);status.textContent=err.message||"Đăng nhập thất bại.";status.className="status error"}
}
async function logoutTeacher(){try{if(firebase.auth().currentUser)await firebase.auth().signOut()}catch(e){console.warn(e)}teacherUser=null;db=null;allWorksheetData={};dashboard.classList.add("hidden");loginCard.classList.remove("hidden")}
async function loadAllData(){
  if(!db||!teacherUser)return; loadStatus.textContent="Đang tải dữ liệu...";
  const results=await Promise.all(WORKSHEET_CATALOG.map(async worksheet=>{try{const snap=await db.ref(`worksheets/${worksheet.id}/results`).once("value");allWorksheetData[worksheet.id]=snap.val()||{};return{id:worksheet.id,ok:true}}catch(err){console.error(`Không đọc được ${worksheet.id}`,err);allWorksheetData[worksheet.id]={};return{id:worksheet.id,ok:false}}}));
  const failed=results.filter(x=>!x.ok); rebuildClassFilter(); renderAll(); loadStatus.textContent=failed.length?`Đã tải nhưng có ${failed.length} phiếu không đọc được. Kiểm tra Rules/ID.`:`Đã tải ${WORKSHEET_CATALOG.length} phiếu.`;
}
function renderAll(){
  const rows=allNormalizedRecords(), worksheets=selectedCatalog(), students=new Map();
  rows.forEach(r=>{const key=studentKey(r);if(!students.has(key))students.set(key,{key,className:r.className,studentNo:r.studentNo,name:r.name});else if(students.get(key).name==="(Chưa có tên)"&&r.name!=="(Chưa có tên)")students.get(key).name=r.name});
  const totalPossible=students.size*worksheets.length, completedCount=rows.filter(r=>r.completed).length;
  kpiWorksheets.textContent=worksheets.length;kpiStudents.textContent=students.size;kpiSubmissions.textContent=rows.length;kpiCompletion.textContent=totalPossible?Math.round(completedCount/totalPossible*100)+"%":"0%";
  if(currentView==="worksheets")renderWorksheetView(rows,worksheets,students);else if(currentView==="students")renderStudentView(rows,worksheets,students);else renderMissingView(rows,worksheets,students);
}
function renderWorksheetView(rows,worksheets,students){
  if(!worksheets.length){content.innerHTML='<div class="empty">Không có phiếu phù hợp bộ lọc.</div>';return}
  const html=worksheets.map(w=>{const recs=rows.filter(r=>r.worksheetId===w.id),done=recs.filter(r=>r.completed).length,avg=recs.length?Math.round(recs.reduce((s,r)=>s+r.completionPercent,0)/recs.length):0;return `<tr><td><b>${esc(w.title)}</b><div class="small">${esc(w.id)}</div></td><td class="center">${esc(w.grade)}</td><td class="center">${esc(w.semester)}</td><td class="center">${esc(w.type)}</td><td class="center">${recs.length}</td><td class="center">${done}</td><td class="center"><span class="pill">${avg}%</span></td><td class="center">${students.size?Math.max(students.size-recs.length,0):0}</td></tr>`}).join("");
  content.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Phiếu</th><th>Khối</th><th>Học kì</th><th>Loại</th><th>Có dữ liệu</th><th>Hoàn thành</th><th>Tiến độ TB</th><th>Chưa có dữ liệu</th></tr></thead><tbody>${html}</tbody></table></div>`;
}
function renderStudentView(rows,worksheets,students){
  const stu=[...students.values()].sort((a,b)=>a.className.localeCompare(b.className,"vi",{numeric:true})||a.studentNo-b.studentNo); if(!stu.length){content.innerHTML='<div class="empty">Chưa có dữ liệu học sinh theo bộ lọc.</div>';return}
  const recordMap=new Map();rows.forEach(r=>recordMap.set(`${studentKey(r)}__${r.worksheetId}`,r)); const head=worksheets.map(w=>`<th class="matrix-cell">${esc(shortTitle(w.title))}</th>`).join("");
  const body=stu.map(s=>{const cells=worksheets.map(w=>{const rec=recordMap.get(`${s.key}__${w.id}`);if(!rec)return `<td class="matrix-cell matrix-none">—</td>`;if(w.type==="quiz"){const score=(rec.score!==null&&rec.total)?`${rec.score}/${rec.total}`:"Đã làm";return `<td class="matrix-cell ${rec.completed?"matrix-ok":"matrix-part"}"><b>${esc(score)}</b></td>`}return `<td class="matrix-cell ${rec.completed?"matrix-ok":"matrix-part"}"><b>${rec.completionPercent}%</b></td>`}).join("");const completed=worksheets.filter(w=>recordMap.get(`${s.key}__${w.id}`)?.completed).length;return `<tr><td>${esc(s.className)}</td><td class="center">${s.studentNo}</td><td>${esc(s.name)}</td>${cells}<td class="center"><b>${completed}/${worksheets.length}</b></td></tr>`}).join("");
  content.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Lớp</th><th>STT</th><th>Họ tên</th>${head}<th>Hoàn thành</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
function renderMissingView(rows,worksheets,students){
  const stu=[...students.values()].sort((a,b)=>a.className.localeCompare(b.className,"vi",{numeric:true})||a.studentNo-b.studentNo),recordMap=new Map();rows.forEach(r=>recordMap.set(`${studentKey(r)}__${r.worksheetId}`,r));const items=[];
  stu.forEach(s=>worksheets.forEach(w=>{const rec=recordMap.get(`${s.key}__${w.id}`);if(!rec)items.push({className:s.className,studentNo:s.studentNo,name:s.name,worksheet:w.title,status:"Chưa làm",progress:"—"});else if(!rec.completed)items.push({className:s.className,studentNo:s.studentNo,name:s.name,worksheet:w.title,status:"Chưa hoàn thành",progress:`${rec.completionPercent}%`})}));
  if(!items.length){content.innerHTML='<div class="empty good">Không có học sinh thiếu bài theo bộ lọc hiện tại.</div>';return}
  content.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Lớp</th><th>STT</th><th>Họ tên</th><th>Phiếu</th><th>Trạng thái</th><th>Tiến độ</th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.className)}</td><td class="center">${x.studentNo}</td><td>${esc(x.name)}</td><td>${esc(x.worksheet)}</td><td class="${x.status==="Chưa làm"?"bad":"warn"}">${esc(x.status)}</td><td class="center">${esc(x.progress)}</td></tr>`).join("")}</tbody></table></div>`;
}
function shortTitle(title){const s=String(title||"");return s.length>26?s.slice(0,26)+"…":s}
function exportCurrentCsv(){
  const rows=allNormalizedRecords(), out=[["Lớp","STT","Họ tên","Mã phiếu","Tên phiếu","Loại","Hoàn thành","Tiến độ %","Điểm","Tổng","Cập nhật"]];
  rows.forEach(r=>out.push([r.className,r.studentNo,r.name,r.worksheetId,r.worksheetTitle,r.worksheetType,r.completed?"Có":"Không",r.completionPercent,r.score??"",r.total??"",r.updatedAt?new Date(r.updatedAt).toLocaleString("vi-VN"):""]));
  const csv="\uFEFF"+out.map(row=>row.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n"),blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`quanly_hocki_${classFilter.value==="all"?"tatca":classFilter.value}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),500);
}

loginBtn.onclick=loginTeacher;logoutBtn.onclick=logoutTeacher;refreshBtn.onclick=loadAllData;exportCsvBtn.onclick=exportCurrentCsv;
email.addEventListener("keydown",e=>{if(e.key==="Enter")password.focus()});password.addEventListener("keydown",e=>{if(e.key==="Enter")loginTeacher()});
gradeFilter.onchange=()=>{rebuildClassFilter();renderAll()};semesterFilter.onchange=renderAll;classFilter.onchange=renderAll;
document.querySelectorAll(".tab").forEach(btn=>{btn.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));btn.classList.add("active");currentView=btn.dataset.view;renderAll()}});
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
</script>
</body>
</html>
