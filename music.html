<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>Thư viện nhạc Nhi hư Google Drive</title>
<style>
:root{--p:#7c3aed;--pd:#6d28d9;--bg:#f1f5f9;--text:#172033;--muted:#64748b;--border:#dbe3ea;--danger:#b91c1c}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button,input,select{font:inherit}[hidden]{display:none!important}.app{min-height:100%;display:grid;grid-template-rows:auto 1fr}
.top{display:flex;align-items:center;gap:12px;padding:12px 18px;background:#fff;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:13px;background:#ede9fe;display:grid;place-items:center;font-size:24px}.brand h1{margin:0;font-size:18px}.brand small{color:var(--muted)}
.status{margin-left:auto;min-width:320px;max-width:460px}.status-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px;gap:10px}.status-row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar{height:7px;background:#e2e8f0;border-radius:999px;overflow:hidden}.bar>div{height:100%;width:0;background:var(--p);transition:width .2s}
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;padding:14px;min-height:0}.sidebar,.player{background:#fff;border:1px solid var(--border);border-radius:15px;overflow:hidden}
.sidebar{display:grid;grid-template-rows:auto auto 1fr;height:calc(100vh - 96px)}.head{padding:14px;border-bottom:1px solid var(--border)}.folder{font-weight:800}.crumb{font-size:12px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{padding:12px 14px;border-bottom:1px solid var(--border)}.search input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px}.folder-actions{display:flex;gap:8px;margin-top:10px}.folder-actions button{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:#f5f3ff;color:var(--p);font-weight:750;cursor:pointer}.folder-actions button:disabled{opacity:.45;cursor:not-allowed}
.list{list-style:none;padding:8px;margin:0;overflow:auto}.item{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;align-items:center;width:100%;padding:10px;border:0;border-radius:11px;background:transparent;text-align:left;color:var(--text);cursor:pointer}.item:hover,.item.active{background:#f5f3ff}.item.active{outline:1px solid #c4b5fd}
.icon{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:#f1f5f9;font-size:20px}.name{font-weight:700;font-size:14px;overflow-wrap:anywhere}.meta{font-size:11px;color:var(--muted);margin-top:3px}.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.player{display:grid;place-items:center;padding:28px;min-height:calc(100vh - 96px);background:linear-gradient(145deg,#fff,#f5f3ff)}.card{width:min(620px,100%);text-align:center}.cover{width:180px;height:180px;border-radius:34px;margin:0 auto 22px;display:grid;place-items:center;font-size:78px;background:linear-gradient(145deg,#ede9fe,#ddd6fe)}
.title{font-size:24px;font-weight:850;margin:0 0 6px;overflow-wrap:anywhere}.sub{color:var(--muted);margin-bottom:22px}.seek{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:10px;font-size:12px;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--p)}
.controls{display:flex;justify-content:center;align-items:center;gap:14px;margin:22px 0}.ctrl{width:48px;height:48px;border-radius:50%;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:20px}.play{width:66px;height:66px;background:var(--p);color:#fff;border-color:var(--p);font-size:26px}.ctrl:disabled{opacity:.45;cursor:not-allowed}
.options{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:16px;color:var(--muted);font-size:13px}.options label{display:flex;align-items:center;gap:7px}.options select{padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:#fff}
.loading{padding:14px 18px;margin:16px auto 0;background:#fff;border:1px solid var(--border);border-radius:12px;color:var(--p);font-weight:700;max-width:440px}.mode{display:inline-block;margin-top:8px;padding:4px 9px;border-radius:999px;background:#ede9fe;color:var(--p);font-size:11px;font-weight:750}
.toast{position:fixed;right:18px;bottom:18px;max-width:min(420px,calc(100vw - 36px));padding:12px 14px;border-radius:11px;background:#0f172a;color:#fff;opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateY(0)}.toast.error{background:var(--danger)}
.menu{display:none}@media(max-width:820px){.status{display:none}.menu{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--border);border-radius:10px;background:#fff}.layout{grid-template-columns:1fr;padding:10px}.sidebar{position:fixed;z-index:10;left:0;top:67px;bottom:0;width:min(88vw,360px);height:auto;border-radius:0 15px 15px 0;transform:translateX(-105%);transition:.22s}.sidebar.open{transform:translateX(0)}.player{min-height:calc(100vh - 88px);padding:18px}.cover{width:145px;height:145px;font-size:64px}.title{font-size:20px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<button id="menu" class="menu">☰</button>
<div class="brand"><div class="logo">🎧</div><div><h1>Thư viện âm thanh</h1><small>Phát trực tiếp từ Google Drive</small></div></div>
<div id="status" class="status" hidden><div class="status-row"><span id="statusText">Đang tải...</span><span id="statusPct">0%</span></div><div class="bar"><div id="progress"></div></div></div>
</header>

<main class="layout">
<aside id="sidebar" class="sidebar">
<div class="head"><div id="folderTitle" class="folder">Đang kết nối...</div><div id="breadcrumb" class="crumb">Thư mục gốc</div><div class="folder-actions"><button id="playFolder" type="button" disabled>▶ Phát tất cả</button></div></div>
<div class="search"><input id="search" type="search" placeholder="Tìm thư mục hoặc file âm thanh..."></div>
<ul id="fileList" class="list"><li class="empty">Đang tải danh sách...</li></ul>
</aside>

<section class="player">
<div class="card">
<div class="cover">🎵</div>
<h2 id="trackTitle" class="title">Chưa chọn bài</h2>
<div id="trackSub" class="sub">Chọn một file âm thanh trong danh sách.</div>
<div class="seek"><span id="current">0:00</span><input id="seek" type="range" min="0" max="100" value="0" disabled><span id="duration">0:00</span></div>
<div class="controls"><button id="prev" class="ctrl" disabled>⏮</button><button id="play" class="ctrl play" disabled>▶</button><button id="next" class="ctrl" disabled>⏭</button></div>
<div class="options">
<label>🔊 <input id="volume" type="range" min="0" max="1" value="1" step=".05"></label>
<label>Tốc độ <select id="speed"><option value=".75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
<label><input id="autoNext" type="checkbox" checked> Tự phát bài sau</label>
</div>
<div id="loading" class="loading" hidden>Đang chuẩn bị phát...</div>
<div id="mode" class="mode" hidden></div>
<audio id="audioA" preload="auto"></audio>
<audio id="audioB" preload="auto"></audio>
</div>
</section>
</main>
</div>
<div id="toast" class="toast"></div>

<script>
const WEB_APP_URL='https://script.google.com/macros/s/AKfycbz9Fd3kzo7TCoGvKO4AhHl_iv0LiCB3Y2L4bqkvrpjMwWYHtDscRm5JhPMthQaSw8lZ5A/exec';
const APP_TYPE='audio';
const DIRECT_TIMEOUT_MS=12000;
const PRELOAD_SECONDS=25;

const $=id=>document.getElementById(id);
const els={menu:$('menu'),sidebar:$('sidebar'),folderTitle:$('folderTitle'),breadcrumb:$('breadcrumb'),playFolder:$('playFolder'),search:$('search'),fileList:$('fileList'),status:$('status'),statusText:$('statusText'),statusPct:$('statusPct'),progress:$('progress'),trackTitle:$('trackTitle'),trackSub:$('trackSub'),current:$('current'),duration:$('duration'),seek:$('seek'),prev:$('prev'),play:$('play'),next:$('next'),volume:$('volume'),speed:$('speed'),autoNext:$('autoNext'),loading:$('loading'),mode:$('mode'),toast:$('toast')};

const players=[$('audioA'),$('audioB')];
let activePlayerIndex=0;
let folderStack=[],currentItems=[],audioItems=[];
let activeFileId='',activeIndex=-1,currentFolderId='',currentFolderName='';
let loadToken=0,folderScanToken=0,toastTimer=null;
let activeObjectUrl='',standbyObjectUrl='';
let standbyTrack=null,standbyReady=false,preloadToken=0;
const streamInfoCache=new Map();

document.addEventListener('DOMContentLoaded',init);

function activeAudio(){return players[activePlayerIndex]}
function standbyAudio(){return players[1-activePlayerIndex]}

function init(){
  bind();
  restore();
  configurePlayers();
  loadDirectory('',true);
}

function configurePlayers(){
  players.forEach((player,index)=>{
    player.preload='auto';
    player.addEventListener('loadedmetadata',()=>{if(index===activePlayerIndex)onMetadata()});
    player.addEventListener('timeupdate',()=>{if(index===activePlayerIndex)onTimeUpdate()});
    player.addEventListener('progress',()=>{if(index===activePlayerIndex)onBufferProgress()});
    player.addEventListener('play',()=>{if(index===activePlayerIndex)els.play.textContent='⏸'});
    player.addEventListener('pause',()=>{if(index===activePlayerIndex)els.play.textContent='▶'});
    player.addEventListener('ended',()=>{if(index===activePlayerIndex)handleEnded()});
  });
}

function bind(){
  els.menu.onclick=()=>els.sidebar.classList.toggle('open');
  els.search.oninput=renderList;
  els.playFolder.onclick=playAllCurrentFolder;
  els.play.onclick=togglePlay;
  els.prev.onclick=()=>playRelative(-1);
  els.next.onclick=()=>playRelative(1);

  els.volume.oninput=()=>{
    players.forEach(p=>p.volume=+els.volume.value);
    localStorage.setItem('audio_volume',els.volume.value);
  };

  els.speed.onchange=()=>{
    players.forEach(p=>p.playbackRate=+els.speed.value);
    localStorage.setItem('audio_speed',els.speed.value);
  };

  els.autoNext.onchange=()=>{
    localStorage.setItem('audio_auto_next',els.autoNext.checked?'1':'0');
    if(els.autoNext.checked)prepareNextTrack();
  };

  els.seek.oninput=()=>{
    const player=activeAudio();
    if(Number.isFinite(player.duration))player.currentTime=+els.seek.value;
  };

  window.addEventListener('beforeunload',cleanup);
}

async function api(action,params={}){
  const url=new URL(WEB_APP_URL);
  url.searchParams.set('action',action);
  url.searchParams.set('appType',APP_TYPE);
  url.searchParams.set('_',Date.now());
  Object.entries(params).forEach(([k,v])=>{
    if(v!==''&&v!==null&&v!==undefined)url.searchParams.set(k,String(v));
  });

  const res=await fetch(url,{cache:'no-store',redirect:'follow'});
  if(!res.ok)throw new Error(`Máy chủ trả về HTTP ${res.status}.`);

  const data=await res.json();
  if(data.ok===false||data.error)throw new Error(data.error||'Máy chủ xử lý thất bại.');
  return data;
}

async function loadDirectory(folderId,reset=false){
  setLoading(true,'Đang lấy danh sách âm thanh...',15);
  els.fileList.innerHTML='<li class="empty">Đang tải...</li>';

  try{
    const data=await api('list',folderId?{folderId}:{});
    currentItems=Array.isArray(data.files)?data.files:[];
    audioItems=currentItems.filter(x=>!x.isFolder);
    currentFolderId=data.folder.id;
    currentFolderName=data.folder.name;
    activeIndex=audioItems.findIndex(x=>x.id===activeFileId);

    folderStack=Array.isArray(data.breadcrumbs)&&data.breadcrumbs.length
      ?data.breadcrumbs
      :[{id:data.folder.id,name:data.folder.name}];

    if(reset&&folderStack.length>1)folderStack=[folderStack[0]];

    els.folderTitle.textContent=data.folder.name;
    els.breadcrumb.textContent=folderStack.map(x=>x.name).join(' › ');
    els.search.value='';
    els.playFolder.disabled=currentItems.length===0;
    els.playFolder.textContent=audioItems.length
      ?`▶ Phát ${audioItems.length} bài`
      :'▶ Quét và phát';

    renderList();
    updateButtons();
  }catch(e){
    els.fileList.innerHTML=`<li class="empty">❌ ${esc(e.message)}</li>`;
    els.playFolder.disabled=true;
    els.playFolder.textContent='Không thể phát';
    toast(e.message,true);
  }finally{
    setLoading(false);
  }
}

function renderList(){
  const keyword=norm(els.search.value);
  const filtered=currentItems.filter(x=>norm(x.name).includes(keyword));
  const fragment=document.createDocumentFragment();

  if(folderStack.length>1){
    fragment.appendChild(makeItem({name:'Quay lại thư mục trước',isFolder:true},true));
  }

  if(!filtered.length){
    const li=document.createElement('li');
    li.className='empty';
    li.textContent=keyword
      ?'Không tìm thấy nội dung phù hợp.'
      :'Thư mục không có file âm thanh.';
    fragment.appendChild(li);
  }else{
    filtered.forEach(x=>fragment.appendChild(makeItem(x,false)));
  }

  els.fileList.replaceChildren(fragment);
}

function makeItem(item,isBack){
  const li=document.createElement('li');
  const button=document.createElement('button');

  button.className='item'+(!isBack&&item.id===activeFileId?' active':'');
  button.innerHTML=`<span class="icon">${isBack?'↩️':item.isFolder?'📁':'🎵'}</span><span><div class="name">${esc(item.name)}</div>${!isBack&&!item.isFolder?`<div class="meta">${fmtBytes(item.size||0)}</div>`:''}</span>`;

  button.onclick=()=>{
    if(isBack)return goBack();
    if(item.isFolder)return openFolder(item);
    openAudio(item);
  };

  li.appendChild(button);
  return li;
}

function goBack(){
  if(folderStack.length>1){
    loadDirectory(folderStack[folderStack.length-2].id);
  }
}

async function openFolder(folder){
  const token=++folderScanToken;
  els.folderTitle.textContent='Đang mở '+folder.name+'...';
  els.playFolder.disabled=true;
  els.playFolder.textContent='Đang tải...';
  els.fileList.innerHTML='<li class="empty">Đang tải nội dung thư mục...</li>';

  try{
    await loadDirectory(folder.id);
  }catch(e){
    if(token===folderScanToken)toast(e.message,true);
  }
}

async function playAllCurrentFolder(){
  if(!currentFolderId)return;

  const token=++folderScanToken;
  els.playFolder.disabled=true;
  els.playFolder.textContent='Đang quét...';
  setLoading(true,'Đang tạo danh sách phát...',10);

  try{
    const data=await api('playlist',{folderId:currentFolderId});
    const tracks=Array.isArray(data.tracks)?data.tracks:[];

    if(token!==folderScanToken)return;
    if(!tracks.length)throw new Error('Không tìm thấy file âm thanh trong thư mục này.');

    audioItems=tracks;
    activeIndex=0;
    els.playFolder.textContent=`▶ Phát ${tracks.length} bài`;
    toast(`Đã tạo danh sách “${currentFolderName}” gồm ${tracks.length} bài.`);
    await openAudio(tracks[0]);
  }catch(e){
    if(token===folderScanToken)toast(e.message,true);
  }finally{
    if(token===folderScanToken){
      els.playFolder.disabled=false;
      setLoading(false);
    }
  }
}

async function getStreamInfo(file){
  if(streamInfoCache.has(file.id))return streamInfoCache.get(file.id);

  const promise=api('getStreamInfo',{
    fileId:file.id,
    folderId:file.folderId||''
  }).then(data=>data.file);

  streamInfoCache.set(file.id,promise);

  try{
    return await promise;
  }catch(e){
    streamInfoCache.delete(file.id);
    throw e;
  }
}

async function openAudio(file,options={}){
  const token=++loadToken;
  const autoplay=options.autoplay!==false;

  savePosition();
  cancelStandby();
  stopPlayer(activeAudio());

  if(activeObjectUrl){
    URL.revokeObjectURL(activeObjectUrl);
    activeObjectUrl='';
  }

  activeFileId=file.id;
  activeIndex=audioItems.findIndex(x=>x.id===file.id);
  renderList();
  updateButtons();
  els.sidebar.classList.remove('open');

  els.trackTitle.textContent=file.name;
  els.trackSub.textContent='Đang kết nối Google Drive...';
  els.loading.hidden=false;
  els.loading.textContent='Đang mở luồng âm thanh...';
  els.mode.hidden=true;
  els.play.disabled=true;
  els.seek.disabled=true;
  resetTimeDisplay();

  try{
    const info=await getStreamInfo(file);
    if(token!==loadToken)return;

    let directError=null;

    try{
      setLoading(true,'Đang mở luồng trực tiếp...',20);
      await loadDirect(activeAudio(),info.downloadUrl,token);
      showMode('Phát trực tiếp');
    }catch(error){
      directError=error;
    }

    if(directError){
      if(token!==loadToken)return;
      els.loading.textContent='Luồng trực tiếp không khả dụng. Đang tải dự phòng...';
      showMode('Chế độ dự phòng');
      await loadByChunks(activeAudio(),file,info,token);
    }

    if(token!==loadToken)return;

    restorePosition(file,activeAudio());
    applyPlayerSettings(activeAudio());

    els.trackSub.textContent=`${fmtBytes(info.size)} • ${fmtTime(activeAudio().duration)}`;
    els.loading.hidden=true;
    els.play.disabled=false;
    els.seek.disabled=false;
    setLoading(false);

    if(autoplay){
      try{
        await activeAudio().play();
      }catch(_){
        toast('Bài đã sẵn sàng. Nhấn nút Phát để nghe.');
      }
    }

    prepareNextTrack();
  }catch(e){
    if(token!==loadToken)return;
    els.loading.hidden=true;
    els.trackSub.textContent='Không thể tải file.';
    setLoading(false);
    toast(e.message,true);
    console.error(e);
  }
}

function loadDirect(player,url,token){
  return new Promise((resolve,reject)=>{
    let timer=null;

    const cleanup=()=>{
      clearTimeout(timer);
      player.removeEventListener('canplay',ready);
      player.removeEventListener('error',failed);
      player.removeEventListener('stalled',stalled);
    };

    const ready=()=>{
      cleanup();
      if(token!==loadToken)return reject(new Error('Đã hủy tải.'));
      resolve();
    };

    const failed=()=>{
      cleanup();
      reject(new Error('Google Drive không cho phát trực tiếp.'));
    };

    const stalled=()=>{
      els.trackSub.textContent='Đang đệm dữ liệu từ Google Drive...';
    };

    player.addEventListener('canplay',ready,{once:true});
    player.addEventListener('error',failed,{once:true});
    player.addEventListener('stalled',stalled);

    timer=setTimeout(()=>{
      cleanup();
      reject(new Error('Mở luồng trực tiếp quá thời gian.'));
    },DIRECT_TIMEOUT_MS);

    player.preload='auto';
    player.src=url;
    player.load();
  });
}

async function loadByChunks(player,file,knownInfo,token){
  const info=knownInfo&&knownInfo.totalChunks
    ?knownInfo
    :(await api('getFileInfo',{
      fileId:file.id,
      folderId:file.folderId||''
    })).file;

  const fullInfo=info.totalChunks
    ?info
    :(await api('getFileInfo',{
      fileId:file.id,
      folderId:file.folderId||''
    })).file;

  const chunks=new Array(fullInfo.totalChunks);

  for(let i=0;i<fullInfo.totalChunks;i++){
    if(token!==loadToken)throw new Error('Đã hủy tải.');

    const pct=Math.round(((i+1)/fullInfo.totalChunks)*92);
    els.loading.textContent=`Đang tải dự phòng: ${i+1}/${fullInfo.totalChunks}`;
    setLoading(true,`Đang tải ${file.name} (${i+1}/${fullInfo.totalChunks})...`,pct);

    chunks[i]=b64((await api('getFileChunk',{
      fileId:file.id,
      folderId:file.folderId||'',
      index:i
    })).base64);
  }

  const blob=new Blob(
    [join(chunks,fullInfo.size)],
    {type:fullInfo.mimeType||guessMime(fullInfo.extension)}
  );

  if(activeObjectUrl)URL.revokeObjectURL(activeObjectUrl);
  activeObjectUrl=URL.createObjectURL(blob);

  player.src=activeObjectUrl;
  player.load();
  await waitForCanPlay(player,10000);
}

function waitForCanPlay(player,timeout){
  if(player.readyState>=3)return Promise.resolve();

  return new Promise((resolve,reject)=>{
    let timer=null;

    const cleanup=()=>{
      clearTimeout(timer);
      player.removeEventListener('canplay',ok);
      player.removeEventListener('error',bad);
    };

    const ok=()=>{cleanup();resolve()};
    const bad=()=>{cleanup();reject(new Error('Không đọc được file âm thanh.'))};

    player.addEventListener('canplay',ok,{once:true});
    player.addEventListener('error',bad,{once:true});
    timer=setTimeout(()=>{cleanup();reject(new Error('Chờ phát quá lâu.'))},timeout);
  });
}

async function prepareNextTrack(){
  if(!els.autoNext.checked||audioItems.length<2||activeIndex<0)return;

  const token=++preloadToken;
  const nextIndex=(activeIndex+1)%audioItems.length;
  const track=audioItems[nextIndex];
  const player=standbyAudio();

  standbyTrack=null;
  standbyReady=false;
  resetPlayer(player);

  try{
    const info=await getStreamInfo(track);
    if(token!==preloadToken)return;

    await preloadDirect(player,info.downloadUrl,token);
    if(token!==preloadToken)return;

    standbyTrack=track;
    standbyReady=true;
  }catch(_){
    // Không tải chunk nền để tránh chiếm băng thông của bài đang phát.
    standbyTrack=null;
    standbyReady=false;
  }
}

function preloadDirect(player,url,token){
  return new Promise((resolve,reject)=>{
    let timer=null;

    const cleanup=()=>{
      clearTimeout(timer);
      player.removeEventListener('canplay',ready);
      player.removeEventListener('error',failed);
    };

    const ready=()=>{
      cleanup();
      if(token!==preloadToken)return reject(new Error('Đã hủy preload.'));
      resolve();
    };

    const failed=()=>{
      cleanup();
      reject(new Error('Không preload được.'));
    };

    player.addEventListener('canplay',ready,{once:true});
    player.addEventListener('error',failed,{once:true});
    timer=setTimeout(()=>{cleanup();reject(new Error('Preload quá thời gian.'))},15000);

    player.preload='auto';
    player.src=url;
    player.load();
  });
}

async function useStandbyTrack(track){
  if(!standbyReady||!standbyTrack||standbyTrack.id!==track.id){
    return false;
  }

  const oldPlayer=activeAudio();
  activePlayerIndex=1-activePlayerIndex;
  const newPlayer=activeAudio();

  activeFileId=track.id;
  activeIndex=audioItems.findIndex(x=>x.id===track.id);
  standbyReady=false;
  standbyTrack=null;

  stopPlayer(oldPlayer);
  resetPlayer(oldPlayer);

  if(activeObjectUrl){
    URL.revokeObjectURL(activeObjectUrl);
    activeObjectUrl='';
  }

  els.trackTitle.textContent=track.name;
  els.trackSub.textContent='Đã nạp trước • đang phát';
  els.loading.hidden=true;
  showMode('Đã nạp trước');
  renderList();
  updateButtons();
  applyPlayerSettings(newPlayer);
  onMetadata();

  try{
    await newPlayer.play();
  }catch(e){
    toast('Nhấn nút Phát để tiếp tục.');
  }

  prepareNextTrack();
  return true;
}

async function handleEnded(){
  savePosition();

  if(!els.autoNext.checked)return;

  const next=nextTrack(1);
  if(!next)return;

  if(await useStandbyTrack(next))return;
  openAudio(next);
}

async function playRelative(step){
  const target=nextTrack(step);
  if(!target)return;

  if(step===1&&await useStandbyTrack(target))return;
  openAudio(target);
}

function nextTrack(step){
  if(!audioItems.length)return null;

  let index=activeIndex+step;
  if(index<0)index=audioItems.length-1;
  if(index>=audioItems.length)index=0;

  return audioItems[index];
}

function togglePlay(){
  const player=activeAudio();
  if(!player.src)return;

  if(player.paused){
    player.play().catch(e=>toast(e.message,true));
  }else{
    player.pause();
  }
}

function onMetadata(){
  const player=activeAudio();

  els.duration.textContent=fmtTime(player.duration);
  els.seek.max=Number.isFinite(player.duration)?player.duration:0;
  applyPlayerSettings(player);
}

function onTimeUpdate(){
  const player=activeAudio();

  els.current.textContent=fmtTime(player.currentTime);
  els.seek.value=player.currentTime||0;

  if(Math.floor(player.currentTime)%5===0)savePosition();

  if(
    els.autoNext.checked&&
    Number.isFinite(player.duration)&&
    player.duration-player.currentTime<=PRELOAD_SECONDS&&
    !standbyReady
  ){
    prepareNextTrack();
  }
}

function onBufferProgress(){
  const player=activeAudio();

  if(!Number.isFinite(player.duration)||!player.buffered.length)return;

  try{
    const end=player.buffered.end(player.buffered.length-1);
    const pct=Math.min(100,Math.round(end/player.duration*100));

    if(!els.status.hidden){
      els.statusPct.textContent=`${pct}% đệm`;
      els.progress.style.width=`${pct}%`;
    }
  }catch(_){}
}

function restorePosition(file,player){
  const saved=+(localStorage.getItem(posKey(file.id))||0);

  if(
    saved>0&&
    Number.isFinite(player.duration)&&
    saved<player.duration-5
  ){
    player.currentTime=saved;
  }
}

function savePosition(){
  const player=activeAudio();

  if(
    activeFileId&&
    Number.isFinite(player.currentTime)
  ){
    localStorage.setItem(
      posKey(activeFileId),
      String(player.currentTime)
    );
  }
}

function posKey(id){return`audio_position_${id}`}

function applyPlayerSettings(player){
  player.volume=+els.volume.value;
  player.playbackRate=+els.speed.value;
}

function updateButtons(){
  const ok=audioItems.length>0&&activeIndex>=0;
  els.prev.disabled=!ok;
  els.next.disabled=!ok;
}

function restore(){
  const volume=localStorage.getItem('audio_volume');
  const speed=localStorage.getItem('audio_speed');
  const auto=localStorage.getItem('audio_auto_next');

  if(volume!==null)els.volume.value=volume;
  if(speed!==null)els.speed.value=speed;
  if(auto!==null)els.autoNext.checked=auto==='1';

  players.forEach(applyPlayerSettings);
}

function showMode(text){
  els.mode.hidden=false;
  els.mode.textContent=text;
}

function resetTimeDisplay(){
  els.current.textContent='0:00';
  els.duration.textContent='0:00';
  els.seek.value=0;
  els.seek.max=100;
}

function setLoading(show,text='',pct=0){
  els.status.hidden=!show;
  if(!show)return;

  const value=Math.max(0,Math.min(100,Math.round(pct)));
  els.statusText.textContent=text;
  els.statusPct.textContent=`${value}%`;
  els.progress.style.width=`${value}%`;
}

function toast(message,isError=false){
  clearTimeout(toastTimer);
  els.toast.textContent=message;
  els.toast.className=`toast show${isError?' error':''}`;
  toastTimer=setTimeout(()=>els.toast.className='toast',3500);
}

function cancelStandby(){
  preloadToken++;
  standbyReady=false;
  standbyTrack=null;
  resetPlayer(standbyAudio());

  if(standbyObjectUrl){
    URL.revokeObjectURL(standbyObjectUrl);
    standbyObjectUrl='';
  }
}

function stopPlayer(player){
  try{player.pause()}catch(_){}
}

function resetPlayer(player){
  try{
    player.pause();
    player.removeAttribute('src');
    player.load();
  }catch(_){}
}

function cleanup(){
  savePosition();
  players.forEach(resetPlayer);

  if(activeObjectUrl)URL.revokeObjectURL(activeObjectUrl);
  if(standbyObjectUrl)URL.revokeObjectURL(standbyObjectUrl);
}

function b64(value){
  const binary=atob(value);
  const bytes=new Uint8Array(binary.length);

  for(let i=0;i<binary.length;i++){
    bytes[i]=binary.charCodeAt(i);
  }

  return bytes;
}

function join(parts,totalLength){
  const result=new Uint8Array(totalLength);
  let offset=0;

  parts.forEach(part=>{
    result.set(part,offset);
    offset+=part.length;
  });

  return result;
}

function norm(value){
  return String(value||'')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .trim();
}

function fmtBytes(bytes){
  if(!bytes)return'0 B';

  const units=['B','KB','MB','GB'];
  const index=Math.min(
    Math.floor(Math.log(bytes)/Math.log(1024)),
    units.length-1
  );

  return`${(bytes/Math.pow(1024,index)).toFixed(index?1:0)} ${units[index]}`;
}

function fmtTime(value){
  if(!Number.isFinite(value)||value<0)return'0:00';

  const hours=Math.floor(value/3600);
  const minutes=Math.floor(value%3600/60);
  const seconds=Math.floor(value%60);

  return hours
    ?`${hours}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`
    :`${minutes}:${String(seconds).padStart(2,'0')}`;
}

function guessMime(extension){
  return({
    mp3:'audio/mpeg',
    m4a:'audio/mp4',
    aac:'audio/aac',
    wav:'audio/wav',
    ogg:'audio/ogg',
    oga:'audio/ogg',
    opus:'audio/ogg',
    flac:'audio/flac',
    webm:'audio/webm'
  })[String(extension||'').toLowerCase()]||'audio/mpeg';
}

function esc(value){
  return String(value).replace(
    /[&<>'"]/g,
    character=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    })[character]
  );
}
