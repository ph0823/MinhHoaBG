<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện Nguyên Nhi</title>
    <style>
        /* --- CSS BIẾN & GIAO DIỆN CHUNG --- */
        :root {
            --bg-color: #f4f4f4;
            --text-color: #333333;
            --card-bg: #ffffff;
            --primary: #d35400;
            --border: #dddddd;
            --btn-bg: #eeeeee;
            --btn-hover: #dddddd;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --border: #333333;
            --btn-bg: #333333;
            --btn-hover: #444444;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
            line-height: 1.6;
        }

        a { text-decoration: none; color: inherit; }
        
        .container { max-width: 900px; margin: 0 auto; padding: 15px; }

        /* --- THANH CÔNG CỤ (TOOLBAR) & TÌM KIẾM --- */
        .toolbar {
            position: sticky;
            top: 0;
            background-color: var(--card-bg);
            padding: 10px 15px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 100;
            gap: 10px;
        }
        .toolbar-title { font-weight: bold; color: var(--primary); font-size: 1.2em; margin: 0; }
        
        .search-box { display: flex; gap: 5px; flex-grow: 1; max-width: 300px; }
        .search-box input { flex-grow: 1; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-color); color: var(--text-color); }
        .search-box button, .toolbar-actions button, .pagination button {
            background-color: var(--btn-bg); color: var(--text-color);
            border: none; padding: 8px 12px; border-radius: 5px;
            cursor: pointer; font-weight: bold;
        }
        .search-box button:hover, .toolbar-actions button:hover, .pagination button:hover { background-color: var(--btn-hover); }

        /* --- QUẢN LÝ MÀN HÌNH --- */
        .view-section { display: none; animation: fadeIn 0.3s ease; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- COMPONENT: CARD & GRID --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: var(--card-bg); border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: block; transition: transform 0.2s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .card img { width: 100%; height: 220px; object-fit: cover; background: #e0e0e0; display: block; }
        .card-info { padding: 10px; height: 65px; }
        .card-info h3 { margin: 0; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; text-align: center; }

        /* --- COMPONENT: NỘI DUNG CHI TIẾT & ĐỌC --- */
        .content-box { background: var(--card-bg); padding: 20px; border-radius: 8px; margin-top: 20px; }
        .btn-back { display: inline-block; background: var(--primary); color: white; padding: 8px 15px; border-radius: 5px; margin-bottom: 15px; }
        .chapter-list { list-style: none; padding: 0; margin: 0; max-height: 400px; overflow-y: auto; border: 1px solid var(--border); }
        .chapter-list li a { display: block; padding: 12px 15px; border-bottom: 1px solid var(--border); }
        .chapter-list li a:hover { background: var(--btn-bg); color: var(--primary); }
        
        #chapter-content { font-size: 22px; text-align: center; margin-top: 20px; }
        #chapter-content p { margin-bottom: 15px; text-align: justify; }
        #chapter-content img { width: 100%; max-width: 800px; display: block; margin: 0 auto; }
        
        .loading { text-align: center; padding: 40px; font-style: italic; opacity: 0.7; }

        /* --- PHÂN TRANG (PAGINATION) --- */
        .pagination { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 30px; }
        .pagination span { font-weight: bold; color: var(--primary); }

        .filter-note { background: #fff3cd; border: 1px solid #ffe69c; color: #664d03; padding: 10px 12px; border-radius: 8px; margin-top: 12px; font-size: 14px; }
        [data-theme="dark"] .filter-note { background: #3b3418; border-color: #6a5b20; color: #ffe69c; }
        .badge { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; margin-top: 6px; }
        .badge-kids { background: #d1e7dd; color: #0f5132; }
        .badge-safe { background: #e2e3e5; color: #41464b; }
        .card-info { height: 88px; }

        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .card img { height: 180px; }
            .content-box { padding: 15px; border-radius: 0; margin-top: 10px; }
            #chapter-content { font-size: 20px; }
            .search-box { max-width: 100%; order: 3; margin-top: 10px; }
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <a href="#/" class="toolbar-title">A Truyen Nhi Quán</a>
        
        <form class="search-box" onsubmit="event.preventDefault(); handleSearch();">
            <input type="text" id="searchInput" placeholder="Nhập tên truyện...">
            <button type="submit">Tìm</button>
        </form>

        <div class="toolbar-actions" id="reader-tools" style="display: none;">
            <button onclick="changeFontSize(-2)">A-</button>
            <button onclick="changeFontSize(2)">A+</button>
            <button onclick="toggleTheme()">Sáng/Tối</button>
        </div>
    </div>

    <div class="container">
        <div id="view-list" class="view-section active">
            <h2 id="list-title">Truyện Thiếu Nhi Mới Cập Nhật</h2>
            
            <div id="story-grid" class="grid">
                <div class="loading">Đang tải dữ liệu...</div>
            </div>
            <div id="pagination" class="pagination"></div>
        </div>

        <div id="view-detail" class="view-section">
            <a href="#/" class="btn-back">⬅ Trang chủ</a>
            <div class="content-box">
                <h2 id="detail-title">Đang tải...</h2>
                <div id="detail-desc" style="margin-bottom: 20px; opacity: 0.8;"></div>
                <button id="btn-continue" class="btn-back" style="background: #27ae60; display: none;">📖 Đọc tiếp</button>
                <h3>Danh sách chương</h3>
                <ul id="detail-chapters" class="chapter-list"></ul>
            </div>
        </div>

        <div id="view-reader" class="view-section">
            <a id="btn-back-detail" href="#/" class="btn-back">⬅ Quay lại danh sách chương</a>
            <div class="content-box">
                <h2 id="reader-title" style="text-align: center; color: var(--primary);">Đang tải...</h2>
                <div id="chapter-content"></div>
            </div>
        </div>
    </div>

    <script>
        const BASE_API = 'https://otruyenapi.com/v1/api';
        let currentFontSize = 22;
        const contentArea = document.getElementById('chapter-content');
        const readerTools = document.getElementById('reader-tools');
        const searchInput = document.getElementById('searchInput');

        // --- BỘ LỌC VÀ XẾP HẠNG NỘI DUNG THIẾU NHI ---
        // Lưu ý: lọc theo từ khóa chỉ giúp giảm rủi ro, không thể thay thế kiểm duyệt nội dung thực tế.
        const BLOCKED_KEYWORDS = [
            '18+', '18 plus', 'smut', 'adult', 'mature', 'trưởng thành', 'hentai',
            'ecchi', 'r18', 'r-18', 'nsfw', 'sex', 'sexy', 'sắc hiệp', 'sắc tình',
            'song tu', 'song thể', 'dâm', 'loạn luân', 'ntr', 'netorare', 'boylove 18',
            'girl love 18', 'yaoi 18', 'yuri 18', 'bdsm', 'cưỡng hiếp'
        ];

        const RISKY_KEYWORDS = [
            'ngôn tình', 'tổng tài', 'xuyên không', 'tu tiên', 'võng du', 'ma đạo',
            'kinh dị', 'máu me', 'bạo lực', 'sát thủ', 'trả thù', 'chiến tranh',
            'romance', 'drama', 'supernatural', 'psychological'
        ];

        const KIDS_KEYWORDS = [
            'thiếu nhi', 'trẻ em', 'kids', 'children', 'học đường', 'school life',
            'hài hước', 'comedy', 'phiêu lưu', 'adventure', 'đời thường', 'slice of life',
            'gia đình', 'family', 'thể thao', 'sports', 'khoa học', 'science',
            'giáo dục', 'educational', 'động vật', 'animal', 'fantasy', 'cổ tích',
            'siêu anh hùng', 'superhero', 'robot', 'mecha', 'trinh thám thiếu nhi'
        ];

        function normalizeText(value = '') {
            return String(value)
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase();
        }

        function getItemText(item = {}) {
            const categories = Array.isArray(item.category)
                ? item.category.map(c => c?.name || c?.slug || '').join(' ')
                : '';
            return normalizeText([
                item.name, item.slug, item.origin_name, item.content, item.description, categories
            ].filter(Boolean).join(' '));
        }

        function containsAny(text, keywords) {
            return keywords.some(keyword => text.includes(normalizeText(keyword)));
        }

        function getKidsScore(item) {
            const text = getItemText(item);
            if (containsAny(text, BLOCKED_KEYWORDS)) return -999;

            let score = 0;
            KIDS_KEYWORDS.forEach(keyword => {
                if (text.includes(normalizeText(keyword))) score += 4;
            });
            RISKY_KEYWORDS.forEach(keyword => {
                if (text.includes(normalizeText(keyword))) score -= 2;
            });

            // Truyện có trạng thái/cập nhật rõ ràng được ưu tiên nhẹ.
            if (item.status === 'ongoing' || item.status === 'completed') score += 1;
            return score;
        }

        function isSafeForKids(item) {
            return getKidsScore(item) > -999;
        }

        function sortKidsFirst(items) {
            return [...items].sort((a, b) => getKidsScore(b) - getKidsScore(a));
        }

        // --- HỆ THỐNG ROUTER ---
        function router() {
            const hash = window.location.hash;
            readerTools.style.display = 'none';

            if (!hash || hash === '' || hash === '#/') {
                document.getElementById('list-title').innerText = "Truyện Thiếu Nhi Mới Cập Nhật";
                switchView('view-list');
                fetchList(`${BASE_API}/danh-sach/truyen-moi`);
            } else if (hash.startsWith('#/tim-kiem/')) {
                const keyword = decodeURIComponent(hash.replace('#/tim-kiem/', ''));
                document.getElementById('list-title').innerText = `Kết quả tìm kiếm: "${keyword}"`;
                searchInput.value = keyword;
                switchView('view-list');
                fetchList(`${BASE_API}/tim-kiem?keyword=${encodeURIComponent(keyword)}`);
            } else if (hash.startsWith('#/truyen/')) {
                const slug = hash.replace('#/truyen/', '');
                switchView('view-detail');
                fetchStoryDetail(slug);
            } else if (hash.startsWith('#/chuong/')) {
                const urlParams = new URLSearchParams(hash.split('?')[1]);
                const apiUrl = urlParams.get('api');
                const storySlug = urlParams.get('truyen');
                const chapName = urlParams.get('name');
                
                readerTools.style.display = 'block'; 
                switchView('view-reader');
                fetchChapterContent(apiUrl, storySlug, chapName);
            }
        }

        window.addEventListener('hashchange', router);
        window.addEventListener('load', () => { initTheme(); router(); });

        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(view => view.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            window.scrollTo(0, 0); 
        }


        function escapeHTML(value = '') {
            return String(value).replace(/[&<>'"]/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[char]));
        }

        function handleSearch() {
            const keyword = searchInput.value.trim();
            if(keyword) window.location.hash = `#/tim-kiem/${encodeURIComponent(keyword)}`;
        }

        // --- GỌI API & PHÂN TRANG ---
        async function fetchList(baseApiUrl, page = 1) {
            const grid = document.getElementById('story-grid');
            const paginationEl = document.getElementById('pagination');
            
            grid.innerHTML = '<div class="loading">Đang tải dữ liệu...</div>';
            paginationEl.innerHTML = ''; // Ẩn phân trang lúc đang tải

            try {
                // Thêm tham số page vào URL
                const separator = baseApiUrl.includes('?') ? '&' : '?';
                const res = await fetch(`${baseApiUrl}${separator}page=${page}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                grid.innerHTML = ''; 
                
                let items = data.data?.items || [];
                let domainCdn = data.data?.domain_cdn || 'https://img.otruyenapi.com';

                // BƯỚC LỌC DỮ LIỆU: Chỉ giữ lại các truyện an toàn
                items = sortKidsFirst(items.filter(isSafeForKids));

                if(items.length === 0) {
                    grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">Không có dữ liệu hoặc các truyện đã bị ẩn bởi bộ lọc an toàn.</p>';
                } else {
                    items.forEach(item => {
                        let thumbUrl = item.thumb_url;
                        if (!thumbUrl.startsWith('http')) {
                            if (!thumbUrl.includes('uploads/comics')) {
                                thumbUrl = `${domainCdn}/uploads/comics/${item.thumb_url}`;
                            } else {
                                thumbUrl = `${domainCdn}/${item.thumb_url}`;
                            }
                            thumbUrl = thumbUrl.replace(/([^:]\/)\/+/g, "$1");
                        }

                        const score = getKidsScore(item);
                        const badge = score >= 4
                            ? '<span class="badge badge-kids">Ưu tiên thiếu nhi</span>'
                            : '<span class="badge badge-safe">Đã lọc an toàn</span>';
                        grid.innerHTML += `
                            <a href="#/truyen/${encodeURIComponent(item.slug)}" class="card">
                                <img src="${escapeHTML(thumbUrl)}" alt="${escapeHTML(item.name)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.src='https://placehold.co/200x300?text=No+Image'">
                                <div class="card-info">
                                    <h3>${escapeHTML(item.name)}</h3>
                                    ${badge}
                                </div>
                            </a>
                        `;
                    });
                }

                // VẼ NÚT PHÂN TRANG
                renderPagination(page, baseApiUrl, data.data?.params?.pagination);

            } catch (error) {
                grid.innerHTML = '<div class="loading" style="color:red">Lỗi kết nối API!</div>';
            }
        }

        function renderPagination(currentPage, baseApiUrl, paginationData) {
            const paginationEl = document.getElementById('pagination');
            let html = '';

            // Nếu đang ở trang > 1, hiển thị nút Trang Trước
            if (currentPage > 1) {
                html += `<button onclick="fetchList('${baseApiUrl}', ${currentPage - 1})">⬅ Trang Trước</button>`;
            }

            html += `<span>Trang ${currentPage}</span>`;

            // Kiểm tra xem có trang tiếp theo không (dựa trên thông số API trả về)
            // Hoặc đơn giản là nếu danh sách còn hiển thị, cho phép bấm tiếp
            if (paginationData) {
                const totalPages = Math.ceil(paginationData.totalItems / paginationData.totalItemsPerPage);
                if (currentPage < totalPages) {
                    html += `<button onclick="fetchList('${baseApiUrl}', ${currentPage + 1})">Trang Sau ➡</button>`;
                }
            } else {
                // Fallback nếu API không trả về tổng số trang rõ ràng
                html += `<button onclick="fetchList('${baseApiUrl}', ${currentPage + 1})">Trang Sau ➡</button>`;
            }

            paginationEl.innerHTML = html;
        }

        // --- CÁC HÀM CÒN LẠI (GIỮ NGUYÊN) ---
        function sanitizeHTML(html = '') {
            const template = document.createElement('template');
            template.innerHTML = html;
            template.content.querySelectorAll('script, iframe, object, embed, form, style').forEach(el => el.remove());
            template.content.querySelectorAll('*').forEach(el => {
                [...el.attributes].forEach(attr => {
                    if (/^on/i.test(attr.name) || ['srcdoc'].includes(attr.name.toLowerCase())) el.removeAttribute(attr.name);
                });
            });
            return template.innerHTML;
        }

        async function fetchStoryDetail(slug) {
            const titleEl = document.getElementById('detail-title');
            const descEl = document.getElementById('detail-desc');
            const chaptersUl = document.getElementById('detail-chapters');
            const btnContinue = document.getElementById('btn-continue');

            titleEl.innerText = "Đang tải...";
            chaptersUl.innerHTML = '<div class="loading">Đang tải danh sách chương...</div>';
            btnContinue.style.display = 'none';

            try {
                const res = await fetch(`${BASE_API}/truyen-tranh/${slug}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const story = data.data?.item;

                if(!story) throw new Error("Không tìm thấy truyện");

                if (!isSafeForKids(story)) {
                    titleEl.innerText = "Nội dung đã bị ẩn";
                    descEl.textContent = "Truyện này có dấu hiệu không phù hợp với chế độ thiếu nhi.";
                    chaptersUl.innerHTML = '';
                    return;
                }

                titleEl.innerText = story.name;
                descEl.innerHTML = sanitizeHTML(story.content || "Chưa có giới thiệu.");

                const savedChapterApi = localStorage.getItem(`history_api_${slug}`);
                const savedChapterName = localStorage.getItem(`history_name_${slug}`);
                if (savedChapterApi) {
                    btnContinue.style.display = 'inline-block';
                    btnContinue.onclick = () => window.location.hash = `#/chuong/?api=${encodeURIComponent(savedChapterApi)}&truyen=${slug}&name=${encodeURIComponent(savedChapterName || 'Đọc tiếp')}`;
                }

                const chapters = story.chapters?.[0]?.server_data || [];
                chaptersUl.innerHTML = '';
                chapters.forEach(chap => {
                    const chapApiUrl = chap.chapter_api_data;
                    chaptersUl.innerHTML += `<li><a href="#/chuong/?api=${encodeURIComponent(chapApiUrl)}&truyen=${slug}&name=${encodeURIComponent(chap.filename)}">Chương ${chap.chapter_name || chap.filename}</a></li>`;
                });
            } catch (error) {
                titleEl.innerText = "Lỗi tải truyện";
                chaptersUl.innerHTML = '<div class="loading" style="color:red">Không thể tải danh sách chương.</div>';
            }
        }

        async function fetchChapterContent(apiUrl, storySlug, chapName) {
            const titleEl = document.getElementById('reader-title');
            const contentEl = document.getElementById('chapter-content');
            const btnBack = document.getElementById('btn-back-detail');

            titleEl.innerText = chapName ? `Chương ${chapName}` : "Đang tải...";
            contentEl.innerHTML = '<div class="loading">Đang tải nội dung chương...</div>';
            
            if(storySlug) {
                btnBack.href = `#/truyen/${storySlug}`;
                localStorage.setItem(`history_api_${storySlug}`, apiUrl);
                if(chapName) localStorage.setItem(`history_name_${storySlug}`, chapName);
            } else { btnBack.href = `#/`; }

            try {
                const res = await fetch(apiUrl);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const chapter = data.data?.item;
                const domainCdn = data.data?.domain_cdn;

                if(!chapter) throw new Error("Không tìm thấy");
                if(!chapName) titleEl.innerText = chapter.chapter_name || chapter.chapter_title || "Nội dung chương";

                const images = chapter.chapter_image;
                if (images && Array.isArray(images) && images.length > 0) {
                    let html = '';
                    const chapterPath = chapter.chapter_path || '';
                    images.forEach(img => {
                        let imgSrc = `${domainCdn}/${chapterPath}/${img.image_file}`;
                        imgSrc = imgSrc.replace(/([^:]\/)\/+/g, "$1");
                        html += `<img src="${imgSrc}" loading="lazy" alt="Truyện tranh">`;
                    });
                    contentEl.innerHTML = html;
                } else {
                    contentEl.innerHTML = sanitizeHTML(chapter.chapter_content || '<p>Đang cập nhật nội dung...</p>');
                }
            } catch (error) {
                titleEl.innerText = "Lỗi tải chương";
                contentEl.innerHTML = '<div class="loading" style="color:red">Không thể tải chương này.</div>';
            }
        }

        function changeFontSize(step) {
            currentFontSize += step;
            if(currentFontSize < 16) currentFontSize = 16;
            if(currentFontSize > 40) currentFontSize = 40;
            contentArea.style.fontSize = currentFontSize + 'px';
            localStorage.setItem('pref_fontsize', currentFontSize);
        }

        function toggleTheme() {
            const body = document.body;
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                localStorage.setItem('pref_theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
                localStorage.setItem('pref_theme', 'dark');
            }
        }

        function initTheme() {
            const savedSize = localStorage.getItem('pref_fontsize');
            if(savedSize) {
                currentFontSize = parseInt(savedSize);
                contentArea.style.fontSize = currentFontSize + 'px';
            }
            if(localStorage.getItem('pref_theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
        }
    </script>
</body>
</html>
