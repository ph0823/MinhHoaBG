<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Kiểm Tra Tốc Độ Gõ Phím - Thơ Tố Hữu</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }
        .main-wrapper {
            display: flex;
            gap: 20px;
            max-width: 1050px;
            width: 95%;
            flex-wrap: wrap;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            flex: 2;
            min-width: 320px;
            text-align: center;
        }
        .leaderboard-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 280px;
        }
        h1, h2 { color: #d32f2f; margin-top: 0; margin-bottom: 10px; }
        .author { color: #666; font-style: italic; margin-bottom: 15px; }
        
        .user-section {
            background: #e3f2fd;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .user-section input {
            padding: 8px 12px;
            border: 1px solid #90caf9;
            border-radius: 4px;
            font-size: 0.95rem;
        }

        .poem-container {
            font-size: 1.25rem;
            line-height: 1.8;
            background: #fff8e1;
            padding: 15px;
            border-left: 5px solid #ffa000;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: left;
            user-select: none;
            white-space: pre-wrap;
            font-family: 'Courier New', Courier, monospace;
            max-height: 200px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        
        .char-correct { color: #2e7d32; background-color: #c8e6c9; }
        .char-incorrect { color: #c62828; background-color: #ffcdd2; }
        .char-current { border-bottom: 3px solid #2196f3; background-color: #bbdefb; }

        textarea {
            width: 100%;
            height: 140px;
            font-size: 1rem;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            resize: none;
            font-family: inherit;
        }
        textarea:focus { border-color: #d32f2f; outline: none; }

        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 9px 16px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #b71c1c; }

        .stats { display: flex; gap: 8px; font-weight: bold; color: #333; flex-wrap: wrap; }
        .stat-box { background: #f0f0f0; padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; }

        .leaderboard-list { list-style: none; padding: 0; margin: 0; }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            font-size: 0.95rem;
        }
        .leaderboard-item:first-child { font-weight: bold; color: #d32f2f; background: #ffebee; }
        .leaderboard-item:nth-child(2) { font-weight: bold; color: #f57c00; }
        .leaderboard-item:nth-child(3) { font-weight: bold; color: #388e3c; }
        .rank { width: 30px; }
        .player-name { flex-grow: 1; text-align: left; }
        .score { font-weight: bold; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="main-wrapper">
    <div class="container">
        <h1>Thử Tài Gõ Phím</h1>
        <div class="author">Các tác phẩm thơ Tố Hữu</div>

        <div class="user-section">
            <label for="player-name-input"><strong>Họ và tên học sinh:</strong></label>
            <input type="text" id="player-name-input" placeholder="Nhập tên của bạn..." maxlength="20">
        </div>
        
        <div class="poem-container" id="poem-display"></div>

        <textarea id="input-field" placeholder="Nhập tên ở trên, sau đó gõ văn bản tại đây..." autofocus></textarea>

        <div class="controls">
            <button id="btn-next">Đổi bài khác 🎲</button>
            <div class="stats">
                <div class="stat-box">Thời gian: <span id="timer">0</span>s</div>
                <div class="stat-box">Tốc độ: <span id="wpm">0</span> WPM</div>
                <div class="stat-box">Chính xác: <span id="accuracy">100</span>%</div>
            </div>
        </div>
    </div>

    <div class="leaderboard-card">
        <h2>🏆 Bảng Xếp Hạng</h2>
        <p style="font-size: 0.85rem; color: #666; margin-bottom: 15px;">Thời gian thực (Real-time Firebase)</p>
        <ol class="leaderboard-list" id="leaderboard"></ol>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDmzXo6VGoXP6zAkJ_kVDdIFKC-i2uOW7o",
        authDomain: "luyen-go.firebaseapp.com",
        projectId: "luyen-go",
        storageBucket: "luyen-go.firebasestorage.app",
        messagingSenderId: "79498233127",
        appId: "1:79498233127:web:a6c2e2bab71ba737ca9502"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const scoresRef = database.ref('typing_scores');

    const poemsList = [
        `Từ ấy trong tôi bừng nắng hạ
Mặt trời chân lý chói qua tim
Hồn tôi là một vườn hoa lá
Rất đậm hương và rộn tiếng chim

Tôi buộc lòng tôi với mọi người
Để tình trang trải với muôn nơi
Để hồn tôi với bao hồn khổ
Gần gũi nhau thêm mạnh khối đời

Tôi đã là con của mọi nhà
Là em của vạn kiếp phôi pha
Là anh của vạn đầu em nhỏ
Không áo cơm, cù bất cù bơ...`,

        `Chú bé Lượm xắt xắt
Cái xắc xinh xinh
Cái chân thoăn thoắt
Cái đầu nghênh nghênh

Ca-lô đội lệch
Mồm huýt sáo vang
Như con chim chóc
Nhảy trên đường làng

Cháu đi liên lạc
Vui lắm chú ơi
Đường ra mặt trận
Thượng kerosene bao nhiêu...

Thôi rồi, Lượm ơi!
Một dòng máu đỏ
An nghỉ trên đồng
Cháu nằm trên lúa
Tay nắm chặt bông
Lúa thơm mùi sữa
Hồn bay giữa đồng...`,

        `Mình về mình có nhớ ta
Mười lăm năm ấy thiết tha mặn nồng
Mình về mình có nhớ không
Nhìn cây nhớ núi, nhìn sông nhớ nguồn?

Tiếng ai tha thiết bên lưng đèo
Mái tranh xám khói, lều tranh xiêu
Thương nhau, chia củ sắn lùi
Bát cơm xẻ nửa, chăn lùi đắp chung

Nhớ sao lớp học i tờ
Đồng khuya đuốc sáng những giờ liên hoan
Nhớ sao ngày tháng cơ quan
Gian lao mà vẫn dạt dào cất ca
Nhớ sao tiếng mõ rừng chiều
Chày đâm nát suối, đều đều suối xa...`
    ];

    const poemDisplay = document.getElementById('poem-display');
    const inputField = document.getElementById('input-field');
    const timerDisplay = document.getElementById('timer');
    const wpmDisplay = document.getElementById('wpm');
    const accuracyDisplay = document.getElementById('accuracy');
    const btnNext = document.getElementById('btn-next');
    const playerNameInput = document.getElementById('player-name-input');
    const leaderboardEl = document.getElementById('leaderboard');

    let currentPoem = "";
    let startTime;
    let timerInterval;
    let isStarted = false;
    let correctCharsCount = 0;

    function loadRandomPoem() {
        clearInterval(timerInterval);
        isStarted = false;
        timerDisplay.innerText = "0";
        wpmDisplay.innerText = "0";
        accuracyDisplay.innerText = "100";
        inputField.value = "";
        inputField.disabled = false;
        poemDisplay.scrollTop = 0;

        const randomIndex = Math.floor(Math.random() * poemsList.length);
        currentPoem = poemsList[randomIndex];

        poemDisplay.innerHTML = '';
        currentPoem.split('').forEach((char, index) => {
            const charSpan = document.createElement('span');
            charSpan.innerText = char;
            if (index === 0) charSpan.classList.add('char-current');
            poemDisplay.appendChild(charSpan);
        });
    }

    inputField.addEventListener('input', () => {
        if (!playerNameInput.value.trim()) {
            alert('Vui lòng nhập "Họ và tên học sinh" trước khi gõ!');
            inputField.value = '';
            playerNameInput.focus();
            return;
        }

        if (!isStarted) {
            isStarted = true;
            startTime = new Date();
            timerInterval = setInterval(updateStats, 1000);
        }

        const arrayPoemSpans = poemDisplay.querySelectorAll('span');
        const arrayValue = inputField.value.split('');
        
        correctCharsCount = 0;
        let isAllCorrect = true;

        arrayPoemSpans.forEach((characterSpan, index) => {
            const character = arrayValue[index];
            characterSpan.classList.remove('char-current');

            if (character == null) {
                characterSpan.classList.remove('char-correct', 'char-incorrect');
                isAllCorrect = false;
            } else if (character === characterSpan.innerText) {
                characterSpan.classList.add('char-correct');
                characterSpan.classList.remove('char-incorrect');
                correctCharsCount++;
            } else {
                characterSpan.classList.add('char-incorrect');
                characterSpan.classList.remove('char-correct');
                isAllCorrect = false;
            }
        });

        // Tự động cuộn đến vị trí gõ hiện tại
        if (arrayValue.length < arrayPoemSpans.length) {
            const currentSpan = arrayPoemSpans[arrayValue.length];
            currentSpan.classList.add('char-current');
            currentSpan.scrollIntoView({
                behavior: 'smooth',
                block: 'center'
            });
        }

        updateStats();

        // Kiểm tra khi hoàn thành bài gõ
        if (arrayValue.length === currentPoem.length && isAllCorrect) {
            clearInterval(timerInterval);
            inputField.disabled = true;
            const finalWPM = parseInt(wpmDisplay.innerText);
            const finalAccuracy = parseInt(accuracyDisplay.innerText);
            const name = playerNameInput.value.trim();

            if (finalAccuracy >= 90) {
                saveScoreToFirebase(name, finalWPM, finalAccuracy);
                setTimeout(() => {
                    alert(`🎉 Chúc mừng ${name}!\nTốc độ: ${finalWPM} WPM\nĐộ chính xác: ${finalAccuracy}%\nThành tích đã lưu lên Bảng xếp hạng!`);
                }, 100);
            } else {
                setTimeout(() => {
                    alert(`⚠️ Độ chính xác của bạn là ${finalAccuracy}% (cần ≥ 90% để lên Bảng xếp hạng). Hãy bấm 'Đổi bài khác' để thử lại nhé!`);
                }, 100);
            }
        }
    });

    // Cập nhật chỉ số WPM chuẩn & Accuracy %
    function updateStats() {
        const timeElapsed = Math.floor((new Date() - startTime) / 1000);
        timerDisplay.innerText = timeElapsed;

        const totalTyped = inputField.value.length;
        
        // Tính Accuracy (%)
        const accuracy = totalTyped > 0 ? Math.round((correctCharsCount / totalTyped) * 100) : 100;
        accuracyDisplay.innerText = accuracy;

        // Tính WPM Chuẩn quốc tế (1 từ = 5 ký tự đúng)
        const minutes = timeElapsed / 60;
        const wpm = minutes > 0 ? Math.round((correctCharsCount / 5) / minutes) : 0;
        wpmDisplay.innerText = wpm;
    }

    function saveScoreToFirebase(name, wpm, accuracy) {
        scoresRef.push({
            name: name,
            wpm: wpm,
            accuracy: accuracy,
            timestamp: Date.now()
        });
    }

    scoresRef.orderByChild('wpm').limitToLast(10).on('value', (snapshot) => {
        const scores = [];
        snapshot.forEach((childSnapshot) => {
            scores.push(childSnapshot.val());
        });

        scores.sort((a, b) => b.wpm - a.wpm);

        leaderboardEl.innerHTML = '';
        if (scores.length === 0) {
            leaderboardEl.innerHTML = '<li style="color:#888; font-style:italic; padding:10px;">Chưa có lượt chơi nào.</li>';
            return;
        }

        scores.forEach((item, index) => {
            const li = document.createElement('li');
            li.className = 'leaderboard-item';
            li.innerHTML = `
                <span class="rank">#${index + 1}</span>
                <span class="player-name">${escapeHTML(item.name)}</span>
                <span class="score">${item.wpm} WPM (${item.accuracy || 100}%)</span>
            `;
            leaderboardEl.appendChild(li);
        });
    });

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }

    btnNext.addEventListener('click', loadRandomPoem);
    loadRandomPoem();
</script>

</body>
</html>
