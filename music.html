<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>Kho nhạc MP3 - 28_08</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --surface: #ffffff;
      --bg: #eef2f5;
      --text: #172033;
      --muted: #64748b;
      --border: #dbe3ea;
      --danger: #b91c1c;
      --shadow: 0 10px 28px rgba(15, 23, 42, .09);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
    .topbar {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 18px; background: var(--surface); border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(15, 23, 42, .05); z-index: 5;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 250px; }
    .brand-icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: #e0e7ff; font-size: 23px; }
    .brand h1 { margin: 0; font-size: 18px; }
    .brand small { display: block; margin-top: 2px; color: var(--muted); }
    .status { margin-left: auto; min-width: 260px; max-width: 460px; }
    .status-row { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    .progress { height: 7px; overflow: hidden; background: #e2e8f0; border-radius: 999px; }
    .progress > div { height: 100%; width: 0; background: var(--primary); transition: width .2s ease; }
    .layout { min-height: 0; display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 14px; padding: 14px; }
    .sidebar, .viewer { min-height: 0; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .sidebar { display: grid; grid-template-rows: auto auto 1fr; overflow: hidden; }
    .sidebar-head { padding: 14px; border-bottom: 1px solid var(--border); }
    .folder-title { font-weight: 750; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .breadcrumb { margin-top: 6px; font-size: 12px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .search-wrap { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .search-wrap input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; outline: none; }
    .search-wrap input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, .12); }
    .file-list { list-style: none; padding: 8px; margin: 0; overflow: auto; }
    .file-item {
      display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center;
      width: 100%; padding: 10px; border: 0; border-radius: 10px; background: transparent; text-align: left; color: var(--text);
    }
    .file-item:hover, .file-item.active { background: #eef2ff; }
    .file-item.active { outline: 1px solid #c7d2fe; }
    .file-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; background: #f1f5f9; font-size: 19px; }
    .file-name { font-size: 14px; font-weight: 650; overflow-wrap: anywhere; }
    .file-meta { margin-top: 3px; font-size: 11px; color: var(--muted); }
    .empty { padding: 30px 16px; text-align: center; color: var(--muted); }
    .viewer { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
    .toolbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px;
      padding: 10px; border-bottom: 1px solid var(--border); background: #fbfdfe;
    }
    .toolbar button {
      height: 36px; border: 1px solid var(--border); border-radius: 9px; background: white; color: var(--text);
      padding: 0 16px; font-weight: 650;
    }
    .toolbar button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .toolbar button:disabled { opacity: .45; cursor: not-allowed; }
    .document-name { flex: 1 1 200px; min-width: 140px; max-width: 420px; margin-right: auto; padding: 0 8px; font-weight: 700; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    
    .canvas-wrap { min-height: 0; overflow: auto; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #cbd5e1; }
    .welcome { display: grid; place-items: center; color: #475569; }
    .welcome[hidden] { display: none !important; }
    .welcome-box { max-width: 480px; padding: 32px; text-align: center; background: rgba(255,255,255,.8); border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .welcome-icon { font-size: 56px; margin-bottom: 12px; }
    
    .audio-stage {
      width: 100%; max-width: 480px; padding: 40px; background: white;
      border-radius: 24px; box-shadow: 0 15px 40px rgba(15, 23, 42, 0.15);
      text-align: center; display: flex; flex-direction: column; align-items: center;
    }
    .audio-stage[hidden] { display: none !important; }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    .playing-icon { animation: pulse 1.5s infinite ease-in-out; }
    .now-playing-title { width: 100%; margin: 0 0 24px 0; color: var(--text); font-size: 20px; font-weight: 750; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    audio { width: 100%; outline: none; }
    
    .toast {
      position: fixed; right: 18px; bottom: 18px; z-index: 20; max-width: min(420px, calc(100vw - 36px));
      padding: 12px 14px; border-radius: 11px; background: #0f172a; color: white; box-shadow: var(--shadow);
      opacity: 0; transform: translateY(12px); pointer-events: none; transition: .2s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: var(--danger); }
    .mobile-menu { display: none; }
    
    @media (max-width: 860px) {
      body { overflow: auto; }
      .app { min-height: 100%; height: auto; }
      .topbar { position: sticky; top: 0; }
      .brand { min-width: 0; }
      .brand small, .status { display: none; }
      .mobile-menu { display: inline-grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 10px; background: white; }
      .layout { grid-template-columns: 1fr; min-height: calc(100vh - 66px); }
      .sidebar { position: fixed; inset: 66px auto 0 0; z-index: 10; width: min(88vw, 350px); border-radius: 0 14px 14px 0; transform: translateX(-105%); transition: transform .22s ease; }
      .sidebar.open { transform: translateX(0); }
      .viewer { min-height: calc(100vh - 94px); }
      .canvas-wrap { padding: 16px; }
      .document-name { flex-basis: 100%; max-width: none; text-align: center; margin-bottom: 8px; }
      .audio-stage { padding: 25px 20px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button id="mobileMenu" class="mobile-menu" type="button" aria-label="Mở danh sách bài hát">☰</button>
    <div class="brand">
      <div class="brand-icon">🎧</div>
      <div><h1>Kho nhạc MP3</h1><small>Nghe nhạc từ Google Drive</small></div>
    </div>
    <div id="statusBox" class="status" hidden>
      <div class="status-row"><span id="statusText">Đang xử lý...</span><span id="statusPercent">0%</span></div>
      <div class="progress"><div id="progressBar"></div></div>
    </div>
  </header>

  <main class="layout">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <div id="folderTitle" class="folder-title">Đang kết nối...</div>
        <div id="breadcrumb" class="breadcrumb">Thư mục gốc</div>
      </div>
      <div class="search-wrap"><input id="searchInput" type="search" placeholder="Tìm thư mục hoặc bài hát..." autocomplete="off"></div>
      <ul id="fileList" class="file-list"><li class="empty">Đang tải danh sách...</li></ul>
    </aside>

    <section class="viewer">
      <div class="toolbar">
        <div id="documentName" class="document-name">Chưa chọn bài hát</div>
        <button id="btnPrev" type="button" disabled title="Phím tắt: Mũi tên trái">← Bài trước</button>
        <button id="btnNext" type="button" disabled title="Phím tắt: Mũi tên phải">Bài sau →</button>
      </div>
      <div id="canvasWrap" class="canvas-wrap">
        <div id="welcome" class="welcome">
          <div class="welcome-box">
            <div class="welcome-icon">🎵</div>
            <h2>Chọn một bài hát để bắt đầu</h2>
            <p>Dùng danh sách bên trái để mở thư mục và chọn file âm thanh.</p>
          </div>
        </div>
        
        <div id="audioStage" class="audio-stage" hidden>
           <div id="playingIcon" style="font-size: 80px; margin-bottom: 16px; display: inline-block;">🎧</div>
           <h3 id="nowPlayingTitle" class="now-playing-title">Tên bài hát</h3>
           <audio id="audioPlayer" controls></audio>
        </div>
      </div>
    </section>
  </main>
</div>
<div id="toast" class="toast" role="status"></div>

<script>
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbz9Fd3kzo7TCoGvKO4AhHl_iv0LiCB3Y2L4bqkvrpjMwWYHtDscRm5JhPMthQaSw8lZ5A/exec';
  const ROOT_MARKER = '';

  const els = {
    sidebar: document.getElementById('sidebar'), mobileMenu: document.getElementById('mobileMenu'),
    folderTitle: document.getElementById('folderTitle'), breadcrumb: document.getElementById('breadcrumb'),
    searchInput: document.getElementById('searchInput'), fileList: document.getElementById('fileList'),
    statusBox: document.getElementById('statusBox'), statusText: document.getElementById('statusText'),
    statusPercent: document.getElementById('statusPercent'), progressBar: document.getElementById('progressBar'),
    documentName: document.getElementById('documentName'), btnPrev: document.getElementById('btnPrev'),
    btnNext: document.getElementById('btnNext'), canvasWrap: document.getElementById('canvasWrap'),
    audioStage: document.getElementById('audioStage'), audioPlayer: document.getElementById('audioPlayer'),
    nowPlayingTitle: document.getElementById('nowPlayingTitle'), playingIcon: document.getElementById('playingIcon'),
    welcome: document.getElementById('welcome'), toast: document.getElementById('toast')
  };

  let folderStack = [];
  let currentItems = [];
  let audioFiles = []; // Lưu trữ danh sách bài hát hiện tại để next/prev
  let currentFolderId = ROOT_MARKER;
  let activeFileId = '';
  let currentAudioUrl = null;
  let loadToken = 0;
  let toastTimer = null;

  document.addEventListener('DOMContentLoaded', init);

  function init() {
    bindEvents();
    loadDirectory(ROOT_MARKER, true);
  }

  function bindEvents() {
    els.mobileMenu.addEventListener('click', () => els.sidebar.classList.toggle('open'));
    els.searchInput.addEventListener('input', renderFileList);
    
    // Điều khiển bài hát
    els.btnPrev.addEventListener('click', playPrev);
    els.btnNext.addEventListener('click', playNext);
    
    // Sự kiện Audio Player
    els.audioPlayer.addEventListener('ended', playNext); // Tự động chuyển bài khi hết
    els.audioPlayer.addEventListener('play', () => els.playingIcon.classList.add('playing-icon'));
    els.audioPlayer.addEventListener('pause', () => els.playingIcon.classList.remove('playing-icon'));

    // Phím tắt
    window.addEventListener('keydown', handleShortcuts);
  }

  async function api(action, params = {}) {
    const url = new URL(WEB_APP_URL);
    url.searchParams.set('action', action);
    url.searchParams.set('_', Date.now().toString());
    Object.entries(params).forEach(([key, value]) => url.searchParams.set(key, String(value)));
    const response = await fetch(url.toString(), { method: 'GET', cache: 'no-store', redirect: 'follow' });
    if (!response.ok) throw new Error(`Máy chủ trả về lỗi HTTP ${response.status}.`);
    const data = await response.json();
    if (data.ok === false || data.error) throw new Error(data.error || 'Máy chủ xử lý không thành công.');
    return data;
  }

  async function loadDirectory(folderId, reset = false) {
    setLoading(true, 'Đang lấy danh sách...', 15);
    els.fileList.innerHTML = '<li class="empty">Đang tải...</li>';
    try {
      const data = await api('list', folderId ? { folderId } : {});
      currentFolderId = data.folder.id;
      currentItems = Array.isArray(data.files) ? data.files : [];
      if (reset) folderStack = [{ id: data.folder.id, name: data.folder.name }];
      els.folderTitle.textContent = data.folder.name;
      els.breadcrumb.textContent = folderStack.map(item => item.name).join(' › ');
      els.searchInput.value = '';
      renderFileList();
      setLoading(false);
    } catch (error) {
      setLoading(false);
      els.fileList.innerHTML = `<li class="empty">❌ ${escapeHtml(error.message)}</li>`;
      showToast(error.message, true);
    }
  }

  function renderFileList() {
    const keyword = normalize(els.searchInput.value);
    const filtered = currentItems.filter(item => normalize(item.name).includes(keyword));
    const fragment = document.createDocumentFragment();

    // Cập nhật danh sách bài hát cho nút Next/Prev
    audioFiles = currentItems.filter(item => !item.isFolder);
    updateControls();

    if (folderStack.length > 1) {
      fragment.appendChild(makeItem({ name: 'Quay lại thư mục trước', isFolder: true }, true));
    }

    if (!filtered.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = keyword ? 'Không tìm thấy kết quả phù hợp.' : 'Thư mục không có bài hát.';
      fragment.appendChild(li);
    } else {
      filtered.forEach(item => fragment.appendChild(makeItem(item, false)));
    }
    els.fileList.replaceChildren(fragment);
  }

  function makeItem(item, isBack) {
    const li = document.createElement('li');
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'file-item' + (!isBack && item.id === activeFileId ? ' active' : '');
    
    // Đổi icon MP3 (🎵) hoặc Folder (📁)
    const icon = isBack ? '↩️' : item.isFolder ? '📁' : '🎵';
    
    button.innerHTML = `<span class="file-icon">${icon}</span><span><div class="file-name">${escapeHtml(item.name)}</div>${(!isBack && !item.isFolder) ? `<div class="file-meta">${formatBytes(item.size || 0)}</div>` : ''}</span>`;
    
    button.addEventListener('click', () => {
      if (isBack) return goBack();
      if (item.isFolder) return openFolder(item);
      openAudio(item);
    });
    li.appendChild(button);
    return li;
  }

  function openFolder(item) {
    folderStack.push({ id: item.id, name: item.name });
    loadDirectory(item.id);
  }

  function goBack() {
    if (folderStack.length <= 1) return;
    folderStack.pop();
    const previous = folderStack[folderStack.length - 1];
    loadDirectory(previous.id);
  }

  async function openAudio(file) {
    const token = ++loadToken;
    activeFileId = file.id;
    renderFileList();
    updateControls();
    els.sidebar.classList.remove('open');
    
    els.documentName.textContent = file.name;
    els.nowPlayingTitle.textContent = file.name;
    els.welcome.hidden = true;
    els.audioStage.hidden = true;

    // Dừng nhạc cũ và giải phóng bộ nhớ
    els.audioPlayer.pause();
    if (currentAudioUrl) {
      URL.revokeObjectURL(currentAudioUrl);
      currentAudioUrl = null;
    }

    try {
      setLoading(true, 'Đang đọc thông tin bài hát...', 3);
      const infoData = await api('getFileInfo', { fileId: file.id });
      if (token !== loadToken) return;
      const info = infoData.file;
      const chunks = new Array(info.totalChunks);

      for (let index = 0; index < info.totalChunks; index++) {
        if (token !== loadToken) return;
        const percent = Math.round((index / info.totalChunks) * 90);
        setLoading(true, `Đang tải bài hát (${index + 1}/${info.totalChunks})...`, percent);
        const chunkData = await api('getFileChunk', { fileId: file.id, index });
        chunks[index] = base64ToBytes(chunkData.base64);
      }

      if (token !== loadToken) return;
      setLoading(true, 'Đang xử lý âm thanh...', 94);
      
      const audioBytes = concatUint8Arrays(chunks, info.size);
      const blob = new Blob([audioBytes], { type: 'audio/mpeg' });
      currentAudioUrl = URL.createObjectURL(blob);
      
      els.audioPlayer.src = currentAudioUrl;
      els.audioStage.hidden = false;
      
      setLoading(false);
      showToast(`Đang phát: “${file.name}”.`);
      
      try {
        await els.audioPlayer.play();
      } catch (err) {
        // Trình duyệt chặn auto-play, yêu cầu người dùng tự bấm play
      }
    } catch (error) {
      if (token !== loadToken) return;
      setLoading(false);

      if (!currentAudioUrl) {
        els.welcome.hidden = false;
        els.audioStage.hidden = true;
        els.documentName.textContent = 'Chưa chọn bài hát';
      }

      showToast(error.message, true);
      console.error(error);
    }
  }

  function playPrev() {
    const index = audioFiles.findIndex(f => f.id === activeFileId);
    if (index > 0) openAudio(audioFiles[index - 1]);
  }

  function playNext() {
    const index = audioFiles.findIndex(f => f.id === activeFileId);
    if (index !== -1 && index < audioFiles.length - 1) openAudio(audioFiles[index + 1]);
  }

  function updateControls() {
    if (!activeFileId) {
      els.btnPrev.disabled = true;
      els.btnNext.disabled = true;
      return;
    }
    const index = audioFiles.findIndex(f => f.id === activeFileId);
    els.btnPrev.disabled = index <= 0;
    els.btnNext.disabled = index === -1 || index >= audioFiles.length - 1;
  }

  function setLoading(show, text = '', percent = 0) {
    els.statusBox.hidden = !show;
    if (!show) return;
    const safePercent = Math.max(0, Math.min(100, Math.round(percent)));
    els.statusText.textContent = text;
    els.statusPercent.textContent = `${safePercent}%`;
    els.progressBar.style.width = `${safePercent}%`;
  }

  function showToast(message, isError = false) {
    clearTimeout(toastTimer);
    els.toast.textContent = message;
    els.toast.className = `toast show${isError ? ' error' : ''}`;
    toastTimer = setTimeout(() => els.toast.className = 'toast', 3500);
  }

  function handleShortcuts(event) {
    if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
    if (!currentAudioUrl) return;
    
    if (event.code === 'Space') {
      event.preventDefault();
      if (els.audioPlayer.paused) els.audioPlayer.play();
      else els.audioPlayer.pause();
    }
    // Tua bài hát bằng mũi tên
    if (event.key === 'ArrowRight') {
       if (event.shiftKey) playNext(); 
       else els.audioPlayer.currentTime = Math.min(els.audioPlayer.currentTime + 5, els.audioPlayer.duration);
    }
    if (event.key === 'ArrowLeft') {
       if (event.shiftKey) playPrev();
       else els.audioPlayer.currentTime = Math.max(els.audioPlayer.currentTime - 5, 0);
    }
  }

  function base64ToBytes(base64) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  function concatUint8Arrays(parts, totalLength) {
    const result = new Uint8Array(totalLength);
    let offset = 0;
    parts.forEach(part => { result.set(part, offset); offset += part.length; });
    return result;
  }

  function normalize(value) {
    return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  }

  function formatBytes(bytes) {
    if (!bytes) return '0 B';
    const units = ['B', 'KB', 'MB', 'GB'];
    const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
    return `${(bytes / Math.pow(1024, index)).toFixed(index ? 1 : 0)} ${units[index]}`;
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
  }
</script>
</body>
</html>
