<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Thư viện truyện</title>
  <style>
    :root{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#dbe3ee;--primary:#2563eb;--danger:#dc2626;--radius:16px;--shadow:0 8px 26px rgba(15,23,42,.08)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
    button,input,select{font:inherit}.hidden{display:none!important}.app{max-width:1200px;margin:auto;padding:16px}.topbar{position:sticky;top:0;z-index:20;margin:-16px -16px 18px;padding:14px 16px;background:rgba(241,245,249,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
    .topbar-row{max-width:1200px;margin:auto;display:flex;gap:12px;align-items:center}.brand{font-size:22px;font-weight:800;white-space:nowrap}.search{display:flex;gap:8px;flex:1}.search input{width:100%;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px #2563eb1f}
    .btn{border:0;border-radius:11px;padding:10px 14px;cursor:pointer;font-weight:700;background:#e2e8f0;color:#0f172a}.btn:hover{filter:brightness(.97)}.btn-primary{background:var(--primary);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin:8px 0 14px}.section-head h1,.section-head h2{margin:0}.muted{color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}.story{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.18s}.story:hover{transform:translateY(-3px);box-shadow:0 13px 30px rgba(15,23,42,.13)}.cover{aspect-ratio:3/4;background:#e2e8f0;overflow:hidden}.cover img{width:100%;height:100%;display:block;object-fit:cover}.story-body{padding:12px}.story-title{font-weight:800;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.story-meta{margin-top:7px;font-size:13px;color:var(--muted)}
    .pager{display:flex;justify-content:center;align-items:center;gap:9px;margin:24px 0}.pager-info{min-width:110px;text-align:center;font-weight:700}.status{padding:24px;text-align:center;color:var(--muted)}.error{color:var(--danger);background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:12px;margin:12px 0}.skeleton{height:290px;border-radius:16px;background:linear-gradient(90deg,#e2e8f0 25%,#f8fafc 37%,#e2e8f0 63%);background-size:400% 100%;animation:shine 1.3s infinite}@keyframes shine{to{background-position:-100% 0}}
    .detail{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.detail-top{display:grid;grid-template-columns:190px 1fr;gap:20px}.detail-cover{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:#e2e8f0}.detail h1{margin:0 0 8px}.detail-desc{white-space:pre-line;color:#334155;max-height:170px;overflow:auto}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.chapter-tools{display:flex;gap:9px;margin:18px 0 10px}.chapter-tools input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:11px}.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:9px;max-height:520px;overflow:auto;padding-right:4px}.chapter{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:#f8fafc;border-radius:11px;padding:10px 12px;cursor:pointer}.chapter:hover{border-color:#93c5fd;background:#eff6ff}.chapter small{color:var(--muted);white-space:nowrap}
    .reader-head{position:sticky;top:76px;z-index:10;background:rgba(241,245,249,.96);backdrop-filter:blur(10px);padding:10px 0;border-bottom:1px solid var(--line)}.reader-title{text-align:center;font-weight:800;margin:8px}.reader-nav{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}.reader-nav select{max-width:min(500px,70vw);padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff}.pages{max-width:920px;margin:16px auto}.page-img{display:block;width:100%;height:auto;margin:0 auto 8px;background:#e2e8f0;min-height:180px}.reader-status{padding:40px;text-align:center;color:var(--muted)}
    @media(max-width:700px){.app{padding:10px}.topbar{margin:-10px -10px 12px;padding:10px}.topbar-row{align-items:stretch;flex-direction:column}.brand{font-size:19px}.detail-top{grid-template-columns:105px 1fr;gap:13px}.detail{padding:12px}.detail-desc{grid-column:1/-1}.chapters{grid-template-columns:1fr}.reader-head{top:112px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.story-body{padding:9px}.story-title{font-size:14px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">📚 Thư viện truyện</div>
      <form id="searchForm" class="search">
        <input id="searchInput" type="search" placeholder="Tìm tên truyện..." autocomplete="off">
        <button class="btn btn-primary" type="submit">Tìm</button>
      </form>
      <button id="homeBtn" class="btn" type="button">Trang chủ</button>
    </div>
  </header>

  <main class="app">
    <section id="listView">
      <div class="section-head"><div><h1 id="listTitle">Truyện gợi ý</h1><div id="listSubtitle" class="muted">Danh sách truyện mới cập nhật</div></div></div>
      <div id="listError" class="error hidden"></div>
      <div id="storyGrid" class="grid"></div>
      <div id="listStatus" class="status hidden"></div>
      <nav id="pagination" class="pager hidden" aria-label="Phân trang">
        <button id="prevPage" class="btn" type="button">← Trước</button><span id="pageInfo" class="pager-info"></span><button id="nextPage" class="btn" type="button">Sau →</button>
      </nav>
    </section>

    <section id="detailView" class="hidden">
      <button id="backToList" class="btn" type="button">← Danh sách truyện</button>
      <div id="detailStatus" class="status">Đang tải mục lục...</div>
      <article id="detailContent" class="detail hidden">
        <div class="detail-top">
          <img id="detailCover" class="detail-cover" alt="Bìa truyện">
          <div><h1 id="detailTitle"></h1><div id="detailMeta" class="muted"></div><div class="toolbar"><button id="readFirstBtn" class="btn btn-primary" type="button">Đọc chương đầu</button><button id="readLatestBtn" class="btn" type="button">Đọc chương mới nhất</button></div></div>
          <div id="detailDesc" class="detail-desc"></div>
        </div>
        <div class="chapter-tools"><input id="chapterFilter" type="search" placeholder="Lọc chương, ví dụ: 12 hoặc ngoại truyện"><span id="chapterCount" class="muted"></span></div>
        <div id="chapterList" class="chapters"></div>
      </article>
    </section>

    <section id="readerView" class="hidden">
      <div class="reader-head">
        <button id="backToDetail" class="btn" type="button">← Mục lục</button>
        <div id="readerTitle" class="reader-title"></div>
        <div class="reader-nav"><button id="prevChapter" class="btn" type="button">← Chương trước</button><select id="chapterSelect"></select><button id="nextChapter" class="btn" type="button">Chương sau →</button></div>
      </div>
      <div id="readerError" class="error hidden"></div>
      <div id="readerStatus" class="reader-status"></div>
      <div id="pageImages" class="pages"></div>
      <div id="readerBottomNav" class="reader-nav hidden"><button id="prevChapterBottom" class="btn" type="button">← Chương trước</button><button id="toTop" class="btn" type="button">Lên đầu trang ↑</button><button id="nextChapterBottom" class="btn" type="button">Chương sau →</button></div>
    </section>
  </main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const state = { page: 1, totalPages: 1, query: '', stories: [], story: null, chapters: [], currentChapter: -1, listScroll: 0 };
  const views = ['listView','detailView','readerView'];
  const showView = name => { views.forEach(v => $(v).classList.toggle('hidden', v !== name)); window.scrollTo({top:0}); };
  const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const api = async params => {
    const url = new URL('/api/truyenqq', location.origin); Object.entries(params).forEach(([k,v]) => v !== '' && v != null && url.searchParams.set(k,v));
    const controller = new AbortController(); const timer = setTimeout(() => controller.abort(), 25000);
    try { const res = await fetch(url, {signal:controller.signal}); const data = await res.json().catch(() => ({})); if (!res.ok) throw new Error(data.error || `Lỗi HTTP ${res.status}`); return data; }
    catch(e){ throw new Error(e.name === 'AbortError' ? 'Máy chủ phản hồi quá lâu. Hãy thử lại.' : e.message); } finally { clearTimeout(timer); }
  };
  const imageUrl = src => src ? `/api/truyenqq?action=image&url=${encodeURIComponent(src)}` : '';
  const placeholders = count => { $('storyGrid').innerHTML = Array.from({length:count},()=>'<div class="skeleton"></div>').join(''); };

  async function loadStories(page=1, query=state.query){
    showView('listView'); state.page=Math.max(1,Number(page)||1); state.query=query.trim(); $('listError').classList.add('hidden'); $('listStatus').classList.add('hidden'); $('pagination').classList.add('hidden');
    $('listTitle').textContent = state.query ? `Kết quả: “${state.query}”` : 'Truyện gợi ý'; $('listSubtitle').textContent = state.query ? 'Kết quả được lấy từ nguồn truyện' : 'Danh sách truyện mới cập nhật'; placeholders(innerWidth<700?6:10);
    try {
      const data = await api({action:'list',page:state.page,q:state.query}); state.stories=data.items||[]; state.totalPages=Math.max(1,Number(data.totalPages)||state.page);
      renderStories(); updatePager(); history.replaceState(null,'',`#list?page=${state.page}${state.query?`&q=${encodeURIComponent(state.query)}`:''}`);
    } catch(e){ $('storyGrid').innerHTML=''; $('listError').textContent=e.message; $('listError').classList.remove('hidden'); $('listStatus').textContent='Không thể tải danh sách truyện.'; $('listStatus').classList.remove('hidden'); }
  }
  function renderStories(){
    if(!state.stories.length){ $('storyGrid').innerHTML=''; $('listStatus').textContent='Không tìm thấy truyện phù hợp.'; $('listStatus').classList.remove('hidden'); return; }
    $('storyGrid').innerHTML=state.stories.map((s,i)=>`<article class="story" data-i="${i}" tabindex="0"><div class="cover"><img loading="lazy" src="${escapeHtml(imageUrl(s.cover))}" alt="${escapeHtml(s.title)}" onerror="this.style.visibility='hidden'"></div><div class="story-body"><div class="story-title">${escapeHtml(s.title)}</div><div class="story-meta">${escapeHtml(s.latestChapter||s.status||'Xem mục lục')}</div></div></article>`).join('');
    document.querySelectorAll('.story').forEach(el=>{ const open=()=>openStory(state.stories[Number(el.dataset.i)]); el.onclick=open; el.onkeydown=e=>{if(e.key==='Enter')open()}; });
  }
  function updatePager(){ $('pagination').classList.remove('hidden'); $('pageInfo').textContent=`Trang ${state.page}${state.totalPages?` / ${state.totalPages}`:''}`; $('prevPage').disabled=state.page<=1; $('nextPage').disabled=state.page>=state.totalPages; }

  async function openStory(story){
    state.listScroll=scrollY; state.story=story; showView('detailView'); $('detailContent').classList.add('hidden'); $('detailStatus').textContent='Đang tải mục lục...'; $('detailStatus').classList.remove('hidden');
    try{
      const data=await api({action:'detail',url:story.url}); state.story={...story,...data.story}; state.chapters=data.chapters||[];
      $('detailTitle').textContent=state.story.title||story.title; $('detailCover').src=imageUrl(state.story.cover||story.cover); $('detailMeta').textContent=[state.story.author,state.story.status,`${state.chapters.length} chương`].filter(Boolean).join(' • '); $('detailDesc').textContent=state.story.description||'Chưa có mô tả.'; $('chapterFilter').value=''; renderChapters();
      $('detailStatus').classList.add('hidden'); $('detailContent').classList.remove('hidden'); $('readFirstBtn').disabled=!state.chapters.length; $('readLatestBtn').disabled=!state.chapters.length; history.replaceState(null,'',`#story=${encodeURIComponent(story.url)}`);
    }catch(e){ $('detailStatus').innerHTML=`<div class="error">${escapeHtml(e.message)}</div>`; }
  }
  function renderChapters(){
    const key=$('chapterFilter').value.trim().toLowerCase(); const rows=state.chapters.map((ch,index)=>({...ch,index})).filter(ch=>!key||`${ch.title} ${ch.date||''}`.toLowerCase().includes(key));
    $('chapterCount').textContent=`${rows.length}/${state.chapters.length}`; $('chapterList').innerHTML=rows.length?rows.map(ch=>`<button class="chapter" data-index="${ch.index}" type="button"><span>${escapeHtml(ch.title)}</span><small>${escapeHtml(ch.date||'')}</small></button>`).join(''):'<div class="muted">Không có chương phù hợp.</div>';
    document.querySelectorAll('.chapter').forEach(b=>b.onclick=()=>openChapter(Number(b.dataset.index)));
  }
  async function openChapter(index){
    if(index<0||index>=state.chapters.length)return; state.currentChapter=index; showView('readerView'); $('readerError').classList.add('hidden'); $('pageImages').innerHTML=''; $('readerBottomNav').classList.add('hidden'); $('readerStatus').textContent='Đang tải nội dung chương...'; renderReaderNav();
    try{
      const data=await api({action:'chapter',url:state.chapters[index].url}); const pages=data.pages||[]; if(!pages.length) throw new Error('Không tìm thấy ảnh của chương này. Cấu trúc nguồn có thể đã thay đổi.');
      $('readerStatus').textContent=''; $('pageImages').innerHTML=pages.map((src,i)=>`<img class="page-img" loading="${i<2?'eager':'lazy'}" src="${escapeHtml(imageUrl(src))}" alt="Trang ${i+1}" data-page="${i+1}">`).join(''); $('readerBottomNav').classList.remove('hidden'); history.replaceState(null,'',`#chapter=${encodeURIComponent(state.chapters[index].url)}`);
    }catch(e){ $('readerStatus').textContent=''; $('readerError').textContent=e.message; $('readerError').classList.remove('hidden'); }
  }
  function renderReaderNav(){
    const ch=state.chapters[state.currentChapter]; $('readerTitle').textContent=`${state.story?.title||''} — ${ch?.title||''}`; $('chapterSelect').innerHTML=state.chapters.map((c,i)=>`<option value="${i}" ${i===state.currentChapter?'selected':''}>${escapeHtml(c.title)}</option>`).join('');
    const hasPrev=state.currentChapter<state.chapters.length-1, hasNext=state.currentChapter>0; ['prevChapter','prevChapterBottom'].forEach(id=>$(id).disabled=!hasPrev); ['nextChapter','nextChapterBottom'].forEach(id=>$(id).disabled=!hasNext);
  }
  const previousChapter=()=>openChapter(state.currentChapter+1); const nextChapter=()=>openChapter(state.currentChapter-1);
  $('searchForm').onsubmit=e=>{e.preventDefault();loadStories(1,$('searchInput').value)}; $('homeBtn').onclick=()=>{$('searchInput').value='';loadStories(1,'')}; $('prevPage').onclick=()=>loadStories(state.page-1); $('nextPage').onclick=()=>loadStories(state.page+1);
  $('backToList').onclick=()=>{showView('listView');setTimeout(()=>scrollTo(0,state.listScroll),0)}; $('backToDetail').onclick=()=>showView('detailView'); $('chapterFilter').oninput=renderChapters;
  $('readFirstBtn').onclick=()=>openChapter(state.chapters.length-1); $('readLatestBtn').onclick=()=>openChapter(0); $('chapterSelect').onchange=e=>openChapter(Number(e.target.value));
  $('prevChapter').onclick=$('prevChapterBottom').onclick=previousChapter; $('nextChapter').onclick=$('nextChapterBottom').onclick=nextChapter; $('toTop').onclick=()=>scrollTo({top:0,behavior:'smooth'});
  loadStories(1,'');
})();
</script>
</body>
</html>
