<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hành Trình Di Sản - Danh Nhân TP.HCM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Merriweather', serif; /* Phông chữ kiểu sách sử */
            background-color: #2c241b; /* Màu nâu cổ điển */
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%234a3b2a' fill-opacity='0.2'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            color: #f3e5ab; /* Màu giấy cũ */
            overflow-x: hidden;
        }

        .scroll-paper {
            background: #f3e5ab;
            color: #3e2723;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 60px rgba(139, 69, 19, 0.1);
            border-radius: 8px;
            position: relative;
        }

        /* Hiệu ứng cuộn giấy */
        .scroll-paper::before, .scroll-paper::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            height: 20px;
            background: linear-gradient(to right, #8d6e63, #d7ccc8, #8d6e63);
            border-radius: 10px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }
        .scroll-paper::before { top: -10px; }
        .scroll-paper::after { bottom: -10px; }

        .option-btn {
            font-family: 'Patrick Hand', cursive; /* Phông chữ viết tay */
            transition: all 0.3s ease;
        }
        .option-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .correct-anim {
            animation: bounce 0.5s;
            background-color: #4ade80 !important; /* Green */
            color: #064e3b !important;
            border-color: #064e3b !important;
        }
        .wrong-anim {
            animation: shake 0.5s;
            background-color: #f87171 !important; /* Red */
            color: #7f1d1d !important;
            border-color: #7f1d1d !important;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ffd700;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }
        
        .figure-icon {
            transition: opacity 0.5s, transform 0.5s;
            transform-origin: center;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- GAME CONTAINER -->
    <div class="w-full max-w-2xl relative z-10">
        
        <!-- INTRO SCREEN -->
        <div id="intro-screen" class="scroll-paper p-10 text-center flex flex-col items-center gap-6 animate-fade-in">
            <div class="bg-amber-800 text-yellow-100 p-4 rounded-full shadow-lg">
                <i data-lucide="scroll-text" class="w-16 h-16"></i>
            </div>
            <h1 class="4xl font-bold text-amber-900 mb-2">Hành Trình Di Sản</h1>
            <p class="text-xl font-medium">Chủ đề: Danh nhân Lịch sử Văn hóa TP.HCM</p>
            <div class="h-1 w-32 bg-amber-800/20 rounded-full mx-auto"></div>
            <p class="text-lg text-amber-900/80 italic">
                "Chào mừng các nhà sử học trẻ tuổi! Chúng ta có <b>10 câu đố</b> về hai nhân vật lỗi lạc: <b>Nguyễn Hữu Cảnh</b> (Vị Khai Mở) và <b>Trịnh Hoài Đức</b> (Vị Học Giả)."
            </p>
            <button onclick="startGame()" class="mt-4 px-8 py-3 bg-amber-700 text-white rounded-lg font-bold text-xl hover:bg-amber-800 transition shadow-lg flex items-center gap-2">
                <i data-lucide="play-circle"></i> Bắt đầu Hành Trình
            </button>
        </div>

        <!-- QUIZ SCREEN (Hidden by default) -->
        <div id="quiz-screen" class="hidden scroll-paper p-8">
            <!-- Header: Progress & Score -->
            <div class="flex justify-between items-center mb-6 text-amber-900 border-b-2 border-amber-900/10 pb-4">
                <div class="flex items-center gap-2">
                    <span class="font-bold text-lg">Câu hỏi: <span id="q-current">1</span>/10</span>
                </div>
                <div class="flex items-center gap-2 bg-amber-100 px-3 py-1 rounded-lg">
                    <i data-lucide="star" class="text-yellow-600 fill-yellow-600 w-5 h-5"></i>
                    <span class="font-bold text-xl" id="score">0</span>
                </div>
            </div>

            <!-- Question Area -->
            <div class="mb-8 min-h-[120px] flex items-center justify-center">
                <h2 id="question-text" class="text-2xl font-bold text-center text-amber-900 leading-relaxed">
                    <!-- Question goes here -->
                </h2>
            </div>

            <!-- Image/Icon Placeholder (Illustrates the figure) -->
            <!-- Đã quay lại sử dụng Lucide icons -->
            <div class="flex justify-center mb-6">
                 <div class="w-20 h-20 bg-amber-200/50 rounded-full flex items-center justify-center border-4 border-amber-500 shadow-md relative">
                     <!-- Icons for the two figures -->
                     <i id="figure-icon-nhc" data-lucide="ship" class="figure-icon text-amber-700 w-12 h-12 absolute scale-100"></i>
                     <i id="figure-icon-thd" data-lucide="book-open-text" class="figure-icon text-amber-700 w-12 h-12 absolute scale-0 opacity-0"></i>
                 </div>
            </div>

            <!-- Options Grid -->
            <div id="options-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Buttons generated by JS -->
            </div>

            <!-- Feedback / Next Button -->
            <div id="feedback-area" class="mt-6 text-center hidden">
                <p id="feedback-text" class="text-lg font-bold mb-3"></p>
                <button onclick="nextQuestion()" class="px-6 py-2 bg-amber-700 text-white rounded-lg hover:bg-amber-800 transition font-bold flex items-center gap-2 mx-auto">
                    Câu tiếp theo <i data-lucide="arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- RESULT SCREEN (Hidden by default) -->
        <div id="result-screen" class="hidden scroll-paper p-10 text-center flex flex-col items-center gap-6">
            <div class="relative">
                <i data-lucide="award" class="w-24 h-24 text-amber-600"></i>
                <i data-lucide="star" class="absolute -top-2 -right-2 w-10 h-10 text-yellow-500 fill-yellow-500 animate-bounce"></i>
            </div>
            
            <h2 class="text-3xl font-bold text-amber-900">Hoàn Thành Hành Trình!</h2>
            
            <div class="bg-white/50 p-6 rounded-xl border border-amber-900/10 w-full">
                <p class="text-lg text-amber-800 mb-2">Số điểm của em:</p>
                <p class="text-5xl font-bold text-amber-700" id="final-score">0/100</p>
            </div>

            <p id="final-message" class="text-xl italic font-serif text-amber-900">
                <!-- Dynamic message -->
            </p>

            <div class="flex gap-4">
                <button onclick="resetGame()" class="px-6 py-2 bg-amber-700 text-white rounded-lg hover:bg-amber-800 transition font-bold">
                    Chơi lại
                </button>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();

        // DATA: 10 Câu hỏi (5 NHC, 5 THD)
        const questions = [
            // --- NGUYỄN HỮU CẢNH (Khai mỏ, Đô đốc) - Index 0-4 ---
            {
                figure: "Nguyễn Hữu Cảnh (Vị Khai Mở)",
                question: "Vào năm 1698, ai là người đã vâng lệnh Chúa Nguyễn vào kinh lược xứ Đàng Trong và lập ra phủ Gia Định?",
                options: ["Lê Văn Duyệt", "Nguyễn Hữu Cảnh", "Trịnh Hoài Đức", "Trương Vĩnh Ký"],
                correct: 1, 
                fact: "Đúng rồi! Năm 1698, Lễ Thành Hầu Nguyễn Hữu Cảnh đã chính thức xác lập chủ quyền, đặt nền móng hành chính cho vùng đất Sài Gòn - TP.HCM ngày nay."
            },
            {
                figure: "Nguyễn Hữu Cảnh (Vị Khai Mở)",
                question: "Nguyễn Hữu Cảnh được triều đình và nhân dân tôn vinh là gì nhờ công khai phá vùng đất phương Nam?",
                options: ["Tả Quân", "Thành hoàng làng và Thượng đẳng thần", "Hiệp trấn Gia Định", "Chỉ là quan võ"],
                correct: 1,
                fact: "Chính xác! Ông được nhân dân thờ phụng như một vị Thành hoàng (có nơi phong Thượng đẳng thần) tại nhiều đình đền ở Nam Bộ."
            },
            {
                figure: "Nguyễn Hữu Cảnh (Vị Khai Mở)",
                question: "Quê hương gốc của vị Khai mỏ Nguyễn Hữu Cảnh là ở đâu?",
                options: ["Thừa Thiên Huế", "Quảng Bình", "Quảng Nam", "Thanh Hóa"],
                correct: 1,
                fact: "Ông xuất thân từ xã Phước Tự (nay thuộc xã Vạn Ninh), huyện Quảng Ninh, tỉnh Quảng Bình."
            },
            {
                figure: "Nguyễn Hữu Cảnh (Vị Khai Mở)",
                question: "Sau khi lập Phủ Gia Định, Nguyễn Hữu Cảnh đã tổ chức các đơn vị hành chính đầu tiên nào?",
                options: ["Lập Tỉnh Sài Gòn và Huyện Chợ Lớn", "Lập 3 dinh: Trấn Biên, Phiên Trấn, Long Hồ", "Lập 2 dinh: Trấn Biên (Đồng Nai) và Phiên Trấn (Sài Gòn)", "Chỉ lập Phủ Gia Định"],
                correct: 2,
                fact: "Ông đã thiết lập Phủ Gia Định và 2 dinh đầu tiên là Trấn Biên (vùng Đồng Nai, Bà Rịa - Vũng Tàu) và Phiên Trấn (vùng TP.HCM, Tây Ninh)."
            },
            {
                figure: "Nguyễn Hữu Cảnh (Vị Khai Mở)",
                question: "Công lao của Nguyễn Hữu Cảnh gắn liền với việc mở mang và bảo vệ vùng đất nào?",
                options: ["Vùng Tây Nguyên", "Vùng đất Chân Lạp (Campuchia)", "Vùng đất Nam Bộ (Sài Gòn và Đồng bằng sông Cửu Long)", "Vùng đất phía Bắc Huế"],
                correct: 2,
                fact: "Ông có công lớn trong việc kinh lược và thiết lập chủ quyền chính thức cho vùng đất Nam Bộ rộng lớn."
            },

            // --- TRỊNH HOÀI ĐỨC (Học giả, Sử gia) - Index 5-9 ---
            {
                figure: "Trịnh Hoài Đức (Vị Học Giả)",
                question: "Trịnh Hoài Đức nổi tiếng với bộ sách địa lý - lịch sử nào, được xem là tư liệu quý giá về vùng đất Nam Bộ?",
                options: ["Gia Định thành thông chí", "Đại Nam thực lục", "Phủ biên tạp lục", "Lục Vân Tiên"],
                correct: 0,
                fact: "Chính xác! 'Gia Định thành thông chí' là công trình khảo cứu tâm huyết nhất của ông, ghi chép chi tiết về núi sông, khí hậu, phong tục Gia Định xưa."
            },
            {
                figure: "Trịnh Hoài Đức (Vị Học Giả)",
                question: "Trịnh Hoài Đức cùng với Lê Quang Định và Ngô Nhân Tịnh được người đời xưng tụng bằng danh hiệu gì?",
                options: ["Gia Định Tam Kiệt", "Gia Định Tam Hùng", "Gia Định Tam Gia", "Nam Bộ Tam Anh"],
                correct: 2,
                fact: "Rất giỏi! Họ được gọi là 'Gia Định Tam Gia' - ba nhà thơ, học giả lớn của đất Gia Định thời bấy giờ."
            },
            {
                figure: "Trịnh Hoài Đức (Vị Học Giả)",
                question: "Trong triều Nguyễn, Trịnh Hoài Đức đã từng giữ chức vụ quan trọng nào?",
                options: ["Chỉ là nhà thơ", "Chỉ là thầy giáo", "Thượng thư bộ Lại và Hiệp trấn thành Gia Định", "Đô đốc Thủy quân"],
                correct: 2,
                fact: "Ông từng giữ nhiều chức vụ cao cấp, trong đó có Thượng thư (Bộ trưởng) và Hiệp trấn (Phó Tổng đốc) thành Gia Định."
            },
            {
                figure: "Trịnh Hoài Đức (Vị Học Giả)",
                question: "Trịnh Hoài Đức thuộc nhóm cư dân nào đã góp phần xây dựng và phát triển vùng đất Gia Định?",
                options: ["Cư dân Khmer", "Cư dân Chăm", "Cư dân Minh Hương (gốc Hoa)", "Cư dân người Thượng"],
                correct: 2,
                fact: "Ông là người gốc Minh Hương (Hoa kiều định cư) và là một trong những đại diện tiêu biểu của nhóm cư dân này trong lịch sử Nam Bộ."
            },
            {
                figure: "Trịnh Hoài Đức (Vị Học Giả)",
                question: "Vai trò chính của Trịnh Hoài Đức trong lịch sử văn hóa là gì?",
                options: ["Quan võ, tướng quân", "Tướng quân, người làm đường", "Nhà thơ, nhà sử học, học giả", "Kỹ sư xây dựng đê điều"],
                correct: 2,
                fact: "Ông là một danh sĩ nổi tiếng với tài văn chương và khảo cứu lịch sử, đóng góp lớn vào kho tàng văn hóa của đất Gia Định."
            }
        ];

        let currentQIndex = 0;
        let score = 0;
        let answered = false;
        const MAX_SCORE = 100; // 10 questions * 10 points

        // UI Elements
        const introScreen = document.getElementById('intro-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const qText = document.getElementById('question-text');
        const optionsGrid = document.getElementById('options-grid');
        const feedbackArea = document.getElementById('feedback-area');
        const feedbackText = document.getElementById('feedback-text');
        const currentQDisplay = document.getElementById('q-current');
        const scoreDisplay = document.getElementById('score');
        
        // Đã cập nhật lại từ img sang icon
        const iconNHC = document.getElementById('figure-icon-nhc'); 
        const iconTHD = document.getElementById('figure-icon-thd'); 

        function startGame() {
            introScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            resetState();
            loadQuestion();
        }

        function resetState() {
            currentQIndex = 0;
            score = 0;
            scoreDisplay.innerText = "0";
        }

        function updateFigureIcon() {
            // Questions 0-4 are NHC (Nguyễn Hữu Cảnh - Ship)
            // Questions 5-9 are THD (Trịnh Hoài Đức - Book)
            const isNHC = currentQIndex < 5;

            if (isNHC) {
                // Hiển thị NHC icon
                iconNHC.classList.remove('scale-0', 'opacity-0');
                iconTHD.classList.add('scale-0', 'opacity-0');
            } else {
                // Hiển thị THD icon
                iconTHD.classList.remove('scale-0', 'opacity-0');
                iconNHC.classList.add('scale-0', 'opacity-0');
            }
        }

        function loadQuestion() {
            answered = false;
            feedbackArea.classList.add('hidden');
            const q = questions[currentQIndex];
            
            currentQDisplay.innerText = currentQIndex + 1;
            qText.innerText = q.question;
            
            updateFigureIcon();

            optionsGrid.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full p-4 bg-white/60 border-2 border-amber-900/20 rounded-xl text-lg font-bold text-amber-900 hover:bg-white text-left shadow-sm";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            if (answered) return; // Prevent multiple clicks
            answered = true;

            const q = questions[currentQIndex];
            const isCorrect = (selectedIndex === q.correct);

            // Highlight chosen button
            if (isCorrect) {
                btnElement.classList.add('correct-anim');
                score += 10;
                scoreDisplay.innerText = score;
                playConfetti();
                feedbackText.innerHTML = `<span class="text-green-700">🎉 Tuyệt vời!</span> <span class="font-normal text-base block mt-1">${q.fact}</span>`;
            } else {
                btnElement.classList.add('wrong-anim');
                // Highlight correct one automatically
                const allBtns = optionsGrid.children;
                allBtns[q.correct].classList.add('correct-anim');
                feedbackText.innerHTML = `<span class="text-red-600">😅 Tiếc quá!</span> <span class="font-normal text-base block mt-1 text-amber-900">Đáp án đúng là: <b>${q.options[q.correct]}</b>.<br>${q.fact}</span>`;
            }

            // Disable all buttons
            Array.from(optionsGrid.children).forEach(b => b.disabled = true);

            // Show Feedback & Next Button
            feedbackArea.classList.remove('hidden');
        }

        function nextQuestion() {
            currentQIndex++;
            if (currentQIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            
            const finalScoreEl = document.getElementById('final-score');
            const finalMsgEl = document.getElementById('final-message');
            
            finalScoreEl.innerText = `${score}/${MAX_SCORE}`;
            
            if (score === MAX_SCORE) {
                finalMsgEl.innerText = "🎉 Tuyệt vời! Em đích thị là một nhà sử học nhí tài ba và đã hoàn thành xuất sắc hành trình di sản!";
                playConfetti();
            } else if (score >= 70) {
                finalMsgEl.innerText = "Làm tốt lắm! Em đã nắm được rất nhiều kiến thức quan trọng về các danh nhân lịch sử địa phương.";
            } else if (score >= 50) {
                finalMsgEl.innerText = "Em đạt số điểm khá. Hãy tìm đọc thêm về hai vị danh nhân này để có kiến thức vững vàng hơn nhé!";
            } else {
                finalMsgEl.innerText = "Cố gắng hơn nhé! Đây là cơ hội tốt để các em khám phá thêm về lịch sử của thành phố mình.";
            }
        }

        function resetGame() {
            startGame();
        }

        function playConfetti() {
            const colors = ['#d97706', '#b45309', '#fcd34d'];
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = '-10px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 4000);
            }
        }
    </script>
</body>
</html>
