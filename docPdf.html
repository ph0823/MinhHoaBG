<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#0f766e">

  <title>Tủ Sách 2026</title>

  <!-- Google Identity Services -->
  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer
  ></script>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- EPUB.js + JSZip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --primary-light: #ccfbf1;

      --background: #f8fafc;
      --surface: #ffffff;
      --viewer-background: #dbe4ea;

      --text: #1e293b;
      --text-secondary: #64748b;

      --border: #cbd5e1;
      --danger: #dc2626;
      --success: #16a34a;
      --warning: #d97706;

      --header-height: 64px;
      --sidebar-width: 330px;

      --shadow:
        0 8px 24px rgba(15, 23, 42, 0.12);

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      overflow: hidden;
      background: var(--background);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: none;
    }

    button,
    .file-item {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    .file-item:focus-visible {
      outline: 3px solid rgba(13, 148, 136, 0.3);
      outline-offset: 2px;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    /* =====================================================
       HEADER
       ===================================================== */

    .app-header {
      min-height: calc(var(--header-height) + var(--safe-top));
      padding:
        calc(10px + var(--safe-top))
        calc(16px + var(--safe-right))
        10px
        calc(16px + var(--safe-left));

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 30;
    }

    .header-left {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-title {
      margin: 0;
      color: var(--primary);
      font-size: 1.15rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .status-connected {
      display: none;
      align-items: center;
      gap: 6px;
      color: var(--success);
      font-size: 0.9rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--success);
    }

    /* =====================================================
       BUTTONS
       ===================================================== */

    .button {
      min-height: 40px;
      padding: 8px 14px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      border-radius: 9px;
      background: var(--primary);
      color: #ffffff;

      font-weight: 700;
      cursor: pointer;
      user-select: none;

      transition:
        background 0.18s ease,
        transform 0.12s ease,
        opacity 0.18s ease;
    }

    .button:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    .button:active:not(:disabled) {
      transform: scale(0.97);
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.46;
    }

    .button-secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    .button-secondary:hover:not(:disabled) {
      background: #cbd5e1;
    }

    .button-danger {
      background: var(--danger);
    }

    .button-danger:hover:not(:disabled) {
      background: #b91c1c;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      padding: 0;
      flex: 0 0 auto;
    }

    .mobile-only {
      display: none;
    }

    /* =====================================================
       MAIN LAYOUT
       ===================================================== */

    .layout {
      position: relative;
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* =====================================================
       SIDEBAR
       ===================================================== */

    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      height: 100%;

      display: flex;
      flex-direction: column;

      background: var(--surface);
      border-right: 1px solid var(--border);

      z-index: 20;
    }

    .sidebar-header {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-title-row {
      margin-bottom: 10px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sidebar-title {
      margin: 0;
      min-width: 0;

      font-size: 0.98rem;
      font-weight: 800;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      height: 42px;
      padding: 8px 38px 8px 12px;

      border: 1px solid var(--border);
      border-radius: 9px;

      background: #f8fafc;
      color: var(--text);
    }

    .search-box input:focus {
      background: #ffffff;
      border-color: var(--primary);
    }

    .search-clear {
      position: absolute;
      top: 50%;
      right: 5px;

      width: 32px;
      height: 32px;
      padding: 0;

      transform: translateY(-50%);
      border-radius: 7px;

      background: transparent;
      color: var(--text-secondary);

      cursor: pointer;
    }

    .breadcrumb {
      min-height: 36px;
      padding: 8px 12px;

      display: flex;
      align-items: center;
      gap: 6px;

      border-bottom: 1px solid var(--border);
      background: #f8fafc;

      color: var(--text-secondary);
      font-size: 0.84rem;

      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: thin;
    }

    .breadcrumb-button {
      padding: 4px 7px;
      border-radius: 6px;

      background: transparent;
      color: var(--primary);

      font-size: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .breadcrumb-button:hover {
      background: var(--primary-light);
    }

    .file-list {
      flex: 1;
      min-height: 0;

      margin: 0;
      padding: 8px;

      overflow-y: auto;
      overscroll-behavior: contain;

      list-style: none;
    }

    .file-item {
      width: 100%;
      min-height: 52px;
      margin-bottom: 4px;
      padding: 9px 10px;

      display: flex;
      align-items: center;
      gap: 11px;

      border-radius: 9px;
      cursor: pointer;

      transition: background 0.15s ease;
    }

    .file-item:hover {
      background: #f1f5f9;
    }

    .file-item.active {
      background: var(--primary-light);
      color: var(--primary-dark);
    }

    .file-item-icon {
      width: 30px;
      flex: 0 0 30px;

      text-align: center;
      font-size: 1.35rem;
    }

    .file-item-content {
      min-width: 0;
      flex: 1;
    }

    .file-item-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      font-size: 0.9rem;
      font-weight: 650;
    }

    .file-item-type {
      margin-top: 3px;

      color: var(--text-secondary);
      font-size: 0.74rem;
    }

    .list-message {
      padding: 24px 14px;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.5;
    }

    .list-message.error {
      color: var(--danger);
    }

    .sidebar-footer {
      padding: 8px 12px calc(8px + var(--safe-bottom));
      border-top: 1px solid var(--border);

      color: var(--text-secondary);
      font-size: 0.76rem;
      text-align: center;
    }

    /* =====================================================
       VIEWER
       ===================================================== */

    .viewer {
      position: relative;

      min-width: 0;
      flex: 1;

      display: flex;
      flex-direction: column;

      overflow: hidden;
      background: var(--viewer-background);
    }

    .viewer-placeholder {
      margin: auto;
      padding: 30px;

      color: var(--text-secondary);
      text-align: center;
    }

    .placeholder-icon {
      margin-bottom: 12px;
      font-size: 3.2rem;
    }

    .viewer-placeholder h2 {
      margin: 0 0 8px;
      color: var(--text);
      font-size: 1.2rem;
    }

    .viewer-placeholder p {
      margin: 0;
      line-height: 1.6;
    }

    /* =====================================================
       PDF TOOLBAR
       ===================================================== */

    .pdf-toolbar {
      display: none;
      min-height: 56px;
      padding: 8px 12px;

      align-items: center;
      justify-content: space-between;
      gap: 10px;

      background: var(--surface);
      border-bottom: 1px solid var(--border);

      z-index: 10;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .page-status {
      min-width: 102px;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .zoom-status {
      min-width: 58px;
      text-align: center;
      font-size: 0.84rem;
      font-weight: 700;
    }

    .fit-select {
      height: 40px;
      padding: 6px 9px;

      border: 1px solid var(--border);
      border-radius: 8px;

      background: #ffffff;
      color: var(--text);

      cursor: pointer;
    }

    /* =====================================================
       PDF AREA
       ===================================================== */

    .pdf-container {
      flex: 1;
      min-height: 0;

      display: none;
      overflow: auto;
      overscroll-behavior: contain;

      padding:
        20px
        calc(20px + var(--safe-right))
        calc(32px + var(--safe-bottom))
        calc(20px + var(--safe-left));

      text-align: center;
      -webkit-overflow-scrolling: touch;
    }

    .canvas-wrapper {
      display: inline-block;
      min-width: 1px;
      min-height: 1px;
    }

    #pdf-canvas {
      display: block;
      max-width: none;
      margin: 0 auto;

      background: #ffffff;
      box-shadow: var(--shadow);
    }

    .canvas-wrapper {
      position: relative;
      perspective: 1400px;
      transform-style: preserve-3d;
      touch-action: pan-y pinch-zoom;
      user-select: none;
    }

    .page-flip-layer {
      position: absolute;
      inset: 0;
      display: none;
      pointer-events: none;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      transform-origin: center left;
      will-change: transform, opacity, filter;
      z-index: 4;
    }

    .page-flip-layer.visible {
      display: block;
    }

    .page-flip-layer.flip-next {
      transform-origin: left center;
      animation: page-flip-next 280ms cubic-bezier(.22,.72,.28,1) forwards;
    }

    .page-flip-layer.flip-prev {
      transform-origin: right center;
      animation: page-flip-prev 280ms cubic-bezier(.22,.72,.28,1) forwards;
    }

    .page-enter-next {
      animation: page-enter-next 260ms cubic-bezier(.22,.72,.28,1);
    }

    .page-enter-prev {
      animation: page-enter-prev 260ms cubic-bezier(.22,.72,.28,1);
    }

    .swipe-hint {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.68);
      color: #fff;
      font-size: 0.74rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
      z-index: 6;
    }

    .pdf-container.show-swipe-hint .swipe-hint {
      opacity: 1;
    }

    @keyframes page-flip-next {
      0% {
        transform: rotateY(0deg) translateX(0);
        opacity: 1;
        filter: brightness(1);
      }
      65% {
        opacity: .96;
      }
      100% {
        transform: rotateY(-88deg) translateX(-2%);
        opacity: 0;
        filter: brightness(.82);
      }
    }

    @keyframes page-flip-prev {
      0% {
        transform: rotateY(0deg) translateX(0);
        opacity: 1;
        filter: brightness(1);
      }
      65% {
        opacity: .96;
      }
      100% {
        transform: rotateY(88deg) translateX(2%);
        opacity: 0;
        filter: brightness(.82);
      }
    }

    @keyframes page-enter-next {
      from {
        opacity: .25;
        transform: translateX(16px) scale(.992);
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    @keyframes page-enter-prev {
      from {
        opacity: .25;
        transform: translateX(-16px) scale(.992);
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }



    /* =====================================================
       ĐI NHANH TỚI TRANG / VỊ TRÍ
       ===================================================== */

    .page-jump-form {
      display: flex;
      align-items: center;
      gap: 5px;
      flex: 0 0 auto;
    }

    .page-jump-label {
      color: var(--text-secondary);
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .page-jump-input {
      width: 68px;
      height: 40px;
      padding: 5px 7px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #ffffff;
      color: var(--text);
      text-align: center;
      font-weight: 700;
      appearance: textfield;
    }

    .page-jump-input::-webkit-inner-spin-button,
    .page-jump-input::-webkit-outer-spin-button {
      margin: 0;
      appearance: none;
    }

    .page-jump-button {
      min-width: 42px;
      min-height: 40px;
      padding: 6px 10px;
      border-radius: 8px;
    }

    .page-jump-input:disabled,
    .page-jump-button:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    .page-jump-input.invalid {
      border-color: var(--danger);
      background: #fef2f2;
    }

    @media (max-width: 900px) {
      .page-jump-label {
        display: none;
      }

      .page-jump-input {
        width: 58px;
        height: 36px;
        padding: 4px 5px;
        font-size: 0.8rem;
      }

      .page-jump-button {
        min-width: 36px;
        min-height: 36px;
        height: 36px;
        padding: 4px 7px;
      }
    }

    @media (max-width: 620px) {
      .page-jump-input {
        width: 52px;
        height: 34px;
      }

      .page-jump-button {
        min-width: 34px;
        min-height: 34px;
        height: 34px;
      }
    }

    /* =====================================================
       EPUB READER
       ===================================================== */

    .epub-container {
      flex: 1;
      min-height: 0;
      display: none;
      position: relative;
      overflow: hidden;
      padding: 12px;
      background: var(--viewer-background);
    }

    .epub-stage {
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: var(--shadow);
    }

    .epub-stage iframe {
      border: 0 !important;
      background: #ffffff;
    }

    .pdf-toolbar.epub-mode #fit-mode,
    .pdf-toolbar.epub-mode #page-effect {
      display: none;
    }

    .pdf-toolbar.epub-mode .page-status {
      min-width: 122px;
    }

    @media (max-width: 620px) {
      .epub-container {
        padding:
          2px
          calc(2px + var(--safe-right))
          calc(6px + var(--safe-bottom))
          calc(2px + var(--safe-left));
      }

      .epub-stage {
        border-radius: 0;
        box-shadow: none;
      }
    }




    /* EPUB: ưu tiên tốc độ dựng trang và độ rõ nội dung */
    .epub-container.is-loading .epub-stage {
      opacity: .72;
    }

    .epub-stage {
      contain: layout paint size;
      transition: opacity .16s ease;
    }

    .epub-stage iframe {
      width: 100% !important;
      height: 100% !important;
      color-scheme: light;
      transform: translateZ(0);
    }

    @media (max-width: 620px) {
      .pdf-toolbar.epub-mode {
        position: sticky;
        top: 0;
      }
    }

    /* =====================================================
       LOADING OVERLAY
       ===================================================== */

    .loading-overlay {
      position: absolute;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 20px;
      background: rgba(241, 245, 249, 0.88);
      backdrop-filter: blur(2px);

      z-index: 50;
    }

    .loading-overlay.visible {
      display: flex;
    }

    .loading-card {
      width: min(340px, calc(100% - 30px));
      padding: 22px;

      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);

      text-align: center;
    }

    .spinner {
      width: 46px;
      height: 46px;
      margin: 0 auto 14px;

      border: 5px solid #dbeafe;
      border-top-color: var(--primary);
      border-radius: 50%;

      animation: spin 0.85s linear infinite;
    }

    .loading-title {
      margin-bottom: 7px;
      font-weight: 800;
    }

    .loading-message {
      color: var(--text-secondary);
      font-size: 0.86rem;
      line-height: 1.45;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =====================================================
       TOAST
       ===================================================== */

    .toast-region {
      position: fixed;
      top: calc(var(--header-height) + var(--safe-top) + 12px);
      right: calc(14px + var(--safe-right));

      width: min(390px, calc(100% - 28px));
      z-index: 100;
    }

    .toast {
      margin-bottom: 9px;
      padding: 12px 14px;

      display: flex;
      align-items: flex-start;
      gap: 10px;

      border-radius: 10px;
      background: #ffffff;
      box-shadow: var(--shadow);
      border-left: 5px solid var(--primary);

      animation: toast-in 0.2s ease;
    }

    .toast.success {
      border-left-color: var(--success);
    }

    .toast.error {
      border-left-color: var(--danger);
    }

    .toast.warning {
      border-left-color: var(--warning);
    }

    .toast-message {
      flex: 1;
      font-size: 0.88rem;
      line-height: 1.45;
    }

    .toast-close {
      padding: 0;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
    }

    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =====================================================
       MOBILE BACKDROP
       ===================================================== */

    .sidebar-backdrop {
      position: fixed;
      inset: 0;

      display: none;
      background: rgba(15, 23, 42, 0.44);

      z-index: 15;
    }

    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 900px) {
      :root {
        --header-height: 58px;
      }

      .mobile-only {
        display: inline-flex;
      }

      .sidebar {
        position: fixed;
        top: calc(var(--header-height) + var(--safe-top));
        bottom: 0;
        left: 0;

        width: min(88vw, 360px);
        min-width: 0;
        height: auto;

        transform: translateX(-105%);
        box-shadow: var(--shadow);

        transition: transform 0.22s ease;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-backdrop.visible {
        display: block;
      }

      .pdf-toolbar {
        overflow-x: auto;
        justify-content: flex-start;
      }

      .toolbar-group {
        flex: 0 0 auto;
      }

      .header-actions .status-connected span:last-child {
        display: none;
      }
    }

    @media (max-width: 620px) {
      .app-header {
        padding-left: calc(8px + var(--safe-left));
        padding-right: calc(8px + var(--safe-right));
      }

      .app-title {
        max-width: 150px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .button-label-optional {
        display: none;
      }

      .pdf-toolbar {
        min-height: 52px;
        padding: 6px 8px;
      }

      .pdf-container {
        padding:
          10px
          calc(10px + var(--safe-right))
          calc(20px + var(--safe-bottom))
          calc(10px + var(--safe-left));
      }

      .page-status {
        min-width: 82px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .page-flip-layer,
      #pdf-canvas {
        animation: none !important;
      }
    }


    /* =====================================================
       CHẾ ĐỘ ĐỌC TẬP TRUNG - VỪA CHIỀU CAO
       ===================================================== */

    .focus-controls-button {
      position: absolute;
      top: calc(8px + var(--safe-top));
      left: calc(8px + var(--safe-left));
      width: 44px;
      height: 44px;
      padding: 0;
      display: none;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.38);
      border-radius: 13px;
      background: rgba(15, 23, 42, 0.72);
      color: #fff;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.24);

    document.addEventListener("DOMContentLoaded", initializeApp);

    async function initializeApp() {
      bindEvents();

      const savedPageEffect =
        localStorage.getItem(
          "docPdfPageEffect"
        );

      if (
        ["flip", "slide", "none"].includes(
          savedPageEffect
        )
      ) {
        state.pageEffect =
          savedPageEffect;

        dom.pageEffect.value =
          savedPageEffect;
      }

      /*
       * sessionStorage vẫn tồn tại khi Refresh trong cùng tab.
       * Vì vậy có thể khôi phục access token mà không yêu cầu
       * người dùng chọn lại tài khoản hoặc đồng ý quyền.
       */
      const restoredSession =
        restoreGoogleSession();

      if (restoredSession) {
        updateAuthUI(true);

        showListMessage(
          "Đang khôi phục phiên Google Drive..."
        );

        try {
          await loadCurrentFolder();

          showToast(
            "Đã khôi phục phiên Google Drive.",
            "success",
            3000
          );
        } catch (error) {
          console.error(
            "Không thể khôi phục phiên Google Drive:",
            error
          );
        }
      } else {
        showListMessage(
          "Vui lòng kết nối Google Drive để tải danh sách."
        );
      }

      try {
        await waitForGoogleIdentityServices();

        state.tokenClient =
          google.accounts.oauth2.initTokenClient({
            client_id: CONFIG.CLIENT_ID,
            scope: CONFIG.SCOPES,

            callback: handleTokenResponse,

            error_callback: handleOAuthError
          });
      } catch (error) {
        console.error(
          "Không thể khởi tạo Google OAuth:",
          error
        );

        /*
         * Nếu token cũ vẫn hợp lệ thì ứng dụng vẫn có thể
         * tiếp tục đọc Drive dù thư viện đăng nhập chưa tải.
         */
        if (!isTokenLikelyValid()) {
          showToast(
            "Không thể tải dịch vụ đăng nhập Google. Hãy kiểm tra kết nối mạng.",
            "error",
            7000
          );

          dom.btnLogin.disabled = true;
        }
      }
    }
